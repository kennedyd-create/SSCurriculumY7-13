<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WHS Social Sciences</title>
<script>
/* a section is already chosen (address ends in #years-...): keep the chooser hidden while it loads */
(function(){var h=location.hash.replace("#","");if(h==="years-7-10"||h==="years-11-13")document.documentElement.className="loading";})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--whs:#002066;--whs-deep:#001546;--whs-light:#d1e6f6;--ink:#0f1a2b;--muted:#52627a;--paper:#ffffff;--gold:#ffd166;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--whs-deep);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
html.loading body{visibility:hidden}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(120% 90% at 50% 0%,#0a2f8a 0%,var(--whs) 45%,var(--whs-deep) 100%)}
.dialog{width:100%;max-width:760px;background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.dhead{background:var(--whs);color:#fff;padding:20px 24px;display:flex;align-items:center;gap:18px;border-bottom:4px solid var(--whs-light)}
.dhead img{width:78px;height:auto;flex:none}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--whs-light)}
h1{font-family:var(--display);font-size:clamp(24px,5vw,32px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
.dbody{padding:22px 24px 26px}
.dbody>p{margin:0 0 16px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:18px 18px 20px;border-radius:12px;
  background:var(--whs-light);border:2px solid transparent;border-top:6px solid var(--whs);color:var(--ink);position:relative;transition:transform .15s,box-shadow .15s,border-color .15s}
.opt:hover{transform:translateY(-3px);box-shadow:0 12px 24px -14px var(--whs);border-color:var(--whs)}
.opt:focus-visible{outline:3px solid var(--whs);outline-offset:3px}
.opt .n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--whs)}
.opt .t{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;color:var(--whs)}
.opt .y{font-family:var(--display);font-weight:700;font-size:18px}
.opt .d{font-size:14px;color:#2b3a52}
.opt .tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--gold);color:var(--whs)}
.opt .go{margin-top:auto;padding-top:10px;font-weight:700;color:var(--whs)}
.opt .go::after{content:"\2192";display:inline-block;margin-left:7px;transition:transform .15s}
.opt:hover .go::after{transform:translateX(4px)}
@media (max-width:620px){.opts{grid-template-columns:1fr}.dhead{padding:16px 18px}.dhead img{width:60px}.dbody{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

EANRF2hq/VstFbXrYLIsXFjE2zoXp08DoTKTQCZANgA4H9aBEB3f2vbHFNiXpsBqPXmmdslAk0Do9tAHgBF5CKSPwXwPABnAjgawA457s3PCtkA4DYAPwdwqYg8pgMsZHkUzeRDExSKgKK2uR114E9DtNFNsxP6fhFZ0sT1JgOYY64zFcC4nKxtA4DlGt7RzjNPBHBEjuvSMJ641yqAmzX/Ns91xwJ4CoCJhj2lqcv1hHsAgDtFZGWrZgAfoEjO0Hs7DMBBAPYCsJ3e6wQDfJsROc9uRlQa6wYNbHbnqSCEuXRE/h9pBPdzdq1KmQAAAABJRU5ErkJggg==\" alt=\"Waiheke High School logo\">\n    <div>\n      <div class=\"eyebrow\">Waiheke High School · Social Sciences<\/div>\n      <h1>Social Sciences 7–10<\/h1>\n      <nav class=\"infonav\" aria-label=\"About the curriculum\">\n        <button type=\"button\" class=\"ib\" data-info=\"purpose\" aria-expanded=\"false\">Purpose<\/button>\n        <button type=\"button\" class=\"ib\" data-info=\"strands\" aria-expanded=\"false\">The four strands<\/button>\n        <button type=\"button\" class=\"ib\" data-info=\"kp\" aria-expanded=\"false\">Knowledge &amp; practices<\/button>\n        <button type=\"button\" class=\"ib\" data-info=\"phases\" aria-expanded=\"false\">Years 7–8 and 9–10<\/button>\n        <button type=\"button\" class=\"ib\" data-info=\"local\" aria-expanded=\"false\">Local context<\/button>\n      <\/nav>\n    <\/div>\n  <\/div>\n  <div class=\"hright\">\n    <div class=\"legend\">\n      <span><i class=\"sw kn\"><\/i>Knowledge: what to teach<\/span>\n      <span><i class=\"sw pr\"><\/i>Practices: skills to teach<\/span>\n      <span><b class=\"lc\">★<\/b>Local context opportunity<\/span>\n    <\/div>\n    <div class=\"hbtns\"><div class=\"sitesw\" role=\"group\" aria-label=\"Year group\"><button type=\"button\" data-site=\"years-7-10\" aria-pressed=\"true\">Years 7–10<\/button><button type=\"button\" data-site=\"years-11-13\" aria-pressed=\"false\">Years 11–13<\/button><\/div><button id=\"theme\" type=\"button\" aria-label=\"Change colour theme\"><\/button><\/div>\n  <\/div>\n<\/div><\/header>\n<section id=\"info\" class=\"info\" hidden>\n  <div class=\"infin\">\n    <button type=\"button\" class=\"ix\" aria-label=\"Close information\">Close<\/button>\n    <div data-panel=\"purpose\">\n      <h3>Purpose of Social Sciences<\/h3>\n      <p class=\"wk\"><i>He aha te mea nui o te ao? He tangata, he tangata, he tangata.<\/i><br>What is the greatest thing in the world? It is people, people, people. <span>Meri Ngāroto, Te Aupōuri<\/span><\/p>\n      <p>Social Sciences is the study of how societies work and how people interact with each other and with their environments. In Years 7–10 it gives students the knowledge and skills to:<\/p>\n      <ul>\n        <li>understand, take part in and contribute to local, national and global communities<\/li>\n        <li>think critically about social issues<\/li>\n        <li>judge how sustainable different social, economic, political and environmental practices are<\/li>\n        <li>engage respectfully with views and experiences that differ from their own.<\/li>\n      <\/ul>\n      <p>Years 9–10 lead directly into the Social Sciences subjects students can take in Years 11–13.<\/p>\n    <\/div>\n    <div data-panel=\"strands\">\n      <h3>The four strands<\/h3>\n      <dl class=\"sgrid\">\n        <div style=\"--c:var(--civ)\"><dt>Civics and Society<\/dt><dd>How people belong, connect and live together. In Years 7–10 students move from local government and democratic values to New Zealand's system of government and international cooperation, building skills as informed, active citizens.<\/dd><\/div>\n        <div style=\"--c:var(--his)\"><dt>History<\/dt><dd>People, places and events over time, through New Zealand history (including Māori history and perspectives) and world history depth studies. Students use sources, compare interpretations and build evidence-based narratives and arguments.<\/dd><\/div>\n        <div style=\"--c:var(--geo)\"><dt>Geography<\/dt><dd>Places, the processes that shape them, and why this matters to people. Students study migration, natural hazards, tourism, coasts, urbanisation and inequality, using maps, spatial tools and data to explain patterns.<\/dd><\/div>\n        <div style=\"--c:var(--fin)\"><dt>Financial and Economic Activity<\/dt><dd>How money is earned, spent, shared, saved and invested, and how to weigh financial choices. From Year 9, students also learn about the New Zealand economy, markets and government budgets.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n    <div data-panel=\"kp\">\n      <h3>Knowledge and practices<\/h3>\n      <p><b>Knowledge<\/b> sets out the content to teach and how deep to go at each year level. <b>Practices<\/b> set out the disciplinary skills of social scientists. Both are teaching requirements, not achievement objectives.<\/p>\n      <ul>\n        <li>They relate but are not an exact match. The teacher decides whether to start with the knowledge or with a practice.<\/li>\n        <li>Knowledge is organised around concepts. Each strand has a big idea across the phase, and each year has a conceptual knowledge statement that anchors the content under it.<\/li>\n        <li>Practices follow the same framing: Think conceptually, Frame questions, Process information, Identify values and perspectives, Communicate findings, and Design, implement and evaluate social action (not always used). Financial and Economic Activity uses only Think conceptually, Process information, and Identify values and perspectives.<\/li>\n        <li>In History and Geography, the Process information and Communicate findings examples must be taught. In all other practices, and throughout Civics and Financial, the examples can be swapped for others that meet the same intent.<\/li>\n      <\/ul>\n    <\/div>\n    <div data-panel=\"phases\">\n      <h3>Years 7–8 and Years 9–10<\/h3>\n      <div class=\"pgrid\">\n        <div><h4>Phase 3 · Years 7–8<\/h4><p>Students deepen their understanding of complex issues by analysing evidence, examining multiple perspectives and evaluating different interpretations. They refine their questioning and consider how values, beliefs and interests shape decisions. Key concepts include democracy, te Tiriti o Waitangi, migration, environmental change and financial systems. Social action becomes more deliberate: students identify issues, plan responses and consider how effective they are.<\/p>\n        <p><b>Te Tiriti o Waitangi:<\/b> students examine He Whakaputanga and te Tiriti, their purpose, interpretations, and the perspectives of Māori and the Crown.<\/p><\/div>\n        <div><h4>Phase 4 · Years 9–10<\/h4><p>Students work as increasingly independent and critical social scientists. They critically analyse evidence, evaluate the reliability and bias of sources, and weigh different interpretations. They build sophisticated arguments, justify positions with evidence, and explore the ethical, social, environmental and economic implications of decisions and events through advocacy, debate and evaluating solutions.<\/p>\n        <p><b>Te Tiriti o Waitangi:<\/b> students analyse its historical and contemporary impacts and explain its significance in New Zealand's constitutional arrangements, governance and society.<\/p><\/div>\n      <\/div>\n      <p class=\"small\">Across both phases students develop communication, collaboration, self-management, problem solving and creativity.<\/p>\n    <\/div>\n    <div data-panel=\"local\">\n      <h3>Local context<\/h3>\n      <p>Teachers bring the sequence to life with local, visible examples: people and place, te ao Māori, and the lives of students and their communities.<\/p>\n      <ul>\n        <li>Anything marked \"e.g.\" is an illustration, not a requirement. You can substitute examples that better reflect the local environment, community, hapū and iwi connections, student interests, teacher expertise or emerging issues, as long as the intended knowledge and practices are taught.<\/li>\n        <li>On this dashboard, <b class=\"lc\">★<\/b> marks places where the curriculum suggests teaching a local context. On Waiheke, the island's own places, marae, communities and environment are natural fits.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n<div class=\"wrap\">\n\n<section class=\"block\" id=\"overview\">\n  <div class=\"head\"><h2>Overview<\/h2><span class=\"hint\"><span id=\"uprog\" class=\"uprog\" hidden><\/span> Select a year or a topic to open it below. Hover for the conceptual knowledge.<\/span><\/div>\n  <div class=\"ovwrap\"><table class=\"ov\" id=\"ovt\"><\/table><\/div>\n<\/section>\n\n<section class=\"block\" id=\"detail\">\n  <div class=\"controls\">\n    <div class=\"seg\" id=\"years\" role=\"group\" aria-label=\"Year level\"><\/div>\n    <div class=\"seg\" role=\"group\" aria-label=\"Open or close strands\"><button id=\"closeall\">Close all<\/button><\/div>\n    <div class=\"tools\">\n      <input type=\"search\" id=\"q\" placeholder=\"Search this year…\" aria-label=\"Search this year\">\n      <span id=\"count\"><\/span>\n    <\/div>\n  <\/div>\n  <div id=\"out\"><\/div>\n<\/section>\n\n<div id=\"toast\" class=\"toast\" role=\"status\" hidden><\/div>\n<footer>\n  Content is taken from the Social Sciences Years 0–10 teaching sequence (September 2026), Phase 3 (Years 7–8) and Phase 4 (Years 9–10). ★ marks the places where the curriculum flags an opportunity to teach a local context (shown as ** in the original). History has one New Zealand history focus each year and a world (global) history focus with a choice of case studies.\n<\/footer>\n<\/div>\n\n<script>\nconst DATA = {\"7-8\": {\"Civics and Society\": {\"sections\": [{\"label\": null, \"idea\": {\"title\": \"Democracy and participation\", \"desc\": \"Active participation and respectful dialogue strengthen democracy.\"}, \"units\": [{\"kc\": [\"Democracies depend on active participation by people taking civic responsibility in local communities informally and formally.\", \"Healthy democracies enable respectful dialogue about political values and ideas and peaceful resolution of conflict.\"], \"pc\": [\"Define, explain, and apply concepts of <b>democracy, participation, and civic responsibility<\\/b>, and make connections between these concepts.\", \"Define, explain, and apply concepts of <b>dialogue, values, and ideas<\\/b>, and make connections between these concepts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>Local government and community engagement<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Local government<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Local governments play a role in making local decisions, providing services and resources for our local community, and these are paid for by rates, user charges, and government funding.**\"}, {\"t\": \"li1\", \"h\": \"Community members get involved in decision-making and volunteering to support their neighbourhoods, cities, towns, and local environments.**\"}, {\"t\": \"li1\", \"h\": \"Local councils are elected by the community and are responsible for:**\"}, {\"t\": \"li2\", \"h\": \"parks and playgrounds\"}, {\"t\": \"li2\", \"h\": \"water (e.g. wastewater, stormwater, drinking water)\"}, {\"t\": \"li2\", \"h\": \"libraries and swimming pools\"}, {\"t\": \"li2\", \"h\": \"rubbish and recycling\"}, {\"t\": \"li2\", \"h\": \"planning of roads, footpaths, and housing zones\"}, {\"t\": \"li2\", \"h\": \"maintaining relationships with local iwi, businesses, and the wider community.\"}, {\"t\": \"h\", \"h\": \"<b>Community engagement<\\/b>\"}, {\"t\": \"li1\", \"h\": \"There is often debate about rates rises, between those who argue increases are necessary to maintain public services and those who want to restrict council spending.\"}, {\"t\": \"li1\", \"h\": \"People demonstrate civic responsibility to help local communities socially and culturally (e.g. Polyfest, Te Matatini, kapa haka, community gardening, shared food events, volunteering, mentoring, coaching, t uakana –teina, peer support).\"}, {\"t\": \"li1\", \"h\": \"Informed and active citizenship includes noticing, listening, attending hui, fono, meetings, joining school boards and committees, caring for others, volunteering, fundraising, making submissions, respectful protest, and voting.\"}, {\"t\": \"li1\", \"h\": \"Informed citizenship includes learning to think critically about sources of information, the difference between fact and opinion, and how to share information ethically.\"}], [{\"t\": \"h\", \"h\": \"<b>Healthy democracies<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Democratic values<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Modern democracies are influenced by Enlightenment t hinking. This includes the idea that a government is lawful if the people have consented to it through fair elections.\"}, {\"t\": \"li1\", \"h\": \"Core democratic values include:\"}, {\"t\": \"li2\", \"h\": \"freedom of expression and respectful discussion\"}, {\"t\": \"li2\", \"h\": \"peaceful non-violent methods to resolve conflict (e.g. respectful debating, petitioning, protesting)\"}, {\"t\": \"li2\", \"h\": \"equality and protection of minority rights\"}, {\"t\": \"li2\", \"h\": \"critical thinking\"}, {\"t\": \"li2\", \"h\": \"voting and participating in communities.\"}, {\"t\": \"li1\", \"h\": \"People can work with others to influence public attitudes, values, and government decision-making by engaging with MPs, writing submissions, signing petitions, creating public campaigns, and participating in respectful protests on issues such as social, environmental, economic, human rights, and minority rights concerns. Examples include student groups, trade unions, business associations, and social action groups, for example:\"}, {\"t\": \"li2\", \"h\": \"young people have opportunities to engage in interest groups for change (e.g. Students Against Dangerous Driving and Disability Rights Groups) and promote change in other ways (e.g. Ngā Manu Kōrero, Student Volunteer Army, Pacific Youth Leadership and Transformation (PYLAT))**\"}, {\"t\": \"li2\", \"h\": \"the New Zealand Council of Trade Unions (NZCTU) makes submissions on legislation, runs campaigns, publishes research, and advocates for workers' interests\"}, {\"t\": \"li2\", \"h\": \"national business associations (e.g. Chambers of Commerce, BusinessNZ, Federated Farmers) influence government decision-making by lobbying politicians, making submissions on proposed laws, and using the media to promote policies that support business growth and economic development\"}, {\"t\": \"li2\", \"h\": \"the New Zealand Taxpayers' Union aims to influence government spending through public campaigns, media engagement, and direct lobbying\"}, {\"t\": \"li2\", \"h\": \"the Polynesian Panthers formed in 1971 to challenge racism, inequality, discriminatory policing, and immigration enforcement facing Pacific peoples in New Zealand, including the Dawn Raids.\"}, {\"t\": \"h\", \"h\": \"<b>How democracies resolve differences peacefully<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Democracies hold elections to choose between parties with competing ideas.\"}, {\"t\": \"li1\", \"h\": \"Outside of elections, people can use democratic institutions for resolving conflict, for example:\"}, {\"t\": \"li2\", \"h\": \"disputes (e.g. money, property) can be settled formally through courts, as well as informally outside of courts (e.g. Tenancy Tribunal, Disputes Tribunal)\"}, {\"t\": \"li2\", \"h\": \"the Waitangi Tribunal can investigate and recommend resolutions for disputes about breaches of te Tiriti o Waitangi / the Treaty of Waitangi; most settlements include a formal written apology from the Crown\"}, {\"t\": \"li2\", \"h\": \"the Offices of the Human Rights and Race Relations Commissioners and the Office of the Ombudsman can help individuals investigate and resolve disputes around discrimination\"}, {\"t\": \"li2\", \"h\": \"citizens’ assemblies can be organised by communities and governments to investigate and recommend solutions for challenging issues (e.g. Porirua Assembly and Porirua Youth Assembly on Climate 2025).\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Ask a range of questions about local government and how community members get involved to address challenges, for example:\"}, {\"t\": \"li2\", \"h\": \"What role does the local government play in our communities?**\"}, {\"t\": \"li2\", \"h\": \"How can people get involved?**\"}, {\"t\": \"li2\", \"h\": \"What are some key issues and challenges as well as opportunities in our community?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using sources (e.g. newspaper articles, digital) to collect and classify information about the roles that individuals and groups have played in addressing a community challenge.\"}, {\"t\": \"li1\", \"h\": \"Examining news items to recognise what is fact and what is opinion, and considering ethical and unethical ways of sharing news and information.\"}, {\"t\": \"li1\", \"h\": \"Collecting information about a local example of ratepayers or residents campaigning about rates rises or council spending decisions, and the arguments made on each side.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Listening to people who are involved in local organisations or local government and finding out about their roles, responsibilities, and perspectives on the opportunities and challenges in the community.**\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using local examples to describe the forms of active citizen participation, and how they can bring about change.**\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Identifying a local civic action** (e.g. a beach clean-up, school playground, garden project) or opportunity and working collaboratively to plan, organise, carry out, and evaluate an initiative or action.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Formulate questions about democracy and values using ‘what’, ‘why’, ‘who’, and ‘how’, for example:\"}, {\"t\": \"li2\", \"h\": \"Who gets to make decisions in a democracy?\"}, {\"t\": \"li2\", \"h\": \"Why do democracies depend on citizens who can listen to others and discuss ideas respectfully?\"}, {\"t\": \"li2\", \"h\": \"How can we make sure everyone is heard in a discussion?\"}, {\"t\": \"li2\", \"h\": \"How do we know if a decision is fair?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using text and timelines to trace how democratic ideas developed over time.\"}, {\"t\": \"li1\", \"h\": \"Collecting information to compare how different interest groups have used democratic processes to influence change.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Considering different perspectives of individuals, groups and organisations involved in disputes.\"}, {\"t\": \"li1\", \"h\": \"Using a range of sources to tell the difference between beliefs, opinions, and facts.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining why listening and discussing different views respectfully is essential for a democracy.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Discussing an issue and developing a plan to collectively raise awareness and promote understanding (including steps to organise a group and choosing what methods might be used to create change).\"}]]}]}]}, \"History\": {\"sections\": [{\"label\": \"New Zealand history\", \"idea\": {\"title\": \"Causes and consequences\", \"desc\": \"There are causes and consequences of cultural contact.\"}, \"units\": [{\"kc\": [\"Cultural contact in the past involved the exchange of new ideas, resources, and technologies, with consequences on people and society.\", \"Agreements were formed in the past in an attempt to resolve differences arising from cultural contact, and to maintain stability, with different consequences for groups.\"], \"pc\": [\"Define, explain, and apply concepts of <b>cultural contact, cultural exchange, and consequences<\\/b>, and make connections between these concepts.\", \"Define, explain, and apply concepts of <b>cultural contact, agreements, consequences, and perspectives<\\/b>, and make connections between these concepts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>Early contact (1790–1830)<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Organisation and relationships in Māori society<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Māori society was shaped by values, relationships, and responsibilities that guided how people lived and responded to change.\"}, {\"t\": \"li1\", \"h\": \"Māori society was organised around core beliefs that shaped how people interacted with each other and understood their relationship with the world. These included:\"}, {\"t\": \"li2\", \"h\": \"mana, whakapapa (genealogy), tikanga (customary protocols), and utu (restoring balance), which guided behaviour, relationships, and responsibilities\"}, {\"t\": \"li2\", \"h\": \"a deep connection to whenua (land) as a taonga (something of value), which was cared for collectively across generations.\"}, {\"t\": \"li1\", \"h\": \"Traditional Māori economies were closely tied to local resources within each local area, supporting trade and relationships between iwi.**\"}, {\"t\": \"h\", \"h\": \"<b>Early contact<\\/b>\"}, {\"t\": \"li1\", \"h\": \"With the arrival of sealers, whalers, traders, and missionaries from Australia and Europe, some of the first sustained European contact with New Zealand began. Exchanging goods, technology, and resources strengthened the mana of hapū and iwi through increased access to resources and strategic relationships.\"}, {\"t\": \"li1\", \"h\": \"The arrival of the first missionaries in the Bay of Islands brought new ideas and led to significant changes for Māori communities, with missionaries serving as trusted intermediaries between Europeans and Māori. These changes included:\"}, {\"t\": \"li2\", \"h\": \"the introduction of new farming tools, along with basic European healthcare and schooling\"}, {\"t\": \"li2\", \"h\": \"collaboration between M ā ori (e.g. Hongi Hika (Ngā Puhi), Tuai (Ngare Raumati), and Hohaia Parata Waikato (Ngā Puhi)) and missionaries (e.g. Thomas Kendall) to document te reo M ā ori in written form\"}, {\"t\": \"li2\", \"h\": \"the establishment of a te reo Māori printing press, which supported the rapid growth of literacy\"}, {\"t\": \"li2\", \"h\": \"missionaries travelled between Australia and New Zealand and helped establish some of the first Christian missions in New Zealand\"}, {\"t\": \"li2\", \"h\": \"m any Māori adopted aspects of Christianity while continuing to value Māori beliefs, customs, and ways of understanding the world.\"}, {\"t\": \"li1\", \"h\": \"Between 1769 and 1814, many Māori showed a strong interest in understanding and adapting to the new world of te ao Pākehā, actively learning about new ideas and technologies and, in some cases, travelling overseas as far as England to experience it first-hand. At the same time, Māori worked to maintain their own identity and traditions while responding to these new influences.\"}, {\"t\": \"h\", \"h\": \"<b>Impact of European technology<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The Musket Wars (1820 –1830s) were an extension of long-standing rivalries between iwi, which were intensified by the introduction of muskets and resulted in widespread devastation.\"}, {\"t\": \"li1\", \"h\": \"These conflicts, alongside the impact of disease, disrupted traditional leadership through the loss of many rangatira, which led to displacement with some local areas becoming depopulated as a result. For example, Moriori expressed mana through Nunuku’s Covenant (Law), which rejected warfare as a way of resolving conflict. Following the arrival of Taranaki iwi (Wellington based) in 1835 (who were driven from their homeland due to the Musket Wars), Moriori experienced significant loss of life when they were invaded.\"}], [{\"t\": \"h\", \"h\": \"<b>Responses to increasing challenges (from 1830)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"From 1830 there were increasing concerns about lawlessness amongst the transient population of whalers, seafarers, traders, adventurers and others at places such as Kororāreka | Russell. This, combined with the growth of the settler population (e.g. the Wakefield scheme) and foreign influence (e.g. France), contributed to the signing of two agreements between Māori and the Crown.\"}, {\"t\": \"h\", \"h\": \"<b>Key features of 1835 He Whakaputanga o te Rangatiratanga o Nu Tireni | The Declaration of Independence<\\/b>\"}, {\"t\": \"li1\", \"h\": \"This was signed by a collective of Māori northern chiefs, witnessed by British Resident James Busby.\"}, {\"t\": \"li1\", \"h\": \"It declared New Zealand an independent nation.\"}, {\"t\": \"li1\", \"h\": \"For Māori, it affirmed the authority of the chiefs (rangatiratanga/chieftainship) and established a relationship with the British Crown.\"}, {\"t\": \"li1\", \"h\": \"From the Crown’s perspective, it guaranteed New Zealand’s independence and freedom from foreign interference.\"}, {\"t\": \"h\", \"h\": \"<b>Key features of 1840 Te Tiriti o Waitangi / The Treaty of Waitangi<\\/b>\"}, {\"t\": \"li1\", \"h\": \"There are two texts: the English text, the Treaty of Waitangi, and the Māori text, te Tiriti o Waitangi, which was translated into te reo Māori by missionary Henry Williams and his son Edward Williams. Most rangatira signed the Māori version.\"}, {\"t\": \"li1\", \"h\": \"Key words and phrases (kāwanatanga, tino rangatiratanga, sovereignty, and taonga) have been interpreted in different ways over time by Māori and the British. Different interpretations contributed to different understandings of who would have authority.\"}, {\"t\": \"li1\", \"h\": \"It was signed by approximately 500 rangatira (including women) and the Lieutenant -Governor (William Hobson) at Waitangi, and then at different coastal places around New Zealand.\"}, {\"t\": \"li1\", \"h\": \"Rangatira held diverse views from their own established perspectives on governance and leadership. Some supported te Tiriti o Waitangi / the Treaty of Waitangi to address lawlessness and trade, while others feared losing authority and land.\"}, {\"t\": \"li1\", \"h\": \"Some rangatira refused to sign, while others never had the opportunity. Neither refusal nor non-engagement resulted in the retention of authority for Māori, as the Treaty was subsequently applied to all Māori.\"}, {\"t\": \"li1\", \"h\": \"There is ongoing debate today around the interpretations and what was agreed upon.\"}, {\"t\": \"h\", \"h\": \"<b>Contested sovereignty<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Soon after signing, some northern Māori became disillusioned about broken promises, such as the imposition of customs duties on trade, and the moving of the capital to Auckland.\"}, {\"t\": \"li1\", \"h\": \"This led to Hōne Heke's (Ngāpuhi) flagstaff protests and the Northern War (1845–1846), the first major conflict between the Crown and a Māori force led by Hōne Heke Pōkai and Te Ruki Kawiti (Ngāpuhi). While they were supported by some Ngāpuhi and allied Māori, other influential Ngāpuhi leaders, especially Tāmati Wāka Nene, sided with the Crown.\"}, {\"t\": \"li1\", \"h\": \"Ruapekapeka Pā is the site of the defining battle of the war and remains an important historical and cultural site.\"}, {\"t\": \"h\", \"h\": \"<b>Impacts, significance, and responses<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Māori worked to protect their people’s whenua (land), language, culture, and authority. For example, Māori leaders such as Sir Āpirana Ngata (Ngāti Porou) and Sir Māui Pō mare (Ngāti Mutunga, Ngāti Toa) worked within political and government systems to improve Māori social, economic, and cultural well - being while maintaining Māori identity and aspirations.\"}, {\"t\": \"li1\", \"h\": \"The loss of Māori land led to responses, including the Kii ngitanga movement, Parihaka resistance, the 1975 Land March, and Treaty settlement processes.\"}, {\"t\": \"li1\", \"h\": \"Concerns about the loss of te reo Māori led to Māori advocacy groups campaigning for language revitalisation, for example, Ngā Tamatoa and the 1972 Māori Language Petition, kōhanga reo, and kura kaupapa Māori.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Reflect on how refining or reframing a question can provide more information and improve the responses gathered, for example: changing ‘Who were the first Europeans to have contact with Māori?’ to ‘Why did sealers, whalers, traders, and missionaries come to New Zealand, and how did their interactions with Māori affect communities, relationships, and ways of life?’\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources (e.g. interviews, hapū and iwi histories, recordings, oral histories, letters and journals) with differing perspectives to identify the exchange of ideas, resources, and technology associated with cultural contact, recognising that sources may not provide the full picture.\"}, {\"t\": \"li1\", \"h\": \"Analysing evidence about the exchange of ideas, resources, and technologies and the consequences that resulted.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing perspectives about cultural contact and cultural exchange.\"}, {\"t\": \"li1\", \"h\": \"Explaining how people's values and beliefs influenced their responses to new ideas, resources, and technologies.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical narrative, using evidence from multiple sources, to explain how cultural contact led to the exchange of new ideas, resources, and technologies.\"}, {\"t\": \"li1\", \"h\": \"Explaining the consequences of cultural exchange for people and society, recognising that these may be interpreted differently by different groups.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Critically evaluating the responses and decisions of groups and communities to new cultural contact.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Develop analysis questions that investigate why events or patterns occur, for example:\"}, {\"t\": \"li2\", \"h\": \"How did different understandings of kāwanatanga, tino rangatiratanga, sovereignty, and taonga influence later disagreements about te Tiriti o Waitangi?\"}, {\"t\": \"li2\", \"h\": \"Why did some rangatira support te Tiriti o Waitangi while others opposed it or chose not to sign?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources with differing perspectives to explain how historical agreements were formed in response to cultural contact, recognising that sources may not provide the full picture and that conclusions drawn from sources are interpretations.\"}, {\"t\": \"li1\", \"h\": \"Comparing examples of historical agreements over time to explain their consequences for different groups, and why people may interpret these consequences differently.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing perspectives on historical agreements and their consequences, recognising that sources may not provide the full picture and that historical interpretations may differ.\"}, {\"t\": \"li1\", \"h\": \"Making informed ethical judgements about decisions and actions associated with historical agreements, considering the values, beliefs, perspectives, challenges, and circumstances of the time.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical narrative of cause-and-consequence that incorporates differing perspectives to explain why agreements were formed and how they attempted to resolve differences arising from cultural contact.\"}, {\"t\": \"li1\", \"h\": \"Explaining how agreements had different consequences for different groups and why historical interpretations of those consequences may change over time.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Creating an awareness campaign to educate others about an agreement and its significance (e.g. nationally or locally),** and weighing interpretations that rate its significance differently.\"}]]}]}, {\"label\": \"Global history\", \"idea\": {\"title\": \"Causes and consequences\", \"desc\": \"There are causes and consequences of cultural contact.\"}, \"units\": [{\"kc\": [\"Cultural contact between people and societies created opportunities, conflict, and challenges.\", \"Cultural contact can be caused by a group advancing its interests, with consequences on the rights of others, leading to resistance and advocacy for civil rights.\"], \"pc\": [\"Define, explain, and apply concepts of <b>cultural contact, opportunity, conflict,<\\/b> and <b>challenges,<\\/b> and make connections between these concepts.\", \"Define, explain, and apply concepts of <b>group interests, cultural contact, resistance,<\\/b> and <b>rights<\\/b>, and make connections between these concepts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>Choose one case study from the following:<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>China and the West (1644–1949)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The Qing dynasty (1644–1912) largely closed China to foreign contact, restricting trade to Canton (Guangzhou, capital of Guangdong province) due to a belief that the West offered little of value. This isolation, plus internal problems, left China vulnerable when European demand for Chinese goods (e.g. porcelain, silk, tea) created a severe trade imbalance.\"}, {\"t\": \"li1\", \"h\": \"British merchants smuggled opium from India to correct the deficit; the resulting addiction crisis prompted Chinese suppression efforts and, in turn, the First Opium War (1839– 1842).\"}, {\"t\": \"li1\", \"h\": \"The 1842 Treaty of Nanjing, the first of many unequal treaties, forced China to open five ports, pay large indemnities, and cede Hong Kong Island.\"}, {\"t\": \"li1\", \"h\": \"The Second Opium War (1856–1860) deepened foreign control, extraterritorial laws applied in treaty ports, and key railways and trade networks fell under foreign influence while opium’s spread caused widespread social ills and damage to health.\"}, {\"t\": \"li1\", \"h\": \"Poverty increased dramatically and migration occurred, including to the New Zealand goldfields from the 1860s.\"}, {\"t\": \"li1\", \"h\": \"The 1900 anti-Western Boxer Rebellion provoked a multinational invasion of Beijing, further reparations, and foreign troops stationed in China, helping to trigger the 1911 Xinhai Revolution and the Qing’s fall in 1912, ending more than 2,000 years of imperial rule – a period Chinese accounts describe as national humiliation.\"}, {\"t\": \"li1\", \"h\": \"During World War One China contributed labourers to the Allies, shifting some Western views. Japan’s invasion beginning in Manchuria in 1931 and then spreading south into mainland China from 1937, devastated lives and infrastructure, leading to widespread famine. China and the Western Allies opposed Japan in World War Two, with the Nationalists receiving substantial US aid.\"}, {\"t\": \"li1\", \"h\": \"After Japan’s defeat, civil war resumed and Mao Zedong’s Communist forces prevailed in 1949, inaugurating a new political era. Mao and subsequent Chinese leaders were determined to never again allow China to become so weak.\"}, {\"t\": \"h\", \"h\": \"<b>OR<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>From Silk Roads to the Age of Exploration<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The Silk Roads, developed during China’s Han Dynasty (202 BCE–220 CE), were a vast network of trade routes linking the east (China) to the west (Europe). Travellers along these routes faced long and difficult journeys, often enduring banditry and dangerous weather conditions across deserts and mountains.\"}, {\"t\": \"li1\", \"h\": \"Merchants, monks, explorers, and travellers moved and exchanged goods such as silks and spices and introduced religions (e.g. Buddhism) and new technology (e.g. paper, printing, compass, gunpowder).\"}, {\"t\": \"li1\", \"h\": \"Over time, Venice became a major maritime hub for Europe, and the introduction of spices from East Asia to Europe via the Silk Roads set off a boom in demand; prices soared as access was limited by the carrying capacity of camels and the lengthy journey of the goods through Muslim-controlled lands.\"}, {\"t\": \"li1\", \"h\": \"In response, European nations along the Atlantic seaboard, such as Spain and Portugal, followed later by England, France, and the Netherlands, sought new sea routes to East Asia, leading to what has become known as the Age of Exploration (roughly 15th to 17th centuries). Navigational advancements, including magnetic compass technology originating in China, made this long-distance ocean voyaging possible.\"}, {\"t\": \"li1\", \"h\": \"Exploration led to European conquest and colonisation as the race to build global trading empires began. To fulfil the high demand for labour on colonial plantations and in mines, the transatlantic slave trade was organised around European colonial economies, with active participation from some African rulers and traders. This resulted in the enslavement and transportation of millions of people.\"}], [{\"t\": \"h\", \"h\": \"<b>Choose one case study from the following:<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Expansion west in America (1803–1890s)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Starting with the Louisiana Purchase in 1803, many people such as farmers and miners in North America, motivated by the belief in Manifest Destiny, moved west for new land, jobs, and better lives.\"}, {\"t\": \"li1\", \"h\": \"Ranching and cowboys driving huge herds of cattle were two major economic activities. The 1849 California Gold Rush increased the population and development of the area, with both positive and negative effects.\"}, {\"t\": \"li1\", \"h\": \"Settlers and Native American peoples came into conflict as both sought control of land and resources, and westward expansion reshaped the lives of everyone involved. Ongoing conflict with Native American peoples, including the Sioux Wars, led to tragic events such as the Wounded Knee Massacre in 1890.\"}, {\"t\": \"li1\", \"h\": \"Native American peoples’ seasonal hunting and gathering traditions were disrupted (e.g. loss of the bison) as their land was taken for farms, mines, towns, and railways, causing many communities to shrink from sickness and conflict. Native American peoples were forcibly removed from their land (e.g. the Trail of Tears) and often moved to economically unproductive reservations.\"}, {\"t\": \"li1\", \"h\": \"Treaties were broken as settlers expanded west. Often these treaties were imposed and used to reduce land available to Native American peoples.\"}, {\"t\": \"li1\", \"h\": \"Native American peoples used resistance, economic adaptation, political negotiation, and cultural preservation to actively challenge westward expansion.\"}, {\"t\": \"li1\", \"h\": \"The lasting impact of this time on Native American people was huge, disrupting Indigenous societies and causing economic and social challenges (e.g. population decline, loss of language and culture).\"}, {\"t\": \"li1\", \"h\": \"Today, Native American peoples are reclaiming their language, culture, land, and protecting the environment (e.g. Standing Rock).\"}, {\"t\": \"h\", \"h\": \"<b>OR<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Civil rights movement in the United States (1954–1968)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"At the end of the American Civil War in 1865, the 13th Amendment to the American Constitution abolished slavery.\"}, {\"t\": \"li1\", \"h\": \"Despite the abolition of slavery, Jim Crow Laws in the Southern States legally enforced racial segregation and inequality, protecting the interests of the white majority and restricting the rights of African Americans, including their right to vote. Different groups formed to overturn these laws (e.g. the National Association for the Advancement of Colored People (NAACP) and the Southern Christian Leadership Conference (SCLC)).\"}, {\"t\": \"li1\", \"h\": \"Leaders such as Dr Martin Luther King Jr. were pivotal during this time, but change was due to the collective advocacy of thousands of everyday men, women, and children.\"}, {\"t\": \"li1\", \"h\": \"Activists used a range of strategies to achieve civil rights for African Americans in the South. These included non-violent protests such as sit-ins (e.g. Greensboro), boycotts (e.g. Montgomery Bus Boycott), and legal challenges (e.g. Brown vs Board of Education). Young people were at the forefront of many campaigns (e.g. the Birmingham Campaign, Little Rock Nine).\"}, {\"t\": \"li1\", \"h\": \"The 1964 Civil Rights Act and the 1965 Voting Rights Act were the highpoints of the movement.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Reflect on how refining or reframing a question can provide more information and improve the responses gathered, for example: changing ‘What was the Silk Road ?’ to ‘How did the Silk Road connect people, goods, ideas, and technologies across Asia, Europe, and North Africa, and what impacts did these exchanges have on different societies?’\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources with differing perspectives to identify opportunities, conflicts, and challenges arising from cultural contact, while recognising that such sources may not provide the full picture.\"}, {\"t\": \"li1\", \"h\": \"Analysing evidence to explain cause-and-consequence relationships associated with cultural contact.\"}, {\"t\": \"li1\", \"h\": \"Sequencing events associated with cultural contact to show how interactions developed over time.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing perspectives about the opportunities, conflicts, and challenges arising from cultural contact.\"}, {\"t\": \"li1\", \"h\": \"Explaining how people's values, beliefs, and priorities influenced their responses to cultural contact.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical narrative of causes and consequences, using evidence from multiple sources, to explain how cultural contact created opportunities, conflicts, and challenges for different groups.\"}, {\"t\": \"li1\", \"h\": \"Explaining why the impacts of cultural contact may be interpreted differently by different people and groups.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Develop analysis questions that investigate why events or patterns occur for your chosen case study, for example:\"}, {\"t\": \"li2\", \"h\": \"Why did conflict develop between settlers and Native Americans during westward expansion?\"}, {\"t\": \"li2\", \"h\": \"Why did African Americans challenge segregation and discrimination during the Civil Rights Movement?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources with differing perspectives to explain how groups advanced their interests through cultural contact, recognising that sources may not provide the full picture and that historical interpretations are shaped by the evidence available.\"}, {\"t\": \"li1\", \"h\": \"Comparing examples of resistance and advocacy for rights over time to explain their consequences for different groups and why these consequences may be interpreted differently.\"}, {\"t\": \"li1\", \"h\": \"Sequencing events that represent key encounters in cultural contact to explain change over time.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing perspectives on whose interests were advanced, whose rights were affected, and the values that may inform why resistance emerged.\"}, {\"t\": \"li1\", \"h\": \"Making informed ethical judgements about actions and decisions relating to resistance and advocacy for rights, considering the values, attitudes, and circumstances of the time, and information available to people at the time.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical narrative of cause-and-consequence that includes multiple perspectives to explain how groups advanced their interests through cultural contact affected the rights of others and led to resistance.\"}, {\"t\": \"li1\", \"h\": \"Explaining how resistance and advocacy for rights resulted in different consequences for different groups and why historical interpretations of these consequences may differ over time.\"}]]}]}]}, \"Geography\": {\"sections\": [{\"label\": null, \"idea\": {\"title\": \"Environmental change\", \"desc\": \"Environmental change is driven by human activities and natural processes.\"}, \"units\": [{\"kc\": [\"Population change through migration impacts people, places, and environments.\", \"Natural processes interact with human activities to create environmental impacts that affect people.\"], \"pc\": [\"Define, explain, and apply concepts of <b>migration, population change, and place,<\\/b> and make connections between these concepts.\", \"Define, explain, and apply concepts of <b>natural processes and environmental impact,<\\/b> and make connections between these concepts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>International and internal migration in New Zealand<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Migration can be international (immigration and emigration) or internal (e.g. rural–urban, urban–rural).\"}, {\"t\": \"li1\", \"h\": \"The decision to migrate balances negative (push) factors at origin with positive (pull) factors at destination.\"}, {\"t\": \"li1\", \"h\": \"Migration can be forced. Asylum seekers and refugees are people forced to migrate because it is unsafe to stay in their home countries.\"}, {\"t\": \"li1\", \"h\": \"Patterns of migration can be shown using flow maps with the width of the arrow showing the amount of movement.\"}, {\"t\": \"h\", \"h\": \"<b>International migration – exemplified through a case study of a migrant group or groups, and of impacts in the local area<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The origin of international migrants has changed since World War Two (from Britain/Northern Europe to the Pacific and Asia) as migrant groups have responded to varying push and pull factors, including government incentives (e.g. Assisted Passage Migration Scheme).\"}, {\"t\": \"li1\", \"h\": \"Many migrant groups settle in geographic clusters that offer networks of support (e.g. Pacific, East Asian, Middle Eastern, South African) within particular suburbs of cities.\"}, {\"t\": \"li1\", \"h\": \"The characteristics of places (e.g. shops, services, language, signs, buildings) are shaped by migrants.**\"}, {\"t\": \"li1\", \"h\": \"Migrant groups contribute culturally (e.g. new ideas, foods, the arts, fashion, languages, traditions, histories), economically (e.g. work, filling skills shortages, new technologies, businesses and entrepreneurship, volunteering), and politically (e.g. holding positions in government and government organisations).\"}, {\"t\": \"li1\", \"h\": \"Over time migrants have faced barriers to participation and contribution such as discrimination, language, and non-recognition of qualifications.\"}, {\"t\": \"li1\", \"h\": \"Migrant communities retain connections with their place of origin through language, media, remembering events, remitting funds, and ethnic and religious associations.\"}, {\"t\": \"li1\", \"h\": \"There are a range of organisations that help migrants make the transition to living in New Zealand (e.g. Migrant Action Trust, The English Language Partners New Zealand, and Belonging Aotearoa).\"}, {\"t\": \"h\", \"h\": \"<b>Internal migration – exemplified through case studies of places in New Zealand experiencing population change, including own local area:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Māori migration to cities occurred at unprecedented pace and scale after World War Two, driven by a lack of work in rural areas and more opportunities in cities.\"}, {\"t\": \"li1\", \"h\": \"New Zealand has a highly mobile population driven by factors such as cost of living, house prices, climate preferences, and educational opportunities.\"}, {\"t\": \"li1\", \"h\": \"The pattern of internal migration is not even, with some places growing and others declining.**\"}, {\"t\": \"li1\", \"h\": \"Change in population distribution can be shown in choropleth maps and computer-generated visualisations.\"}, {\"t\": \"li1\", \"h\": \"Areas of growth experience economic benefits such as employment opportunities and more consumer choices, but there may also be pressures on housing, services, and the environment.\"}, {\"t\": \"li1\", \"h\": \"The effects of internal migration on places experiencing growth and decline can be seen in changes to their:\"}, {\"t\": \"li2\", \"h\": \"character (e.g. age structure)\"}, {\"t\": \"li2\", \"h\": \"culture (e.g. loss of links to marae, hapū, and iwi traditions, loss of community fabric through pepper-potting of Māori, changes in cultural diversity, as well as new expressions of Māori identity in cities such as urban marae and pan-Māori)\"}, {\"t\": \"li2\", \"h\": \"landscape (e.g. closed shops and services, urban sprawl, infrastructure) of places.\"}], [{\"t\": \"h\", \"h\": \"<b>Natural hazards in New Zealand<\\/b>\"}, {\"t\": \"p\", \"h\": \"Note: The two prescribed illustrative examples are floods and earthquakes; however, teachers in areas affected by natural hazards may choose to replace one of these with volcanoes, tsunami, or landslides if it better reflects the experiences of students in their class.\"}, {\"t\": \"li1\", \"h\": \"Natural processes affect landforms and become hazards when they pose a risk to life or property.\"}, {\"t\": \"li1\", \"h\": \"‘The four Rs’ (Reduction, Readiness, Response, Recovery) underpin the emergency management system in New Zealand.\"}, {\"t\": \"li1\", \"h\": \"Consequences for people affected by natural disasters include loss of life, loss of property and marae, damage to urupā (burial grounds), damage to infrastructure, siltation, damage to transport links, disruption to lives and livelihoods, psychological, and long - term health impacts.\"}, {\"t\": \"h\", \"h\": \"<b>Flooding – exemplified through at least one New Zealand case study<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>River systems<\\/b>\"}, {\"t\": \"li1\", \"h\": \"River systems comprise a source, tributaries, channel, and mouth. Rivers vary from fast-flowing mountain, to braided (e.g. Rakaia River) and meandering (e.g. Waikato River).\"}, {\"t\": \"li1\", \"h\": \"In te ao Māori, rivers are living ancestors with their own mauri (life force), which carries an obligation to care for the whole river system** (e.g. the Whanganui River | Te Awa Tupua was recognised in 2017 as an indivisible, living whole and is represented by appointed guardians from the Crown and local iwi who act on its behalf to uphold its health and well-being).\"}, {\"t\": \"li1\", \"h\": \"Many towns and cities in New Zealand are located on river floodplains, which are the lower, flatter reaches of rivers.\"}, {\"t\": \"li1\", \"h\": \"Topographical maps use contour lines to show the height of the land above sea level. The wider apart the contour lines, the flatter the land. Grid references are used to locate specific points.\"}, {\"t\": \"h\", \"h\": \"<b>Floods<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Flooding occurs due to amount and duration of rainfall and storms and their impacts on river systems and urban areas.\"}, {\"t\": \"li1\", \"h\": \"Climate change can impact the severity of floods. The increase in greenhouse gases from the burning of fossil fuels warms the atmosphere. A warmer atmosphere holds more moisture, which generates heavier rainfall and more intense storms resulting in increased surface runoff and greater flood risk.\"}, {\"t\": \"li1\", \"h\": \"Human activities within the river system (e.g. deforestation, slash management of forests, building and farming on flood-prone land) can magnify the impact of flooding.\"}, {\"t\": \"li1\", \"h\": \"Urban areas have many impermeable surfaces such as concrete, asphalt, and buildings. These stop water soaking into the ground and can contribute to flooding.\"}, {\"t\": \"li1\", \"h\": \"Flooding risks are managed through weather forecasting, river level warnings, stopbanks, river diversions, the creation of more permeable surfaces, and the clearing of drains and gutters.\"}, {\"t\": \"li1\", \"h\": \"People protect themselves by having emergency kits, evacuating, and moving to higher ground when needed.\"}, {\"t\": \"h\", \"h\": \"<b>Earthquakes – exemplified through at least one New Zealand case study<\\/b>\"}, {\"t\": \"li1\", \"h\": \"New Zealand’s location on the Pacific Ring of Fire makes the country vulnerable to earthquakes.\"}, {\"t\": \"li1\", \"h\": \"Earthquakes occur through tectonic plate movement, and the physical consequence of earthquakes includes ground vibration, rupture, uplift, subsidence, liquefaction, and tsunami.\"}, {\"t\": \"li1\", \"h\": \"Many cultures had stories to explain earthquakes (e.g. Poseidon for the Ancient Greeks, Neptune for the Ancient Romans, Namazu in Japan). In te ao Māori the legend of Rūaumoko is a traditional Māori explanation for earthquakes.\"}, {\"t\": \"li1\", \"h\": \"Earthquakes are unpredictable but are managed through monitoring and planning by Earth Sciences New Zealand.\"}, {\"t\": \"li1\", \"h\": \"Personal safety responses include ‘Drop, Cover, and Hold’, and ‘Long or Strong, Get Gone’ strategies, keeping emergency kits ready, and knowing evacuation routes for tsunamis.\"}, {\"t\": \"h\", \"h\": \"<b>Hazard management – exemplified through the flooding and earthquake case studies<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The ability of a community to manage hazards is influenced by accessibility, costs, and available resources, and how they come together to support each other.**\"}, {\"t\": \"li1\", \"h\": \"Short-term responses include search and rescue, marae as a focal point for support, response and recovery, provision of essentials, temporary fixes, financial aid, and humanitarian assistance and citizen-initiated volunteering.\"}, {\"t\": \"li1\", \"h\": \"Longer -term responses include reconstruction and mitigation but may also include relocation.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Reflect on how refining or reframing a question can provide more information, for example: changing ‘What causes migration?’ to ‘How does migration change the character of places?’\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using flow maps to show patterns of immigration to New Zealand.\"}, {\"t\": \"li1\", \"h\": \"Using maps and 3D computer-generated visualisations to show population density and change nationally.\"}, {\"t\": \"li1\", \"h\": \"Using articles, stories, information from websites, local interviews, or other personal accounts to describe, for example:\"}, {\"t\": \"li2\", \"h\": \"the experience of new migrants\"}, {\"t\": \"li2\", \"h\": \"the experience of living in places of rapid population growth or in areas of population decline.\"}, {\"t\": \"li1\", \"h\": \"Optional: Tracing personal family histories of migration (international and internal). Using photographs to show how the character of places changes as a result of migration.\"}, {\"t\": \"li1\", \"h\": \"Optional: Carrying out fieldwork to identify evidence of the impact of migrant groups on the local area.**\"}, {\"t\": \"li1\", \"h\": \"Optional: Surveying people about why they have migrated into the local area.**\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Considering different perspectives from, for example, residents, businesses, local council,** and iwi on the impact of internal migration on a place of rapid growth.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Describing the impact of population growth or decline on a place.\"}, {\"t\": \"li1\", \"h\": \"Describing the impact of migration on the migrant community and the place of destination.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social actions by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Investigating the actions of community groups who work with immigrant communities to make the transition to living in New Zealand easier, and how to support those efforts.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Develop analysis questions that investigate why events or patterns occur, for example: ‘Why are some places more vulnerable to natural hazards than others?’\"}, {\"t\": \"li1\", \"h\": \"Use questions to explore causes and impacts, for example:\"}, {\"t\": \"li2\", \"h\": \"What causes particular hazards?\"}, {\"t\": \"li2\", \"h\": \"What are the immediate and longer-term impacts of particular hazards?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical data to track changes in flood frequency.\"}, {\"t\": \"li1\", \"h\": \"Using topographic maps and other tools to identify and investigate the shape of the land in flood-prone areas.\"}, {\"t\": \"li1\", \"h\": \"Using diagrams to show the natural and human processes that create different types of hazards.\"}, {\"t\": \"li1\", \"h\": \"Using flow diagrams to show the sequence of events in a hazard from the original cause to impact and response.\"}, {\"t\": \"li1\", \"h\": \"Using quantitative data (e.g. casualties, costs) and qualitative sources (e.g. images, accounts of eyewitnesses) to describe the impact of hazards.\"}, {\"t\": \"li1\", \"h\": \"Optional: Carrying out local fieldwork ** to test the local awa (river) for debris or loss of vegetation cover that may contribute to flooding, or to investigate the impact of impermeable surfaces.\"}, {\"t\": \"li1\", \"h\": \"Optional: Surveying people to gather their opinions about perceptions of hazard risk.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating the values behind the actions of groups such as marae and volunteer organisations in their response to hazards.\"}, {\"t\": \"li1\", \"h\": \"Analysing and comparing points of view about responsibilities in relation to natural hazards (e.g. whether people should be allowed to live in high-risk places).\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Describing the natural processes that create hazards, and the environmental impacts and changes to people’s lives that result from those hazards.\"}, {\"t\": \"li1\", \"h\": \"Describing the natural hazards response plan in your local area.**\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social actions by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Considering how people could contribute to support communities affected by hazardous events.\"}, {\"t\": \"li1\", \"h\": \"Considering how people could raise awareness of Civil Defence practices in New Zealand.\"}]]}]}]}, \"Financial and Economic Activity\": {\"sections\": [{\"label\": null, \"idea\": {\"title\": \"Navigating financial systems\", \"desc\": \"Understanding how money works within communities, businesses, and governments enables better decisions together.\"}, \"units\": [{\"kc\": [\"Managing money as a group requires financial planning based on shared values and decisions.\", \"Scams, credit, debt, and awareness of consumer rights can affect financial outcomes.\"], \"pc\": [\"Define, explain, and apply concepts of <b>values, money management, and financial planning,<\\/b> and make connections between these concepts.\", \"Define, explain, and apply concepts of <b>credit, debt, and consumer rights,<\\/b> and make connections between these concepts.\"], \"k\": [[{\"t\": \"label\", \"h\": \"Financial systems\"}, {\"t\": \"h\", \"h\": \"<b>Family community and business financial planning<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Currency<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Countries have their own currencies, which can be exchanged for the currencies of other nations.\"}, {\"t\": \"li1\", \"h\": \"The value of the New Zealand dollar (NZD) changes in relation to other currencies, and banks and other providers can exchange currencies for a fee.\"}, {\"t\": \"h\", \"h\": \"<b>Business<\\/b>\"}, {\"t\": \"li1\", \"h\": \"A business is when a person or group provides a good or service to generate a profit.\"}, {\"t\": \"li1\", \"h\": \"A business can be local, national, or international. When businesses operate internationally, countries buy and sell goods and services with each other.\"}, {\"t\": \"label\", \"h\": \"Decision-making\"}, {\"t\": \"li1\", \"h\": \"Groups that need to make financial decisions may include family groups, hapū or iwi, community organisations, and small and large businesses.\"}, {\"t\": \"li1\", \"h\": \"Like individuals, groups have priorities and collective values which influence the decisions they make.\"}, {\"t\": \"li1\", \"h\": \"Groups cannot afford everything, so they must make trade -offs when making informed decisions.\"}, {\"t\": \"li1\", \"h\": \"Being informed involves:\"}, {\"t\": \"li2\", \"h\": \"weighing up benefits and consequences\"}, {\"t\": \"li2\", \"h\": \"understanding what is influencing decision-making\"}, {\"t\": \"li2\", \"h\": \"taking time to research your options.\"}, {\"t\": \"label\", \"h\": \"Managing money\"}, {\"t\": \"li1\", \"h\": \"Financial planning can be used to help groups, businesses, and organisations make financial decisions.\"}, {\"t\": \"li1\", \"h\": \"A budget sets out how that group plans to spend their money within their income.\"}, {\"t\": \"li1\", \"h\": \"In society people pool or share money and resources. They may do this for cultural reasons, personal values, or to help ease financial pressure.\"}, {\"t\": \"li1\", \"h\": \"Shared living arrangements like flatting, papakāinga, retirement villages, or intergenerational living can help people live their values, as well as:\"}, {\"t\": \"li2\", \"h\": \"access more than they could on their own\"}, {\"t\": \"li2\", \"h\": \"manage other costs such as utilities, and child and elder care.\"}, {\"t\": \"li1\", \"h\": \"Financial sustainability is the ability to manage money in a way that meets current needs and responds to changes and challenges in the future.\"}, {\"t\": \"label\", \"h\": \"Being prepared\"}, {\"t\": \"li1\", \"h\": \"Informed financial decision-making requires access to safe, relevant, and impartial information, for example:\"}, {\"t\": \"li2\", \"h\": \"safe financial information protects your privacy and should not put your money at risk\"}, {\"t\": \"li2\", \"h\": \"relevant financial information is suited to a person’s or group’s circumstances, values, and perspectives\"}, {\"t\": \"li2\", \"h\": \"impartial financial information is balanced and unbiased; it is not trying to sell you something to benefit someone else.\"}, {\"t\": \"li1\", \"h\": \"Like individuals, it is important for groups to consider their financial sustainability when making decisions and financial planning (e.g. a local tourism business planning to cut costs in the quiet seasons, a group maintaining emergency savings).\"}], [{\"t\": \"label\", \"h\": \"Financial systems\"}, {\"t\": \"h\", \"h\": \"<b>Personal financial awareness<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Consumer rights and responsibilities<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Consumer rights are the laws and protections people are entitled to when buying goods and services within New Zealand, such as:\"}, {\"t\": \"li2\", \"h\": \"accurate information\"}, {\"t\": \"li2\", \"h\": \"fit for purpose goods\"}, {\"t\": \"li2\", \"h\": \"remedies if something goes wrong.\"}, {\"t\": \"li1\", \"h\": \"Consumer responsibilities are the obligations on the other side of that relationship, such as:\"}, {\"t\": \"li2\", \"h\": \"reading agreements\"}, {\"t\": \"li2\", \"h\": \"using a product as intended\"}, {\"t\": \"li2\", \"h\": \"checking the reliability of the seller.\"}, {\"t\": \"label\", \"h\": \"Decision-making\"}, {\"t\": \"li1\", \"h\": \"Advertising can have a direct or subconscious influence on spending such as social media, influencers, online and physical advertisements, and branding.\"}, {\"t\": \"li1\", \"h\": \"Some in-person and online businesses use tactics such as fake urgency, hidden costs, and pre-ticked add -ons to influence decisions instead of helping people choose.\"}, {\"t\": \"label\", \"h\": \"Managing money\"}, {\"t\": \"li1\", \"h\": \"Different ways of paying (e.g. cash, debit cards, credit cards) each have advantages and disadvantages.\"}, {\"t\": \"li1\", \"h\": \"When borrowing money, you usually pay interest. This means you may repay much more than the original cost.\"}, {\"t\": \"li1\", \"h\": \"Credit is the ability to borrow money. It allows you to access money you do not currently have (e.g. a credit card).\"}, {\"t\": \"li1\", \"h\": \"Debt is the amount of money you owe. It must be paid back, usually in set amounts and at set times (e.g. money owed on a credit card, loans, mortgages, or buy now, pay later).\"}, {\"t\": \"li1\", \"h\": \"When using credit or taking on debt, you need to meet all obligations, such as fees and regular repayments.\"}, {\"t\": \"li1\", \"h\": \"When investing money, it can earn more money for you. You may invest in shares, property, or funds to grow it over time. The value of investments can go up or down.\"}, {\"t\": \"li1\", \"h\": \"Shares are small pieces of ownership in a company that you can buy and sell.\"}, {\"t\": \"li1\", \"h\": \"Funds are pools of money from many investors that are invested together across a range of assets (e.g. KiwiSaver).\"}, {\"t\": \"label\", \"h\": \"Being prepared\"}, {\"t\": \"li1\", \"h\": \"Scams are deceptive schemes designed to steal people’s money or personal information. There are different types of scams, and unfortunately, they are constantly evolving.\"}, {\"t\": \"li1\", \"h\": \"People can protect themselves from scams by:\"}, {\"t\": \"li2\", \"h\": \"not sharing personal information (e.g. bank details and passwords)\"}, {\"t\": \"li2\", \"h\": \"questioning if communication and other content is legitimate\"}, {\"t\": \"li2\", \"h\": \"contacting the bank and telling trusted adults or authorities when there is suspicious activity.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Process information by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Collecting information about the different types of groups in the community that may need to make financial decisions.\"}, {\"t\": \"li1\", \"h\": \"Collecting information about community organisations or groups and what they need to do to stay within budget.\"}, {\"t\": \"li1\", \"h\": \"Using a given budget rank spending priorities for a set of items or experiences.\"}, {\"t\": \"li1\", \"h\": \"Fully costing a school trip and considering what could be done to bring down the cost and using online resources to build a grocery or event budget for a group of your choosing.\"}, {\"t\": \"li1\", \"h\": \"Suggesting how resources might be shared to help with a community project or initiative.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining why people might take a collective approach to money and resource management (e.g. papakāinga (communal Māori land), retirement villages, and extended family living) where land, responsibilities, and resources are shared.\"}], [{\"t\": \"h\", \"h\": \"<b>Process information by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using everyday scenarios regarding consumer rights and responsibilities, such as faulty products, misleading advertising, and refund requests to identify appropriate actions or outcomes.\"}, {\"t\": \"li1\", \"h\": \"Comparing the advantages and disadvantages of using different types of payment such as cash, online transactions, debt, or credit.\"}, {\"t\": \"li1\", \"h\": \"Using quantitative information to show how debt can become difficult to manage.\"}, {\"t\": \"li1\", \"h\": \"Identifying ways the design of an app, website shop, or platform can influence people’s decisions.\"}, {\"t\": \"li1\", \"h\": \"Producing a student-friendly resource on financial scams.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Discussing why honesty and truthfulness is important for sellers and consumers.\"}]]}]}]}}, \"9-10\": {\"Civics and Society\": {\"sections\": [{\"label\": null, \"idea\": {\"title\": \"Democracy processes and international cooperation\", \"desc\": \"People and countries can work together through democratic and cooperative processes to influence decisions and solve challenges.\"}, \"units\": [{\"kc\": [\"Representative democracy shapes how people can participate and influence political decisions.\", \"People and countries can cooperate internationally to try to resolve disagreement for more peaceful, just, and sustainable futures.\"], \"pc\": [\"Define, explain, and apply concepts of <b>parliament and citizen,<\\/b> and make connections between these concepts by exploring different contexts.\", \"Define, explain, and apply concepts of <b>global citizenship, international treaties, and peaceful resolution<\\/b> in different contexts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>New Zealand system of government<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Constitutional arrangements<\\/b>\"}, {\"t\": \"li1\", \"h\": \"New Zealand is a constitutional monarchy with a parliamentary system of government. This means that our head of state is a sovereign. The King is represented in New Zealand by the Governor-General.\"}, {\"t\": \"li1\", \"h\": \"New Zealand’s parliamentary, representative democracy differs from other systems of government, such as direct democracies (e.g. Switzerland), presidential systems (e.g. USA), federal systems (e.g. Australia), and autocracies (e.g. North Korea). Constitutional monarchies themselves vary in how much power a monarch keeps. In New Zealand, the monarch’s role is ceremonial, and the government is run by elected ministers. In Tonga, reforms in 2010 introduced a mostly elected legislature, but the king still appoints the prime minister, the cabinet, and judges.\"}, {\"t\": \"li1\", \"h\": \"New Zealand is a constitutional monarchy, modelled on the British Westminster parliament where the power of the King or Queen of the nation is limited by the constitution.\"}, {\"t\": \"li1\", \"h\": \"New Zealand’s Constitution sets out rules about what government can or cannot do with its power. It is not written in one law; it is many laws and customs that make up the constitution, including te Tiriti o Waitangi / the Treaty of Waitangi, the Constitution Act, and the Bill of Rights.\"}, {\"t\": \"li1\", \"h\": \"Te Tiriti o Waitangi / The Treaty of Waitangi are founding constitutional documents with three articles addressing Crown governance, Māori rights to land, resources, taonga (something of value), and equal protections for all.\"}, {\"t\": \"li1\", \"h\": \"The two texts use different key terms (kāwanatanga, sovereignty, tino rangatiratanga, taonga) leading to ongoing debate about what was agreed.\"}, {\"t\": \"li1\", \"h\": \"The Court of Appeal in 1987 (Sir Robin Cooke) concluded that the Treaty created a foundational partnership between Crown and Māori.\"}, {\"t\": \"li1\", \"h\": \"The New Zealand Constitution is flexible. MPs can change most of it by simply voting. This is different from countries like the United States, where the constitution is very hard to change.\"}, {\"t\": \"h\", \"h\": \"<b>Elections<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Every three years, people 18 years and older get two votes under the Mixed Member Proportional voting system (MMP): one for a person to become a MP for a local area (electorate), and one for a party (party vote) to represent them in Parliament and make decisions on things they care about.\"}, {\"t\": \"li1\", \"h\": \"People of Māori descent can choose to put their name on the Māori roll instead and vote for someone to represent a Māori electorate; the second vote is for the party they want to govern the country.\"}, {\"t\": \"li1\", \"h\": \"Parties with the most votes get the most seats in Parliament and can form a government. Often two or more parties need to make agreements or coalitions to get enough seats to be the government.\"}, {\"t\": \"li1\", \"h\": \"The leader of the biggest party in a government coalition usually becomes Prime Minister. This is different from other democracies, for example, that vote directly for a President.\"}, {\"t\": \"h\", \"h\": \"<b>Branches of government<\\/b>\"}, {\"t\": \"li1\", \"h\": \"New Zealand has three branches of government:\"}, {\"t\": \"li2\", \"h\": \"the Legislative Branch is made up of the MPs who scrutinise and vote on laws, and the Governor-General, who represents the Sovereign (King or Queen) of New Zealand and agrees to these laws\"}, {\"t\": \"li2\", \"h\": \"the Executive branch is made up of senior MPs from the governing party/parties; they meet as a Cabinet (a committee of Ministers) each week to decide policy and suggest laws and are supported by the public service\"}, {\"t\": \"li2\", \"h\": \"the Judiciary is the third branch; it is made up of all the judges of New Zealand, who explain what different laws and rights mean and make sure these are followed.\"}, {\"t\": \"li1\", \"h\": \"Having different roles and responsibilities for each branch of government aims to stop any one branch having too much power.\"}, {\"t\": \"li1\", \"h\": \"In New Zealand, the media has an important role to ask questions of government, explain what is happening to the public, share people’s concerns, and is subject to critique itself to ensure trustworthy reporting. Because of this, it is sometimes called the fourth ‘estate’ or branch. Ensuring the news is reliable and trustworthy is important for all members of a democracy.\"}, {\"t\": \"li1\", \"h\": \"Citizens can be involved in parliamentary law-making by talking to local MPs, petitioning for law changes, or writing and presenting submissions about draft law.\"}, {\"t\": \"li1\", \"h\": \"Not all campaigns achieve their intended outcome. For example, the 2015–16 New Zealand flag referendum involved a nationwide campaign to consider changing the national flag, but voters ultimately chose to retain the existing flag.\"}, {\"t\": \"h\", \"h\": \"<b>Winning the vote<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Who gets a vote in a democracy has been contested for over
