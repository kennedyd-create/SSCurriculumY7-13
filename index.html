stainability and resilience.\"},{\"t\":\"li1\",\"h\":\"Kaitiakitanga provides a framework for how energy resources are used, managed, and protected to ensure their long-term sustainability. It emphasises balancing present energy needs with the responsibility to safeguard the well-being of future generations. This includes the careful stewardship of both renewable and non-renewable energy resources to minimise environmental impacts, protect ecosystems, and uphold the mauri of whenua, wai, and te taiao.\"},{\"t\":\"li1\",\"h\":\"Hapū and iwi apply kaitiakitanga through sustainable energy management strategies that strengthen energy security while supporting environmental, cultural, social, and economic well-being. Iwi-led renewable energy initiatives such as Tūwharetoa Geothermal, Tū Mai Rā Energy, and Tūaropaki Trust, demonstrate how Māori values can guide innovative and sustainable approaches to energy development.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Strategies to reduce energy insecurity and consumption, exemplified through two case studies (local, regional or national scale) from different continents (e.g. China, Morocco, California, Nepal, South Africa).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to interpret the spatial distribution of energy production and consumption.\"},{\"t\":\"li1\",\"h\":\"Interpret statistical data to explain the temporal change of energy consumption and production.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Examine the level of energy production and consumption in case studies.\"},{\"t\":\"li1\",\"h\":\"Identify changes in energy production and consumption over time across case studies.\"},{\"t\":\"li1\",\"h\":\"Discuss the factors that influence energy production and consumption across case studies.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate the effectiveness and sustainability of different strategies to reduce energy insecurity and consumption using a case study.\"},{\"t\":\"li1\",\"h\":\"Examine varied perspectives on appropriate strategies used to reduce energy consumption across case studies.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate the global pattern of per capita energy consumption and the implications (e.g. economic, social, environmental) of these patterns.\"},{\"t\":\"li1\",\"h\":\"Investigate energy movement and trade networks (e.g. pipelines, shipping, electricity grids) and the implications (e.g. political, economic, environmental) of this.\"}]},{\"name\":\"Geopolitics\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Inequalities<\\/b>\"},{\"t\":\"li1\",\"h\":\"Geographers investigate inequalities as differences in access to resources, services, opportunities, and quality of life within and between places.\"},{\"t\":\"li1\",\"h\":\"Inequalities emerge when resources and services such as income, healthcare, education, and housing are distributed unevenly.\"},{\"t\":\"li1\",\"h\":\"Inequalities can occur within and between countries and at local, regional, national, and global scales.\"},{\"t\":\"li1\",\"h\":\"Low Income Countries (LICs) may turn towards High Income Countries (HICs) for support to meet the needs within their country.\"},{\"t\":\"li1\",\"h\":\"Political drivers of inequalities include stability of governments, conflict, structure of political system, and economic policies.\"},{\"t\":\"li1\",\"h\":\"Historical drivers of inequalities include colonisation, imperialism, slavery and exploitation, and resource depletion.\"},{\"t\":\"li1\",\"h\":\"Economic drivers include trade imbalances, unequal access to technology, resources, and employment and economic opportunities, and unequal concentrations of wealth and debt.\"},{\"t\":\"li1\",\"h\":\"Environmental drivers include climate change, natural hazards, and extreme environments.\"},{\"t\":\"li1\",\"h\":\"The interaction of political, historical, economic and environmental drivers can restrict social mobility, leading to the persistence of inequalities across generations.\"},{\"t\":\"li1\",\"h\":\"There is a range of inequalities that exist in New Zealand and the wider Pacific such as:\"},{\"t\":\"li2\",\"h\":\"significant differences in income with widening gaps between wages and salaries\"},{\"t\":\"li2\",\"h\":\"unequal educational outcomes and levels of educational achievement\"},{\"t\":\"li2\",\"h\":\"inequitable access to healthcare due to travel distances and limited availability of services\"},{\"t\":\"li2\",\"h\":\"unequal access to housing, driven by rising costs and limited supply.\"},{\"t\":\"h\",\"h\":\"<b>Indicators of inequality<\\/b>\"},{\"t\":\"li1\",\"h\":\"Indicators such as income, education, health, and housing are used to assess the levels of inequality within countries and across the globe.\"},{\"t\":\"li1\",\"h\":\"Indicators of inequalities change over time and have their own strengths and limitations when used to assess inequality.\"},{\"t\":\"li1\",\"h\":\"GDP per capita represents a country's total economic output (GDP) divided by its population.\"},{\"t\":\"li1\",\"h\":\"The Gini coefficient is a statistical measure of income or wealth inequality, with values ranging from 0 (complete equality) to 1 (complete inequality).\"},{\"t\":\"li1\",\"h\":\"The Human Development Index (HDI) assesses long-term progress in three basic dimensions:\"},{\"t\":\"li2\",\"h\":\"a long/healthy life\"},{\"t\":\"li2\",\"h\":\"access to knowledge\"},{\"t\":\"li2\",\"h\":\"a decent standard of living.\"},{\"t\":\"li1\",\"h\":\"The Happiness Index assesses personal well-being, life satisfaction, and sustainability.\"},{\"t\":\"li1\",\"h\":\"The HDI and the Happiness Index methodologies have changed over time to reflect evolving understandings of development and well-being.\"},{\"t\":\"h\",\"h\":\"<b>Strategies to address inequality<\\/b>\"},{\"t\":\"li1\",\"h\":\"National-led initiatives designed to reduce inequalities may include policies and programmes related to healthcare, housing, education, and social supports (e.g. free education for all, housing for homeless people).\"},{\"t\":\"li1\",\"h\":\"International-led initiatives designed to reduce inequalities include aid programmes, loans, trade agreements and development partnerships (e.g. World Bank loans, Aid, Fair Trade, World Trade Organisation).\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"International-led initiatives to address inequality exemplified through two international case studies from different regions that have adopted different strategies (e.g. the Solomon Islands, India, Bangladesh, Hawaii, Brazil).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools and diagrams to show inequalities at a range of scales including national and global.\"},{\"t\":\"li1\",\"h\":\"Analyse data to identify variations in inequalities globally.\"},{\"t\":\"li1\",\"h\":\"Critique indicators of inequalities.\"},{\"t\":\"li1\",\"h\":\"Analyse changes to indicators of inequalities that have occurred over time.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Examine how a range of factors influence inequalities using case studies.\"},{\"t\":\"li1\",\"h\":\"Analyse how inequality measures shift and change over time.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate the global distribution of development indicators, and what those patterns explain about global inequalities.\"},{\"t\":\"li1\",\"h\":\"Investigate the relationships between different sets of development indicators (e.g. GDP and life expectancy, GDP and literacy rates or rates of schooling) across a sample of countries.\"}]}],\"13\":[{\"name\":\"Resources\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Global distribution of freshwater resources<\\/b>\"},{\"t\":\"li1\",\"h\":\"Freshwater is essential for life, supporting ecosystems, human health, agriculture, and industry. It is sourced from surface water (rivers, lakes, glaciers) and groundwater (aquifers).\"},{\"t\":\"li1\",\"h\":\"The spatial distribution of freshwater sources is determined by physical processes such as climate and geology.\"},{\"t\":\"li1\",\"h\":\"Not all fresh water sources are accessible for consumption and use by people (agriculture, industrial, commercial, households).\"},{\"t\":\"h\",\"h\":\"<b>Factors influencing water security<\\/b>\"},{\"t\":\"li1\",\"h\":\"A range of physical, economic, and social and political factors affect water security.\"},{\"t\":\"li1\",\"h\":\"Physical factors include:\"},{\"t\":\"li2\",\"h\":\"accessibility\"},{\"t\":\"li2\",\"h\":\"natural hazards\"},{\"t\":\"li2\",\"h\":\"climate change.\"},{\"t\":\"li1\",\"h\":\"Economic factors include:\"},{\"t\":\"li2\",\"h\":\"access to technology\"},{\"t\":\"li2\",\"h\":\"national income\"},{\"t\":\"li2\",\"h\":\"agricultural practices\"},{\"t\":\"li2\",\"h\":\"water demand.\"},{\"t\":\"li1\",\"h\":\"Social and political factors include:\"},{\"t\":\"li2\",\"h\":\"population growth\"},{\"t\":\"li2\",\"h\":\"governance\"},{\"t\":\"li2\",\"h\":\"water management policies.\"},{\"t\":\"h\",\"h\":\"<b>Impacts of water insecurity across the globe<\\/b>\"},{\"t\":\"li1\",\"h\":\"The impacts of water insecurity can be experienced at different rates and scales (micro and macro). Impacts range from short term to long term.\"},{\"t\":\"li1\",\"h\":\"Water insecurity can lead to adverse environmental impacts such as soil degradation, desertification, and biodiversity loss.\"},{\"t\":\"li1\",\"h\":\"Water insecurity has wide-ranging social impacts such as heightened spread of disease and increased hygiene risks, forced migration, and gender inequality – with a disproportionate burden on women and children.\"},{\"t\":\"li1\",\"h\":\"Water insecurity has significant economic impacts such as loss of agricultural productivity, job market and industry disruption, and increased water supply costs.\"},{\"t\":\"li1\",\"h\":\"<b>Case study:<\\/b> Impacts of water insecurity on people and places exemplified through case studies from two different continental regions experiencing water insecurity (e.g. Jordan, South Africa, Chennai – India).\"},{\"t\":\"h\",\"h\":\"<b>Sustainability of management strategies to address water insecurity<\\/b>\"},{\"t\":\"li1\",\"h\":\"Managing water insecurity requires a multi-faceted approach combining technological innovation, infrastructure improvement, and community-driven conservation.\"},{\"t\":\"li1\",\"h\":\"Management strategies of water insecurity at different scales (micro and macro) have various levels of effectiveness.\"},{\"t\":\"li1\",\"h\":\"Māori recognise that water systems are interconnected from the mountains to the sea (ki uta ki tai). The management of these water systems is guided by the principle of kaitiakitanga. Water is understood as a living entity with its own mauri and inherent rights, reinforcing the responsibility to protect and sustain waterways for the well-being of people and the environment.\"},{\"t\":\"li1\",\"h\":\"Water insecurity can be addressed at a macro scale through a range of large-scale interventions and system-level approaches. These include:\"},{\"t\":\"li2\",\"h\":\"desalination to convert seawater into usable freshwater\"},{\"t\":\"li2\",\"h\":\"large environmental restoration projects such as the Great Green Wall across Africa to combat desertification and restore water cycles\"},{\"t\":\"li2\",\"h\":\"infrastructure upgrades to improve storage, distribution, and efficiency of water systems.\"},{\"t\":\"li1\",\"h\":\"There is also a growing movement to recognise the rights of water bodies, with rivers being granted legal personhood, such as the Whanganui River in New Zealand. This approach reflects a shift toward valuing water as a living entity, strengthening protection and long-term sustainability.\"},{\"t\":\"li1\",\"h\":\"Water insecurity can be managed at a micro scale, such as restoring wetlands, rainwater harvesting, and water trucking during a natural hazard.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Sustainability of management strategies to address water insecurity, exemplified through case studies exploring management of water insecurity from two different continents (these may be the same as the case studies used for impacts).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to examine the spatial distribution of freshwater sources.\"},{\"t\":\"li1\",\"h\":\"Interpret statistical data to identify freshwater availability for human use across a range of scales.\"},{\"t\":\"li1\",\"h\":\"Interpret temporal data global examples to evaluate the effectiveness of management strategies that address water insecurity.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use case studies to examine the impacts of water insecurity on people and places.\"},{\"t\":\"li1\",\"h\":\"Examine factors that can lead to water insecurity.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate the effectiveness of water insecurity management strategies.\"},{\"t\":\"li1\",\"h\":\"Justify water insecurity management strategies across case studies.\"},{\"t\":\"li1\",\"h\":\"Examine varied perspectives related to water insecurity management across case studies.\"},{\"t\":\"li1\",\"h\":\"Use case studies to evaluate different water insecurity management approaches at micro and macro scales.\"}]},{\"name\":\"Geopolitics\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Trans-boundary resource conflicts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Trans-boundary resource conflicts occur when the ownership, allocation, access to, or management of a resource extends across political, administrative, cultural, or environmental boundaries and competing interests create conflict.\"},{\"t\":\"li1\",\"h\":\"These conflicts may involve a range of resources, including freshwater, rivers, land, seabed, minerals, forests, fisheries, and other natural resources, and occur at local, national, and international scales.\"},{\"t\":\"li1\",\"h\":\"Trans-boundary resource conflicts can also occur within a country where the use or management of a resource in one area affects people or environments beyond its boundary.\"},{\"t\":\"li1\",\"h\":\"In New Zealand, trans-boundary resource conflicts may also arise where there are differing interpretations of rights and responsibilities under te Tiriti o Waitangi, Treaty settlements, customary interests, or statutory resource management arrangements. These conflicts often require balancing environmental, cultural, economic, and social priorities while recognising the rights and responsibilities of hapū and iwi and other stakeholders.\"},{\"t\":\"h\",\"h\":\"<b>Factors that influence conflicts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Unequal access to and allocation of resources along borders (e.g. water in the Nile River in Ethiopia and Egypt, the Mekong River in Southeast Asia) can result in conflict.\"},{\"t\":\"li1\",\"h\":\"Competing usage of resources (e.g. the seabed and marine areas in the South China Sea, mineral extraction between Rwanda and DRC (Democratic Republic of the Congo), environmental degradation in the Aral Sea, infrastructure development of Qosh-Tepa Canal) can result in conflict.\"},{\"t\":\"h\",\"h\":\"<b>Impacts of trans-boundary resource conflict<\\/b>\"},{\"t\":\"li1\",\"h\":\"Economic impacts include disruptions to global trade and supply chains that restrict the circulation of resources (e.g. crude oil through the Strait of Hormuz). Other impacts include compromised food security and energy production.\"},{\"t\":\"li1\",\"h\":\"Political impacts include war, increased political tensions, and mistrust between nations (e.g. China exerting control over the Mekong River).\"},{\"t\":\"li1\",\"h\":\"Social impacts include displacement, loss of cultural heritage and disruptions to livelihoods (e.g. the Aral Sea degradation has transformed what was once a reliable source of food and employment into a toxic desert).\"},{\"t\":\"li1\",\"h\":\"Environmental impacts include environmental collapse, soil salinity, and biodiversity loss (e.g. increased salinity levels in the Tigris River resulting in severe water scarcity).\"},{\"t\":\"li1\",\"h\":\"Conflict arises because of different perspectives related to the use of a resource.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Impacts and perspectives of trans-boundary resource conflict exemplified through two case studies of current trans-boundary resources conflicts. One must be international. (e.g. Pakistan/India, Nile River Basin, Strait of Hormuz, Amazon Rainforest, seabed mining Taranaki, exclusive economic zones).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools and data to map trans-boundary conflicts.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Explain how factors influence and contribute to trans-boundary resource conflicts across case studies.\"},{\"t\":\"li1\",\"h\":\"Examine varied perspectives related to trans-boundary resource conflicts across case studies.\"},{\"t\":\"li1\",\"h\":\"Evaluate impacts of trans-boundary resource conflicts across case studies.\"}]}]}},{\"name\":\"Geographic Investigation\",\"focus\":\"The processes and methods used to investigate people, places, and environments through geographic methodology.\",\"inYear\":{\"11\":\"Students are taught geographic investigation, with components integrated throughout the physical and human geography strands, including framing geographic questions, collecting, processing, analysing data, and communicating findings.\",\"12\":\"Students are taught geographic investigations through the analysis of geographic research and the completion of a teacher-guided investigation. Students are taught an awareness of reliability, validity, and sampling, and how these influence the quality of geographic data. Through these experiences, students evaluate and apply the geographical investigation process.\",\"13\":\"Students are taught how to conduct a complete geographic investigation within a single geographic context, including the formulation of aims and questions, the collection, processing, and analysis of multiple primary and secondary data sources, and the communication of well-supported conclusions and evaluative reflections.\"},\"years\":{\"11\":[{\"name\":\"Research aims, questions, and hypotheses\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Nature of investigations<\\/b>\"},{\"t\":\"li1\",\"h\":\"Geographic investigations are evidence-based inquiries with a spatial dimension, in which geographers ask questions, gather information, and draw conclusions about patterns, relationships, and processes involving people, places, and environments.\"},{\"t\":\"li1\",\"h\":\"Fieldwork enables geographers to directly observe and experience places, collect primary data, and engage with the experiences and perspectives of people.\"},{\"t\":\"li1\",\"h\":\"Geographic investigations draw on evidence from multiple sources and consider multiple perspectives to develop informed conclusions.\"},{\"t\":\"li1\",\"h\":\"Geographic investigations in the New Zealand context can draw on whakapapa, tikanga, oral histories, place-based knowledge, lived experience, and relationships with whenua to support evidence-informed and culturally grounded findings.\"},{\"t\":\"li1\",\"h\":\"Digital technologies, including artificial intelligence (AI), can support geographic investigations. Information should be critically evaluated, verified using credible sources, and used alongside independent analysis and reasoning.\"},{\"t\":\"li1\",\"h\":\"Geographic investigations are guided by an aim, question, or hypothesis and have a spatial focus.\"},{\"t\":\"li1\",\"h\":\"Geographic investigation may relate to key geographic concepts such as place, location, distribution, characteristics, patterns, processes, change, sustainability, and interactions.\"},{\"t\":\"li1\",\"h\":\"A geographic aim is a broad purpose or goal of an investigation, while a geographic question focuses on a specific aspect of the aim.\"},{\"t\":\"li1\",\"h\":\"A hypothesis is a testable prediction that is written as a statement about a geographic pattern, process, relationship, or difference, and is informed by observations, existing knowledge, or theories.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Construct a geographic aim to guide an investigation across a range of geographic topics\"},{\"t\":\"li1\",\"h\":\"Develop simple geographic hypotheses linked to an aim or question.\"}]},{\"name\":\"Methodology\",\"k\":[{\"t\":\"li1\",\"h\":\"Methodology refers to designing an appropriate method.\"},{\"t\":\"li1\",\"h\":\"Quantitative data are numerical data that can be measured.\"},{\"t\":\"li1\",\"h\":\"Qualitative data are descriptive, non-numerical information.\"},{\"t\":\"li1\",\"h\":\"Primary data are collected first-hand in the field and secondary data are obtained from previously published or collected sources.\"},{\"t\":\"li1\",\"h\":\"Primary data can be collected through quantitative methods (e.g. counts, measurements, surveys, profiles, and transects) and qualitative methods (e.g. photographs, interviews, field sketches, and observations).\"},{\"t\":\"li1\",\"h\":\"Secondary data can include quantitative sources (e.g. census data and climate records) and qualitative sources (e.g. reports, quotes, and historical photographs).\"},{\"t\":\"li1\",\"h\":\"Secondary data can include quantitative sources (e.g. census data, migration statistics, and climate records) and qualitative sources (e.g. council planning reports, newspaper articles, oral histories, and historical photographs).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and design appropriate methods and recording formats for collecting a range of data aligned to the aim of an investigation.\"}]},{\"name\":\"Data collection\",\"k\":[{\"t\":\"li1\",\"h\":\"Systematic collection of data helps geographers gather information in a consistent and reliable way.\"},{\"t\":\"li1\",\"h\":\"Quantitative data can be systematically recorded using methods such as check sheets, tally sheets, rating scales, and frequency tables.\"},{\"t\":\"li1\",\"h\":\"Qualitative data can be systematically recorded using methods such as field notes, annotated field sketches, photographs, audio or video recording.\"},{\"t\":\"li1\",\"h\":\"Geospatial tools can be used to collect, represent, analyse, and communicate spatial information.\"},{\"t\":\"li1\",\"h\":\"Spatial referencing systems (e.g. latitude and longitude, scale, direction) and topographic mapping conventions (e.g. contour lines, grid referencing, symbols) enable geographic information used in investigations to be located, represented, and interpreted.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Collect different forms of data (primary, secondary, quantitative, qualitative) in a systematic way.\"}]},{\"name\":\"Data processing and presentation\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Processing data<\\/b>\"},{\"t\":\"li1\",\"h\":\"Raw data often requires processing before it can be presented and analysed. This may involve organising, classifying, summarising, and calculating statistical measures to make patterns, trends, and relationships easier to identify.\"},{\"t\":\"li1\",\"h\":\"Quantitative data may be processed using totals, averages, percentages, rates, rankings, indices, and other statistical measures, while qualitative data may be organised into themes, categories, and summaries.\"},{\"t\":\"li1\",\"h\":\"Digital tools such as spreadsheets, GIS, and data visualisation software can be used to process, organise, and prepare geographic data for presentation.\"},{\"t\":\"h\",\"h\":\"<b>Presenting data<\\/b>\"},{\"t\":\"li1\",\"h\":\"Effective presentation is clear, accurate, and aligned to the type of data collected and the purpose of the investigation.\"},{\"t\":\"li1\",\"h\":\"Geographic investigation data can be presented using a range of spatial, statistical, visual, and digital representations. The most appropriate presentation method depends on the nature of the data and the findings being communicated:\"},{\"t\":\"li2\",\"h\":\"Spatial data are commonly presented using map and GIS visualisations.\"},{\"t\":\"li2\",\"h\":\"Comparison data are commonly presented using bar graphs.\"},{\"t\":\"li2\",\"h\":\"Proportional data can be presented using percentage bar graphs, or pie graphs.\"},{\"t\":\"li2\",\"h\":\"Continuous numerical data can be processed into grouped intervals (e.g. monthly rainfall, population age groups) are shown using histograms.\"},{\"t\":\"li2\",\"h\":\"Line graphs are used to show trends or patterns and changes across continuous variables such as time, distance, elevation, or location.\"},{\"t\":\"li2\",\"h\":\"Relationships between variables can be presented using scatter graphs.\"},{\"t\":\"li2\",\"h\":\"Continuums are used to present characteristics, conditions, perceptions, or impacts that vary along a spectrum rather than fitting into distinct categories (e.g. environmental quality, accessibility, degree of impact).\"},{\"t\":\"li2\",\"h\":\"Visual evidence can be presented and their significance explained using annotated sketches and photographs.\"},{\"t\":\"li1\",\"h\":\"Geographic presentations use conventions that help information be interpreted accurately and consistently.\"},{\"t\":\"li1\",\"h\":\"Maps and GIS visualisations use appropriate conventions and features to support accurate interpretation of spatial information. These may include titles, labels, legends or keys, map symbols, annotations, scale information, directional references or orientation, sources when using secondary data, and interactive features where appropriate.\"},{\"t\":\"li1\",\"h\":\"Graphs use appropriate conventions and features to communicate data clearly and accurately. These may include a title, clearly labelled axes with units of measurement, an appropriate scale, accurate plotting of data, a key where necessary, and sources when using secondary data.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Process a range of data (e.g. graphs, tables, maps) using appropriate representations and geographic conventions.\"},{\"t\":\"li1\",\"h\":\"Utilise appropriate geographical mapping conventions when representing spatial data.\"}]},{\"name\":\"Data analysis and conclusions\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Data analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Analysis of data involves looking for patterns, trends, relationships, distributions, and anomalies.\"},{\"t\":\"h\",\"h\":\"<b>Conclusions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Drawing conclusions involves making evidence-based judgements about how the presented and analysed data answers the geographic investigations aim or question, or hypothesis.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Interpret processed data to identify patterns, trends and relationships and to draw conclusions related to the investigation aim and hypothesis or question.\"}]},{\"name\":\"Evaluation\",\"k\":[{\"t\":\"li1\",\"h\":\"Data accuracy and usefulness can be impacted by such things as frequency of observations, equipment calibration, and relevance of questions to the study aim.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Identify the strengths and limitations of the data.\"}]}],\"12\":[{\"name\":\"Research aims, questions, and hypotheses\",\"k\":[{\"t\":\"li1\",\"h\":\"Geographic aims and questions focus investigations on geographic patterns, processes, relationships, and issues, and may consider both spatial and temporal dimensions.\"},{\"t\":\"li1\",\"h\":\"Hypotheses may be directional or comparative.\"},{\"t\":\"li1\",\"h\":\"A directional hypothesis predicts the relationship, trend, pattern, or difference you expect to find (e.g. pedestrian counts will decrease as distance from the CBD increases, beach sediment size will decrease towards the water).\"},{\"t\":\"li1\",\"h\":\"A comparative hypothesis predicts a difference between two or more places, groups, or conditions (e.g. residents living near the river will perceive flood risk differently from residents living further away).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Geographic research analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use teacher provided research examples in human and physical geography to investigate the range of ways researchers define their investigations and align aims and questions or hypotheses.\"},{\"t\":\"h\",\"h\":\"<b>Teacher-guided investigation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Construct a geographic aim and a set of questions or hypothesis to direct the investigation.\"}]},{\"name\":\"Methodology\",\"k\":[{\"t\":\"li1\",\"h\":\"Different knowledge systems, including Mātauranga Māori, can inform the planning of investigations, the interpretation of data, and the conclusions drawn.\"},{\"t\":\"li1\",\"h\":\"Investigations may require consultation with appropriate knowledge holders, experts, or communities to ensure that knowledge is used appropriately and accurately.\"},{\"t\":\"li1\",\"h\":\"Sampling methods are used when a representative portion of a population is investigated rather than the entire population.\"},{\"t\":\"li1\",\"h\":\"Sampling methods include:\"},{\"t\":\"li2\",\"h\":\"random sampling: selecting samples so that each has an equal chance of being chosen, helping to reduce bias.\"},{\"t\":\"li2\",\"h\":\"systematic sampling: selecting samples at regular intervals, such as every two metres along a transect.\"},{\"t\":\"li2\",\"h\":\"stratified sampling: dividing a population into groups and selecting samples from each group to ensure representation.\"},{\"t\":\"li1\",\"h\":\"Selecting a sampling method involves justifying why a technique is appropriate. This includes alignment with the purpose of the study, study area characteristics, time constraints, accessibility, resources, and the nature of the data.\"},{\"t\":\"li1\",\"h\":\"Primary data are collected to gather current location-specific information, answer the investigation’s research questions, verify patterns or issues identified in secondary sources, and provide detailed evidence about conditions in the field.\"},{\"t\":\"li1\",\"h\":\"Secondary data are collected to provide background information and context, identify trends, patterns, and relationships across larger areas or longer time periods, support the planning of fieldwork and primary data collection, and enable comparisons between places and over time.\"},{\"t\":\"li1\",\"h\":\"Validity refers to the extent to which data measures what it is intended to measure, and depends on the alignment between the investigation’s purpose, questions, variables, methods, and data collected.\"},{\"t\":\"li1\",\"h\":\"Reliability refers to the extent to which data collection methods produce consistent and dependable results when repeated under similar conditions, and can be assessed through the consistency of methods, the use of appropriate sampling procedures, sample size, the reduction of bias, and the extent to which results can be replicated.\"},{\"t\":\"li1\",\"h\":\"Questionnaire design is the systematic process of developing clear, unbiased, and structured questions to collect reliable and valid data. Different types of questions elicit different responses (e.g. open questions gather detailed answers whereas closed questions elicit concise answers and quantitative data).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Geographic research analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use teacher provided research examples in human and physical geography to identify and evaluate the appropriateness of sampling methods used in geographic investigations.\"},{\"t\":\"h\",\"h\":\"<b>Teacher-guided investigation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Select and justify data sources appropriate to the investigation considering reliability and validity.\"},{\"t\":\"li1\",\"h\":\"Select and justify a sampling method appropriate to the investigation where sampling is required.\"},{\"t\":\"li1\",\"h\":\"Design data collection recording formats or approaches appropriate to the investigation.\"}]},{\"name\":\"Data collection\",\"k\":[{\"t\":\"li1\",\"h\":\"Data are collected in accordance with the investigation methodology to ensure the evidence gathered is relevant to the aim, question, or hypothesis, and is consistent and sufficient evidence is gathered for analysis.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Geographic research analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use teacher provided research examples in human and physical geography to identify the different ways that data are collected and used, and why each approach is best suited to the study.\"},{\"t\":\"h\",\"h\":\"<b>Teacher-guided investigation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use appropriate data collection methods to systematically gather relevant data that supports the purpose of the investigation.\"}]},{\"name\":\"Data processing and presentation\",\"k\":[{\"t\":\"li1\",\"h\":\"Data presentation involves cleaning (e.g. checking for recording errors, identifying missing data, ensuring units are standardised and categories are consistent, removing duplicate data) and transforming (e.g. graphs, maps) raw data to discover useful patterns, trends, or relationships.\"},{\"t\":\"li1\",\"h\":\"Geographical data can be represented using spatial techniques such as choropleth maps, cartograms, and isopleth maps, and using statistical techniques such as mode, median, mean, range, and correlation coefficients.\"},{\"t\":\"li1\",\"h\":\"Geographers may use derived measures such as percentages, rates, ratios, densities, and indices to compare places, processes, and phenomena.\"},{\"t\":\"li1\",\"h\":\"Processed and presented data can be annotated to provide additional explanation, context, and interpretation, and could be integrated and displayed in multiple layers using geospatial technologies such as Geographic Information Systems (GIS).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Geographic research analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use teacher provided research examples in human and physical geography to examine different ways that data are processed and presented, and the extent to which those approaches are effective.\"},{\"t\":\"h\",\"h\":\"<b>Teacher-guided investigation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Make decisions about the most appropriate ways to process and present the collected data. Present the data using appropriate geographic conventions.\"}]},{\"name\":\"Data analysis and conclusions\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Data analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Data analysis involves applying geographic concepts to identify patterns, trends, relationships, and anomalies.\"},{\"t\":\"h\",\"h\":\"<b>Conclusions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Conclusions are drawn by combining, comparing, and evaluating evidence from multiple sources of data and should show how results link to the aim and purpose of the investigation.\"},{\"t\":\"li1\",\"h\":\"Conclusions are typically explanatory, comparative, or evaluative and should be supported by evidence from the investigation. In some contexts, they predict or recommend future actions.\"},{\"t\":\"li1\",\"h\":\"Conclusions may be stated tentatively when noting limitations, uncertainty, or insufficient evidence.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Geographic research analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use teacher provided research examples in human and physical geography to assess the extent to which evidence presented in geographic investigations supports the conclusions reached.\"},{\"t\":\"h\",\"h\":\"<b>Teacher-guided investigation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Identify patterns, trends, or relationships in the data and frame conclusions in a way best suited to the purpose of the investigation.\"}]},{\"name\":\"Evaluation\",\"k\":[{\"t\":\"li1\",\"h\":\"Geographers evaluate the strengths and limitations of a geographic investigation and identify ways to improve data quality and accuracy, or extend the study by investigating additional questions, variables, locations, time periods, or perspectives to deepen understanding of the geographic issue.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Geographic research analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use teacher provided research examples in human and physical geography to identify the ways researchers identify strengths, limitations, and next steps.\"},{\"t\":\"h\",\"h\":\"<b>Teacher-guided investigation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Identify the strengths and limitations of the study and its conclusions and suggest ways to strengthen future investigations.\"}]}],\"13\":[{\"name\":\"Research aims, questions, and hypotheses\",\"k\":[{\"t\":\"li1\",\"h\":\"Geographic investigations seek to understand, explain, and sometimes suggest responses or solutions to real-world issues and problems connected to key geographic concepts.\"},{\"t\":\"li1\",\"h\":\"Geographic questions and hypotheses are informed by geographic concepts and theories, stakeholder perspectives, existing data, prior research, and contextual knowledge.\"},{\"t\":\"li1\",\"h\":\"Multiple questions and hypotheses may be developed to investigate complex geographic issues.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Draw on existing knowledge to form an aim and set of questions or hypothesis to shape an investigation.\"}]},{\"name\":\"Methodology\",\"k\":[{\"t\":\"li1\",\"h\":\"Methodology refers to the planned approach used to conduct a geographic investigation. It includes decisions about the selection of methods, data types and tools, sampling strategies, and ethical considerations.\"},{\"t\":\"li1\",\"h\":\"Methodological decisions are informed by the aims, questions, and hypotheses of the investigation, existing research, and mātauranga Māori, and are selected to generate relevant and useful evidence.\"},{\"t\":\"li1\",\"h\":\"Data collection has ethical implications including consideration of bias, participant consent, participant privacy, environmental and cultural impacts. This may include consulting with local hapū/iwi within a particular area.\"},{\"t\":\"li1\",\"h\":\"Technology and geospatial tools (such as ArcGIS Survey123, Google Forms, mobile GIS apps, GPS units) can be used to collect and record a range of quantitative and qualitative geographic data, including location data, measurements, photographs, sound recordings, field observations, and respondent answers.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Design a methodology for a geographic investigation that aligns with its aims, questions, and hypotheses.\"},{\"t\":\"li1\",\"h\":\"Justify the selection of data collection methods, sampling approaches, and any ethical considerations in a geographic investigation.\"},{\"t\":\"p\",\"h\":\"Note: Teachers should provide feedback on the investigation plan before students independently collect, process, present, analyse, evaluate, and report on the investigation.\"}]},{\"name\":\"Data collection\",\"k\":[{\"t\":\"li1\",\"h\":\"Data collection has ethical implications including consideration of bias, participant consent, participant privacy, environmental and cultural impacts. This may include consulting with local hapū/iwi within a particular area.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Implement the investigation methodology to collect primary data using appropriate fieldwork techniques and equipment.\"},{\"t\":\"li1\",\"h\":\"Apply ethical practices throughout the data collection process.\"},{\"t\":\"li1\",\"h\":\"Source secondary data relevant to the investigation.\"}]},{\"name\":\"Data processing and presentation\",\"k\":[{\"t\":\"li1\",\"h\":\"Researchers decide upon the most effective ways to present spatial, statistical, and visual data using correct geographic conventions and terminology.\"},{\"t\":\"li1\",\"h\":\"Multiple forms of primary and secondary data can be processed, synthesised, and integrated to identify patterns, relationships, and geographic insights.\"},{\"t\":\"li1\",\"h\":\"Different presentation methods highlight different spatial patterns, relationships, trends, and characteristics within geographic data.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select appropriate methods to present spatial, statistical, and visual data to communicate geographic findings effectively.\"},{\"t\":\"li1\",\"h\":\"Apply appropriate geographic conventions and terminology when presenting and communicating geographic information.\"}]},{\"name\":\"Data analysis and conclusions\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Data analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"Data are combined, compared, and analysed using geographic concepts to identify trends, patterns, relationships, and anomalies.\"},{\"t\":\"h\",\"h\":\"<b>Conclusions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Synthesis involves bringing together information from different geographical sources to develop new understandings, explanations, or judgements.\"},{\"t\":\"li1\",\"h\":\"Conclusions are drawn by synthesising findings, summarising key evidence, and evaluating how well the data supports or challenges an explanation and may consider alternative explanations.\"},{\"t\":\"li1\",\"h\":\"Conclusions may incorporate perspectives and worldviews that make conclusions more culturally informed, locally relevant, and comprehensive.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse presented data to identify trends, patterns, and relationships.\"},{\"t\":\"li1\",\"h\":\"Synthesise data and information to explain patterns, trends, and relationships and develop justified conclusions.\"}]},{\"name\":\"Evaluation\",\"k\":[{\"t\":\"li1\",\"h\":\"Geographers evaluate how methodological decisions influenced the validity, reliability, and credibility of investigation findings and conclusions.\"},{\"t\":\"li1\",\"h\":\"Geographers consider alternative methods, data sources, explanations, and lines of inquiry that may strengthen or challenge conclusions.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate how the reliability and validity of a geographic investigation affect the strength of the evidence and the conclusions drawn.\"},{\"t\":\"li1\",\"h\":\"Critique methodological decisions and propose justified improvements, alternative approaches, or further lines of inquiry.\"}]}]}},{\"name\":\"Disciplinary Writing\",\"focus\":\"The use of writing to reflect the ways in which knowledge is organised, analysed, and communicated within the discipline.\",\"inYear\":{},\"years\":{\"11\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Geographic information and evidence can be interpreted, analysed, evaluated, and used to explain patterns, processes, relationships, and change across places, environments, and scales.\"},{\"t\":\"li1\",\"h\":\"Geographic communication is shaped by the purpose, audience, and conventions of the discipline.\"},{\"t\":\"li1\",\"h\":\"Geographic concepts, processes, perspectives, and subject-specific terminology provide the framework for constructing and communicating meaning.\"},{\"t\":\"li1\",\"h\":\"Geography texts use recognised structures and evidence-based reasoning to explain, compare, analyse, evaluate, and justify conclusions and judgements about people, places, environments, and geographic issues.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and use precise geographic terminology accurately and consistently to communicate understanding of geographic concepts, processes, patterns, relationships, perspectives, places, environments, and scales.\"},{\"t\":\"li1\",\"h\":\"Use explanatory, comparative, causal, and evaluative reasoning to explain geographic processes, patterns, and relationships between people, places, and environments.\"},{\"t\":\"li1\",\"h\":\"Use precise spatial and temporal language to describe and explain geographic patterns, relationships, and change across places, environments, scales, and timeframes.\"},{\"t\":\"li1\",\"h\":\"Organise coherent explanatory, analytical, and evaluative geographic texts by selecting and integrating evidence from primary and secondary geographic sources, and evaluating the limitations of that evidence, to develop conclusions and judgements.\"}]}],\"12\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Geographic information and evidence can be interpreted, analysed, evaluated, and used to explain patterns, processes, relationships, and change across places, environments, and scales.\"},{\"t\":\"li1\",\"h\":\"Geographic communication is shaped by the purpose, audience, and conventions of the discipline.\"},{\"t\":\"li1\",\"h\":\"Geographic concepts, processes, perspectives, and subject-specific terminology provide the framework for constructing and communicating meaning.\"},{\"t\":\"li1\",\"h\":\"Geography texts use recognised structures and evidence-based reasoning to explain, compare, analyse, evaluate, and justify conclusions and judgements about people, places, environments, and geographic issues.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and use increasingly complex geographic terminology accurately and consistently to communicate detailed understanding of geographic concepts, processes, patterns, relationships, perspectives, places, environments, and scales.\"},{\"t\":\"li1\",\"h\":\"Use explanatory, comparative, causal, and evaluative reasoning to analyse geographic processes, patterns, and relationships between people, places, and environments.\"},{\"t\":\"li1\",\"h\":\"Use precise spatial and temporal language to analyse geographic patterns, relationships, and change across places, environments, scales, and timeframes.\"},{\"t\":\"li1\",\"h\":\"Construct coherent explanatory, analytical, and evaluative geographic texts by integrating evidence from primary and secondary geographic sources (including published investigations), and evaluating the limitations of the evidence, to develop well-supported conclusions and judgements.\"}]}],\"13\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Geographic information and evidence can be interpreted, analysed, evaluated, and used to explain patterns, processes, relationships, and change across places, environments, and scales.\"},{\"t\":\"li1\",\"h\":\"Geographic communication is shaped by the purpose, audience, and conventions of the discipline.\"},{\"t\":\"li1\",\"h\":\"Geographic concepts, processes, perspectives, and subject-specific terminology provide the framework for constructing and communicating meaning.\"},{\"t\":\"li1\",\"h\":\"Geography texts use recognised structures and evidence-based reasoning to explain, compare, analyse, evaluate, and justify conclusions and judgements about people, places, environments, and geographic issues.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and use increasingly complex geographic terminology accurately and consistently to communicate nuanced understanding of geographic concepts, processes, patterns, relationships, perspectives, places, environments, and scales.\"},{\"t\":\"li1\",\"h\":\"Use explanatory, comparative, causal, and evaluative reasoning to analyse geographic processes, patterns, and relationships between people, places, and environments with increasing depth and complexity.\"},{\"t\":\"li1\",\"h\":\"Use precise spatial and temporal language to analyse complex geographic patterns, relationships, and change across places, environments, scales, and timeframes.\"},{\"t\":\"li1\",\"h\":\"Construct sustained and coherent explanatory, analytical, and evaluative geographic texts by synthesising evidence from multiple primary and secondary geographic sources, and evaluating the limitations of the evidence to develop nuanced, well-supported conclusions and judgements.\"}]}]},\"intro\":\"In Geography, students use explicitly taught disciplinary writing to analyse, evaluate, synthesise, and communicate geographic understanding using evidence, geographic concepts, terminology, and conventions to explain issues, justify judgements, and propose informed responses.\",\"writing\":true}]},{\"key\":\"psy\",\"name\":\"Psychology\",\"short\":\"Psychology\",\"years\":[12,13],\"c\":\"--psy\",\"source\":\"Psychology, Years 12–13 (October 2026)\",\"starts\":{\"12\":2029,\"13\":2030},\"lead\":\"In Psychology, students are taught the workings of the brain, human thought, emotion and behaviour through a range of psychological approaches and theories, including those unique to New Zealand’s bicultural heritage. They explore concepts relating to development, personality, relationships, and mental health. Students are taught how to research, analyse, and apply ethical practices in psychology, how to apply and critique research methodologies in practice.\",\"paras\":[\"Students are taught to examine psychological concepts, theories, and evidence to explain behaviour and mental processes. They learn to evaluate psychological claims by analysing research methodologies, recognising bias, benefits, and limitations. Students examine how biological, social, environmental, cultural, and ethical factors, influence psychological approaches and understanding.\",\"Psychology provides students with the knowledge and practices to examine human behaviour and mental processes and apply psychological approaches to individual and societal behaviours and issues. Students develop critical thinking, ethical reasoning, and informed judgement, enabling them to contribute thoughtfully to discussions, develop research, and explain the ways in which human behaviour can be understood.\",\"As students progress through Years 12–13, they move from explaining psychological concepts and interpreting findings to critically analysing competing explanations of behaviour and designing their own research with teacher consultation. This enables students to synthesise evidence, evaluate the strengths and limitations of psychological explanations, and draw well-reasoned and evidence-based conclusions about human behaviour and mental processes.\"],\"pathway\":\"Psychology leads to pathways in psychology and related disciplines such as health sciences, law, education, and commerce.\",\"guidance\":[{\"title\":\"Knowledge and practices\",\"blocks\":[{\"t\":\"p\",\"h\":\"The Psychology teaching sequence is organised into strands, elements, and sub-elements, and then further structured into knowledge and practices. The knowledge column sets out the declarative knowledge to be taught, while the practice column sets out the disciplinary skills, applications, and procedural knowledge. The practices underpin ways of working in Psychology and are specific to the discipline.\"},{\"t\":\"p\",\"h\":\"The teaching of all knowledge and practices is compulsory. However, schools can determine how learning is organised across the year, including integrating content from multiple elements and strands where this supports coherence and depth. Examples within the teaching sequence in brackets signified with ‘e.g.’ are provided as guidance only; as long as the intended knowledge and practices are met, schools and teachers may substitute contexts and examples that better reflect local environments, iwi and hapū connections, student interests, and teacher expertise.\"},{\"t\":\"p\",\"h\":\"Where key studies are referenced in the teaching sequence, students should be aware of the key study but are not required to engage directly with the original works.\"},{\"t\":\"p\",\"h\":\"Disciplinary writing is included in the teaching sequence to set out what subject-specific literacy is to be taught. It is organised into a knowledge component that is consistent across all year levels and a practice component sequenced across years.\"}]},{\"title\":\"Designing a programme\",\"blocks\":[{\"t\":\"p\",\"h\":\"The teaching sequence is designed to be taught as a non-linear programme. The knowledge and practice statements within each element or sub-element are related, but teachers may select complementary statements from across the sequence or treat sub-elements as discrete units of work. Disciplinary writing is most effectively taught when integrated across the teaching programme.\"}]},{\"title\":\"Responsible use of artificial intelligence (AI)\",\"blocks\":[{\"t\":\"p\",\"h\":\"Artificial intelligence (AI) can support learning, research, inquiry, and creative processes, but it may also introduce bias, inaccuracies, ethical concerns, and issues relating to ownership. AI should enhance, not replace, critical or creative thinking, source evaluation, subject knowledge, or students’ own analysis and decision-making. Responsible AI use emphasises the importance of exercising independent judgement, drawing on credible sources, verifying information, being transparent about AI use, considering diverse perspectives, and developing independent thinking.\"}]},{\"title\":\"Working with contexts\",\"blocks\":[{\"t\":\"p\",\"h\":\"In Psychology, learning is organised and understood through the contexts outlined in the table below. The contexts do not constitute separate bodies of knowledge; rather, they provide authentic settings in which students learn and apply the knowledge and practices from the Biopsychology, Cognitive Psychology, and Sociocultural Psychology strands. Within each context, teachers should select topics that provide sufficient scope and complexity to support the knowledge contained within the teaching sequence.\"}]}],\"contexts\":{\"12\":{\"title\":\"Psychology context specifications – Year 12\",\"blocks\":[{\"t\":\"p\",\"h\":\"In each strand (apart from Research Methodologies) the knowledge and practices must be authentically applied to appropriate contexts within:\"},{\"t\":\"li1\",\"h\":\"Social Psychology\"},{\"t\":\"li1\",\"h\":\"Clinical Psychology\"},{\"t\":\"li1\",\"h\":\"Educational Psychology\"},{\"t\":\"p\",\"h\":\"At Year 12 students do not need to design their own research.\"}]},\"13\":{\"title\":\"Psychology context specifications – Year 13\",\"blocks\":[{\"t\":\"p\",\"h\":\"In each strand (apart from Research Methodologies) the knowledge and practices must be authentically applied to appropriate contexts within:\"},{\"t\":\"li1\",\"h\":\"Forensic Psychology\"},{\"t\":\"li1\",\"h\":\"Health Psychology\"},{\"t\":\"li1\",\"h\":\"Developmental Psychology\"},{\"t\":\"p\",\"h\":\"At Year 13 students design their own research with teacher consultation to ensure ethical adherence.\"}]}},\"support\":[],\"strands\":[{\"name\":\"Research Methodologies\",\"focus\":\"Developing an understanding of the methods used to investigate psychological questions and build knowledge in the field. Learning how research is designed, conducted, evaluated, and applied, as well as developing the ability to critically assess the evidence.\",\"inYear\":{\"12\":\"Students are taught how psychological knowledge is developed through research. They investigate research methods, descriptive statistics, ethical principles, and begin to evaluate research evidence.\",\"13\":\"Students are taught to critically evaluate research with increasing complexity and apply methodological and ethical knowledge to design, conduct, analyse, and interpret psychological investigations.\"},\"years\":{\"12\":[{\"name\":\"Methodology\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Experimental versus non-experimental research<\\/b>\"},{\"t\":\"li1\",\"h\":\"Psychological research is classified as either experimental or non-experimental, depending on whether the researchers are manipulating a variable.\"},{\"t\":\"h\",\"h\":\"<b>Experimental research<\\/b>\"},{\"t\":\"li1\",\"h\":\"Experimental research is classified as either laboratory or field.\"},{\"t\":\"li1\",\"h\":\"Laboratory experiments are conducted in highly controlled environments, with the aim of establishing cause-and-effect relationships (causality).\"},{\"t\":\"li1\",\"h\":\"Field experiments are conducted in real-world, natural settings (e.g. schools, workplaces, public spaces) but still involve manipulation of an independent variable. Field experiments aim to study authentic behaviour and establish causality.\"},{\"t\":\"h\",\"h\":\"<b>Non-experimental research methods<\\/b>\"},{\"t\":\"li1\",\"h\":\"Interviews use either structured (set questions), semi-structured (flexible guide), or unstructured (conversational) formats to gain in-depth insights into participants’ thoughts, feelings, and experiences through direct verbal communication.\"},{\"t\":\"li1\",\"h\":\"Focus groups are where a trained moderator leads a group (typically 4–10 people) in a structured discussion about specific attitudes, beliefs, or experiences. Focus groups aim to explore nuanced topics by leveraging group interactions.\"},{\"t\":\"li1\",\"h\":\"Survey research uses self-report measures (primarily questionnaires) to collect data on thoughts, feelings, and behaviours from large, diverse samples. The aim of survey research is to describe trends, assess attitudes, or find correlations.\"},{\"t\":\"li1\",\"h\":\"Case studies are in-depth, longitudinal examinations of a single individual, group, or event. They utilise interviews, observations, and records to gather rich, detailed data in real-life contexts, with the aim to study rare phenomena or develop theories.\"},{\"t\":\"li1\",\"h\":\"Observation involves systematically watching, recording, and analysing behaviour in natural or controlled settings, without manipulating variables to describe behaviours in real time. It can be naturalistic (for ecological validity) or structured (for quantitative data).\"},{\"t\":\"li1\",\"h\":\"How the researcher is involved can vary between participant observation or non-participant observation (covert or overt).\"},{\"t\":\"li1\",\"h\":\"All research methodologies have strengths and weaknesses that need to be considered when planning research.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Classify research methods using their key features and justify each classification.\"},{\"t\":\"li1\",\"h\":\"Select, apply, and evaluate the most appropriate methodology for specific research aims, considering the strengths and limitations of alternative methods.\"},{\"t\":\"li1\",\"h\":\"Communicate and justify methodological decisions clearly and accurately in scientific reports.\"}]},{\"name\":\"Research evaluation\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Working with data<\\/b>\"},{\"t\":\"li1\",\"h\":\"The data that researchers gather can be either:\"},{\"t\":\"li2\",\"h\":\"quantitative (numerical data that can be measured, counted, or statistically analysed)\"},{\"t\":\"li2\",\"h\":\"qualitative (non-numerical data, e.g. descriptions or themes).\"},{\"t\":\"li1\",\"h\":\"Descriptive statistics are used to organise, summarise, and describe the basic features of quantitative data. They include the following measures of central tendency, which are used to identify the ‘typical’ or average response including mean, median, and mode.\"},{\"t\":\"li1\",\"h\":\"Researchers use tables and graphs to clearly represent the quantitative data they have gathered (e.g. bar graphs showing the means of different conditions often with error bands, histograms for continuous data, box-and-whisker plots, and scatter graphs).\"},{\"t\":\"li1\",\"h\":\"Qualitative data is analysed by identifying themes and interpreting meaning, not through statistics.\"},{\"t\":\"h\",\"h\":\"<b>Early psychology<\\/b>\"},{\"t\":\"li1\",\"h\":\"Early ‘scientific looking’ approaches (e.g. phrenology, Franz Joseph Gall, 1819) were often flawed and dangerous, highlighting the need for valid measurement and scientific scrutiny.\"},{\"t\":\"li1\",\"h\":\"Wilhelm Wundt founded the first psychology laboratory in Leipzig in 1879, establishing psychology as an independent scientific discipline. Wundt pioneered the use of controlled experiments and introspection to study the human mind.\"},{\"t\":\"li1\",\"h\":\"The psychoanalytic approach (Freud, 1856–1939) focused on the unconscious mind, psychosexual stages, defence mechanisms, and case studies (e.g. Little Hans).\"},{\"t\":\"h\",\"h\":\"<b>Psychology as a science<\\/b>\"},{\"t\":\"li1\",\"h\":\"Behaviourism (Watson, 1913; Skinner, 1938) helped to legitimise psychology as a science. It focused on observable behaviour and incorporated controlled laboratory experiments, a focus on stimulus–response relationships, and an emphasis on objectivity and measurement.\"},{\"t\":\"li1\",\"h\":\"The weaknesses of behaviourism were addressed by:\"},{\"t\":\"li2\",\"h\":\"cognitive psychology – using scientific processes to investigate mental processes\"},{\"t\":\"li2\",\"h\":\"biological psychology and neuroscience – explaining behaviour through physiology.\"},{\"t\":\"h\",\"h\":\"<b>Validity and reliability<\\/b>\"},{\"t\":\"li1\",\"h\":\"The strength of psychological theory is based on the validity and reliability of the research supporting it:\"},{\"t\":\"li2\",\"h\":\"Validity ensures that the research studies what it claims to be studying.\"},{\"t\":\"li2\",\"h\":\"Reliability measures the consistency, stability, and reproducibility of research results or tools.\"},{\"t\":\"li1\",\"h\":\"One key type of validity is ecological validity – the extent to which research findings can be generalised to real-life, natural settings.\"},{\"t\":\"h\",\"h\":\"<b>Bias<\\/b>\"},{\"t\":\"li1\",\"h\":\"Research accuracy can be affected by:\"},{\"t\":\"li2\",\"h\":\"experimenter bias – the influence of the researcher’s expectations on the results (experimenter effect)\"},{\"t\":\"li2\",\"h\":\"participant bias – participants may alter their behaviour to match perceived study goals (demand characteristics).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Classify qualitative and quantitative data, selecting appropriate methods for representing and analysing each type.\"},{\"t\":\"li1\",\"h\":\"Represent and interpret psychological data using accurately labelled tables, graphs, and descriptive statistics.\"},{\"t\":\"li1\",\"h\":\"Draw and justify conclusions from data by linking patterns and findings to relevant psychological concepts and evidence.\"},{\"t\":\"li1\",\"h\":\"Communicate data, statistical evidence, interpretations, and conclusions clearly and accurately in psychological reports.\"},{\"t\":\"li1\",\"h\":\"Evaluate the strength of psychological theory by comparing the validity and reliability of research that supports and challenges the theory.\"},{\"t\":\"li1\",\"h\":\"Use psychological studies to:\"},{\"t\":\"li2\",\"h\":\"describe the aim, method, and key findings of psychological research\"},{\"t\":\"li2\",\"h\":\"explain how findings are used to support claims about behaviour\"},{\"t\":\"li2\",\"h\":\"apply psychological explanations to specific behaviours or characteristics\"},{\"t\":\"li2\",\"h\":\"identify clear strengths and limitations of research.\"}]},{\"name\":\"Ethics\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Ethical principles<\\/b>\"},{\"t\":\"li1\",\"h\":\"Key ethical principles guide psychological research, including:\"},{\"t\":\"li2\",\"h\":\"avoidance of deception – misleading participants should be avoided, unless it is justified and the benefits outweigh the costs\"},{\"t\":\"li2\",\"h\":\"right to withdraw – participants must be able to leave a study at any time, taking their data with them\"},{\"t\":\"li2\",\"h\":\"informed consent – participants must be informed of the nature of the research, risks, and benefits, and agree to participate voluntarily\"},{\"t\":\"li2\",\"h\":\"protection from harm – researchers must protect participants from both physical and psychological harm\"},{\"t\":\"li2\",\"h\":\"confidentiality – participant data and identity must be kept private and secure\"},{\"t\":\"li2\",\"h\":\"debrief – after the research, participants should be informed about the study's purpose and results and given support if needed.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate the costs and benefits of using deception in research.\"},{\"t\":\"li1\",\"h\":\"Apply general ethical frameworks when evaluating research, identifying where research fails to adhere.\"},{\"t\":\"li1\",\"h\":\"Discuss how procedures have been developed to comply with an ethical framework when conducting research.\"}]}],\"13\":[{\"name\":\"Methodology\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Sampling techniques<\\/b>\"},{\"t\":\"li1\",\"h\":\"Sampling is the process of selecting a subset of individuals (the sample) from a larger group (the target population) to participate in a study.\"},{\"t\":\"li1\",\"h\":\"When quantitative data is sought, researchers aim to obtain a representative sample to generalise findings, balancing accuracy with feasibility.\"},{\"t\":\"li1\",\"h\":\"Key sampling techniques for quantitative data include:\"},{\"t\":\"li2\",\"h\":\"random sampling\"},{\"t\":\"li2\",\"h\":\"systematic sampling\"},{\"t\":\"li2\",\"h\":\"stratified sampling\"},{\"t\":\"li2\",\"h\":\"opportunity or convenience sampling\"},{\"t\":\"li2\",\"h\":\"volunteer or self-selected sampling.\"},{\"t\":\"li1\",\"h\":\"Key considerations for sampling to collect quantitative data are:\"},{\"t\":\"li2\",\"h\":\"representativeness – the degree to which the sample reflects the target population’s characteristics\"},{\"t\":\"li2\",\"h\":\"generalisation – applying the findings from the sample to the broader population\"},{\"t\":\"li2\",\"h\":\"bias – whether certain groups are over- or under-represented\"},{\"t\":\"li2\",\"h\":\"AI-generated data and analysis – AI outputs may inherit biases from training data and may not accurately represent the population or dataset being studied.\"},{\"t\":\"li1\",\"h\":\"When qualitative data is sought, researchers aim to gain deep, rich, and contextualised understanding of participants’ experiences.\"},{\"t\":\"li1\",\"h\":\"Key sampling techniques for qualitative data include non-probability methods such as purposive sampling and theoretical sampling.\"},{\"t\":\"h\",\"h\":\"<b>Experimental research design<\\/b>\"},{\"t\":\"li1\",\"h\":\"Experimental research designs are classified as either natural, quasi, or true experiments, depending on the level of control over the independent variable and participant allocation.\"},{\"t\":\"li1\",\"h\":\"Natural experiments are where researchers observe the effects of naturally occurring events (e.g. disasters, policy changes) on behaviour, rather than manipulating an independent variable directly.\"},{\"t\":\"li1\",\"h\":\"Quasi-experiments are where the independent variable is a pre-existing characteristic (e.g. gender, personality type) or an event occurring in a real-world setting. Quasi-experiments aim to test interventions or variables without random assignment of participants to groups.\"},{\"t\":\"li1\",\"h\":\"True experiments are where participants are randomly allocated to the different conditions of the independent variable. The setting can be laboratory or field. In true experiments, the method of allocation is classified as either independent measures, repeated measures, or matched pairs.\"},{\"t\":\"li2\",\"h\":\"Independent measures are when different participants are used in each condition of the independent variable.\"},{\"t\":\"li2\",\"h\":\"Repeated measures are when the same participants are used in each condition of the independent variable.\"},{\"t\":\"li2\",\"h\":\"Matched pairs are when pairs of participants are matched on relevant key characteristics (e.g. age), and each member of the pair is assigned to a different condition of the independent variable.\"},{\"t\":\"h\",\"h\":\"<b>Indigenous research methodologies<\\/b>\"},{\"t\":\"li1\",\"h\":\"Indigenous research methodologies are when cultural connectedness is at the centre of the research. Knowledge is shared, and relational. Examples of methods include:\"},{\"t\":\"li2\",\"h\":\"wānanga (in-depth culturally safe discussions)\"},{\"t\":\"li2\",\"h\":\"talanoa (sharing of stories/conversation to explain and talk about life situations)\"},{\"t\":\"li2\",\"h\":\"pūrākau (storytelling narratives).\"},{\"t\":\"li1\",\"h\":\"Indigenous research methods vary between iwi, hapū, and whānau and between Pacific peoples’ communities and villages.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and justify the most appropriate sampling method for a given research aim.\"},{\"t\":\"li1\",\"h\":\"Identify and evaluate the effectiveness of different research designs, including strategies to mitigate their limitations.\"},{\"t\":\"li1\",\"h\":\"Consider the strengths and limitations of Indigenous research methodologies, without critiquing the culture itself.\"},{\"t\":\"li1\",\"h\":\"In own research:\"},{\"t\":\"li2\",\"h\":\"discuss psychological concepts underpinning the aim\"},{\"t\":\"li2\",\"h\":\"select and justify research methods, research designs, and sampling techniques.\"}]},{\"name\":\"Research evaluation\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Descriptive statistics<\\/b>\"},{\"t\":\"li1\",\"h\":\"In addition to measures of central tendency, researchers use measures of dispersion (spread) such as standard deviation, range, and interquartile range.\"},{\"t\":\"li1\",\"h\":\"Measures of spread help researchers determine how consistent or diverse participants’ responses are and assess whether differences between individuals or groups are meaningful.\"},{\"t\":\"h\",\"h\":\"<b>Statistical Evidence in Psychological Research<\\/b>\"},{\"t\":\"li1\",\"h\":\"Inferential statistics are used to draw conclusions beyond the sample (e.g. about a wider population).\"},{\"t\":\"li1\",\"h\":\"Statistical evidence is used to identify patterns in data and determine whether research findings reflect genuine psychological effects.\"},{\"t\":\"li1\",\"h\":\"A p-value is the probability of obtaining results at least as extreme as those observed if the null hypothesis were true. A lower p-value gives stronger grounds for rejecting the null hypothesis.\"},{\"t\":\"li1\",\"h\":\"A confidence interval is a range of plausible values for a population parameter, calculated from sample data using a repeatable statistical procedure. Effect size measures the magnitude or practical importance of an observed effect.\"},{\"t\":\"li1\",\"h\":\"Replication, transparency, and reproducibility strengthen confidence in psychological evidence.\"},{\"t\":\"li1\",\"h\":\"The interpretation of statistical evidence requires critical evaluation of research design, methodology, data quality, and information sources, including AI-generated outputs that may contain bias, inaccuracies, or omissions.\"},{\"t\":\"h\",\"h\":\"<b>Analysis of qualitative data<\\/b>\"},{\"t\":\"li1\",\"h\":\"Techniques for analysing qualitative data include:\"},{\"t\":\"li2\",\"h\":\"thematic analysis – identifying, analysing, and reporting patterns\"},{\"t\":\"li2\",\"h\":\"content analysis – turning qualitative data into quantitative data by counting the frequency of specific phrases or behaviours.\"},{\"t\":\"h\",\"h\":\"<b>Validity<\\/b>\"},{\"t\":\"li1\",\"h\":\"In addition to ecological validity, researchers assess population validity, and temporal validity.\"},{\"t\":\"li1\",\"h\":\"Population validity (external) measures how well the results of a study can be generalised from the specific sample group to the larger target population.\"},{\"t\":\"li1\",\"h\":\"Temporal validity (external) measures how well research findings hold up over time.\"},{\"t\":\"h\",\"h\":\"<b>Reliability<\\/b>\"},{\"t\":\"li1\",\"h\":\"Reliability refers to the consistency and repeatability of research findings, measurements, or assessments.\"},{\"t\":\"li2\",\"h\":\"Test-retest reliability assesses whether a measure produces similar results when administered to the same participants on different occasions.\"},{\"t\":\"li2\",\"h\":\"Inter-rater reliability assesses the extent to which different observers or researchers record, rate, or interpret behaviour in a consistent way.\"},{\"t\":\"li2\",\"h\":\"Internal consistency examines whether items within the same test or questionnaire measure the same construct and produce similar results.\"},{\"t\":\"li1\",\"h\":\"Reliability can be improved through standardisation, operationalisation, training, and running pilot studies.\"},{\"t\":\"h\",\"h\":\"<b>Bias<\\/b>\"},{\"t\":\"li1\",\"h\":\"Cultural bias is the tendency to interpret human behaviour through the lens of one's own culture. This may occur when knowledge derived from WEIRD (Western, educated, industrialised, rich, democratic) populations is assumed to apply universally, leading to ethnocentric interpretations.\"},{\"t\":\"li1\",\"h\":\"Ethnocentrism is the tendency to evaluate and judge other cultures according to the values, norms, and standards of one’s own culture, often resulting in the belief that one’s own culture is more normal, correct, or superior.\"},{\"t\":\"li1\",\"h\":\"Gender bias involves differential treatment or representation of men and women in research and theory, often resulting from androcentrism (male-centred views). It manifests through exaggerating differences (alpha bias) or minimising them (beta bias), which can misrepresent human behaviour and reinforce harmful gender stereotypes.\"},{\"t\":\"li1\",\"h\":\"AI systems may reproduce social and cultural biases, requiring critical evaluation of potential inaccuracies and inequities.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse and interpret statistical information presented in psychological research reports.\"},{\"t\":\"li1\",\"h\":\"Apply thematic and content analysis techniques to qualitative data.\"},{\"t\":\"li1\",\"h\":\"Use psychological studies to:\"},{\"t\":\"li2\",\"h\":\"evaluate the credibility of research by considering replication, transparency, and reproducibility\"},{\"t\":\"li2\",\"h\":\"critically evaluate psychological claims using both statistical evidence and methodological considerations\"},{\"t\":\"li2\",\"h\":\"compare different explanations of behaviour\"},{\"t\":\"li2\",\"h\":\"synthesise research findings to form well-supported conclusions.\"},{\"t\":\"li1\",\"h\":\"In own research:\"},{\"t\":\"li2\",\"h\":\"interpret appropriate statistical tests to form a valid conclusion\"},{\"t\":\"li2\",\"h\":\"review and critique research regarding validity and reliability\"},{\"t\":\"li2\",\"h\":\"suggest improvements and next steps in the research process.\"}]},{\"name\":\"Ethics\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Ethics in practice<\\/b>\"},{\"t\":\"li1\",\"h\":\"Ethical constraints can limit validity and generalisability, so ethical decision-making involves balancing competing principles – harm minimisation versus scientific value.\"},{\"t\":\"li1\",\"h\":\"Ethical acceptability can vary depending on:\"},{\"t\":\"li2\",\"h\":\"population studied\"},{\"t\":\"li2\",\"h\":\"method used\"},{\"t\":\"li2\",\"h\":\"cultural context\"},{\"t\":\"li2\",\"h\":\"potential benefits of research.\"},{\"t\":\"li1\",\"h\":\"High-risk research must be approved by an ethics committee before it begins. Ethics committees assess:\"},{\"t\":\"li2\",\"h\":\"risks versus benefits\"},{\"t\":\"li2\",\"h\":\"participant protection\"},{\"t\":\"li2\",\"h\":\"informed consent procedures\"},{\"t\":\"li2\",\"h\":\"cultural considerations.\"},{\"t\":\"li1\",\"h\":\"Ethics committees reduce risk but do not guarantee research is sound in practice. Researchers must respond ethically as research unfolds.\"},{\"t\":\"h\",\"h\":\"<b>Māori research ethics and cultural safety<\\/b>\"},{\"t\":\"li1\",\"h\":\"In New Zealand, Te Ara Tika framework is based on four guiding principles:\"},{\"t\":\"li2\",\"h\":\"Whakapapa – relationships, context, and connectedness\"},{\"t\":\"li2\",\"h\":\"Tika – doing what is right and just\"},{\"t\":\"li2\",\"h\":\"Manaakitanga – care, respect, and reciprocity\"},{\"t\":\"li2\",\"h\":\"Mana – protecting dignity, authority, and autonomy.\"},{\"t\":\"li1\",\"h\":\"Cultural safety involves:\"},{\"t\":\"li2\",\"h\":\"consultation\"},{\"t\":\"li2\",\"h\":\"shared benefit\"},{\"t\":\"li2\",\"h\":\"appropriate settings (e.g. marae protocols).\"},{\"t\":\"h\",\"h\":\"<b>Vulnerable populations<\\/b>\"},{\"t\":\"li1\",\"h\":\"Conducting research with vulnerable populations requires weighing the potential value of the research against possible risks of harm and implementing additional safeguards, such as obtaining appropriate consent, monitoring for distress, and ensuring participation is voluntary.\"},{\"t\":\"li1\",\"h\":\"Vulnerable populations include:\"},{\"t\":\"li2\",\"h\":\"children\"},{\"t\":\"li2\",\"h\":\"adults who are cognitively impaired, mentally ill, or institutionally dependent\"},{\"t\":\"li2\",\"h\":\"animals.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate research designs with regard to ethical adherence and cultural safety, suggesting improvements.\"},{\"t\":\"li1\",\"h\":\"In own research:\"},{\"t\":\"li2\",\"h\":\"identify key ethical risks\"},{\"t\":\"li2\",\"h\":\"make and justify decisions based on ethics and cultural context.\"},{\"t\":\"li1\",\"h\":\"Carry out cost–benefit analyses to assess the ethical justification and usefulness of research conducted with vulnerable populations.\"}]}]}},{\"name\":\"Biopsychology\",\"focus\":\"Explaining human behaviour by examining its biological foundations. This includes the structure and functioning of the brain, neurochemistry, genetics, and the interaction between biological and environmental influences on behaviour.\",\"inYear\":{\"12\":\"Students are taught to explore how biological systems influence thoughts, emotions, and behaviour. They examine brain structure and function, genetics, and neurochemistry as biological foundations of human behaviour.\",\"13\":\"Students are taught to investigate how biological and environmental factors interact to contribute to behaviour and psychological functioning, with a focus on genetics, neurochemistry, brain function, and neuroplasticity.\"},\"years\":{\"12\":[{\"name\":\"Genetics\",\"k\":[{\"t\":\"li1\",\"h\":\"Biological psychologists argue that genes passed down from parents influence traits such as intelligence, personality, and susceptibility to psychological disorders.\"},{\"t\":\"li1\",\"h\":\"The biological approach is grounded in the nature–nurture debate, supporting the nativist argument that behaviour is largely explained by innate biological factors rather than environmental influences.\"},{\"t\":\"li1\",\"h\":\"Research within the biological approach uses the scientific method, including neuroimaging and brain-scanning techniques (e.g. fMRIs, EEGs) to investigate the relationship between brain activity and behaviour.\"},{\"t\":\"li1\",\"h\":\"Genetic variation arises from random mutations and sexual reproduction, creating a diverse range of traits. This variation extends to behavioural tendencies and cognitive predispositions.\"},{\"t\":\"li1\",\"h\":\"In twin studies, researchers look at concordance rates – the probability that both twins share a trait – to investigate if psychological characteristics have a genetic basis.\"},{\"t\":\"li1\",\"h\":\"Natural selection acts on genetic variations by favouring behaviours that enhance a human’s chances of survival and reproduction. Over time, behaviours that successfully solve adaptive problems (e.g. predator avoidance, social cooperation) are more likely to be passed on.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate evidence for genetic influences on behaviour.\"},{\"t\":\"li1\",\"h\":\"Analyse findings from twin studies and concordance rates to evaluate claims about genetic influences on behaviour.\"},{\"t\":\"li1\",\"h\":\"Use the biological approach to explain behaviour and evaluate genetic explanations within the nature–nurture debate.\"},{\"t\":\"li1\",\"h\":\"Evaluate how scientific methods in biological psychology are used to investigate relationships between brain activity and behaviour, considering the strengths and limitations of the evidence produced.\"}]},{\"name\":\"Neurochemistry\",\"k\":[{\"t\":\"li1\",\"h\":\"Neurochemicals are produced in the brain and in endocrine glands elsewhere in the body. They affect how brain cells communicate, shaping thoughts, emotions, and behaviour. They include:\"},{\"t\":\"li2\",\"h\":\"neurotransmi
