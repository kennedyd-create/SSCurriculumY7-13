 2,000 years. Throughout history, diverse groups have campaigned for the right to vote. More recently, this has included advocacy for 16-year-olds such as Make It 16.\"}], [{\"t\": \"h\", \"h\": \"<b>International cooperation and global citizenship<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Big ideas that changed the world<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Political ideas and values shape how countries relate to each other (e.g. multilateralism, acting unilaterally where states retain their own decision rights rather than binding themselves to shared rules).\"}, {\"t\": \"li1\", \"h\": \"After World War Two, the United Nations (UN) was established to maintain international peace and security, and take collective measures for international cooperation, including international treaties and agreements to promote human rights and fundamental freedoms.\"}, {\"t\": \"li1\", \"h\": \"International treaties and agreements establish expectations of how countries cooperate across borders, such as the UN Charter, the UDHR, the Antarctic Treaty, the Paris Agreement, and the Sustainable Development Goals (SDGs).\"}, {\"t\": \"li1\", \"h\": \"International mediation can peacefully resolve serious disputes between nations (e.g. the UN Secretary-General’s binding ruling in 1986, settling the dispute between New Zealand and France over the bombing of the Rainbow Warrior).\"}, {\"t\": \"li1\", \"h\": \"The UN Declaration on the Rights of Indigenous Peoples (UNDRIP) recognises the rights of Indigenous Peoples worldwide, including rights to land, resources, language, culture, and self-determination. There is debate about how far UNDRIP's provisions correspond to what te Tiriti o Waitangi / the Treaty of Waitangi recognises.\"}, {\"t\": \"h\", \"h\": \"<b>New Zealand’s place in the world<\\/b>\"}, {\"t\": \"li1\", \"h\": \"New Zealand has been a prominent voice in the establishment of the UN.\"}, {\"t\": \"li1\", \"h\": \"The New Zealand government, groups, and individuals have worked with others to achieve international change and drive key treaties and initiatives, including:\"}, {\"t\": \"li2\", \"h\": \"treaties on nuclear weapons (NPT), International Court of Justice case on legality of nuclear weapons, South Pacific Nuclear Free Zone Treaty (1985), Treaty on the Prohibition of Nuclear Weapons\"}, {\"t\": \"li2\", \"h\": \"the International Convention for the Regulation of Whaling\"}, {\"t\": \"li2\", \"h\": \"the Christchurch Call.\"}, {\"t\": \"h\", \"h\": \"<b>Global citizenship<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Global citizenship does not mean that people are all the same; it challenges people to be global citizens with shared moral responsibilities, while also accepting and valuing differences.\"}, {\"t\": \"li1\", \"h\": \"The UDHR established a universal standard for global dignity, paved the way for enforceable conventions and treaties, and embedded human rights laws at national levels.\"}, {\"t\": \"li1\", \"h\": \"Global citizens take an active interest in international institutions and agreements such as Sustainable Development Goals, ethical travel and consumerism, fair trade, slow fashion. They also practice the responsible use of digital technologies such as AI and protecting others’ safety and privacy while supporting international aid, and global cooperation.\"}, {\"t\": \"li1\", \"h\": \"Global citizens learn to navigate complex issues and critically evaluate information to recognise the way false or misleading material can be spread through media or online platforms internationally, undermining trust between citizens and governments, and between countries.\"}, {\"t\": \"li1\", \"h\": \"Social media and AI can operate across national borders. How social media and AI should be regulated, monitored or deregulated is an ongoing debate for jurisdictions and global citizens.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Formulate questions about New Zealand’s democracy as a system using ‘who’, ‘what’, ‘how’, and ‘why’ questions, by asking, for example:\"}, {\"t\": \"li2\", \"h\": \"What are the distinctive features of New Zealand democracy?\"}, {\"t\": \"li2\", \"h\": \"How does the Constitution, including te Tiriti o Waitangi / the Treaty of Waitangi, influence decision-making in New Zealand?\"}, {\"t\": \"li2\", \"h\": \"How do citizens influence government decisions?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using government websites and electoral data to collect information about the roles and responsibilities of Parliament, Cabinet, and the Governor-General, and how MMP elections shape the composition of parliament.\"}, {\"t\": \"li1\", \"h\": \"Comparing how Treaty clauses are worded across different statutes and determining what each requires of decision-makers.\"}, {\"t\": \"li1\", \"h\": \"Using quantitative data from past elections to describe how past governments have been formed in New Zealand (e.g. coalitions).\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Identifying values and beliefs that motivate people to call for law changes or join political parties.\"}, {\"t\": \"li1\", \"h\": \"Comparing views on lowering the voting age.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual understandings, by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining the role of Parliament.\"}, {\"t\": \"li1\", \"h\": \"Using examples of coalition governments to explain how parties work together to form and make governments.\"}, {\"t\": \"li1\", \"h\": \"Describing how the trustworthiness of the media contributes to public understanding of government decisions and democratic processes.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Planning a structured debate or submission on a policy issue or issues that matter to young people.\"}, {\"t\": \"li1\", \"h\": \"Organising a discussion, forum, mock parliament, or election and reflecting on what the processes revealed about how New Zealand’s system of government makes laws, resolves differences, represents a diverse population, and requires civic engagement and civil discussion.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Formulate disciplinary questions about political ideas and citizenship, from local to global, using ‘what’, ‘why’, ‘who’, and ‘how’, for example:\"}, {\"t\": \"li2\", \"h\": \"What makes an international agreement effective?\"}, {\"t\": \"li2\", \"h\": \"Who decides what counts as a universal right?\"}, {\"t\": \"li2\", \"h\": \"How does a small country like New Zealand influence international actions?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Comparing the purpose and provisions of at least two international treaties or agreements (e.g. UN Charter, UDHR, Antarctic Treaty, Paris Agreement, SDGs).\"}, {\"t\": \"li1\", \"h\": \"Analysing the steps New Zealand took to bring about a specific treaty or agreement (e.g. NPT, SPNFZT, TPNW, Christchurch Call). Examining where UNDRIP and te Tiriti o Waitangi / the Treaty of Waitangi correspond and where they do not, and why New Zealand initially declined to support UNDRIP.\"}, {\"t\": \"li1\", \"h\": \"Examining how misinformation spread through social media and artificial intelligence (AI) can affect trust between citizens, governments, and countries, and analysing the responsibilities of individuals, technology platforms, and governments for addressing it.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Considering why some countries or leaders reject multilateral agreements in favour of acting alone and evaluating the arguments on each side.\"}, {\"t\": \"li1\", \"h\": \"Evaluating how different individuals and groups viewed New Zealand’s role in international nuclear disarmament efforts and the reasons for their views.\"}, {\"t\": \"li1\", \"h\": \"Analysing the idea of global citizenship and considering how shared responsibilities and respect for cultural differences can influence cooperation between countries.\"}, {\"t\": \"li1\", \"h\": \"Comparing the universal rights outlined in the UDHR with the specific rights recognised in UNDRIP, and analysing different perspectives about why both universal and group-specific rights are important.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual understandings, by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining how international organisations and agreements such as the UN and the SDGs attempt to establish shared expectations of cooperation between countries, using specific examples.\"}, {\"t\": \"li1\", \"h\": \"Constructing a reasoned argument about New Zealand’s role in an international agreement of choice, evaluating whether its influence was proportionate to its size.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action, by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Comparing regulatory and freedom of speech responses to a global issue (e.g. where misinformation crosses national borders through social media or AI) and decide on the most appropriate response.\"}, {\"t\": \"li1\", \"h\": \"Designing a student conference or mock forum to consider international events or issues, for example, evaluating a New Zealand-led international initiative such as the Christchurch Call, or an environment or human rights issue.\"}]]}]}]}, \"History\": {\"sections\": [{\"label\": \"New Zealand history\", \"idea\": {\"title\": \"Causes and consequences, and perspectives\", \"desc\": \"Historical conflicts have multiple causes and consequences, about which people have different perspectives and interpretations.\"}, \"units\": [{\"kc\": [\"Multiple interrelated factors contribute to the causes of conflict with significant short and longer-term consequences for those involved.\", \"The causes and consequences of the world wars and various forms of participation can reshape identity, relationships, and place in the world.\"], \"pc\": [\"Define, explain, and apply concepts of <b>conflict<\\/b>, <b>interrelated causes, short- and long-term consequences, and perspectives<\\/b>, and make connections between these concepts by exploring different contexts.\", \"Define, explain, and apply concepts of <b>war participation, perspectives, and national identity,<\\/b> and make connections between these concepts by exploring different contexts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>The New Zealand Wars | Ngā Pakanga o Aotearoa (1845–1872)<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Causes of the New Zealand Wars<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Conflict grew because Māori and European settlers had different ideas about land, authority, and te Tiriti o Waitangi / the Treaty of Waitangi.\"}, {\"t\": \"li1\", \"h\": \"As settlers demanded more land and gained power through colonial government systems, Māori became excluded and tensions increased because of competing economic interests, cultural beliefs, and ideas about control.\"}, {\"t\": \"li1\", \"h\": \"Governors such as Gore Browne were concerned about the settler pressure for land, but he was also determined that Crown authority would prevail when it came to what he saw as challenges from the Kiingitanga. Meanwhile, the Colonial Office in London urged restraint as it did not want the financial burden of war. Some iwi also supported the Crown in its wars, or were neutral. This might be because the Crown was fighting a traditional enemy, or the iwi were in close proximity to settler populations and needed to be careful.\"}, {\"t\": \"h\", \"h\": \"<b>Māori responses and tino rangatiratanga<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Māori worked to protect their whenua (land), mana, and tino rangatiratanga (self-determination) as colonial pressure increased, forming movements like the Kiingitanga to unite iwi and maintain authority over land and people.\"}, {\"t\": \"li1\", \"h\": \"Māori responded in a multitude of ways, including different forms of resistance, adaptation, and engagement with colonial systems.\"}, {\"t\": \"h\", \"h\": \"<b>Nature of the New Zealand Wars<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The New Zealand Wars happened in different regions** and involved Crown forces and various Māori groups, with the nature of the fighting changing depending on leadership, land, and alliances.\"}, {\"t\": \"li1\", \"h\": \"Māori and Crown groups used different strategies (e.g. fortified pā, redoubts), and each had different advantages, such as resources, organisation, and knowledge of the land.\"}, {\"t\": \"h\", \"h\": \"<b>Impacts of the New Zealand Wars<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The New Zealand Wars led to major Crown confiscations of Māori land ** (raupatu), causing deep losses of whenua (land), resources, and well-being.\"}, {\"t\": \"li1\", \"h\": \"Some Māori communities adopted non -violent resistance. At Parihaka in 1881, Te Whiti -o- Rongomai (Taranaki, Te Āti Awa) and Tohu Kākahi (Taranaki, Te Āti Awa) opposed land confiscation through peaceful action rather than armed warfare.\"}, {\"t\": \"li1\", \"h\": \"The outcomes of the New Zealand Wars strengthened Crown control, giving way to further policies that increasingly limited Māori authority and supported assimilation, such as the Native Land Court 1865, Native Schools Act 1867 and the later Tohunga Suppression Act 1907.\"}, {\"t\": \"h\", \"h\": \"<b>Responses over time<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Māori communities continued to respond through different forms of resistance, adaptation, and efforts to maintain identity and authority.\"}, {\"t\": \"li1\", \"h\": \"Māori used a range of approaches to seek recognition and redress. These responses, including working within and alongside the Crown system (e.g. establishment of the Waitangi Tribunal in 1975), reflect ongoing efforts to resolve historical grievances and shape relationships between Māori and the Crown.\"}, {\"t\": \"h\", \"h\": \"<b>Remembering the New Zealand Wars<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The New Zealand Wars may have been understood in different ways over time, from early colonial narratives that emphasised settlement and order, to more recent interpretations highlighting land loss, resistance, and treaty relationships.\"}, {\"t\": \"li1\", \"h\": \"For Māori, the wars remain significant because their impacts continue to affect whānau, hapū, iwi today.**\"}, {\"t\": \"li1\", \"h\": \"There are differing perspectives on how the wars should be understood, remembered, and commemorated.\"}], [{\"t\": \"h\", \"h\": \"<b>World War One and World War Two, and New Zealand’s participation and response<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>World War One (1914–1918)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The shifting balance of European power and the 1914 assassination of Archduke Franz Ferdinand triggered the war. As a loyal Dominion, New Zealand rapidly joined Britain against the Central Powers.\"}, {\"t\": \"li1\", \"h\": \"Conflict spread across Europe, the Middle East, Africa, and the Pacific. The Western Front was defined by static trench warfare.\"}, {\"t\": \"li1\", \"h\": \"Over 100,000 New Zealanders served overseas during World War One. Sir Āpirana Ngata strongly encouraged Māori enlistment and helped recruit for the Māori Pioneer Battalion, while Te Puea Hērangi (Waikato Tainui) opposed conscription and recruitment among Waikato Māori due to the legacy of land confiscations.\"}, {\"t\": \"li1\", \"h\": \"As volunteer numbers declined, conscription was introduced in 1916, although conscientious objectors were often treated harshly. Pacific Islanders, especially from the Cook Islands and Niue, volunteered to serve with New Zealand forces and made an important contribution to the war effort.\"}, {\"t\": \"li1\", \"h\": \"Australians and New Zealanders have fought alongside each other in wars, including at Gallipoli.\"}, {\"t\": \"li1\", \"h\": \"Women and children played vital roles in the war effort. Women served as nurses, volunteers, and essential workers, helping to fill key labour shortages in agriculture, factories, transportation, and healthcare, while children supported the war through fundraising, sending letters and care packages, and promoting patriotism.\"}, {\"t\": \"h\", \"h\": \"<b>New Zealand’s key campaigns<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Gallipoli (1915–1916) – Allied forces landed in an attempt to defeat the Ottoman Empire but withdrew after heavy casualties and poor planning.\"}, {\"t\": \"li1\", \"h\": \"The Western Front was the main theatre for New Zealand troops, including the Battle of Passchendaele (New Zealand’s darkest day), where over 800 New Zealand soldiers were killed.\"}, {\"t\": \"li1\", \"h\": \"Both sides were exhausted after four years of war, but Germany signed an armistice in November 1918 following the entry of America into the war. The war claimed over 18,000 New Zealand lives and caused the collapse of four major empires.\"}, {\"t\": \"h\", \"h\": \"<b>World War Two (1939–1945)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Deep resentment in Germany over the Treaty of Versailles and the economic hardships of the Great Depression led to the rise of Adolf Hitler. The invasion of Poland in 1939 began the war in Europe.\"}, {\"t\": \"li1\", \"h\": \"Germany initially dominated using Blitzkrieg tactics. The tide eventually turned due to massive losses on the Russian Front and American industrial capacity; Germany surrendered in May 1945.\"}, {\"t\": \"li1\", \"h\": \"Japan’s attack on Pearl Harbor began the Pacific War in 1941 and brought the United States into the war. The Battle of Midway (1942) was the turning point that crippled Japan’s naval offensive. The war ended in September 1945 after the atomic bombings of Hiroshima and Nagasaki.\"}, {\"t\": \"h\", \"h\": \"<b>New Zealand’s contribution<\\/b>\"}, {\"t\": \"li1\", \"h\": \"New Zealand forces fought in Greece, Crete, North Africa, and Italy, with notable service by the 28th Māori Battalion.\"}, {\"t\": \"li1\", \"h\": \"The 28th Māori Battalion became one of New Zealand’s most highly regarded military units, and its service strengthened Māori leadership, identity, and recognition within New Zealand society.\"}, {\"t\": \"li1\", \"h\": \"New Zealand made a significant contribution to the war effort in the Pacific, with approximately 20,000 New Zealanders serving in military operations, intelligence gathering, and maritime support. For example:\"}, {\"t\": \"li2\", \"h\": \"the Air Force patrol and reconnaissance missions\"}, {\"t\": \"li2\", \"h\": \"the Army’s 3rd Division fought alongside US forces, helping liberate islands such as Vella Lavella from Japanese control before being withdrawn in 1944\"}, {\"t\": \"li2\", \"h\": \"the Navy protected convoys and hunted Japanese submarines\"}, {\"t\": \"li2\", \"h\": \"Coastwatchers, including Pacific Island peoples, provided vital intelligence by reporting Japanese shipping and aircraft movements across the Pacific.\"}, {\"t\": \"li1\", \"h\": \"The Home Front – the government implemented conscription, rationing, and censorship. Over 100,000 American troops rotated through New Zealand. Women significantly increased their participation in the workforce. The Māori War Effort Organisation coordinated recruitment and production. Prisoner of War camps were established at Featherston and Matiu | Somes Island.\"}, {\"t\": \"li1\", \"h\": \"Defences including coastal gun batteries and underwater mines were used to protect New Zealand (e.g. long-range artillery bases at Whangaparāoa Peninsula and on Waiheke Island at Stony Batter, coordinated from the ‘nerve centre’ at Maungauika | North Head; Wrights Hill Fortress in Karori).**\"}, {\"t\": \"h\", \"h\": \"<b>Consequences and legacy<\\/b>\"}, {\"t\": \"li1\", \"h\": \"World War Two resulted in up to 80 million deaths, including nearly 12,000 New Zealanders.\"}, {\"t\": \"li1\", \"h\": \"European empires weakened, leading to decolonisation. New Zealand’s security focus moved away from Britain towards the United States and the Pacific.\"}, {\"t\": \"li1\", \"h\": \"The UN was formed in 1945 to prevent future global conflict. New Zealand played an influential role as a founding member, advocating for the rights of smaller nations.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Craft evaluative questions to form and justify a point of view, for example:\"}, {\"t\": \"li2\", \"h\": \"To what extent did differing views about land, authority, and te Tiriti o Waitangi contribute to the outbreak of the New Zealand Wars?\"}, {\"t\": \"li2\", \"h\": \"How effective were different Māori and Crown strategies during the New Zealand Wars?\"}, {\"t\": \"li2\", \"h\": \"Why do different groups remember and interpret the New Zealand Wars in different ways?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources with differing and contrary perspectives to identify the multiple interrelated causes of conflict, recognising that available sources may not fully represent the diversity of people's experiences or perspectives.\"}, {\"t\": \"li1\", \"h\": \"Analysing and comparing evidence from multiple sources to explain relationships between causes of conflict and its short- and long-term consequences.\"}, {\"t\": \"li1\", \"h\": \"Sequencing and locating the key events related to a conflict.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing and contrary perspectives on the causes and consequences of conflict, including perspectives that support different interpretations.\"}, {\"t\": \"li1\", \"h\": \"Making informed ethical judgements about actions and decisions associated with conflict, using historical evidence and considering the attitudes and values of the time, the challenges people faced, and the information available to them.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual understandings by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical argument or narrative of cause-and-consequence using evidence from multiple sources to explain how interrelated factors contributed to conflict and comparing examples over time to identify continuity and change in their short- and long-term consequences.\"}, {\"t\": \"li1\", \"h\": \"Explaining how differing perspectives influence interpretations of the causes and consequences of conflict.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Developing an awareness campaign about the New Zealand wars, based on an evaluation of competing claims about the present-day significance and justifying a judgement from evidence.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Ask questions that explore values, ethics, bias, and consequences, including different perspectives and short- and long-term impacts, for example:\"}, {\"t\": \"li2\", \"h\": \"How did different groups of people in New Zealand respond to World War One and World War Two?\"}, {\"t\": \"li2\", \"h\": \"What were the immediate and long-term impacts of the World Wars on New Zealand society?\"}, {\"t\": \"li2\", \"h\": \"What impact did the World Wars have on our local community?\"}, {\"t\": \"li2\", \"h\": \"Why do we remember some aspects of the wars (e.g. Gallipoli) better than others?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources with differing and contrary perspectives to investigate:\"}, {\"t\": \"li2\", \"h\": \"causes and consequences of war\"}, {\"t\": \"li2\", \"h\": \"forms of participation in conflict or war and how war contributed to the development of national identity, recognising that sources may not fairly represent the diversity of people's experiences.\"}, {\"t\": \"li1\", \"h\": \"Critically analysing and comparing evidence from multiple sources to evaluate how participation in war and national identity have been understood and represented over time.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing and contrary perspectives about participation in war, including whose experiences have been recognised or excluded.\"}, {\"t\": \"li1\", \"h\": \"Making informed ethical judgements about participation in war, considering historical evidence, the attitudes and values of the time, the complex challenges people faced, what they knew and expected, and how our own perspectives influence interpretation.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual understandings by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical argument or narrative of cause-and-consequence using evidence from multiple sources to explain reasons for and effects of war, and different forms of participation in it.\"}, {\"t\": \"li1\", \"h\": \"Communicating how perspectives on participation and national identity have changed over time and why different groups continue to interpret their historical significance differently.\"}, {\"t\": \"li1\", \"h\": \"Explaining why World War One and World War Two were significant for New Zealand.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social action by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Sharing local stories of service, sacrifice, and community contributions during the World Wars.\"}, {\"t\": \"li1\", \"h\": \"Evaluating how remembrance and commemoration help communities understand the impacts and legacies of war.\"}]]}]}, {\"label\": \"Global history\", \"idea\": {\"title\": \"Causes and consequences, and perspectives\", \"desc\": \"Historical encounters and conflicts have multiple causes and consequences, about which people have different perspectives and interpretations.\"}, \"units\": [{\"kc\": [\"People hold different perspectives towards interactions between societies and the consequences on identity, authority, and independence.\", \"Differing perspectives about which people belong in a place have had, and continue to have, significant consequences.\"], \"pc\": [\"Define, explain, and apply concepts of <b>perspectives, identity, authority, and independence<\\/b>, and make connections between these concepts by exploring different examples.\", \"Define, explain, and apply concepts of <b>power<\\/b>, <b>belonging and exclusion<\\/b> and <b>perspectives<\\/b> and make connections between these concepts by exploring different examples.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>Choose one case study from the following:<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Pacific histories<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Traditional Pacific societies<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Polynesian navigators settled islands across the Pacific, including the Cook Islands, Tonga, Niue, Sāmoa, and New Zealand, using stars, ocean currents, winds, and bird migrations to guide their voyages. Although Pacific societies developed their own cultures and languages, they remained connected through shared Polynesian ancestry, trade, travel, family relationships, and cultural traditions.\"}, {\"t\": \"li1\", \"h\": \"The Tahitian navigator Tupaia demonstrated Pacific connections when he travelled with James Cook and communicated with many Pacific peoples using related Polynesian languages.\"}, {\"t\": \"h\", \"h\": \"<b>European expansion into the Pacific<\\/b>\"}, {\"t\": \"li1\", \"h\": \"During the 19th century, European explorers, missionaries, traders, and colonial powers became increasingly involved in the Pacific.\"}, {\"t\": \"li1\", \"h\": \"Britain, Germany, France, and the United States competed for strategic ports, natural resources (e.g. copra, sugar, pearl), and political influence, resulting in many Pacific islands coming under colonial rule or foreign control.\"}, {\"t\": \"li1\", \"h\": \"New Zealand politicians saw the Pacific as important for defence, trade, and regional influence and sought a greater role in Pacific affairs.\"}, {\"t\": \"h\", \"h\": \"<b>New Zealand’s role in the Pacific<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The Cook Islands and Niue became part of New Zealand’s administration in 1901. New Zealand occupied German Sāmoa in 1914 and later governed Western Sāmoa under a League of Nations mandate.\"}, {\"t\": \"li1\", \"h\": \"New Zealand’s involvement influenced government, education, healthcare, trade, and migration, creating lasting cultural, economic, and family connections across the Pacific.\"}, {\"t\": \"h\", \"h\": \"<b>Different experiences of colonisation<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The Cook Islands, Niue, and Sāmoa experienced New Zealand rule differently because of their unique histories and circumstances.\"}, {\"t\": \"li1\", \"h\": \"Colonisation introduced Christianity, formal education, new systems of government, and economic change, while reducing traditional political authority and altering some cultural practices.\"}, {\"t\": \"li1\", \"h\": \"Many Sāmoan people opposed New Zealand rule after the 1918 influenza epidemic, which spread when the SS Talune was not quarantined, and after the violence of Black Saturday in 1929 against peaceful Mau Movement protesters.\"}, {\"t\": \"li1\", \"h\": \"In 2002, New Zealand formally apologised to Sāmoa for aspects of its colonial administration, including its handling of the influenza epidemic and actions against the Mau Movement.\"}, {\"t\": \"h\", \"h\": \"<b>Resistance and self-determination<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Pacific peoples maintained their languages, identities, cultural traditions, and family connections throughout the colonial period.\"}, {\"t\": \"li1\", \"h\": \"In Sāmoa, the Mau Movement used peaceful protest to oppose New Zealand rule and demand independence.\"}, {\"t\": \"h\", \"h\": \"<b>Pathways to self-government<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Sāmoa achieved independence in 1962, the Cook Islands became self-governing in free association with New Zealand in 1965, with Niue following in 1974.\"}, {\"t\": \"li1\", \"h\": \"Some Pacific nations later adopted new or Indigenous names, including Kiribati (Gilbert Islands), Vanuatu (New Hebrides), and Sāmoa (Western Sāmoa), as part of strengthening cultural identity and self-determination.\"}, {\"t\": \"li1\", \"h\": \"Despite self-government, the Cook Islands, Niue, and Sāmoa maintained strong constitutional, cultural, family, and economic links with New Zealand.\"}, {\"t\": \"h\", \"h\": \"<b>The Kingdom of Tonga<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Tonga is the only Pacific Island nation that was never formally colonised. In the mid- 1800s, King George Tupou I united the kingdom, strengthening its stability, sovereignty, and independence.\"}, {\"t\": \"li1\", \"h\": \"In 1839, King Tupou I dedicated Tonga to God through Tukufonua ki Langi, an event that shaped the nation’s Christian identity and is remembered by many Tongans as an affirmation of Tonga’s sovereignty and independence.\"}, {\"t\": \"li1\", \"h\": \"Although Tonga was a British Protected State from 1900 to 1970, it retained its Indigenous monarchy and self-governance. Following the end of the protectorate, Tonga continued as an independent constitutional monarchy.\"}, {\"t\": \"h\", \"h\": \"<b>Migration and identity<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Migration from the Cook Islands, Niue, Tonga, and Sāmoa strengthened family, cultural, and economic connections with New Zealand during the 20th century.\"}, {\"t\": \"li1\", \"h\": \"Pacific peoples have made significant contributions to New Zealand’s communities, language, arts, sport, politics, and economy.\"}, {\"t\": \"li1\", \"h\": \"During the 1970s, Pacific peoples were disproportionately targeted through discriminatory immigration enforcement, causing lasting harm. In 2021, the New Zealand government formally apologised for the Dawn Raids and acknowledged the injustices experienced by Pacific communities.\"}, {\"t\": \"h\", \"h\": \"<b>Perspectives and interpretations<\\/b>\"}, {\"t\": \"li1\", \"h\": \"People from the Cook Islands, Niue, Tonga, Sāmoa, and New Zealand may interpret shared historical events differently because of their experiences and cultural perspectives.\"}, {\"t\": \"li1\", \"h\": \"Pacific oral histories, family stories, cultural traditions, and written records all contribute to our understanding of the past.\"}, {\"t\": \"li1\", \"h\": \"Considering multiple perspectives helps build a fuller understanding of New Zealand’s shared history with Pacific peoples and its continuing significance today.\"}, {\"t\": \"p\", \"h\": \"OR\"}, {\"t\": \"h\", \"h\": \"<b>Gandhi and the campaign for Indian Independence (1915–1947)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"India was part of the British Empire from 1757 to 1947, and under direct rule by Britain from 1858 (the British Raj).\"}, {\"t\": \"li1\", \"h\": \"Many Indian people wanted independence because Britain exploited India’s natural resources (e.g. cotton, tea, minerals) and treated Indian people as second class citizens (e.g. excluded them from positions of power and discriminated against them).\"}, {\"t\": \"li1\", \"h\": \"British rule affected people in India differently depending on their social position, religion, gender, region, and circumstances, resulting in a range of experiences and perspectives. For example:\"}, {\"t\": \"li2\", \"h\": \"some wealthy members of society gained education, employment, and political opportunities under British administration, while others (e.g. many farmers and workers) faced poverty, high taxes, and limited political rights\"}, {\"t\": \"li2\", \"h\": \"railway construction improved communications and trade, but mainly served British interests, displaced some traditional workers, and left many rural communities with fewer benefits than cities.\"}, {\"t\": \"h\", \"h\": \"<b>Resistance and the Independence Movement<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Mohandas Karamchand Gandhi, commonly known as Mahatma Gandhi, became the leading figure of the Indian National Congress and introduced the idea of Satyagraha (peaceful resistance) to achieve independence.\"}, {\"t\": \"li1\", \"h\": \"Gandhi and the Independence Movement used civil disobedience and non-cooperation tactics. These tactics included protests (e.g. the Salt March 1930), boycotting of British goods, and a refusal to cooperate with British authorities.\"}, {\"t\": \"li1\", \"h\": \"Indian people responded to British colonial rule in different ways, including peaceful protest, political activism, local community organising, and calls for self-government and independence. For example, some cooperated with British authorities through government or military service, while others supported the Indian National Congress and Gandhi's peaceful protest campaigns, including the Salt March. Some groups favoured more radical methods, including armed resistance, to achieve independence.\"}, {\"t\": \"li1\", \"h\": \"Although Gandhi was the figurehead of the Independence Movement, many others, including local leaders, women, workers, students, and community organisations, contributed to the movement and helped mobilise millions of Indians.\"}, {\"t\": \"h\", \"h\": \"<b>Independence and partition<\\/b>\"}, {\"t\": \"li1\", \"h\": \"India gained independence in 1947 after decades of campaigning, protest, political activism, and negotiation. The country was divided into two sovereign nations – India and Pakistan.\"}, {\"t\": \"li1\", \"h\": \"Partition led to large-scale migration, violence, and displacement. For example, many Hindus and Sikhs moved from areas that became Pakistan to India, while many Muslims moved from India to Pakistan. These migrations involved millions of people, and continue to shape identities, family histories, and relations between India and Pakistan today.\"}, {\"t\": \"h\", \"h\": \"<b>Perspectives and interpretations<\\/b>\"}, {\"t\": \"p\", \"h\": \"People in India, Britain, Pakistan, and elsewhere may interpret the causes, significance, and outcomes of Indian independence differently because of their experiences, identities, and historical perspectives.\"}], [{\"t\": \"h\", \"h\": \"<b>Choose one case study from the following:<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Nazi Germany – Ideology, control, and the Holocaust<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Social and economic conditions where people are more willing to accept promises of change<\\/b>\"}, {\"t\": \"li1\", \"h\": \"After World War One, Germany faced political chaos, economic crisis, and anger in Germany at the Treaty of Versailles, which many Germans regarded as punitive.\"}, {\"t\": \"li1\", \"h\": \"Hyperinflation, unemployment, and the Great Depression made many Germans more willing to support strong, authoritarian leadership, especially when it promised to restore Germany.\"}, {\"t\": \"h\", \"h\": \"<b>Social control<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Social control can be achieved by influencing what people think and believe.\"}, {\"t\": \"li1\", \"h\": \"The Nazis used propaganda, mass rallies, censorship, education, and the cult of personality to shape people’s thinking.\"}, {\"t\": \"li1\", \"h\": \"Schools, youth groups, newspapers, radio, films, posters, and other forms of propaganda spread Nazi ideas.\"}, {\"t\": \"li1\", \"h\": \"Hitler was presented as a strong leader who should not be questioned and who could solve Germany’s problems.\"}, {\"t\": \"li1\", \"h\": \"Jewish people and other groups were portrayed as enemies who threatened Germany and undermined society.\"}, {\"t\": \"li1\", \"h\": \"Hostility, prejudice, and discrimination against Jewish people (antisemitism) existed in Europe long before the Nazis came to power. The Nazis intensified it through racial ideology, propaganda, and discriminatory laws that excluded Jews from society through legal, economic, and social restrictions.\"}, {\"t\": \"h\", \"h\": \"<b>Dictatorships<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Dictatorships maintain power through a combination of persuasion and coercion.\"}, {\"t\": \"li1\", \"h\": \"The Nazis used laws, fear, and surveillance to control behaviour.\"}, {\"t\": \"li1\", \"h\": \"Political opposition was banned.\"}, {\"t\": \"li1\", \"h\": \"The Gestapo and SS punished people who resisted.\"}, {\"t\": \"li1\", \"h\": \"Rights and freedoms were gradually removed.\"}, {\"t\": \"h\", \"h\": \"<b>The Holocaust<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The Holocaust developed through a series of decisions and policies rather than a single event or order.\"}, {\"t\": \"li1\", \"h\": \"Discrimination became persecution and then genocide.\"}, {\"t\": \"li1\", \"h\": \"Jewish people were first excluded from society through laws and restrictions (e.g. The Nuremberg Laws, which removed citizenship rights from Jewish Germans and prohibited marriage between Jews and non-Jews).\"}, {\"t\": \"li1\", \"h\": \"Over time, persecution became more severe, as seen in the November Pogroms (Kristallnacht) of 1938, a state -organised attack against Jewish people, homes, businesses, and synagogues across Nazi Germany.\"}, {\"t\": \"li1\", \"h\": \"During World War Two, Nazi policies developed into the systematic murder of millions of people including 6 million Jewish people.\"}, {\"t\": \"h\", \"h\": \"<b>New Zealand’s mixed response to Jewish refugees<\\/b>\"}, {\"t\": \"li1\", \"h\": \"At the Evian Conference (1938) New Zealand expressed sympathy for Jewish refugees.\"}, {\"t\": \"li1\", \"h\": \"The government also condemned the November Pogroms (1938) (Kristallnacht) but remained extremely reluctant to accept refugees fleeing Nazi Germany.\"}, {\"t\": \"li1\", \"h\": \"Immigration restrictions were tightened, and it was only after pressure from Britain that New Zealand agreed to admit approximately 1,000 refugees.\"}, {\"t\": \"h\", \"h\": \"<b>Other genocides<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The experiences of the Holocaust remind us to be aware of how hatred towards other groups can lead to terrible consequences. There have been other genocides committed since the Holocaust (e.g. Rwanda, Cambodia, Srebrenica).\"}, {\"t\": \"h\", \"h\": \"<b>Democratic protections against authoritarianism<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Healthy democracies strive to preserve safeguards against authoritarianism (e.g. separation of powers, free and fair elections, rule of law, independent judiciary, free media and human rights protections).\"}, {\"t\": \"p\", \"h\": \"OR\"}, {\"t\": \"h\", \"h\": \"<b>The Easter Rising and Irish Independence (1916–1922)<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Growing calls for independence<\\/b>\"}, {\"t\": \"li1\", \"h\": \"British rule over Ireland began as early as the 12th century, but many Irish people continued to believe that Ireland should have more control over its own government, while retaining its own Irish language and culture (e.g. traditional sports, local arts). However, some people, particularly many Protestants in Ulster, supported remaining part of the United Kingdom.\"}, {\"t\": \"h\", \"h\": \"<b>Challenging British rule<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Periodic rebellions from the 17th century contributed to the development of nationalist movements such as the Fenians/Irish Republican Brotherhood (IRB), the Irish Volunteers, and Sinn Féin, which sought greater Irish self-governance or independence. These movements played an important role in the 1916 Easter Rising, a key turning point in Irish politics.\"}, {\"t\": \"li1\", \"h\": \"Although the Rising was defeated and Irish opinion remained divided, Britain's harsh response, including the execution of many of the Rising's leaders, increased support for Irish independence.\"}, {\"t\": \"li1\", \"h\": \"Leaders such as Michael Collins and Éamon de Valera, along with many ordinary Irish men and women, continued working to challenge British control.\"}, {\"t\": \"li1\", \"h\": \"Victorious in the 1918 election in Ireland, Sinn Féin refused to take seats in the British Parliament and instead established Dáil Éireann, which declared Irish independence in 1919. Britain rejected this declaration.\"}, {\"t\": \"li1\", \"h\": \"During the resulting Irish War of Independence (1919–1921), Irish republicans and British forces fought a guerrilla war until eventually a negotiated settlement was reached.\"}, {\"t\": \"h\", \"h\": \"<b>Political change and its impact<\\/b>\"}, {\"t\": \"li1\", \"h\": \"As a result of the conflict, in 1922 most of Ireland became the Irish Free State and gained substantial self-government within the British Commonwealth.\"}, {\"t\": \"li1\", \"h\": \"Six counties in the north chose to remain part of the United Kingdom and became known as Northern Ireland.\"}, {\"t\": \"li1\", \"h\": \"The movement changed Ireland's political system and demonstrated how individuals and groups can challenge existing power structures to affect political change.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Craft evaluative questions to form and justify a point of view, for example:\"}, {\"t\": \"li2\", \"h\": \"How effective were different Pacific responses to colonial rule and efforts to limit authority?\"}, {\"t\": \"li2\", \"h\": \"How effective was Gandhi’s campaign for independence?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources with differing and contrary perspectives to identify the causes and consequences of interaction between societies, recognising that available sources may not fully represent the diversity of people's experiences.\"}, {\"t\": \"li1\", \"h\": \"Analysing and comparing evidence from multiple sources to explain relationships between perspectives, identity, authority, and independence.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing and contrary perspectives about identity, authority, and independence, including perspectives that support different interpretations.\"}, {\"t\": \"li1\", \"h\": \"Making informed ethical judgements about actions and decisions relating to authority and independence, using historical evidence and considering the attitudes and values of the time, the challenges people faced, and the information available to people at the time.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual understandings by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical argument or narrative of cause-and-consequence, using evidence from multiple sources, to explain how differing perspectives about identity and authority contributed to movements for independence, and comparing examples over time to identify continuity and change in these relationships.\"}, {\"t\": \"li1\", \"h\": \"Explaining how differing perspectives on identity, authority, and independence can lead to different interpretations of historical events and their significance over time.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Ask questions that explore values, ethics, bias, and consequences, including different perspectives and short- and long-term impacts.\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using historical sources with differing and contrary perspectives to investigate how power influenced experiences of belonging and exclusion, recognising that available sources may not fully capture or fairly represent the diversity of people's experiences and perspectives.\"}, {\"t\": \"li1\", \"h\": \"Critically analysing and comparing evidence from multiple sources to explain how power shaped experiences of belonging and exclusion, and the consequences that resulted over time.\"}, {\"t\": \"li1\", \"h\": \"Sequencing key events and changes in how power was exercised and contested.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating differing and contrary perspectives about power, belonging, and exclusion, including which experiences have been recognised, marginalised, or omitted from historical accounts.\"}, {\"t\": \"li1\", \"h\": \"Mak ing informed ethical judgements about actions and decisions relating to power and exclusion, considering historical evidence, the attitudes and values of the time, the complex challenges people faced, what they knew and expected, and how our own perspectives influence interpretation.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual understandings by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Constructing a historical argument or narrative using evidence from multiple sources to explain how power has been exerted to define who belonged and who was excluded, and the short- and long-term consequences this had for excluded groups.\"}, {\"t\": \"li1\", \"h\": \"Communicating how differing perspectives on power, belonging, and exclusion have shaped competing interpretations of the past and continue to influence society today.\"}]]}]}]}, \"Geography\": {\"sections\": [{\"label\": null, \"idea\": {\"title\": \"Interaction and sustainability\", \"desc\": \"Human-environment interactions create both opportunities and challenges for places.\"}, \"units\": [{\"kc\": [\"The rapid growth of tourism impacts on the sustainability of vulnerable human and physical environments.\", \"Rapid urbanisation changes environments and creates sustainability challenges that can be costly and difficult to resolve.\"], \"pc\": [\"Define, explain, and apply the concepts of <b>tourism and sustainability,<\\/b> and make connections between these concepts by exploring different contexts.\", \"Define, explain, and apply concepts of <b>megacities and sustainability<\\/b>, and make connections between these concepts by exploring different contexts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>Tourism<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Forms of tourism<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Tourism can be domestic and international, and can be inbound and outbound.\"}, {\"t\": \"li1\", \"h\": \"Tourism is generally for a short term, ranging from days through to months.\"}, {\"t\": \"li1\", \"h\": \"People travel as tourists for recreation and relaxation, adventure, cultural and heritage experiences, health/medical, education, pilgrimages, and visiting friends and family.\"}, {\"t\": \"li1\", \"h\": \"Flow maps show quantity and direction of tourist travel using arrows. The pattern of tourism varies by country, seasons, and high and low seasons.\"}, {\"t\": \"h\", \"h\": \"<b>Tourism in New Zealand – exemplified through case studies of a range of tourist destinations<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Tourism has a long history in New Zealand (e.g. the ‘wonder country’ tours in the 19th century).\"}, {\"t\": \"li1\", \"h\": \"New Zealand is an attractive tourist destination because of the unique natural environments and opportunities to experience iconic destinations, tours, adventure activities, and film locations.\"}, {\"t\": \"li1\", \"h\": \"Māori have always played a central role in New Zealand tourism through cultural experiences, guiding, and ecotourism that connects tourists to the land. Māori have also played a role in establishing New Zealand on the global stage (e.g. kapa haka groups, Te Māori exhibition 198 4).\"}, {\"t\": \"li1\", \"h\": \"Tourism is a large export earner for New Zealand and a major global business; it generates employment and revenue, supports regional development, and showcases cultures.\"}, {\"t\": \"li1\", \"h\": \"Tourism can also place pressure on sensitive ecosystems, infrastructure (e.g. water supply, sewage systems, road congestion), increased cost of local housing, and resident dissatisfaction caused by noise and crowds.\"}, {\"t\": \"li1\", \"h\": \"Communities and government use a range of ways to manage the pressures of growth (e.g. restricting or closing sensitive sites, controlling short-term rentals, visitor levies). Tourism sustainability initiatives need to balance economic growth, environmental protection, and cultural preservation.\"}, {\"t\": \"h\", \"h\": \"<b>Tourism in Europe – exemplified through either a case study of at least one European tourist destination<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Europe is one of the world’s top tourism destinations, offering a natural environment, history, architecture, art, culture, and food supported by ease of travel.\"}, {\"t\": \"li1\", \"h\": \"While tourism generates revenue and provides jobs, it changes the character, culture, and landscape of places.\"}, {\"t\": \"li1\", \"h\": \"Protests in some European destinations (e.g. Athens, Barcelona) reflect concerns about pressure on infrastructure and environment, loss of local culture, pressure on housing and rising rents, and the uneven benefits of tourism.\"}, {\"t\": \"p\", \"h\": \"OR\"}, {\"t\": \"h\", \"h\": \"<b>Tourism in the Pacific – exemplified through a case study of at least one Pacific tourist destination<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Pacific Island nations attract tourists through a combination of the uniqueness of the natural environments and cultures.\"}, {\"t\": \"li1\", \"h\": \"While tourism is a major source of foreign exchange and revenue, and provides jobs and preserves cultural traditions, it also changes the character, culture, and landscape of places.\"}, {\"t\": \"li1\", \"h\": \"The heavy reliance on coastal-based tourism makes Pacific nations economically vulnerable to the impacts of climate change through sea-level rise and greater storm intensity and damage.\"}, {\"t\": \"li1\", \"h\": \"Overtourism also places pressure on the environment and local resources. Many Pacific nations have policy interventions to manage this (e.g. French Polynesia has banned cruise ships carrying more than 3,500 passengers, Palau has shifted to low-impact tourism, Pacific Tourism Organisation is working towards eliminating single-use plastics).\"}], [{\"t\": \"h\", \"h\": \"<b>Urbanisation and megacities<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Historically most people across the globe lived in rural areas. Urban living has only become common in high-income countries since the mid-19th century.\"}, {\"t\": \"li1\", \"h\": \"Rapid urban growth has been more recent in low- and middle-income countries across Africa and Asia.\"}, {\"t\": \"li1\", \"h\": \"Urbanisation is the process of more people living in cities and towns, which is driven by rural–urban migration and higher rates of natural increase (births minus deaths).\"}, {\"t\": \"h\", \"h\": \"<b>Megacities and the challenges of rapid urban growth<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The number and location of people (spatial distribution) have significantly changed since the mid-20th century. Spatial distribution and growth are best illustrated through different types of maps such as time-series maps, heat maps, proportional circle maps, and cartograms.\"}, {\"t\": \"li1\", \"h\": \"The rapid growth of megacities (cities with over 10 million people) is one of the clearest signs of rapid urbanisation, as people move to them for greater economic opportunities.\"}, {\"t\": \"h\", \"h\": \"<b>Causes and impacts of megacity growth are exemplified through case studies of megacities in low- and high-income Asian countries<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The growth of megacities is supported by their site (physical features) and situation (location relative to other places advantages).\"}, {\"t\": \"li1\", \"h\": \"The main causes of growth are rural–urban migration, natural increase associated with a younger population, and economic investment (locally from global companies).\"}, {\"t\": \"li1\", \"h\": \"Rapid growth changes the environment and creates challenges such as housing shortages and rising costs, including the growth of informal settlements, traffic congestion, strained infrastructure, and environmental problems.\"}, {\"t\": \"li1\", \"h\": \"Megacities develop strategies for mitigating the challenges, for example, planning, community-led initiatives, improving liveability, and upgrading infrastructure. People have different views about the appropriateness and impacts of these strategies.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Crafting evaluative questions to form and justify a point of view, for example, ‘To what extent should places encourage tourism?’\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using an atlas, maps, and other tools to locate major tourist destinations in New Zealand and Europe, or the Pacific and using flow maps to show tourist movements.\"}, {\"t\": \"li1\", \"h\": \"Using quantitative data and graphs to identify the scale of tourism to top destinations, and graphs to show changes in tourism over time (numbers of tourists and destinations).\"}, {\"t\": \"li1\", \"h\": \"Accessing reports and websites to collect information about tourism impacts and mitigations.\"}, {\"t\": \"li1\", \"h\": \"Optional: Using surveys to learn about people’s tourism preferences.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Comparing perspectives people have about different tourist environments, and their reasons for holding those views.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining how the sustainability of tourism is under pressure in some places, and the responses to those pressures. Support explanations with visual evidence (e.g. diagrams, maps, graphs, tables) using appropriate geographic conventions.\"}, {\"t\": \"li1\", \"h\": \"Optional: Explaining how and why tourism has or has not impacted your local area.**\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social actions by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Developing a sustainable tourism campaign to promote initiatives individuals and groups can take to improve tourism sustainability (e.g. respecting local cultures, supporting local economies, sustainable transport, reusable containers).\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Ask questions that explore values, ethics, bias, and consequences, including different perspectives and short- and long-term impacts, for example, ‘Why do some megacities have more challenges facing them than others?’\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using an atlas, maps, and other tools to locate global megacities.\"}, {\"t\": \"li1\", \"h\": \"Using quantitative data to describe the growth of megacities.\"}, {\"t\": \"li1\", \"h\": \"Using maps, aerial photographs, satellite imagery, and other tools to describe the growth of megacities and their ecological footprint.\"}, {\"t\": \"li1\", \"h\": \"Using photographs and qualitative sources such as personal stories to show the experience of life in informal settlements in some megacities.\"}, {\"t\": \"li1\", \"h\": \"Using reports and access organisations websites to collect information about how megacities are responding to the challenges of rapid urban growth.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Investigating how different groups respond to proposed solutions to address challenges in a megacity.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining how communities and governments can work together to enhance sustainability and living conditions in megacities. Support explanations with visual evidence (e.g. diagrams, maps, graphs, tables) using appropriate geographic conventions.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social actions by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Evaluating the actions of government or non-governmental organisations who have attempted to address a social or an environmental issue in a megacity.\"}]]}, {\"kc\": [\"The interactions between natural processes at the coast and people’s activities creates sustainability challenges that need to be actively managed.\", \"Interactions between countries can increase or reduce the impacts of inequality and the sustainability of communities and countries.\"], \"pc\": [\"Define, explain, and apply concepts of <b>natural processes, impact, and sustainability,<\\/b> and make connections between these concepts by exploring different contexts.\", \"Define, explain, and apply concepts of <b>interaction, inequality and sustainability<\\/b>, and make connections between these concepts by exploring different contexts.\"], \"k\": [[{\"t\": \"h\", \"h\": \"<b>New Zealand coasts<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Coastal processes<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Waves erode the coast through hydraulic action, abrasion, attrition and solution (corrosion).\"}, {\"t\": \"li1\", \"h\": \"Transportation involves the movement of material along the coast by longshore drift.\"}, {\"t\": \"li1\", \"h\": \"Deposition occurs when wave energy is too low to carry material.\"}, {\"t\": \"h\", \"h\": \"<b>Landforms from erosion and deposition<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Erosional landforms include headlands, bays, caves, arches, stacks, stumps, and wave -cut platforms.\"}, {\"t\": \"li1\", \"h\": \"Depositional landforms include beaches, spits, and sand dunes.\"}, {\"t\": \"h\", \"h\": \"<b>Coastal threats and management – exemplified through at least one New Zealand case study<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Threats<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Human activity (e.g. building near or on the coast, vegetation removal, trampling of dunes, vehicles on beaches, sand mining, seawalls, or dams on rivers) can disrupt natural processes (e.g. disrupt the natural sand budget).\"}, {\"t\": \"li1\", \"h\": \"Human activities, especially burning fossil fuels (e.g. coal, oil, and gas), add greenhouse gases to the atmosphere. These gases trap more heat around Earth, causing global temperatures to rise. This is known as global warming.\"}, {\"t\": \"li1\", \"h\": \"As the planet warms, glaciers and polar ice sheets melt, adding more water to the oceans and causing sea levels to rise. The oceans also absorb most of the extra heat trapped by greenhouse gases. When water warms, it expands and takes up more space, which causes sea levels to rise even further.\"}, {\"t\": \"li1\", \"h\": \"Warmer oceans can make hurricanes and cyclones stronger because they provide more energy for these storms. A warmer atmosphere can also hold more water vapour, which can lead to heavier rainfall and a greater risk of flooding.\"}, {\"t\": \"li1\", \"h\": \"Raised sea levels and increased intensity of storms makes coastal areas more vulnerable to flooding (inundation). High-energy storm waves can also severely erode cliffs, causing cliff collapse and remove large quantities of sand and dunes in a short time.\"}, {\"t\": \"li1\", \"h\": \"The impacts of coastal processes can be seen using GIS comparing with historical maps or photographs, data from satellite imagery, and aerial photographs. GIS links locational data to other descriptive information to show patterns, relationships, and changes over time.\"}, {\"t\": \"h\", \"h\": \"<b>Management<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Coastal risks associated with environmental change can be addressed using:\"}, {\"t\": \"li2\", \"h\": \"hard engineering methods such as sea walls, groynes, and rock armour\"}, {\"t\": \"li2\", \"h\": \"soft engineering methods such as beach nourishment and dune restoration and planting.\"}, {\"t\": \"li1\", \"h\": \"Moving people away from the coast (managed retreat) allows natural coastal processes to continue, but relocation is complex and contested.\"}, {\"t\": \"li1\", \"h\": \"Decisions about managing environmental change at the coast are influenced by economic, social, and environmental factors.\"}, {\"t\": \"li1\", \"h\": \"There are multiple and sometimes competing perspectives (e.g. property owners, ratepayers, insurers, councils and central government, hapū and iwi) on managing coastal erosion and inundation.\"}], [{\"t\": \"h\", \"h\": \"<b>Global inequalities<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Inequality refers to the uneven distribution of wealth (assets), income (money earned), and access to services such as health and education between individuals, households, or countries.\"}, {\"t\": \"li1\", \"h\": \"The Human Development Index (HDI) measures the well-being of people in a country. GIS and remote sensing (e.g. night-time light emissions), show patterns of inequality.\"}, {\"t\": \"li1\", \"h\": \"There is a complex mix of factors that contribute to inequalities including:\"}, {\"t\": \"li2\", \"h\": \"unfavourable physical environments that impact health and productivity\"}, {\"t\": \"li2\", \"h\": \"people living on flood plains near rivers, on the coast or on steep and unstable land, without vegetation cover are more exposed to climate change and natural hazards (e.g. flooding, landslides), to heat stress, and to loss of crops and livelihoods. They are less able to protect themselves or to recover\"}, {\"t\": \"li2\", \"h\": \"impacts of colonialism\"}, {\"t\": \"li2\", \"h\": \"political instability, corruption, and conflict\"}, {\"t\": \"li2\", \"h\": \"differential levels of education and skills that restrict access to higher wage employment\"}, {\"t\": \"li2\", \"h\": \"technological differences\"}, {\"t\": \"li2\", \"h\": \"low-wage export manufacturing is argued by some to exploit workers and by others to be a route by which poorer countries have raised incomes.\"}, {\"t\": \"li1\", \"h\": \"Since about 1990, the proportion of people in extreme poverty has reduced as a result of growth in East and South Asia especially China and India. Extreme poverty is still heavily concentrated in sub-Saharan Africa and conflict affected nations.\"}, {\"t\": \"h\", \"h\": \"<b>Impacts of inequality<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Global inequalities impact health and well-being, access to services such as education, crime rates, social mobility, and future growth.\"}, {\"t\": \"li1\", \"h\": \"On a personal level, income inequality means living day-to-day without the ability to save and the constant stress of having enough for basic needs. It can have long-term effects through intergenerational disparities.\"}, {\"t\": \"h\", \"h\": \"<b>Mitigating inequality<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Aid can be short term (emergency) or long term (developmental).\"}, {\"t\": \"li1\", \"h\": \"Inequality can be mitigated by the actions of global (e.g. the UN Sustainable Development Goals, the World Bank) and regional (e.g. ASEAN) organisations, and of global charities (e.g. the Red Cross, World Vision).\"}, {\"t\": \"li1\", \"h\": \"Trade supports development, but tariffs and trade barriers can create challenges for countries seeking to build strong industries.\"}, {\"t\": \"li1\", \"h\": \"Fair trade pays higher prices for commodities produced in developing countries (e.g. cocoa, coffee) to create a fund for local farmers to spend on education, healthcare, and infrastructure.\"}]], \"p\": [[{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Ask questions that explore values, ethics, bias, and consequences, including different perspectives and short- and long-term impacts. For example:\"}, {\"t\": \"li2\", \"h\": \"Why is managed retreat such a complex issue?\"}, {\"t\": \"li2\", \"h\": \"What are the immediate and longer-term consequences of coastal erosion?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using annotated diagrams to show the relationship between human activity, greenhouse gases, global warming, sea-level change and storm intensity\"}, {\"t\": \"li1\", \"h\": \"Using diagrams to show how coastal processes operate to create distinctive landforms and how those processes are affected by extreme climate events.\"}, {\"t\": \"li1\", \"h\": \"Using quantitative data (e.g. rates of erosion and deposition, costs, and visual sources such as historical photographs, aerial photography, and satellite imagery) to show changes at the coast and the impacts of management.\"}, {\"t\": \"li1\", \"h\": \"Using Geographical Information Systems (GIS) to track changes in coastal environments.\"}, {\"t\": \"li1\", \"h\": \"Using reports and access websites to collect information on the ways coastal erosion is being managed.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining how managed retreat creates disagreement.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining how environments change through natural processes, and how people’s activities can be in conflict in coastal areas.\"}, {\"t\": \"li1\", \"h\": \"Explaining how a coastal management plan seeks to sustain both natural processes and human activity.\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social actions by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Identifying successful community responses to environmental challenges at the coast and the factors that have contributed to their success.\"}], [{\"t\": \"h\", \"h\": \"<b>Frame questions<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Ask questions that explore values, ethics, bias, and consequences, including different perspectives and short- and long-term impacts. Examples include: What have attempts to reduce global inequality achieved, and what accounts for the differences between them?\"}, {\"t\": \"h\", \"h\": \"<b>Process information by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Using visual tools (e.g. graphs, diagrams, maps, other tools) to show levels of income and wealth inequality across the globe.\"}, {\"t\": \"li1\", \"h\": \"Using quantitative data (e.g. HDI) to compare levels of human development between countries.\"}, {\"t\": \"li1\", \"h\": \"Using sources (e.g. personal accounts, websites such as Dollar Street, charity organisations, readings, video) to compile accounts of the daily lived experience of inequality.\"}, {\"t\": \"h\", \"h\": \"<b>Identify values and perspectives by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Comparing views among peers towards the purchase of fast fashion or fair-trade products, and the extent to which they are aware of the impacts of these different types of purchase.\"}, {\"t\": \"h\", \"h\": \"<b>Communicate findings and conceptual knowledge by:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Explaining the extent of global inequalities, interactions that lead to inequalities, the lived experience of inequality and interventions designed to help mitigate the effects of inequality and build sustainable communities.\"}, {\"t\": \"li1\", \"h\": \"Support explanations with case studies and visual evidence (e.g. diagrams, maps, graphs, tables) using appropriate geographic conventions).\"}, {\"t\": \"h\", \"h\": \"<b>Design, implement, and evaluate social actions by, for example:<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Creating an initiative to show how individuals can reduce inequality in communities (on a small scale).\"}, {\"t\": \"li1\", \"h\": \"Creating an initiative to support a local charity that is helping to mitigate the effects of income inequality.\"}]]}]}]}, \"Financial and Economic Activity\": {\"sections\": [{\"label\": null, \"idea\": {\"title\": \"Financial well-being in a complex and changing world\", \"desc\": \"Understanding the economic systems that shape our financial lives empowers people to make informed decisions and build long-term financial well-being.\"}, \"units\": [{\"kc\": [\"Knowledge of the economy and markets helps inform financial decision-making, planning, and managing risk.\", \"Budgeting and knowledge of investments, saving, and borrowing supports long-term financial sustainability.\"], \"pc\": [\"Define, explain, and apply concepts of <b>economy, markets, planning, and risk<\\/b>, and make connections between these concepts by exploring different contexts.\", \"Define, explain, and apply concepts of <b>budgeting, investment, saving, and borrowing,<\\/b> and make connections between these concepts by exploring different contexts.\"], \"k\": [[{\"t\": \"label\", \"h\": \"Financial systems\"}, {\"t\": \"h\", \"h\": \"<b>The economy and personal financial decision-making<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>The economy<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The economy is the system of how money, goods, and services move between people, businesses, and governments around the world.\"}, {\"t\": \"li1\", \"h\": \"The economy is made up of different sectors; primary (raw materials), secondary (manufacturing), and tertiary (services), with volunteering making an important non -financial contribution.\"}, {\"t\": \"li1\", \"h\": \"The Māori economy is closely linked to rangatiratanga (self - determination) and plays a growing role in New Zealand’s prosperity. Treaty settlements have enabled some iwi to build asset bases, which they have used for commercial and social investment. New Zealand relies heavily on exporting primary products such as dairy and providing tertiary services such as tourism. New Zealand also imports goods from other countries (e.g. cars from Japan).\"}, {\"t\": \"li1\", \"h\": \"Global and local prices are shaped by two primary economic forces:\"}, {\"t\": \"li2\", \"h\": \"supply – how much of something is available\"}, {\"t\": \"li2\", \"h\": \"demand – how much people want or need it.\"}, {\"t\": \"li1\", \"h\": \"Inflation is the general increase in prices over time, which means money buys less than it did before. Inflation affects the cost of living, savings, and income.\"}, {\"t\": \"h\", \"h\": \"<b>Global markets<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Global markets are the systems through which countries buy and sell goods, services, and resources with each other. The prices of everyday goods like petrol and food are often shaped by what is happening in global markets, not just locally.\"}, {\"t\": \"li1\", \"h\": \"People, groups, and businesses can invest in global markets, which means their savings and investments can be affected by what happens economically around the world.\"}, {\"t\": \"label\", \"h\": \"Decision-making\"}, {\"t\": \"h\", \"h\": \"<b>Informed financial decision-making<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Changes in the economy (e.g. growth and downturns) affect prices, wages, and employment, which in turn impact financial decisions.\"}, {\"t\": \"li1\", \"h\": \"Being involved in global markets means that events in other countries can affect the cost of living, jobs, and financial choices at home.\"}, {\"t\": \"li1\", \"h\": \"Informed decision-making for people and groups also involves understanding their own:\"}, {\"t\": \"li2\", \"h\": \"life experiences that influence feelings about money\"}, {\"t\": \"li2\", \"h\": \"values and priorities\"}, {\"t\": \"li2\", \"h\": \"responsibilities.\"}, {\"t\": \"li1\", \"h\": \"Recognising different perspectives, choices, and ways people use money helps support the financial well-being of society.\"}, {\"t\": \"label\", \"h\": \"Managing money\"}, {\"t\": \"h\", \"h\": \"<b>The benefits of financial planning<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Some benefits of financial planning include:\"}, {\"t\": \"li2\", \"h\": \"helping to build financial resilience, which is the ability to be flexible and respond to unexpected events.\"}, {\"t\": \"li2\", \"h\": \"enabling people to grow their money, which ensures they are making the right decisions for their finances and their future.\"}, {\"t\": \"li2\", \"h\": \"ensuring people meet their financial responsibilities such as bills and loan payments, taxes, and basic needs.\"}, {\"t\": \"li2\", \"h\": \"allowing people to also meet financial priorities such as giving or sharing money.\"}, {\"t\": \"li1\", \"h\": \"Effective financial planning should:\"}, {\"t\": \"li2\", \"h\": \"involve long- and short-term goal setting\"}, {\"t\": \"li2\", \"h\": \"take into account values, priorities, and responsibilities at different times\"}, {\"t\": \"li2\", \"h\": \"be reviewed and adjusted regularly to suit changing circumstances and priorities.\"}, {\"t\": \"li1\", \"h\": \"Budgets should:\"}, {\"t\": \"li2\", \"h\": \"account for the money an individual or group expects to receive (income) and how they expect to spend it (expenditure).\"}, {\"t\": \"li2\", \"h\": \"allow for flexibility to give an individual or group the best chance of success by using methods and tools that work for them.\"}, {\"t\": \"label\", \"h\": \"Being prepared\"}, {\"t\": \"h\", \"h\": \"<b>Managing financial risk<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Emergency fund<\\/b>\"}, {\"t\": \"li1\", \"h\": \"People and groups can put money aside for unexpected events (e.g. an emergency fund, shared whānau savings).\"}, {\"t\": \"li1\", \"h\": \"Local and national governments have disaster relief funds.\"}, {\"t\": \"h\", \"h\": \"<b>Insurance<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Insurance (e.g. travel, pet, house and contents, life) provides security against unexpected events.\"}, {\"t\": \"li1\", \"h\": \"People make choices about:\"}, {\"t\": \"li2\", \"h\": \"what to insure\"}, {\"t\": \"li2\", \"h\": \"whether to insure for full or partial value such as third-party or comprehensive insurance\"}, {\"t\": \"li2\", \"h\": \"reducing costs by agreeing to a higher excess, which is the amount you pay before insurance covers the remaining cost.\"}, {\"t\": \"h\", \"h\": \"<b>Accident Compensation Corporation (ACC)<\\/b>\"}, {\"t\": \"li1\", \"h\": \"New Zealand has a unique no-fault personal injury insurance scheme funded through compulsory levies (on workers, employers, motorists), government, and investment returns. It supports anyone who is injured in an accident in the country.\"}], [{\"t\": \"label\", \"h\": \"Financial systems\"}, {\"t\": \"h\", \"h\": \"<b>Government policy and long-term financial planning<\\/b>\"}, {\"t\": \"h\", \"h\": \"<b>Government budgets<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Governments – like people and groups – have budgets that determine how money is collected and spent across the country.\"}, {\"t\": \"li1\", \"h\": \"Governments also have income. This is generated from taxation, state-owned enterprises (government-owned businesses) and investment.\"}, {\"t\": \"li1\", \"h\": \"The democratic system allows people to vote for policies that represent their individual, local, and national economic priorities.\"}, {\"t\": \"h\", \"h\": \"<b>Tax<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Taxation is money the government collects through various means to fund public services (e.g. schools and hospitals), infrastructure (e.g. roads and public transport), social support (e.g. pensions and benefits), and to influence behaviour (e.g. taxes on tobacco, alcohol or pollution).\"}, {\"t\": \"li1\", \"h\": \"Tax is collected from income (e.g. PAYE) and spending (e.g. GST).\"}, {\"t\": \"li1\", \"h\": \"People pay different amounts in income tax based on what they earn.\"}, {\"t\": \"li1\", \"h\": \"Rates are local taxes paid by property owners and businesses, based on the value and use of their land and buildings.\"}, {\"t\": \"li1\", \"h\": \"Local councils use rates to fund services such as water, sewage, libraries, parks, and local infrastructure.\"}, {\"t\": \"li1\", \"h\": \"Evading tax is illegal and reduces funding available for public services.\"}, {\"t\": \"label\", \"h\": \"Decision-making\"}, {\"t\": \"h\", \"h\": \"<b>Government budgets and decision-making<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Local and national governments also have budgets and responsibilities, for example:\"}, {\"t\": \"li2\", \"h\": \"different political groups have different values and beliefs that frame their economic policies\"}, {\"t\": \"li2\", \"h\": \"government money is also limited, so government budget decisions involve trade-offs\"}, {\"t\": \"li2\", \"h\": \"governments aim to reduce inequality by redistributing wealth through taxation and providing benefits and allowances.\"}, {\"t\": \"h\", \"h\": \"<b>Employment<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Some types of employment contracts are casual, part-time, full-time, or fixed term, and they have different effects on entitlements, and income security.\"}, {\"t\": \"li1\", \"h\": \"Important clauses to understand relate to wages, hours, leave, flexible working, notice periods, and trial periods.\"}, {\"t\": \"h\", \"h\": \"<b>Saving, investing, and borrowing<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Saving helps keep money safe but is a slower way to grow your money.\"}, {\"t\": \"li1\", \"h\": \"Different savings options have different features such as fees, interest rates, and withdrawal rules.\"}, {\"t\": \"li1\", \"h\": \"There are different types of investments, and each has different risks and possible returns.\"}, {\"t\": \"li1\", \"h\": \"Investment decisions are influenced by:\"}, {\"t\": \"li2\", \"h\": \"values and beliefs (e.g. sustainable investment, local investment)\"}, {\"t\": \"li2\", \"h\": \"attitude towards risk\"}, {\"t\": \"li2\", \"h\": \"personal circumstances, including when people need their money back, how much they can invest, and whether they spread their money
