 across different investments.\"}, {\"t\": \"li1\", \"h\": \"When making the decision to take on debt, consider:\"}, {\"t\": \"li2\", \"h\": \"the reason for borrowing (e.g. an immediate purchase or investment in your future)\"}, {\"t\": \"li2\", \"h\": \"who is providing the credit (e.g. reliability and trustworthiness, rate of interest)\"}, {\"t\": \"li2\", \"h\": \"manageability and impact (e.g. how long it will take to pay off, whether you can afford to pay it off, or whether it will lead to further debt).\"}, {\"t\": \"li1\", \"h\": \"Credit cards and loans both charge interest, but compound interest means the amount owed can grow quickly over time, affecting financial burdens significantly.\"}, {\"t\": \"label\", \"h\": \"Managing money\"}, {\"t\": \"h\", \"h\": \"<b>Tools and advice for money management<\\/b>\"}, {\"t\": \"li1\", \"h\": \"Financial tools from reliable and impartial providers can help with managing your money and making financial decisions.\"}, {\"t\": \"li1\", \"h\": \"Financial advice can help with money management and assist informed financial decision-making around budgeting, saving, debt, borrowing, KiwiSaver, investing, insurance, and planning for the future.\"}, {\"t\": \"li1\", \"h\": \"People or groups can access financial advice from places such as financial advisers, mentors, coaches, banks, budgeting services, mortgage and insurance brokers, investment providers and advisers, and community organisations.\"}, {\"t\": \"label\", \"h\": \"Being prepared\"}, {\"t\": \"h\", \"h\": \"<b>Retirement<\\/b>\"}, {\"t\": \"li1\", \"h\": \"The purpose of pensions and retirement savings is to provide an income during retirement. Superannuation is a government payment made to people after they reach a certain age.\"}, {\"t\": \"li1\", \"h\": \"The sustainability of superannuation schemes is often debated, with governments considering options such as changing the age of eligibility, who qualifies, and how payments are adjusted over time.\"}, {\"t\ select();let ok=false;try{ok=document.execCommand(\"copy\")}catch(e){}ta.remove();done(ok);};\n  try{navigator.clipboard.writeText(txt).then(()=>done(true),fallback)}catch(e){fallback()}\n}\n/* info panels */\nconst infoSec=document.getElementById(\"info\");\nfunction showInfo(k){\n  document.querySelectorAll(\".ib\").forEach(b=>b.setAttribute(\"aria-expanded\",String(b.dataset.info===k)));\n  infoSec.hidden=!k;\n  infoSec.querySelectorAll(\"[data-panel]\").forEach(p=>p.hidden=p.dataset.panel!==k);\n}\ndocument.querySelector(\".infonav\").addEventListener(\"click\",e=>{const b=e.target.closest(\".ib\");if(b)showInfo(b.getAttribute(\"aria-expanded\")===\"true\"?null:b.dataset.info)});\ninfoSec.querySelector(\".ix\").addEventListener(\"click\",()=>showInfo(null));\n/* theme */\nlet theme=\"light\";try{theme=localStorage.getItem(\"ss710theme\")===\"dark\"?\"dark\":\"light\"}catch(e){}\nfunction applyTheme(){document.documentElement.dataset.theme=theme;\n  document.getElementById(\"theme\").textContent=theme===\"dark\"?\"☀ Light mode\":\"☾ Dark mode\";}\ndocument.getElementById(\"theme\").addEventListener(\"click\",()=>{theme=theme===\"dark\"?\"light\":\"dark\";try{localStorage.setItem(\"ss710theme\",theme)}catch(e){}applyTheme()});\napplyTheme();\ndocument.getElementById(\"closeall\").addEventListener(\"click\",()=>{openStrand=null;saveStrand();openSet.clear();saveOpen();renderDetail();});\ndocument.getElementById(\"out\").addEventListener(\"toggle\",e=>{const d=e.target; if(d.dataset.k){ d.open?openSet.add(d.dataset.k):openSet.delete(d.dataset.k); saveOpen(); }},true);\nlet qt;document.getElementById(\"q\").addEventListener(\"input\",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();renderDetail();},150)});\nfunction setYear(y){state.year=y;renderAll();}\n\n/* detail */\nfunction hl(html){\n  if(!state.q) return html;\n  const q=state.q.replace(/[.*+?^${}()|[\\]\\\\]/g,\"\\\\$&\");\n  const re=new RegExp(\"(\"+q+\")\",\"gi\");\n  return html.split(/(<[^>]+>)/).map(p=>p.startsWith(\"<\")?p:p.replace(re,\"<mark>$1<\/mark>\")).join(\"\");\n}\nfunction blocksHTML(bl){\n  if(!bl.length) return '<p class=\"empty\">No content listed for this column.<\/p>';\n  let out=\"\",lvl=0;\n  const close=to=>{while(lvl>to){out+= \"<\/li><\/ul>\";lvl--;}};\n  for(const b of bl){\n    const txt=hl(star(b.h));\n    if(b.t===\"li1\"||b.t===\"li2\"){\n      const want=b.t===\"li1\"?1:2;\n      if(lvl===want) out+=\"<\/li>\";\n      else if(lvl<want){ while(lvl<want){out+=\"<ul>\";lvl++; if(lvl<want) out+=\"<li>\";} }\n      else { close(want); out+=\"<\/li>\"; }\n      out+=\"<li>\"+txt;\n    } else {\n      close(0);\n      const plain=strip(b.h);\n      if(plain===\"OR\") out+='<div class=\"orsep\">OR<\/div>';\n      else if(b.t===\"label\") out+=`<div class=\"lab\">${txt}<\/div>`;\n      else if(b.t===\"h\") out+=`<div class=\"h\">${txt}<\/div>`;\n      else if(b.t===\"ref\") out+=`<div class=\"ref\">${txt}<\/div>`;\n      else out+=`<p class=\"p\">${txt}<\/p>`;\n    }\n  }\n  close(0);\n  return out;\n}\nlet COPY=[];\nfunction splitOptions(bl){\n  const idx=bl.findIndex(b=>b.t===\"h\"&&/Choose one case study/.test(strip(b.h)));\n  if(idx<0) return null;\n  const rest=bl.slice(idx+1), out=[]; let cur=null;\n  for(const b of rest){\n    if(strip(b.h)===\"OR\"){cur=null;continue;}\n    if(!cur){cur={name:strip(b.h),blocks:[]};out.push(cur);}\n    cur.blocks.push(b);\n  }\n  return out;\n}\nconst dec=s=>{const e=document.createElement(\"textarea\");e.innerHTML=s;return e.value};\nconst plain=h=>dec(strip(h)).replace(/\\*\\*/g,\"\").replace(/\\s+/g,\" \").trim();\nfunction toText(title,clabel,concept,bl){\n  const L=[title,\"\",clabel+\": \"+plain(concept)];\n  for(const b of bl){\n    const x=plain(b.h);\n    if(b.t===\"li1\") L.push(\"• \"+x);\n    else if(b.t===\"li2\") L.push(\"    ◦ \"+x);\n    else if(b.t===\"label\") L.push(\"\",x.toUpperCase());\n    else if(x===\"OR\") L.push(\"\",\"OR\",\"\");\n    else L.push(\"\",x);\n  }\n  return L.join(\"\\n\").replace(/\\n{3,}/g,\"\\n\\n\");\n}\nfunction copyBtn(i){return `<button class=\"copy\" type=\"button\" data-i=\"${i}\">Copy<\/button>`}\nfunction unitHTML(u,i,title){\n  const ki=COPY.push(toText(title+\" – Knowledge\",\"Conceptual knowledge\",u.kc[i],u.k[i]))-1;\n  const pi=COPY.push(toText(title+\" – Practices\",\"Think conceptually\",u.pc[i],u.p[i]))-1;\n  return `<div class=\"unit\">\n    <div class=\"col k\"><div class=\"colh\"><span class=\"dot\" style=\"background:var(--know-line)\"><\/span><span class=\"eyebrow\">Knowledge<\/span><\/div>\n      <div class=\"concept\"><span class=\"eyebrow\">Conceptual knowledge<\/span>${hl(star(u.kc[i]))}<\/div><div class=\"colt\">${copyBtn(ki)}<\/div>\n      <div class=\"content\">${blocksHTML(u.k[i])}<\/div><div class=\"colf\">${copyBtn(ki)}<\/div><\/div>\n    <div class=\"col p\"><div class=\"colh\"><span class=\"dot\" style=\"background:var(--prac-line)\"><\/span><span class=\"eyebrow\">Practices<\/span><\/div>\n      <div class=\"concept\"><span class=\"eyebrow\">Think conceptually<\/span>${hl(star(u.pc[i]))}<\/div><div class=\"colt\">${copyBtn(pi)}<\/div>\n      <div class=\"content\">${blocksHTML(u.p[i])}<\/div><div class=\"colf\">${copyBtn(pi)}<\/div><\/div>\n  <\/div>`;\n}\nfunction renderDetail(){\n  const qi=document.getElementById(\"q\"); qi.disabled=!state.year; qi.placeholder=state.year?\"Search this year…\":\"Choose a year to search\";\n  if(!state.year){COPY=[];document.getElementById(\"out\").innerHTML='<div class=\"pick\">Choose a year level above, or select a topic in the overview, to see its strands.<\/div>';document.getElementById(\"count\").textContent=\"\";return;}\n  const y=state.year,i=yi(y),ph=DATA[phaseOf(y)]; COPY=[];\n  const hits={};\n  if(state.q){ for(const s of STRANDS){const st=ph[s.key]; const h=st.sections.map(se=>hl(se.idea.desc)+se.units.map(u=>blocksHTML(u.k[i])+blocksHTML(u.p[i])+hl(u.kc[i])+hl(u.pc[i])).join(\"\")).join(\"\"); hits[s.key]=(h.match(/<mark>/g)||[]).length;}\n    if(!openStrand||!hits[openStrand]){const f=STRANDS.find(s=>hits[s.key]); if(f) openStrand=f.key;} }\n  let cards='<div class=\"cards\" role=\"group\" aria-label=\"Strands\">';\n  for(const s of STRANDS){\n    const idea=ph[s.key].sections[0].idea;\n    cards+=`<button type=\"button\" class=\"card\" data-s=\"${s.key}\" aria-expanded=\"${openStrand===s.key}\" aria-controls=\"panel\" style=\"--c:var(${s.c});--ct:var(${tint(s.c)})\">\n      <span class=\"chev\" aria-hidden=\"true\"><\/span><span class=\"eyebrow\">Year ${y}<\/span><h2>${s.key}<\/h2><span class=\"bi\"><b>${idea.title}<\/b><\/span>${state.q&&hits[s.key]?`<span class=\"cnt\">${hits[s.key]} match${hits[s.key]===1?\"\":\"es\"}<\/span>`:\"\"}<\/button>`;\n  }\n  cards+=\"<\/div>\";\n  let html=\"\";\n  const s=STRANDS.find(x=>x.key===openStrand);\n  if(s){\n    const st=ph[s.key], idea=st.sections[0].idea;\n    html+=`<div id=\"panel\" style=\"--c:var(${s.c});--ct:var(${tint(s.c)})\"><div class=\"ph\"><div class=\"shx\"><span class=\"eyebrow\">Year ${y} · Strand<\/span><h2>${s.key}<\/h2>\n      <span class=\"bigidea\"><b>${idea.title}.<\/b> ${hl(idea.desc)}<\/span><\/div><button type=\"button\" class=\"x\" aria-label=\"Close strand\">Close<\/button><\/div>`;\n    for(const se of st.sections){\n      const lab=se.label?HIST[se.label]:null;\n      const ttl=`Year ${y} ${s.key}`+(se.label?` – ${HIST[se.label]}`:\"\");\n      let body=se.units.length>1?\"\":se.units.map(u=>unitHTML(u,i,ttl)).join(\"\");\n      const opts=se.label===\"Global history\"?splitOptions(se.units[0].k[i]):null;\n      if(opts&&opts.length>1){\n        const u=se.units[0];\n        body=`<p class=\"optnote\">Choose one case study. The practices are the same for both options.<\/p>`+opts.map((op,oi)=>{\n          const ub=unitHTML({kc:u.kc,pc:u.pc,k:i?[[],op.blocks]:[op.blocks,[]],p:u.p},i,`${ttl} – ${op.name}`);\n          const ok=s.key+\"|opt\"+oi, oo=openSet.has(ok)||(state.q&&/<mark>/.test(blocksHTML(op.blocks)));\n          return `<details class=\"sub opt\" data-k=\"${ok}\" ${oo?\"open\":\"\"}><summary class=\"subh\"><span class=\"chev\" aria-hidden=\"true\"><\/span><span class=\"otag\">Option ${\"AB\"[oi]||oi+1}<\/span><span class=\"oname\">${op.name}<\/span><\/summary>${ub}<\/details>`;\n        }).join(\"\");\n      }\n      if(lab){\n        const k=s.key+\"|\"+se.label, o=openSet.has(k)||(state.q&&/<mark>/.test(body));\n        html+=`<details class=\"sub\" data-k=\"${k}\" id=\"s-${slug(s.key)}-${slug(se.label)}\" ${o?\"open\":\"\"}><summary class=\"subh\"><span class=\"chev\" aria-hidden=\"true\"><\/span><span class=\"tag\">${lab}<\/span><span class=\"hint\">${topics(se.units[0].k[i]).list.join(\" or \")}<\/span><\/summary>${body}<\/details>`;\n      } else if(se.units.length>1){\n        se.units.forEach((u,ui)=>{\n          const name=topics(u.k[i]).list[0]||(\"Topic \"+(ui+1)), k=s.key+\"|u\"+ui, ub=unitHTML(u,i,`${ttl} – ${name}`);\n          const o=openSet.has(k)||(state.q&&/<mark>/.test(ub));\n          html+=`<details class=\"sub\" data-k=\"${k}\" id=\"s-${slug(s.key)}-u${ui}\" ${o?\"open\":\"\"}><summary class=\"subh\"><span class=\"chev\" aria-hidden=\"true\"><\/span><span class=\"tag\">${name}<\/span><span class=\"hint\">${strip(u.kc[i])}<\/span><\/summary>${ub}<\/details>`;\n        });\n      } else html+=`<div class=\"sub\">${body}<\/div>`;\n    }\n    html+=\"<\/div>\";\n  } else html+=`<div class=\"pick\">Choose a strand above to see its knowledge and practices for Year ${y}.<\/div>`;\n  const out=document.getElementById(\"out\");\n  out.innerHTML=cards+html;\n  const n=state.q?Object.values(hits).reduce((a,b)=>a+b,0):null;\n  document.getElementById(\"count\").textContent=n===null?\"\":`${n} match${n===1?\"\":\"es\"}`;\n}\nfunction renderAll(){renderOverview();renderControls();renderDetail();}\nrenderAll();\n<\/script>\n\n<script>\n(function(){\n  var KEY=\"whs-ss-theme\", root=document.documentElement;\n  function go(site){ if(location.hash.replace(\ \/button><\/div><button id=\"theme\" type=\"button\" aria-label=\"Change colour theme\"><\/button><\/div>\n  <\/div>\n<\/div><\/header>\n\n<section id=\"info\" class=\"info\" hidden>\n  <div class=\"infin\">\n    <button type=\"button\" class=\"ix\" aria-label=\"Close information\">Close<\/button>\n    <div data-panel=\"purpose\">\n      <h3>Purpose of the senior subjects<\/h3>\n      <p class=\"wk\"><i>Unuhia te rito o te harakeke kei whea te kōmako e kō? Whakatairangitia – rere ki uta, rere ki tai; Ui mai koe ki ahau he aha te mea nui o te ao, Māku e kī atu he tangata, he tangata, he tangata!<\/i><br>Remove the heart of the flax bush and where will the kōmako sing? Proclaim it to the land, proclaim it to the sea; ask me, ‘What is the greatest thing in the world?’ I will reply, ‘It is people, people, people!’<span>Nā, Meri Ngāroto, Te Aupōuri (1830s). Every senior subject document opens with this whakataukī.<\/span><\/p>\n      <p>Each subject has its own purpose statement. The summary below shows where each one leads. Open a subject and choose <b>Purpose statement<\/b> for the full text.<\/p>\n      <dl class=\"sgrid\" id=\"purposegrid\"><\/dl>\n    <\/div>\n    <div data-panel=\"subjects\">\n      <h3>Subjects and strands<\/h3>\n      <p>Year 11 Business and Economics leads into Business Studies in Years 12–13. Geography runs across all three years. Classical Studies and Psychology start in Year 12. Every subject also has a Disciplinary Writing strand.<\/p>\n      <dl class=\"sgrid\" id=\"subjectgrid\"><\/dl>\n    <\/div>\n    <div data-panel=\"kp\">\n      <h3>Knowledge and practices<\/h3>\n      <p>Each teaching sequence is organised into strands and elements (some subjects also use sub-elements), then split into two columns.<\/p>\n      <div class=\"pgrid\">\n        <div><h4>Knowledge<\/h4><p>The facts, concepts, principles, and theories to teach. This is the declarative knowledge.<\/p><\/div>\n        <div><h4>Practices<\/h4><p>The skills, strategies, and applications to teach. These are the disciplinary skills and procedural knowledge that underpin ways of working in the subject.<\/p><\/div>\n      <\/div>\n      <ul>\n        <li>The teaching of all knowledge and practices is compulsory. Schools decide how learning is organised across the year, including combining content from several elements and strands.<\/li>\n        <li>Knowledge and practice statements within an element are related, but you can pair statements from across the sequence or treat elements as separate units of work.<\/li>\n        <li>Anything in brackets marked <b class=\"eg\">e.g.<\/b> is guidance only. You can substitute contexts and examples that better reflect local environments, iwi and hapū connections, student interests, and teacher expertise.<\/li>\n        <li><b>Disciplinary Writing<\/b> sets out the subject-specific literacy to teach. Its knowledge is the same at every year level and its practices are sequenced by year. It is most effective when integrated across the programme.<\/li>\n        <li><b>Artificial intelligence<\/b> can support learning, research, inquiry, and creative processes. It should enhance, not replace, critical or creative thinking, source evaluation, subject knowledge, or students’ own analysis and decision-making.<\/li>\n      <\/ul>\n      <p class=\"small\">Each subject’s own wording is under <b>Teaching sequence guidance<\/b> when you open the subject.<\/p>\n    <\/div>\n    <div data-panel=\"contexts\">\n      <h3>Contexts and case studies<\/h3>\n      <p>Most subjects say which contexts or case studies the knowledge and practices are taught through. Open a subject to see the requirement for the year you are planning.<\/p>\n      <div class=\"pgrid\">\n        <div><h4>Geography<\/h4><p>Set case studies for each element in each year, such as two tropical storm case studies in Year 11 with one from the Pacific. Year 12 includes a teacher-guided investigation and Year 13 a complete investigation in a single context.<\/p><\/div>\n        <div><h4>Classical Studies<\/h4><p>Teachers choose one context from each column: literary, artistic and architectural, then religion and mythology and social organisation in Year 12, or politics and ancient history in Year 13.<\/p><\/div>\n        <div><h4>Psychology<\/h4><p>Apart from Research Methodologies, each strand is applied to Social, Clinical and Educational Psychology in Year 12, and Forensic, Health and Developmental Psychology in Year 13.<\/p><\/div>\n        <div><h4>Business Studies<\/h4><p>Contexts include teacher-provided case studies and student-generated ideas. A supporting document suggests agribusiness case studies for each strand, shown inside each strand here.<\/p><\/div>\n        <div><h4>Business and Economics<\/h4><p>The practices in two strands may be taught through teacher-provided case studies or student-generated ideas, with an emphasis on familiar and local contexts.<\/p><\/div>\n      <\/div>\n    <\/div>\n    <div data-panel=\"dates\">\n      <h3>Start dates and status<\/h3>\n      <p>These are the October 2026 teaching-content documents. Progress and assessment information is still in development. Once that is finished, each subject is proposed to be made a National Curriculum Statement and published in the New Zealand Gazette, and the official versions will replace these documents.<\/p>\n      <div class=\"tlwrap\"><table class=\"tl\">\n        <tr><th scope=\"col\">Year level<\/th><th scope=\"col\">Proposed required from<\/th><th scope=\"col\">Subjects here<\/th><\/tr>\n        <tr><th scope=\"row\">Year 11<\/th><td>1 January 2028<\/td><td>Business and Economics, Geography<\/td><\/tr>\n        <tr><th scope=\"row\">Year 12<\/th><td>1 January 2029<\/td><td>Business Studies, Classical Studies, Geography, Psychology<\/td><\/tr>\n        <tr><th scope=\"row\">Year 13<\/th><td>1 January 2030<\/td><td>Business Studies, Classical Studies, Geography, Psychology<\/td><\/tr>\n      <\/table><\/div>\n      <p class=\"small\">The dates apply to schools that offer the subject.<\/p>\n    <\/div>\n    <div data-panel=\"local\">\n      <h3>Local context<\/h3>\n      <p>The documents ask teachers to apply knowledge to familiar and local contexts, and they leave room to choose your own examples.<\/p>\n      <ul>\n        <li>Anything marked <b class=\"eg\">e.g.<\/b> is an illustration, not a requirement. As long as the intended knowledge and practices are met, you can use examples from Waiheke and the Hauraki Gulf instead.<\/li>\n        <li><b>Geography<\/b> names several local openings: a Year 12 case study of a local urban area, investigation examples set in the school grounds or around a local river or stormwater system, and Year 13 investigation contexts such as beach processes, coastal vulnerability and climate change in the local area.<\/li>\n        <li><b>Business and Economics<\/b> emphasises familiar and local contexts. <b>Business Studies<\/b> asks for authentic local, national, and global contexts, and its references to businesses include kaupapa Māori businesses, social enterprises and not-for-profits.<\/li>\n        <li>Geography’s supporting guidance notes that engagement with local hapū and iwi may support the inclusion of local knowledge, histories, values, and perspectives.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n\n<div class=\"wrap\">\n\n<section class=\"block\" id=\"overview\">\n  <div class=\"head\"><h2>Overview<\/h2><span class=\"hint\">Select a subject, a year or a strand to open it below.<\/span><\/div>\n  <div class=\"ovwrap\"><table class=\"ov\" id=\"ovt\"><\/table><\/div>\n<\/section>\n\n<section class=\"block\" id=\"detail\">\n  <div class=\"controls\">\n    <div class=\"seg\" id=\"years\" role=\"group\" aria-label=\"Year level\"><\/div>\n    <div class=\"seg\" role=\"group\" aria-label=\"Close open sections\"><button id=\"closeall\" type=\"button\">Close all<\/button><\/div>\n    <div class=\"tools\">\n      <input type=\"search\" id=\"q\" placeholder=\"Search this year…\" aria-label=\"Search this year\">\n      <span id=\"count\" role=\"status\"><\/span>\n    <\/div>\n  <\/div>\n  <div id=\"out\"><\/div>\n<\/section>\n\n<footer>\n  <p>Content is taken from the New Zealand Curriculum teaching-content documents dated October 2026: Business and Economics (Year 11), Business Studies (Years 12–13) and its agribusiness supporting document, Classical Studies (Years 12–13), Geography (Years 11–13) and Psychology (Years 12–13).<\/p>\n  <p>Knowledge and practice statements use the documents’ own wording. The summaries behind the buttons in the header are written for this dashboard.<\/p>\n<\/footer>\n<\/div>\n\n<script>\nconst DATA = {\"subjects\":[{\"key\":\"bec\",\"name\":\"Business and Economics\",\"short\":\"Business & Economics\",\"years\":[11],\"c\":\"--bec\",\"source\":\"Business and Economics, Year 11 (October 2026)\",\"starts\":{\"11\":2028},\"lead\":\"In Business and Economics, students are taught how businesses, consumers, and governments interact in the economy. Students are taught how to apply financial and economic reasoning and use economic models to explain decision-making in context. Students are also taught how internal operations and external influences affect business operations, and how economic theory connects to practical business concepts, such as marketing, people management, business planning, and operations management.\",\"paras\":[\"Students are taught core business and economic concepts, models, and systems, including scarcity, opportunity cost, resource allocation, business purpose, business processes, and decision-making. They use this disciplinary knowledge to understand, explain, and interpret economic and business activity within local, national, and global contexts.\",\"Business and Economics provides students with the knowledge and practices to analyse economic and business issues, situations, data, and systems in both contemporary and theoretical contexts. Students apply disciplinary concepts, models, frameworks, and evidence to investigate patterns, relationships, influences, and impacts, using economic and business reasoning to explain outcomes, evaluate decisions, and explore implications.\",\"As students progress through Year 11, they develop the ability to evaluate information, synthesise perspectives, and communicate well-reasoned conclusions using disciplinary language, concepts, and evidence in written form. This enables them to justify decisions, develop recommendations, and participate thoughtfully in economic, business, civic, and community contexts while considering ethical, social, cultural, environmental, and long-term implications.\"],\"pathway\":\"Year 11 Business and Economics leads to further study in Business Studies, Economics, and other related subjects in Years 12 and 13.\",\"guidance\":[{\"title\":\"Knowledge and practices\",\"blocks\":[{\"t\":\"p\",\"h\":\"The Business and Economics teaching sequence is organised into strands, elements, and sub-elements, and then further structured into knowledge and practices. The knowledge column sets out the declarative knowledge to be taught, while the practice column sets out the disciplinary skills, applications, and procedural knowledge. The practices underpin ways of working in Business and Economics and are specific to the discipline.\"},{\"t\":\"p\",\"h\":\"The teaching of all knowledge and practices is compulsory. However, schools can determine how learning is organised across the year, including integrating content from multiple elements and strands where this supports coherence and depth. Examples within the teaching sequence in brackets signified with ‘e.g.’ are provided as guidance only; as long as the intended knowledge and practices are met, schools and teachers may substitute contexts and examples that better reflect local environments, iwi and hapū connections, student interests, and teacher expertise.\"},{\"t\":\"p\",\"h\":\"Disciplinary writing is included in the teaching sequence to set out what subject-specific literacy is to be taught. It is organised into a knowledge component that is consistent across all year levels and a practice component sequenced across years.\"}]},{\"title\":\"Responsible use of artificial intelligence\",\"blocks\":[{\"t\":\"p\",\"h\":\"Artificial intelligence (AI) can support learning, research, inquiry, and creative processes, but it may also introduce bias, inaccuracies, ethical concerns, and issues relating to ownership. AI should enhance, not replace, critical or creative thinking, source evaluation, subject knowledge, or students’ own analysis and decision-making. Responsible AI use emphasises the importance of exercising sound judgement, drawing on credible sources, verifying information, being transparent about AI use, considering diverse perspectives, and developing independent thinking.\"}]},{\"title\":\"Designing a programme\",\"blocks\":[{\"t\":\"p\",\"h\":\"The teaching sequence is designed to be taught as a non-linear programme. The knowledge and practice statements within each element or sub-element are related, but teachers may select complementary statements from across the sequence or treat sub-elements as discrete units of work. Disciplinary writing is most effectively taught when integrated across the teaching programme.\"},{\"t\":\"p\",\"h\":\"The practices in the Business and the Business Environment and Enterprise, and Entrepreneurship and Innovation strands may be taught through either teacher-provided case studies or student-generated ideas. Student-generated ideas may be developed for real-world sale or explored as innovative concepts that are not taken to market. Across all strands, the teaching sequence emphasises applying knowledge to familiar and local contexts, using models as tools to support understanding rather than exact representations of reality.\"}]}],\"contexts\":{},\"support\":[{\"title\":\"Agribusiness case studies for Year 11 (from the Business Studies supporting document)\",\"blocks\":[{\"t\":\"p\",\"h\":\"For students to be taught about certain areas of agribusiness that increase in complexity each year, the following case study progression across year levels could be considered:\"},{\"t\":\"label\",\"h\":\"Year 11\"},{\"t\":\"h\",\"h\":\"<b>Strand: Business and the Business Environment<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Fonterra<\\/b>\"},{\"t\":\"li1\",\"h\":\"cooperative ownership structure\"},{\"t\":\"li1\",\"h\":\"global dairy markets\"},{\"t\":\"li1\",\"h\":\"stakeholder relationships\"},{\"t\":\"li1\",\"h\":\"sustainability initiatives\"},{\"t\":\"li1\",\"h\":\"business responses to changing consumer demands.\"},{\"t\":\"h\",\"h\":\"<b>Zespri<\\/b>\"},{\"t\":\"li1\",\"h\":\"international markets\"},{\"t\":\"li1\",\"h\":\"biosecurity risks\"},{\"t\":\"li1\",\"h\":\"consumer trends\"},{\"t\":\"li1\",\"h\":\"business growth and adaptation.\"},{\"t\":\"h\",\"h\":\"<b>Local dairy, sheep, and beef, or horticultural business<\\/b>\"},{\"t\":\"li1\",\"h\":\"business structure\"},{\"t\":\"li1\",\"h\":\"stakeholders\"},{\"t\":\"li1\",\"h\":\"business purpose\"},{\"t\":\"li1\",\"h\":\"environmental and market influences.\"},{\"t\":\"h\",\"h\":\"<b>Strand: Enterprise, Entrepreneurship, and Innovation<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Robotics Plus<\\/b>\"},{\"t\":\"li1\",\"h\":\"technology innovation\"},{\"t\":\"li1\",\"h\":\"product development\"},{\"t\":\"li1\",\"h\":\"international growth\"},{\"t\":\"li1\",\"h\":\"commercialisation of research.\"},{\"t\":\"h\",\"h\":\"<b>Allflex<\\/b>\"},{\"t\":\"li1\",\"h\":\"agritech innovation\"},{\"t\":\"li1\",\"h\":\"entrepreneurship\"},{\"t\":\"li1\",\"h\":\"startup growth\"},{\"t\":\"li1\",\"h\":\"solving labour and livestock management challenges.\"},{\"t\":\"h\",\"h\":\"<b>Local agribusiness entrepreneur<\\/b>\"},{\"t\":\"li1\",\"h\":\"farm diversification\"},{\"t\":\"li1\",\"h\":\"direct-to-consumer marketing\"},{\"t\":\"li1\",\"h\":\"agritourism ventures\"},{\"t\":\"li1\",\"h\":\"niche food production.\"}]}],\"strands\":[{\"name\":\"Scarcity and the Market\",\"focus\":\"The economic concepts and models used to understand how individuals, households, businesses, organisations, and governments make decisions about allocating scarce resources, and how demand, supply, and market forces influence prices, production, and consumption.\",\"inYear\":{\"11\":\"Students are taught that scarcity requires people, businesses, and governments to make choices about the use of limited resources and this results in opportunity cost, trade-offs, and cost-benefit analysis. Using economic models to investigate demand, supply, and market equilibrium, and the factors that influence consumer and producer behaviour.\"},\"years\":{\"11\":[{\"name\":\"Scarcity\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Scarcity<\\/b>\"},{\"t\":\"li1\",\"h\":\"Scarcity is an economic problem that arises because resources are limited while wants and needs are unlimited. This affects individuals, households, businesses, organisations, and governments, all of which must make choices about how to allocate scarce resources. Resources, or means, may include time, skills, money, labour, land, and other productive resources.\"},{\"t\":\"li1\",\"h\":\"Opportunity cost is the value of the next best alternative that is given up when a choice is made.\"},{\"t\":\"li1\",\"h\":\"The choices made by individuals, businesses, organisations, and governments are influenced by their goals, values, and priorities which shape how they evaluate options and outcomes.\"},{\"t\":\"li1\",\"h\":\"Every economic decision involves trade-offs. Recognising opportunity cost helps decision-makers understand what is given up when choosing one option over another and supports more informed allocation of scarce resources.\"},{\"t\":\"li1\",\"h\":\"Cost-benefit analysis is the process of comparing the costs and benefits of a decision or project to determine whether the benefits outweigh the costs and make the option worthwhile.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Scarcity<\\/b>\"},{\"t\":\"li1\",\"h\":\"Analyse how scarcity influences economic choices and resource allocation.\"},{\"t\":\"li1\",\"h\":\"Evaluate trade-offs and opportunity costs associated with economic decision-making.\"},{\"t\":\"li1\",\"h\":\"Assess alternative uses of scarce resources to inform economic decision-making.\"}]},{\"name\":\"Modelling markets\",\"k\":[{\"t\":\"li1\",\"h\":\"Economic models are simplified representations of real-world behaviour used by economists to explain and predict how economic systems operate.\"},{\"t\":\"li1\",\"h\":\"The demand and supply models are economic models used to represent how buyers and sellers interact in a market.\"},{\"t\":\"li1\",\"h\":\"Ceteris paribus is a Latin term meaning ‘all other things being equal’. It is used to isolate the relationship between two variables by holding all other factors constant.\"},{\"t\":\"li1\",\"h\":\"Vice versa is a Latin term meaning ‘the reverse is also true’. It is used when the relationship between two variables works in both directions.\"},{\"t\":\"h\",\"h\":\"<b>Demand<\\/b>\"},{\"t\":\"li1\",\"h\":\"Demand is the quantity a consumer is able and willing to buy at each price. Demand can be represented in a schedule and a curve.\"},{\"t\":\"li1\",\"h\":\"The law of demand states that as the price of a product falls, the quantity demanded increases, assuming all other factors remain constant (ceteris paribus), and the reverse is also true (vice versa).\"},{\"t\":\"li1\",\"h\":\"A change in price causes a movement along the demand curve, resulting in a change in the quantity demanded (ceteris paribus).\"},{\"t\":\"li1\",\"h\":\"A change in any non-price factors (e.g. tastes and preferences, income, prices of substitutes, prices of complements, season) causes a shift in the demand curve. This is a change in demand at each and every price.\"},{\"t\":\"li1\",\"h\":\"Substitute goods are products that can replace each other in consumption, and an increase in the price of one such good leads to an increase in demand for the other (ceteris paribus).\"},{\"t\":\"li1\",\"h\":\"Complementary goods are products that are consumed together. An increase in the price of one complementary good leads to a decrease in demand for the other (ceteris paribus).\"},{\"t\":\"li1\",\"h\":\"Normal goods are goods for which demand increases as consumer income increases and decreases when income decreases.\"},{\"t\":\"li1\",\"h\":\"Inferior goods are goods for which demand decreases as consumer income increases as consumers switch to more desirable alternatives.\"},{\"t\":\"li1\",\"h\":\"Luxury goods are goods for which demand increases more than proportionately as consumer income increases.\"},{\"t\":\"li1\",\"h\":\"Market demand is the total quantity of a good or service that all consumers in a market are willing and able to purchase at each price.\"},{\"t\":\"h\",\"h\":\"<b>Supply<\\/b>\"},{\"t\":\"li1\",\"h\":\"Supply is the quantity a producer is willing and able to supply at each price. Supply can be represented in a schedule and a curve.\"},{\"t\":\"li1\",\"h\":\"The law of supply states that as the price of a product rises quantity supplied increases (ceteris paribus and vice versa).\"},{\"t\":\"li1\",\"h\":\"A change in prices causes a movement along the supply curve, resulting in a change in quantity supplied (ceteris paribus).\"},{\"t\":\"li1\",\"h\":\"A change in other factors (taxes, subsidies, cost of production, technology) causes a shift in the supply curve, which is a change in supply at each and every price.\"},{\"t\":\"li1\",\"h\":\"Market supply is the total quantity of a good or service that all producers are willing and able to supply at each.\"},{\"t\":\"h\",\"h\":\"<b>Market equilibrium<\\/b>\"},{\"t\":\"li1\",\"h\":\"Market equilibrium occurs at the price and quantity where market demand and market supply intersect (quantity demanded equals quantity supplied).\"},{\"t\":\"li1\",\"h\":\"When the market price is above equilibrium, a surplus occurs.\"},{\"t\":\"li1\",\"h\":\"When market price is below equilibrium, a shortage occurs.\"},{\"t\":\"li1\",\"h\":\"Market equilibrium is dynamic rather than fixed as changing economic conditions continuously influence price and quantity.\"},{\"t\":\"li1\",\"h\":\"Market forces cause prices to rise or fall in response to surpluses and shortages, returning the market to equilibrium through the price mechanism.\"},{\"t\":\"li1\",\"h\":\"Demand curve shifts due to changes in tastes and preferences, income, prices of substitutes, prices of complements, and government policy (e.g. taxes and subsidies) disrupt equilibrium.\"},{\"t\":\"li1\",\"h\":\"Supply curve shifts due to changes in costs of production, productivity, and government policy (e.g. taxes, subsidies, regulations) disrupt equilibrium.\"},{\"t\":\"li1\",\"h\":\"When demand or supply changes price adjustments continue until a new equilibrium price and quantity are established.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Demand<\\/b>\"},{\"t\":\"li1\",\"h\":\"Construct and interpret demand curve models to examine consumer demand.\"},{\"t\":\"li1\",\"h\":\"Analyse changes in demand and their causes.\"},{\"t\":\"li1\",\"h\":\"Examine how price and non-price factors influence consumer demand.\"},{\"t\":\"li1\",\"h\":\"Analyse how substitute and complementary goods influence consumer purchasing and demand.\"},{\"t\":\"li1\",\"h\":\"Classify goods as normal or inferior based on how demand responds to changes in consumer income.\"},{\"t\":\"li1\",\"h\":\"Compare how demand for different goods reflects changes in consumer income.\"},{\"t\":\"h\",\"h\":\"<b>Supply<\\/b>\"},{\"t\":\"li1\",\"h\":\"Construct and interpret supply curve models to examine producer supply.\"},{\"t\":\"li1\",\"h\":\"Analyse changes in supply and their causes.\"},{\"t\":\"li1\",\"h\":\"Examine how related goods and services influence producer supply decisions and market supply.\"},{\"t\":\"li1\",\"h\":\"Compare individual supply curves and market supply curves to explain how producer behaviour influences total market supply.\"},{\"t\":\"h\",\"h\":\"<b>Market equilibrium<\\/b>\"},{\"t\":\"li1\",\"h\":\"Interpret demand and supply models to analyse equilibrium price and equilibrium quantity.\"},{\"t\":\"li1\",\"h\":\"Analyse the effects of changes in demand and supply on market equilibrium using graphs and market models.\"},{\"t\":\"li1\",\"h\":\"Evaluate the causes and effects of surpluses and shortages in markets.\"},{\"t\":\"li1\",\"h\":\"Explain the sequence of price and quantity adjustments through which a market surplus is eliminated and market equilibrium is restored.\"},{\"t\":\"li1\",\"h\":\"Apply demand, supply, and equilibrium analysis to interpret real-world market events.\"}]}]}},{\"name\":\"Allocation of Resources and the Circular Flow\",\"focus\":\"The systems and models used to understand how resources are allocated within an economy, the interdependence of economic participants, and the roles of markets, governments, communities, and other factors that influence economic activity, resource distribution, and economic growth.\",\"inYear\":{\"11\":\"Students are taught to examine how resources are allocated through market, government, community-based, and kaupapa Māori approaches within New Zealand’s mixed economy. They use the circular flow model to explore the interdependence of households, businesses, government, financial institutions, and the overseas sector, and investigate how injections, withdrawals, and fiscal policy influence economic activity and growth.\"},\"years\":{\"11\":[{\"name\":\"Allocation of resources\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Allocation of resources<\\/b>\"},{\"t\":\"li1\",\"h\":\"Resources in an economy can be allocated through systems that determine what goods and services are provided, how they are produced, and for whom they are distributed.\"},{\"t\":\"li1\",\"h\":\"Market systems allocate resources through the interaction of consumers and producers, with prices determined by demand and supply signalling what goods and services are produced, how they are produced, and for whom they are produced.\"},{\"t\":\"li1\",\"h\":\"The effective operation of market systems depends on clearly defined property rights and the ability to enforce those rights, allowing individuals and firms to own, use, and exchange resources.\"},{\"t\":\"li1\",\"h\":\"Government provision allocates resources through decisions made by the government, determining what goods and services are provided, how they are produced, and for whom they are distributed through policies, rules, and funding rather than prices. These include the provision of public services such as health and education, income support and welfare, infrastructure, and public goods.\"},{\"t\":\"li1\",\"h\":\"New Zealand is a mixed economy with both market and government provision.\"},{\"t\":\"li1\",\"h\":\"The Treaty of Waitangi helps govern how natural and economic resources are allocated and managed in New Zealand. Decisions about resources such as land, water, fisheries, and other taonga may involve the Crown, local authorities, iwi, hapū, businesses, and communities, whose rights, interests, and responsibilities are considered within legal and policy frameworks, particularly where groups have differing interests in those resources.\"},{\"t\":\"li1\",\"h\":\"Community businesses such as kaupapa Māori businesses or community gardens may allocate resources according to collective well-being, cultural values, and kaitiakitanga, recognising relationships between people, communities, and the environment.\"},{\"t\":\"li1\",\"h\":\"Community-based approaches allocate resources through shared decision-making, determining what goods and services are provided, how they are produced, and for whom they are distributed based on collective needs, values, and priorities.\"},{\"t\":\"li1\",\"h\":\"Charities and clubs are types of non-profit organisations, with charities focused on public benefit and clubs focused on the interests of their members.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Allocation of resources<\\/b>\"},{\"t\":\"li1\",\"h\":\"Compare how market, government, and community-based systems allocate resources.\"},{\"t\":\"li1\",\"h\":\"Examine how government decisions, policies, and spending influence resource allocation and the provision of goods and services.\"},{\"t\":\"li1\",\"h\":\"Examine how Treaty principles influence government resource allocation decisions.\"},{\"t\":\"li1\",\"h\":\"Investigate how te ao Māori and community-based approaches allocate resources.\"}]},{\"name\":\"The circular flow\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Circular flow<\\/b>\"},{\"t\":\"li1\",\"h\":\"Interdependence means to rely on one another. All members of an economy have interdependent relationships.\"},{\"t\":\"li1\",\"h\":\"Producers can be grouped into three sectors based on what they produce. The primary sector involves extracting or harvesting natural resources directly from the environment. The secondary sector uses raw materials to manufacture or build products. The tertiary sector provides services (e.g. finance and marketing).\"},{\"t\":\"li1\",\"h\":\"The circular flow model is used to illustrate the relationships between, and the interdependence of, the five sectors of the economy: households (consumers), businesses (firms/producers), the government, financial institutions, and the overseas sector.\"},{\"t\":\"li1\",\"h\":\"The circular flow model shows how money moves in an economy, and how economic events impact on the money flows (payments) and real flows (goods, services and resources provided) between the sectors:\"},{\"t\":\"li2\",\"h\":\"households provide labour (real flow)\"},{\"t\":\"li2\",\"h\":\"businesses pay wages (money flow)\"},{\"t\":\"li2\",\"h\":\"businesses provide goods and services (real flow)\"},{\"t\":\"li2\",\"h\":\"households spend money (money flow).\"},{\"t\":\"li1\",\"h\":\"Injections are flows of money into the circular flow that are outside of household and business spending. These include government spending (G), investment (I), and export receipts (X). Withdrawals are flows out of the circular flow, namely through taxation (T), savings (S), and import payments (M).\"},{\"t\":\"li1\",\"h\":\"Economic growth is an increase in the real value of goods and services produced, usually measured by growth in gross domestic product (GDP). It leads to an expansion of income, output, and spending in the circular flow.\"},{\"t\":\"li1\",\"h\":\"Sustained economic growth occurs when productive capacity increases through improvements in the quantity and quality of resources and higher productivity, allowing the economy to produce more goods and services over time.\"},{\"t\":\"li1\",\"h\":\"Government economic policies can influence the circular flow and growth in an economy. Fiscal policy refers to government decisions about its spending (injections) and taxation (withdrawals).\"},{\"t\":\"li1\",\"h\":\"The difference between government spending and revenue is the budget balance, which can be a surplus or a deficit. A deficit occurs when spending is greater than revenue and is usually financed by borrowing, which must be repaid in the future.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Interpret five-sector circular flow models to examine interactions between different sectors of the economy.\"},{\"t\":\"li1\",\"h\":\"Examine the roles and interdependence of economic sectors within the circular flow model.\"},{\"t\":\"li1\",\"h\":\"Analyse how injections and withdrawals affect the circular flow of income.\"},{\"t\":\"li1\",\"h\":\"Predict the effects of changes in injections and withdrawals on economic flows and on different sectors of the economy.\"}]}]}},{\"name\":\"Business and the Business Environment\",\"focus\":\"The purpose, structure, and operation of businesses, including how businesses create value, make decisions, respond to influences, and balance the interests of stakeholders within changing economic, social, and cultural contexts.\",\"inYear\":{\"11\":\"Students are taught why businesses exist, the purposes that shape business activity, and different ways business success can be measured. They investigate business legal structures, stakeholder relationships, and the internal and external factors that influence decision-making. Students use frameworks to analyse to evaluate business situations and explore how sustainability, and stakeholder interests influence business decisions and outcomes.\"},\"years\":{\"11\":[{\"name\":\"Business and types of business\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Defining business<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses exist to meet the needs and wants of customers and communities by providing goods and services that create value, with the intention of generating income and in many cases profit, though success may also be measured through social impact, lifestyle, or collective well-being.\"},{\"t\":\"li1\",\"h\":\"Business activity involves uncertainty and risk, as decisions are made without complete information and resources committed with no guaranteed outcomes.\"},{\"t\":\"li1\",\"h\":\"Businesses interact with a range of stakeholders, including owners, employees, customers, suppliers, and the wider community. Stakeholder interests and expectations influence how a business operates.\"},{\"t\":\"h\",\"h\":\"<b>Purpose and pūtake<\\/b>\"},{\"t\":\"li1\",\"h\":\"Purpose describes what a business aims to achieve and the value it creates for others. Pūtake reflects the deeper foundation of why a business exists – grounded in its values, identity, and relationships – shaping its direction and decision-making. While related, purpose expresses the what and pūtake the why.\"},{\"t\":\"li1\",\"h\":\"Businesses operate with different purposes – financial return, social or environmental impact, lifestyle, and collective well-being – often pursuing more than one, which together shape how success is defined and measured.\"},{\"t\":\"li1\",\"h\":\"Māori frameworks and organisations, such as Māori authorities and iwi boards, view profit as one outcome of decision-making. In addition, consideration is given to other multi-dimensional outcomes such as the sustainability of resources for future generations.\"},{\"t\":\"li1\",\"h\":\"Sustainability is a business's capacity to achieve long-term success by balancing economic performance, environmental responsibility, and social well-being.\"},{\"t\":\"h\",\"h\":\"<b>Introduction to legal structures of business<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses in New Zealand can operate under different legal structures, including sole traders, partnerships, and companies, each with different implications for ownership, control, liability, profit distribution, and access to capital.\"},{\"t\":\"li1\",\"h\":\"A sole trader is owned and operated by one person with full control and entitlements to profits, but unlimited personal liability and generally fewer options for raising capital. A partnership shares ownership, decision-making, and liability across two or more people, allowing partners to pool resources and potentially access more capital. A company separates ownership from control, provides shareholders with limited liability, and can raise capital by issuing shares.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Assess how businesses meet customer needs and wants, while managing uncertainty and risk.\"},{\"t\":\"li1\",\"h\":\"Compare business structures and their implications for ownership, control, risk, and growth.\"},{\"t\":\"li1\",\"h\":\"Examine how stakeholders, purpose, and pūtake influence business decision-making.\"},{\"t\":\"li1\",\"h\":\"Analyse how business decisions align with organisational values, objectives, and desired outcomes.\"},{\"t\":\"li1\",\"h\":\"Evaluate different approaches to business success, including financial, social, cultural, and environmental outcomes.\"}]},{\"name\":\"The business environment\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Factors impacting business<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses operate within internal and external environments that create pressures and possibilities, shaping the decisions they make.\"},{\"t\":\"li1\",\"h\":\"Internal factors are elements within a business's control, including its resources, capabilities, processes, and performance, and can be adjusted to improve outcomes.\"},{\"t\":\"li1\",\"h\":\"External factors are influences outside a business's control that arise from the broader environment, including economic, social, technological (e.g. advances in artificial intelligence (AI)), legal, and competitive conditions, which create both opportunities and challenges that businesses must respond to.\"},{\"t\":\"h\",\"h\":\"<b>SWOT analysis<\\/b>\"},{\"t\":\"li1\",\"h\":\"SWOT is an analytical framework that organises internal and external factors to inform business decision-making. Strengths and weaknesses are internal factors within a business's control that provide advantages or disadvantages, while opportunities and threats are external factors outside its control that present possibilities or risks.\"},{\"t\":\"h\",\"h\":\"<b>Stakeholders<\\/b>\"},{\"t\":\"li1\",\"h\":\"Stakeholders are individuals or groups that either influence or are affected by a business's activities and decisions. They can be classified as internal (e.g. owners, managers, employees, shareholders), or external (e.g. customers, suppliers, government, the wider community).\"},{\"t\":\"li1\",\"h\":\"Stakeholders have different and sometimes conflicting interests, ranging from profit and income to job security, quality, compliance, and social or environmental outcomes. Business decisions involve balancing these competing interests while responding to internal and external factors.\"},{\"t\":\"li1\",\"h\":\"Te ao Māori frameworks of thinking offer a values-based perspective on stakeholder relationships, emphasising kaitiakitanga, manaakitanga, and rangatiratanga alongside collective well-being and long-term responsibility as guiding principles for decision-making.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse how internal and external factors influence business performance and strategic decision-making.\"},{\"t\":\"li1\",\"h\":\"Use SWOT to evaluate internal strengths and weaknesses and external opportunities and threats.\"},{\"t\":\"li1\",\"h\":\"Examine how stakeholder interests and objectives influence business decisions and outcomes.\"},{\"t\":\"li1\",\"h\":\"Evaluate the trade-offs involved in balancing competing stakeholder interests.\"},{\"t\":\"li1\",\"h\":\"Use a values-based perspective to evaluate business relationships business relationships, responsibilities, and decision-making.\"}]},{\"name\":\"Internal functions of a business\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Organisational structures and business functions<\\/b>\"},{\"t\":\"li1\",\"h\":\"An organisational structure defines how roles, responsibilities, and lines of authority and communication are arranged within a business and is typically displayed as an organisational chart.\"},{\"t\":\"li1\",\"h\":\"Businesses are typically structured around key functions, including marketing, operations, finance, and human resources, each with a specific role in achieving business objectives.\"},{\"t\":\"li1\",\"h\":\"Business functions are interdependent, meaning they must work together to achieve overall business success. Marketing influences demand and revenue, operations determine production capability and costs, and finance sets budgets, allocates resources, and monitors profitability, with each function shaping and responding to the others.\"},{\"t\":\"h\",\"h\":\"<b>Marketing<\\/b>\"},{\"t\":\"li1\",\"h\":\"The marketing function identifies customer needs and promotes products or services to generate demand.\"},{\"t\":\"li1\",\"h\":\"A target market is the specific group of customers a business seeks to attract and serve.\"},{\"t\":\"li1\",\"h\":\"Market research, both primary and secondary, informs decisions about customers, competitors, and the wider market. It helps businesses identify and understand their target market, tailor products, services, and digital marketing to customer needs, and evaluate the effectiveness of targeted content, including AI-assisted marketing campaigns.\"},{\"t\":\"li1\",\"h\":\"The marketing mix consists of four interconnected elements, product, price, place, and promotion, which are coordinated to meet the needs of a target market and achieve business objectives.\"},{\"t\":\"li1\",\"h\":\"Product refers to the goods or services offered, including their features and the benefits they provide to customers, which influence demand and revenue.\"},{\"t\":\"li1\",\"h\":\"Pricing strategies are approaches used to set prices that influence demand and revenue, and are selected based on business objectives, costs, competition, and target market characteristics.\"},{\"t\":\"li1\",\"h\":\"Place refers to how a product is distributed and made available to customers through direct channels, including face-to-face, online, and drop shipping, or indirect channels through intermediaries such as retailers and wholesalers.\"},{\"t\":\"li1\",\"h\":\"Promotion informs, persuades, and reminds customers about products or services through methods including advertising, sales promotion, personal selling, and digital and social media. Businesses select promotional methods based on the characteristics of the target market and the costs and resources required to reach that market effectively.\"},{\"t\":\"li1\",\"h\":\"Personal selling involves a direct conversation between a seller and a potential customer, in which the seller identifies the customer's need, communicates the value of the product or service, and responds to questions or hesitation to support a purchasing decision.\"},{\"t\":\"li1\",\"h\":\"Feedback from the target market, including what the target market asks, respond to, or decline, particularly in a direct selling situation, provides direct evidence of whether a promotional strategy and the solution are meeting the needs of the target market.\"},{\"t\":\"h\",\"h\":\"<b>Finance<\\/b>\"},{\"t\":\"li1\",\"h\":\"The finance function is responsible for planning and reporting financial information, including funding, budgeting, and monitoring inflows and outflows to support business decision-making.\"},{\"t\":\"li1\",\"h\":\"A budget is a financial plan predicting expected revenue and costs before a period, while an income statement summarises actual revenue, costs, and profit after a period. Variance analysis compares these two to identify differences and inform future decisions.\"},{\"t\":\"li1\",\"h\":\"Break-even analysis identifies the level of sales at which total revenue equals total costs, resulting in zero profit. The margin of safety measures how far actual or expected sales exceed the break-even point, indicating the level of risk in business operations.\"},{\"t\":\"h\",\"h\":\"<b>Operations<\\/b>\"},{\"t\":\"li1\",\"h\":\"The operations function transforms inputs (e.g. labour, materials, and equipment) into outputs (e.g. goods and services), influencing the cost, quality, and efficiency of production. Productivity is a measure of how efficiently this transformation occurs, expressed as output divided by input. Labour productivity measures output per worker or per hour worked.\"},{\"t\":\"li1\",\"h\":\"Businesses select from a range of production methods (e.g. job, batch, flow, flexible manufacturing) each offering different trade-offs between productivity, cost, quality, flexibility, and the ability to customise outputs.\"},{\"t\":\"li1\",\"h\":\"AI can improve productivity by automating routine tasks, analysing large amounts of data, and supporting business decision-making, but may also change workforce requirements and employment opportunities.\"},{\"t\":\"li1\",\"h\":\"Quality refers to the extent to which outputs meet customer expectations and required standards and is monitored through quality control processes that influence costs and customer satisfaction.\"},{\"t\":\"li1\",\"h\":\"Human Resources is the function of a business responsible for managing employees, including hiring, training, motivating, and supporting staff.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Examine how organisational structures, business functions, and communication systems support business operations and performance.\"},{\"t\":\"li1\",\"h\":\"Analyse how business functions contribute to achieving organisational objectives and how they influence one another.\"},{\"t\":\"li1\",\"h\":\"Analyse how market research informs marketing decisions to meet customer needs and achieve business objectives.\"},{\"t\":\"li1\",\"h\":\"Evaluate marketing strategies, including pricing, promotion, distribution, and personal selling, in relation to target markets and business objectives.\"},{\"t\":\"li1\",\"h\":\"Interpret financial information to evaluate business performance, viability, and risk.\"},{\"t\":\"li1\",\"h\":\"Analyse how operational processes influence productivity, quality, efficiency, and business performance.\"},{\"t\":\"li1\",\"h\":\"Evaluate how decisions across marketing, finance, operations, and human resources influence overall business performance.\"}]}]}},{\"name\":\"Enterprise, Entrepreneurship, and Innovation\",\"focus\":\"Entrepreneurship, enterprise, and business operation, including how opportunities are identified and developed, how businesses manage resources and responsibilities, and how innovation, financial management, ethics, and community engagement contribute to sustainable business success.\",\"inYear\":{\"11\":\"Students are taught that entrepreneurship, enterprise, and innovation are ways of creating financial, social, and environmental value. They examine the changing nature of work, develop an understanding of business finances and cash flow, and investigate the opportunities and challenges of running a small business.\"},\"years\":{\"11\":[{\"name\":\"Entrepreneurship\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Entrepreneurship<\\/b>\"},{\"t\":\"li1\",\"h\":\"Entrepreneurship involves identifying and turning opportunities into value; the value could be financial, environmental, or social.\"},{\"t\":\"li1\",\"h\":\"Enterprise is the willingness to take action; it is the mindset and behaviours that turn an idea into reality. It includes initiative, resilience, creativity, and the ability to manage risk and uncertainty.\"},{\"t\":\"li1\",\"h\":\"Innovation is the application of a new or improved idea in a way that creates value for others. It does not require invention; a better process, a new business model, or a familiar product delivered in a different way can all be innovations. Innovative ideas often emerge from everyday problems, unmet community needs, and personal skills, qualifications, or observations of customer demand.\"},{\"t\":\"li1\",\"h\":\"Pōtikitanga, the unique qualities that differentiate a business from its competitors, is critical to the success of a new venture, whether through service quality, convenience, price, or reliability.\"},{\"t\":\"h\",\"h\":\"<b>Changing nature of work<\\/b>\"},{\"t\":\"li1\",\"h\":\"Technological, social, environmental, and economic changes have led to non-traditional work arrangements, including:\"},{\"t\":\"li2\",\"h\":\"gig work\"},{\"t\":\"li2\",\"h\":\"side hustles\"},{\"t\":\"li2\",\"h\":\"digital nomadism.\"},{\"t\":\"li1\",\"h\":\"Non-traditional work arrangements offer flexibility over hours, location, and type of work, but also create uncertainty through income instability and limited employment benefits.\"},{\"t\":\"li1\",\"h\":\"Digital platforms can connect workers, businesses, and consumers directly, supporting alternative forms of work and business activity alongside traditional employment structures. Advances in AI and automation can enhance productivity, supporting new business models and changing the skills required in the workforce.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate the opportunities, constraints, and risks that influence decisions to establish a new business.\"},{\"t\":\"li1\",\"h\":\"Analyse how personal strengths and unmet community needs can inform the development of viable business opportunities and unique value propositions.\"},{\"t\":\"li1\",\"h\":\"Analyse how technological, social, environmental, and economic changes have influenced the nature of entrepreneurship and work.\"},{\"t\":\"li1\",\"h\":\"Compare the benefits, challenges, and risks of different contemporary work arrangements for workers and businesses.\"}]},{\"name\":\"Managing a business\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Managing money<\\/b>\"},{\"t\":\"li1\",\"h\":\"Start-up costs are the initial expenses required to get a business up and running. They include equipment, tools, licences, branding, initial stock, and workspace setup. These costs must be understood early because they determine how much start-up capital is needed before the business can begin earning income.\"},{\"t\":\"li1\",\"h\":\"Costs can be broken into fixed costs and variable costs. Fixed costs remain the same regardless of how many products or services a business sells, while variable costs change depending on the level of production or sales.\"},{\"t\":\"li1\",\"h\":\"Cash inflows are the funds entering the business from all income-generating activities. This includes sales revenue, payments received on invoices, and any additional income such as grants or small one-off earnings.\"},{\"t\":\"li1\",\"h\":\"Cash outflows are the payments the business makes to operate day-to-day. These include bills, supplier payments, operating costs, and routine expenses such as fuel, materials, or subscriptions.\"},{\"t\":\"li1\",\"h\":\"Accurately recording both cash inflows and outflows provides a clear picture of the business’s financial status. It shows whether the business is making a profit, reveals potential issues before they become serious, and ensures the business can meet tax obligations.\"},{\"t\":\"h\",\"h\":\"<b>Challenges and support when running a business<\\/b>\"},{\"t\":\"li1\",\"h\":\"Running a small business can be financially rewarding and can allow flexibility and the achievement of personal goals. However, it can also create financial, operational, and emotional pressure through irregular income, long hours, and complex decision-making.\"},{\"t\":\"li1\",\"h\":\"Effective planning involves prioritising tasks, managing finances, and organising workload and may help businesses anticipate and respond to challenges.\"},{\"t\":\"li1\",\"h\":\"Personal resilience is built through reflection, coping strategies, and access to support networks, including family, mentors, peers, and advisory services.\"},{\"t\":\"li1\",\"h\":\"Mentoring and advisory organisations offer guidance, training, financial advice, practical expertise, networking opportunities, and access to experienced mentors that may assist small businesses to develop capability and confidence.\"},{\"t\":\"li1\",\"h\":\"A range of government, regional, and community-based organisations offer this support in New Zealand, including general business advisory services, regional business partner networks, local and regional chambers of commerce, and culturally responsive organisations that specifically support Māori and Pacific entrepreneurs.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of these practices\"},{\"t\":\"li1\",\"h\":\"Evaluate the financial requirements and viability of a business venture.\"},{\"t\":\"li1\",\"h\":\"Analyse how cash inflows and outflows influence a business's financial position.\"},{\"t\":\"li1\",\"h\":\"Analyse how financial and emotional pressures influences decision-making, resilience, and sustainability in small businesses.\"},{\"t\":\"li1\",\"h\":\"Investigate how planning and resource management strategies reduce uncertainty and support business continuity.\"},{\"t\":\"li1\",\"h\":\"Assess the contribution of support services, networks, and business practices to small business resilience and sustainability.\"},{\"t\":\"li1\",\"h\":\"Examine how culturally specific organisations support Māori and Pacific entrepreneurs, and business sustainability.\"}]},{\"name\":\"Business obligations\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Engaging the community<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses that actively engage with their community may build trust, loyalty, and long-term relationships that extend beyond transactional exchanges.\"},{\"t\":\"li1\",\"h\":\"Community engagement includes supporting local initiatives, maintaining open communication with stakeholders, and operating in ways that reflect the values and needs of the communities they serve.\"},{\"t\":\"li1\",\"h\":\"Ethical business practice is grounded in honesty, fairness, and genuine care for customers, suppliers, and the wider community. Honest and fair dealing can support commercial success through trust, reputation, and customer loyalty, but ethical obligations may require such behaviour even when it provides no commercial benefit.\"},{\"t\":\"li1\",\"h\":\"In New Zealand, te ao Māori values offer a framework for community engagement. Whanaungatanga, the importance of strong, supportive relationships, and manaakitanga, respect, generosity, and care for others, reflect an understanding of business success that prioritises collective well-being and mutual respect alongside financial outcomes.\"},{\"t\":\"h\",\"h\":\"<b>Tax obligations<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses are required to meet a range of tax obligations, including declaring and paying tax on profits, meeting consumption tax requirements once turnover reaches a specified threshold, and maintaining accurate financial records to support timely and correct payments to the relevant government authority.\"},{\"t\":\"li1\",\"h\":\"When a business employs staff, it takes on additional obligations including deducting and passing on employee tax contributions, levies, and retirement savings scheme contributions on behalf of their employees, and maintaining accurate records of these deductions.\"},{\"t\":\"li1\",\"h\":\"Fulfilling these obligations is fundamental to legal compliance, business credibility, and long-term sustainability. Failure to meet them accurately and on time can result in penalties, reputational damage, and risk to the viability of the business.\"},{\"t\":\"h\",\"h\":\"<b>Legal responsibilities<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses operate within a legal framework that protects consumers, promotes honest trading, and safeguards personal information; meeting these obligations is fundamental to customer trust, credibility, and long-term viability.\"},{\"t\":\"li1\",\"h\":\"Consumer protection laws require businesses to ensure goods and services meet acceptable quality standards, are fit for purpose, and come with fair remedies when something goes wrong.\"},{\"t\":\"li1\",\"h\":\"Fair trading laws prohibit misleading behaviour, false claims, and deceptive advertising, requiring businesses to operate with honesty and transparency in all market interactions.\"},{\"t\":\"li1\",\"h\":\"Health and safety involves identifying hazards and managing risks to protect employees, customers, and others from harm in the workplace while complying with all relevant health and safety laws and regulations.\"},{\"t\":\"li1\",\"h\":\"Privacy laws require businesses to collect only the personal information they need, store it securely, use it only for its intended purpose, and give individuals the right to access and correct their own information.\"},{\"t\":\"li1\",\"h\":\"The use of AI in business creates opportunities for innovation and efficiency but also requires businesses to consider ethical issues such as privacy, bias, transparency, accountability, and the responsible use of data.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of these practices\"},{\"t\":\"li1\",\"h\":\"Analyse how ethical business practices contribute to community relationships, trust, and long-term sustainability.\"},{\"t\":\"li1\",\"h\":\"Examine how kaupapa Māori values, including whanaungatanga and manaakitanga, inform business practice and community engagement.\"},{\"t\":\"li1\",\"h\":\"Analyse the legal obligations of businesses and their role in supporting responsible business practice.\"},{\"t\":\"li1\",\"h\":\"Evaluate how ethical conduct, legal compliance, and responsible information management contribute to business reputation and sustainability.\"}]}]}},{\"name\":\"Disciplinary Writing\",\"focus\":\"The use of writing to reflect the ways in which knowledge is organised, analysed, and communicated within the discipline.\",\"inYear\":{},\"years\":{\"11\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Business and Economic concepts, frameworks, models, and subject-specific terminology provide the foundation for constructing and communicating meaning about business activities, decisions, and practices.\"},{\"t\":\"li1\",\"h\":\"Business and Economic evidence, including quantitative and qualitative information, can be selected, interpreted, analysed, and connected to claims through causal and explanatory reasoning to support clear, reasoned arguments.\"},{\"t\":\"li1\",\"h\":\"Business and Economics texts use logical structures, signposting, and disciplinary conventions to communicate analysis and evaluation effectively for purpose and audience.\"},{\"t\":\"li1\",\"h\":\"Comparison, evaluative language, and modality enable the communication of effectiveness, limitations, implications, risks, assumptions, and trade-offs in relation to business and economic concepts and practices.\"},{\"t\":\"li1\",\"h\":\"Business and Economic decisions, recommendations, and actions are justified through the strategic selection and framing of evidence, consideration of stakeholder perspectives, and communication shaped by audience, purpose, and appropriate levels of formality and objectivity.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply subject-specific concepts and terminology accurately appropriate to purpose and audience.\"},{\"t\":\"li1\",\"h\":\"Use sentence structures to link claims to relevant evidence, employing causal and explanatory language to construct clear and reasoned arguments.\"},{\"t\":\"li1\",\"h\":\"Employ logical text structures and signposting to guide the reader through analysis and evaluation, using present tense for established theory and past tense for data or events.\"},{\"t\":\"li1\",\"h\":\"Use comparison and modality to convey effectiveness, limitations, and implications in relation to concepts and practice.\"},{\"t\":\"li1\",\"h\":\"Justify decisions, recommendations, or actions for specific audiences by selecting and framing evidence strategically, including the use of graphs and data, using evaluative and persuasive language.\"}]}]},\"intro\":\"In Business and Economics, students use explicitly taught disciplinary writing to communicate, analyse, evaluate, and justify economics and business ideas, decisions, relationships, and outcomes using appropriate concepts, evidence, models and terminology.\",\"writing\":true}]},{\"key\":\"bus\",\"name\":\"Business Studies\",\"short\":\"Business Studies\",\"years\":[12,13],\"c\":\"--bus\",\"source\":\"Business Studies, Years 12–13 (October 2026)\",\"starts\":{\"12\":2029,\"13\":2030},\"lead\":\"Students are taught how businesses operate, make decisions, and respond to change in a range of small business, corporate, national and global contexts. Students are taught about business functions such as marketing, finance, operations and resources, and how to apply business concepts, models, and values. Students are also taught how business and sustainability intersect in sectors, such as in agri-businesses.\",\"paras\":[\"Students are taught core business concepts, frameworks, and practices that explain how businesses create value, operate, grow, and respond to changing economic, social, cultural, technological, and environmental conditions. Through the use of business models, strategic frameworks, financial information, and market evidence, students examine how businesses manage resources, create competitive advantage, respond to stakeholder needs, and balance growth, risk, and sustainability.\",\"Business Studies provides students with the knowledge and practices to analyse business situations, issues, environments, data, and organisational practices using disciplinary concepts, tools, frameworks, and evidence. This disciplinary knowledge helps students develop the ability to apply business thinking to interpret information, examine relationships and impacts, explain outcomes, and support informed decision-making in local, national, and global contexts.\",\"As students progress through Years 12–13, they develop the ability to evaluate and synthesise information, perspectives, and evidence, and to communicate reasoned conclusions using disciplinary language and conventions in written form. This enables them to justify decisions, develop recommendations and business proposals, and communicate strategically, ethically, and effectively about complex business issues and opportunities.\"],\"pathway\":\"Business Studies leads to pathways in business, economics, commerce, agribusiness, and related fields such as entrepreneurship, management, commercial innovation, agri-innovation, rural enterprise, and environmental leadership.\",\"guidance\":[{\"title\":\"Knowledge and practices\",\"blocks\":[{\"t\":\"p\",\"h\":\"The Business Studies teaching sequence is organised into strands, elements, and sub-elements, and then further structured into knowledge and practices. The knowledge column sets out the declarative knowledge to be taught, while the practice column sets out the disciplinary skills, applications, and procedural knowledge. The practices underpin ways of working in Business Studies and are specific to the discipline.\"},{\"t\":\"p\",\"h\":\"The teaching of all knowledge and practices is compulsory. However, schools can determine how learning is organised across the year, including integrating content from multiple elements and strands where this supports coherence and depth. Examples within the teaching sequence in brackets signified with ‘e.g.’ are provided as guidance only; as long as the intended knowledge and practices are met, schools and teachers may substitute contexts and examples that better reflect local environments, iwi and hapū connections, student interests, and teacher expertise.\"},{\"t\":\"p\",\"h\":\"Disciplinary writing is included in the teaching sequence to set out what subject-specific literacy is to be taught. It is organised into a knowledge component that is consistent across all year levels and a practice component sequenced across years.\"}]},{\"title\":\"Responsible use of artificial intelligence\",\"blocks\":[{\"t\":\"p\",\"h\":\"Artificial intelligence (AI) can support learning, research, inquiry, and creative processes, but it may also introduce bias, inaccuracies, ethical concerns, and issues relating to ownership. AI should enhance, not replace, critical or creative thinking, source evaluation, subject knowledge, or students’ own analysis and decision-making. Responsible AI use emphasises the importance of exercising independent judgement, drawing on credible sources, verifying information, being transparent about AI use, considering diverse perspectives, and developing independent thinking.\"}]},{\"title\":\"Designing a programme\",\"blocks\":[{\"t\":\"p\",\"h\":\"The teaching sequence is designed to be taught as a non-linear programme. The knowledge and practice statements within each element or sub-element are related, but teachers may select complementary statements from across the sequence or treat sub-elements as discrete units of work. Disciplinary writing is most effectively taught when integrated across the teaching programme.\"},{\"t\":\"p\",\"h\":\"A comprehensive Business Studies programme uses authentic local, national, and global contexts, disciplinary models and frameworks, and a range of evidence sources, including data, reports, financial information, case studies, and contemporary issues.\"},{\"t\":\"p\",\"h\":\"Teachers use the practices to teach students to connect theory and practice, consider multiple perspectives, and apply disciplinary thinking to real-world decision-making and problem-solving.\"},{\"t\":\"p\",\"h\":\"The table below outlines the full ranges of contexts to support the teaching of the knowledge and practices. A supporting document has been developed specific to agribusiness.\"}]}],\"contexts\":{\"12\":{\"title\":\"Context specifications – Years 12 and 13\",\"blocks\":[{\"t\":\"p\",\"h\":\"Contexts include both:\"},{\"t\":\"li1\",\"h\":\"teacher-provided case studies\"},{\"t\":\"li1\",\"h\":\"student-generated ideas.\"},{\"t\":\"p\",\"h\":\"Student-generated ideas may be developed for real-world sale <b>OR<\\/b> explored as innovative concepts that are not taken to market.\"},{\"t\":\"p\",\"h\":\"References to businesses include:\"},{\"t\":\"li1\",\"h\":\"agribusinesses – businesses that produce, process, distribute, or support products and services from agriculture, aquaculture, dairy manufacturing, equine, forestry, horticulture, seafood, and sports turf industries, and rely directly on biological systems and natural ecosystems\"},{\"t\":\"li1\",\"h\":\"kaupapa Māori businesses – businesses or enterprises that are operated according to traditional or contemporary Māori culture and values. Some kaupapa Māori businesses are owner-operated and some employ people of Māori descent. Others may employ people of diverse ethnicities\"},{\"t\":\"li1\",\"h\":\"social enterprises – businesses that generate income while prioritising social, environmental, cultural, or community outcomes, with profits primarily reinvested to support their purpose\"},{\"t\":\"li1\",\"h\":\"not-for-profits – organisations that operate for social, cultural, environmental, charitable, sporting, educational, or community purposes and do not distribute profits to private owners or shareholders\"},{\"t\":\"li1\",\"h\":\"all New Zealand businesses operating domestically or in a global context.\"}]},\"13\":{\"title\":\"Context specifications – Years 12 and 13\",\"blocks\":[{\"t\":\"p\",\"h\":\"Contexts include both:\"},{\"t\":\"li1\",\"h\":\"teacher-provided case studies\"},{\"t\":\"li1\",\"h\":\"student-generated ideas.\"},{\"t\":\"p\",\"h\":\"Student-generated ideas may be developed for real-world sale <b>OR<\\/b> explored as innovative concepts that are not taken to market.\"},{\"t\":\"p\",\"h\":\"References to businesses include:\"},{\"t\":\"li1\",\"h\":\"agribusinesses – businesses that produce, process, distribute, or support products and services from agriculture, aquaculture, dairy manufacturing, equine, forestry, horticulture, seafood, and sports turf industries, and rely directly on biological systems and natural ecosystems\"},{\"t\":\"li1\",\"h\":\"kaupapa Māori businesses – businesses or enterprises that are operated according to traditional or contemporary Māori culture and values. Some kaupapa Māori businesses are owner-operated and some employ people of Māori descent. Others may employ people of diverse ethnicities\"},{\"t\":\"li1\",\"h\":\"social enterprises – businesses that generate income while prioritising social, environmental, cultural, or community outcomes, with profits primarily reinvested to support their purpose\"},{\"t\":\"li1\",\"h\":\"not-for-profits – organisations that operate for social, cultural, environmental, charitable, sporting, educational, or community purposes and do not distribute profits to private owners or shareholders\"},{\"t\":\"li1\",\"h\":\"all New Zealand businesses operating domestically or in a global context.\"}]}},\"support\":[{\"title\":\"Agribusiness supporting document: introduction\",\"blocks\":[{\"t\":\"p\"
