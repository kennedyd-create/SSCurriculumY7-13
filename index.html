,\"h\":\"This Business Studies Curriculum Support Document provides guidance for teaching and learning in Business Studies across Years 12–13. It supports curriculum planning by outlining year-level appropriate business concepts, contexts, case studies, and learning experiences that can be used to develop rich, coherent, and engaging Business Studies teaching and learning programmes. It is designed to work alongside the Business Studies curriculum by helping teachers select content and contexts that support the intended knowledge, skills, and practices across the strands.\"},{\"t\":\"p\",\"h\":\"The document supports teachers to choose relevant, accessible, and engaging business contexts that reflect the diversity of businesses in New Zealand, the Pacific, and global markets. It recognises that context is central to how students understand business activity, entrepreneurship, innovation, sustainability, and the impact of business decisions on individuals, communities, and society. It also supports students to explore Agribusiness, kaupapa Māori, community and student-led business, examining perspectives, values, and approaches to local, national, and international business practices.\"},{\"t\":\"p\",\"h\":\"This support document is intended to strengthen progression across senior secondary Business Studies by helping teachers plan for increasing sophistication in business knowledge and application. It supports students to develop disciplinary understanding of business concepts, strategic decision-making, marketing, human resources, finance, operations, entrepreneurship, and economic influences. It also encourages students to engage with real-world business issues in ways that build independence, critical thinking, problem-solving, and effective communication across Years 12–13.\"}]},{\"title\":\"Potential agribusiness case study progression\",\"blocks\":[{\"t\":\"p\",\"h\":\"For students to be taught about certain areas of agribusiness that increase in complexity each year, the following case study progression across year levels could be considered:\"},{\"t\":\"label\",\"h\":\"Year 11\"},{\"t\":\"h\",\"h\":\"<b>Strand: Business and the Business Environment<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Fonterra<\\/b>\"},{\"t\":\"li1\",\"h\":\"cooperative ownership structure\"},{\"t\":\"li1\",\"h\":\"global dairy markets\"},{\"t\":\"li1\",\"h\":\"stakeholder relationships\"},{\"t\":\"li1\",\"h\":\"sustainability initiatives\"},{\"t\":\"li1\",\"h\":\"business responses to changing consumer demands.\"},{\"t\":\"h\",\"h\":\"<b>Zespri<\\/b>\"},{\"t\":\"li1\",\"h\":\"international markets\"},{\"t\":\"li1\",\"h\":\"biosecurity risks\"},{\"t\":\"li1\",\"h\":\"consumer trends\"},{\"t\":\"li1\",\"h\":\"business growth and adaptation.\"},{\"t\":\"h\",\"h\":\"<b>Local dairy, sheep, and beef, or horticultural business<\\/b>\"},{\"t\":\"li1\",\"h\":\"business structure\"},{\"t\":\"li1\",\"h\":\"stakeholders\"},{\"t\":\"li1\",\"h\":\"business purpose\"},{\"t\":\"li1\",\"h\":\"environmental and market influences.\"},{\"t\":\"h\",\"h\":\"<b>Strand: Enterprise, Entrepreneurship, and Innovation<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Robotics Plus<\\/b>\"},{\"t\":\"li1\",\"h\":\"technology innovation\"},{\"t\":\"li1\",\"h\":\"product development\"},{\"t\":\"li1\",\"h\":\"international growth\"},{\"t\":\"li1\",\"h\":\"commercialisation of research.\"},{\"t\":\"h\",\"h\":\"<b>Allflex<\\/b>\"},{\"t\":\"li1\",\"h\":\"agritech innovation\"},{\"t\":\"li1\",\"h\":\"entrepreneurship\"},{\"t\":\"li1\",\"h\":\"startup growth\"},{\"t\":\"li1\",\"h\":\"solving labour and livestock management challenges.\"},{\"t\":\"h\",\"h\":\"<b>Local agribusiness entrepreneur<\\/b>\"},{\"t\":\"li1\",\"h\":\"farm diversification\"},{\"t\":\"li1\",\"h\":\"direct-to-consumer marketing\"},{\"t\":\"li1\",\"h\":\"agritourism ventures\"},{\"t\":\"li1\",\"h\":\"niche food production.\"},{\"t\":\"label\",\"h\":\"Year 12\"},{\"t\":\"h\",\"h\":\"<b>Strand: Strategic Business Management and Sustainability<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Fonterra<\\/b>\"},{\"t\":\"li1\",\"h\":\"cooperative ownership structure\"},{\"t\":\"li1\",\"h\":\"balancing returns for farmers with environmental expectations\"},{\"t\":\"li1\",\"h\":\"managing global market pressures and sustainability commitments.\"},{\"t\":\"h\",\"h\":\"<b>Strand: Creating Value<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Zespri<\\/b>\"},{\"t\":\"li1\",\"h\":\"development of premium kiwifruit varieties\"},{\"t\":\"li1\",\"h\":\"brand development and international marketing\"},{\"t\":\"li1\",\"h\":\"managing intellectual property and global supply chains.\"},{\"t\":\"h\",\"h\":\"<b>Strand: Workforce and Financial Viability<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Family dairy farm<\\/b>\"},{\"t\":\"li1\",\"h\":\"seasonal cash flow management\"},{\"t\":\"li1\",\"h\":\"succession planning\"},{\"t\":\"li1\",\"h\":\"labour management and staff retention.\"},{\"t\":\"h\",\"h\":\"<b>Sealord<\\/b>\"},{\"t\":\"li1\",\"h\":\"governance within a large Māori-owned business\"},{\"t\":\"li1\",\"h\":\"workforce planning across harvesting, processing, logistics, and export operations\"},{\"t\":\"li1\",\"h\":\"investment in vessels, technology, and processing infrastructure\"},{\"t\":\"li1\",\"h\":\"balancing profitability with sustainability and responsible resource management.\"},{\"t\":\"h\",\"h\":\"<b>Strand: Enterprise and Growth<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Wakatū Incorporation<\\/b>\"},{\"t\":\"li1\",\"h\":\"creating growth while maintaining cultural values and intergenerational stewardship\"},{\"t\":\"li1\",\"h\":\"diversifying across horticulture, food production, and international markets.\"},{\"t\":\"label\",\"h\":\"Year 13\"},{\"t\":\"h\",\"h\":\"<b>Strand: Strategic Business Management and Sustainability<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>A2 Milk Company<\\/b>\"},{\"t\":\"li1\",\"h\":\"building a business around product differentiation\"},{\"t\":\"li1\",\"h\":\"strategic responses to international market opportunities\"},{\"t\":\"li1\",\"h\":\"managing rapid growth and changing consumer trends\"},{\"t\":\"li1\",\"h\":\"brand protection and market positioning\"},{\"t\":\"li1\",\"h\":\"balancing growth with long-term shareholder value.\"},{\"t\":\"h\",\"h\":\"<b>NZ King Salmon<\\/b>\"},{\"t\":\"li1\",\"h\":\"strategic management of environmental challenges\"},{\"t\":\"li1\",\"h\":\"stakeholder engagement and community consultation\"},{\"t\":\"li1\",\"h\":\"balancing growth with environmental constraints\"},{\"t\":\"li1\",\"h\":\"regulatory challenges and resource consent processes and long-term sustainability in aquaculture.\"},{\"t\":\"h\",\"h\":\"<b>Strand: Creating Value<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Zespri<\\/b>\"},{\"t\":\"li1\",\"h\":\"protection of intellectual property through plant variety rights\"},{\"t\":\"li1\",\"h\":\"global marketing and branding strategies\"},{\"t\":\"li1\",\"h\":\"value creation throughout the kiwifruit value chain.\"},{\"t\":\"h\",\"h\":\"<b>Silver Fern Farms<\\/b>\"},{\"t\":\"li1\",\"h\":\"moving from commodity production to branded food products\"},{\"t\":\"li1\",\"h\":\"creating value through traceability and provenance\"},{\"t\":\"li1\",\"h\":\"meeting customer requirements in international markets\"},{\"t\":\"li1\",\"h\":\"product differentiation and sustainability\"},{\"t\":\"li1\",\"h\":\"value chain management from farm to consumer.\"},{\"t\":\"h\",\"h\":\"<b>Strand: Workforce and Financial Viability<\\/b>\"},{\"t\":\"h\",\"h\":\"<b>Pāmu Farms<\\/b>\"},{\"t\":\"li1\",\"h\":\"organisational structure and leadership\"},{\"t\":\"li1\",\"h\":\"large-scale agribusiness management\"},{\"t\":\"li1\",\"h\":\"sustainability and financial performance.\"}]}],\"strands\":[{\"name\":\"Enterprise and Growth\",\"focus\":\"Entrepreneurship, innovation, and business growth, including how ventures create value, respond to customer needs, develop sustainable business models, secure resources for growth, and expand within local and global markets.\",\"inYear\":{\"12\":\"Students are taught about entrepreneurship as a process of identifying opportunities and creating value. They use tools to analyse customer needs, develop and test business ideas, and evaluate solutions using desirability, feasibility, viability, and sustainability criteria.\",\"13\":\"Students are taught to examine how businesses achieve and manage growth through scaling, expansion, exporting, and strategic development. They analyse growth strategies, funding and ownership trade-offs, export readiness, and the operational, financial, and leadership challenges.\"},\"years\":{\"12\":[{\"name\":\"Creating innovative products\",\"k\":[{\"t\":\"li1\",\"h\":\"Entrepreneurship is the process of identifying opportunities, developing innovative ideas, and creating value by starting or growing a venture, often in the context of financial risk and reward.\"},{\"t\":\"li1\",\"h\":\"Entrepreneurship may take place across small business, start-ups, agribusiness, Māori business, social enterprise, or within an established organisation (intrapreneurship).\"},{\"t\":\"h\",\"h\":\"<b>Business planning<\\/b>\"},{\"t\":\"li1\",\"h\":\"The Business Model Canvas is a one-page strategic planning tool used to describe, design, and improve a business model.\"},{\"t\":\"li1\",\"h\":\"It can be used for start-ups and established businesses to visualise how an organisation creates and delivers value.\"},{\"t\":\"li1\",\"h\":\"The categories of the Business Model Canvas are:\"},{\"t\":\"li2\",\"h\":\"customer segments\"},{\"t\":\"li2\",\"h\":\"value propositions\"},{\"t\":\"li2\",\"h\":\"channels\"},{\"t\":\"li2\",\"h\":\"customer relationships\"},{\"t\":\"li2\",\"h\":\"revenue streams\"},{\"t\":\"li2\",\"h\":\"key resources\"},{\"t\":\"li2\",\"h\":\"key activities\"},{\"t\":\"li2\",\"h\":\"key partnerships\"},{\"t\":\"li2\",\"h\":\"cost structure.\"},{\"t\":\"h\",\"h\":\"<b>Customer needs<\\/b>\"},{\"t\":\"li1\",\"h\":\"Customer needs are the problems, desires, or requirements that customers seek to satisfy through products services or experiences.\"},{\"t\":\"li1\",\"h\":\"A value proposition explains how a product of service creates value for a specific customer group.\"},{\"t\":\"h\",\"h\":\"<b>Design thinking and Agile processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Design thinking is a human-centred, iterative approach to problem-solving that follows the stages of empathise, define, ideate, prototype, and test.\"},{\"t\":\"li1\",\"h\":\"Design thinking reduces uncertainty by using feedback from users to evaluate and refine solutions before implementation.\"},{\"t\":\"li1\",\"h\":\"Agile development supports solutions that evolve in response to changing requirements through iterative cycles, continuous feedback, and incremental delivery.\"},{\"t\":\"li1\",\"h\":\"Circular design considers how products can be designed for reuse, repair, regeneration, and improved sustainability.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Develop a Business Model Canvas to communicate how a venture creates, delivers, and captures value.\"},{\"t\":\"li1\",\"h\":\"Analyse customer needs and feedback to identify opportunities for innovation and value creation.\"},{\"t\":\"li1\",\"h\":\"Apply design thinking processes to define problems, generate solutions, prototype ideas, and refine them through user feedback.\"},{\"t\":\"li1\",\"h\":\"Evaluate and refine products, services, or business models using Agile and circular design principles to improve customer value and sustainability.\"}]},{\"name\":\"Scaling and growth\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Growth<\\/b>\"},{\"t\":\"li1\",\"h\":\"Business growth typically involves adding resources, such as capital, people, or technology, resulting in increased revenue.\"},{\"t\":\"li1\",\"h\":\"Growth can also be measured through increases in employees, customers, or locations.\"},{\"t\":\"li1\",\"h\":\"Business growth can be internal or external.\"},{\"t\":\"li1\",\"h\":\"Internal business growth results from a business using its own resources, capabilities, and finances to expand.\"},{\"t\":\"li1\",\"h\":\"External business growth occurs when a business expands by merging with, acquiring, or forming alliances with other companies. It is essentially using outside resources to jumpstart expansion.\"},{\"t\":\"li1\",\"h\":\"Business growth strategies generally include vertical or horizontal integration or diversification.\"},{\"t\":\"li1\",\"h\":\"Problems with business growth can be caused by operational strain, financial mismanagement, workforce shortages which can lead to increased costs, poor customer service, and strained leadership. Challenges include overstretched resources, maintaining quality, and managing quality.\"},{\"t\":\"li1\",\"h\":\"Scaling occurs when a business increases revenue without a proportional increase in resources, often through technology-enabled processes.\"},{\"t\":\"li1\",\"h\":\"Scaling too early increases the risk of business failure.\"},{\"t\":\"li1\",\"h\":\"Growth and scaling describe different patterns of expansion. Scalable business models enable output to expand without equivalent resource increases.\"},{\"t\":\"li1\",\"h\":\"Strategic pathways for expansion can be analysed using frameworks such as the Ansoff Matrix to evaluate alternative directions for growth.\"},{\"t\":\"li1\",\"h\":\"Expansion creates operational and financial pressures. Limits in production capacity, labour, capital, or managerial capability restrict how quickly a firm can grow without compromising quality or efficiency.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Analyse the internal and external reasons businesses expand, the strategies they use, and how economies of scale protect margins, build competitive advantage, and ensure long-term viability.\"},{\"t\":\"li1\",\"h\":\"Compare traditional linear growth with scalable models, contrasting how resource use and costs shift when sales revenue increases without a matching rise in operating expenses.\"},{\"t\":\"li1\",\"h\":\"Create a framework to choose between steady growth and rapid scaling, highlighting key readiness indicators across human resources, financial health, and market demand.\"},{\"t\":\"li1\",\"h\":\"Examine the risks of scaling too early, such as staffing, cash flow, and production bottlenecks, and apply a strategic framework to manage growth without sacrificing quality or efficiency.\"}]},{\"name\":\"Government and non-government support for growth\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Supports for growth<\\/b>\"},{\"t\":\"li1\",\"h\":\"Business growth increases pressure on internal resources, which can limit a business’s ability to expand effectively.\"},{\"t\":\"li1\",\"h\":\"Unmanaged growth can result in operational inefficiencies, quality issues, and cash flow pressure.\"},{\"t\":\"li1\",\"h\":\"Small and medium-sized businesses often require external support because they have limited capital, expertise, networks, or capacity to manage risk.\"},{\"t\":\"li1\",\"h\":\"The New Zealand Government supports business growth to achieve economic objectives, such as employment, innovation, productivity, exports, and regional development.\"},{\"t\":\"li1\",\"h\":\"Government support reduces barriers to growth through funding, advice, capability development, and business support programmes.\"},{\"t\":\"li1\",\"h\":\"Non-government support provides access to capital, expertise, networks, and market opportunities that can enable business growth. This may be delivered by organisations including banks, investors, incubators, accelerators, and industry associations.\"},{\"t\":\"li1\",\"h\":\"Kaupapa Māori businesses may access targeted support from government organisations and Māori economic development initiatives. This support exists to strengthen a te ao Māori approach to economic participation.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse common barriers to growth for New Zealand businesses and identify exactly where these operational pressures surface.\"},{\"t\":\"li1\",\"h\":\"Evaluate government and non-government support options by navigating the trade-offs between cost, accessibility, control, and strategic impact, justifying the most appropriate choice for a specific business scenario.\"},{\"t\":\"li1\",\"h\":\"Evaluate the purpose of targeted support for kaupapa Māori businesses by analysing the historical and structural barriers affecting Māori economic participation.\"}]}],\"13\":[{\"name\":\"Creating innovative products\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Start-up businesses<\\/b>\"},{\"t\":\"li1\",\"h\":\"A start-up is a temporary organisation formed to search for a viable product and business model for an identified problem.\"},{\"t\":\"li1\",\"h\":\"Innovation for start-ups is a structured process involving opportunity identification, solution design, testing, and iteration.\"},{\"t\":\"h\",\"h\":\"<b>Solution market fit<\\/b>\"},{\"t\":\"li1\",\"h\":\"The DFV/DFVS framework is used to assess and refine innovation by balancing desirability, feasibility, viability, and sustainability through iterative testing.\"},{\"t\":\"li2\",\"h\":\"desirability considers whether a solution meets a genuine customer need\"},{\"t\":\"li2\",\"h\":\"feasibility considers whether a solution can be produced and delivered with available resources\"},{\"t\":\"li2\",\"h\":\"viability considers whether a solution can sustain itself financially over time\"},{\"t\":\"li2\",\"h\":\"sustainability considers social and environmental impact.\"},{\"t\":\"h\",\"h\":\"<b>Innovative product development<\\/b>\"},{\"t\":\"li1\",\"h\":\"Start-ups operate under high uncertainty and use structured development approaches to reduce risk.\"},{\"t\":\"li1\",\"h\":\"The Lean Canvas is used to describe and align key elements of a business model, including value proposition, customers, revenue, costs, and impact.\"},{\"t\":\"li1\",\"h\":\"The Lean Startup approach tests assumptions using experimentation and minimum viable products (MVPs) that contain features of a new product to test with real customers.\"},{\"t\":\"li1\",\"h\":\"Feedback and data gathered from build-measure-learn cycles is used to decide whether to pivot or persevere. The Lean Startup approach emphasises continuous learning, rapid iteration, and customer-centric development.\"},{\"t\":\"h\",\"h\":\"<b>Financial sustainability and funding for start-ups<\\/b>\"},{\"t\":\"li1\",\"h\":\"Financial sustainability determines how long a start-up can operate and how quickly it can grow, based on its ability to manage cash flow and survive early uncertainty.\"},{\"t\":\"li1\",\"h\":\"Start-ups may be funded through bootstrapping, government support, angel investment, or venture capital, each involving trade-offs in ownership, risk, control, and growth expectations.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate solution-market fit by analysing the balance between customer desirability, operational feasibility, financial sustainability, and long-term environmental impact.\"},{\"t\":\"li1\",\"h\":\"Appraise the causes of business failure in New Zealand and international contexts, including poor solution-market fit.\"},{\"t\":\"li1\",\"h\":\"Formulate and test the core assumptions underlying an unproven business concept using the Lean start-up approach.\"},{\"t\":\"li1\",\"h\":\"Synthesise market data and stakeholder feedback from real-world testing to evaluate whether those assumptions are valid and justify a decision to pivot or persevere using empirical evidence.\"},{\"t\":\"li1\",\"h\":\"Critically evaluate capital structures by analysing funding requirements, and the trade-offs between growth and ownership control.\"}]},{\"name\":\"Scaling and growth\",\"k\":[{\"t\":\"h\",\"h\":\"<b>High growth and scaling<\\/b>\"},{\"t\":\"li1\",\"h\":\"A high growth business experiences rapid expansion in revenue, users, or market share over a short period, often growing faster than the wider market.\"},{\"t\":\"li1\",\"h\":\"High growth is measured using indicators such as revenue growth, customer numbers, market share, profitability, retention, or employee growth, and is relatively rare.\"},{\"t\":\"li1\",\"h\":\"High growth businesses often prioritise revenue growth over short-term profitability and require scalable models, agile leadership, and significant funding to manage operational pressure.\"},{\"t\":\"li1\",\"h\":\"A scale-up refers to the phase where a business with proven product-market fit and a viable model focuses on efficiently expanding operations, markets, and capacity to meet demand.\"},{\"t\":\"li1\",\"h\":\"Not all businesses pursue maximum growth; growth strategies are shaped by intended outcomes such as long-term independence, acquisition, public listing, export potential, or intergenerational stewardship (e.g. family-owned businesses).\"},{\"t\":\"li1\",\"h\":\"Leadership alignment, collaboration, and organisational culture strongly influence whether growth accelerates or stalls, with silos limiting performance.\"},{\"t\":\"li1\",\"h\":\"Funding decisions, working capital needs, foreign exchange exposure, and ownership expectations shape control, risk, and long-term sustainability during growth.\"},{\"t\":\"li1\",\"h\":\"Within many kaupapa Māori businesses growth may be understood as needing to balance economic performance with the protection of cultural values, relationships, and collective sustainability.\"},{\"t\":\"h\",\"h\":\"<b>Exporting businesses<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses may export to access larger markets, increase sales, diversify revenue, spread risk, gain economies of scale, or use capabilities and resources that are valued internationally.\"},{\"t\":\"li1\",\"h\":\"Export preparedness can be assessed through product readiness, market readiness, and organisational readiness. This includes having a suitable product or services, evidence of demand, an appropriate market-entry strategy, and the finance, systems, people, logistics, and risk-management capability needed to enter and sustain an overseas market.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Compare start-ups, scale-ups, and mature businesses, identifying the triggers that mean a business is ready to scale.\"},{\"t\":\"li1\",\"h\":\"Evaluate how rapid expansion affects cash flow, working capital, and long-term funding choices.\"},{\"t\":\"li1\",\"h\":\"Analyse the trade-offs of expansion, focusing on how to grow profits while preserving culture and practicing kaitiakitanga.\"},{\"t\":\"li1\",\"h\":\"Justify a long-term strategic pathway (e.g. acquisition, IPO, or trust) using real-world examples to weigh the risks and rewards.\"},{\"t\":\"li1\",\"h\":\"Apply product readiness, market readiness, and organisational readiness to determine a business’s export preparedness.\"}]},{\"name\":\"Government and non-government support for growth\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Supports for growth and export development<\\/b>\"},{\"t\":\"li1\",\"h\":\"Exporting is a high-risk, capability-dependent activity, with businesses typically progressing through stages of international expansion.\"},{\"t\":\"li1\",\"h\":\"External support influences a business’s export readiness, speed of international expansion, and ability to manage export risk.\"},{\"t\":\"li1\",\"h\":\"New Zealand Government support helps businesses overcome export barriers and build capability and confidence for international growth.\"},{\"t\":\"li1\",\"h\":\"Government support is typically targeted and staged according to a business’s capability, innovation, and export potential.\"},{\"t\":\"li1\",\"h\":\"Non-government support can accelerate international growth and shape export strategy through the provision of specialist expertise, capital, and global networks.\"},{\"t\":\"li1\",\"h\":\"In some community and Kaupapa Māori business contexts, export development may be guided by a range of outcomes, including whānau outcomes, cultural sustainability, and long-term intergenerational benefit, alongside profit and financial returns.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse the stages of international expansion for a New Zealand business and evaluate how government and non-government support can be strategically combined to drive export growth.\"},{\"t\":\"li1\",\"h\":\"Critically evaluate external support options using clear criteria to justify the most appropriate combination of resources for international growth.\"},{\"t\":\"li1\",\"h\":\"Examine the strategic conflicts between rapid expansion, capability development, and risk-management, evaluating how effectively available support addresses these competing demands.\"},{\"t\":\"li1\",\"h\":\"Evaluate how community business or kaupapa Māori values shape export strategies compared to conventional models.\"}]}]},\"agri\":{\"12\":{\"intro\":\"Agribusinesses grow by identifying opportunities, solving problems, and creating products and services that customers want. This might involve developing new food products, adopting technology, entering new markets, or improving the way the business operates. Students are taught how entrepreneurs and businesses turn ideas into successful ventures and examine the conditions needed for growth in New Zealand's primary industries. Examples could include agritech companies, food producers, horticultural businesses, and Māori agribusinesses.\",\"cases\":[{\"name\":\"Bluelab\",\"points\":[\"identifying opportunities to improve production through better monitoring and management of growing conditions\",\"growing from a New Zealand business to an internationally recognised export company\",\"responding to customer needs through ongoing research and product development.\"]},{\"name\":\"Rockit Apples\",\"points\":[\"transforming a traditional fruit product into a premium branded offering\",\"using packaging innovation and market research to access export markets\",\"growing from a local horticultural business into a global brand.\"]},{\"name\":\"Wakatū Incorporation\",\"points\":[\"creating growth while maintaining cultural values and intergenerational stewardship\",\"diversifying across horticulture, food production, and international markets.\"]}]},\"13\":{\"intro\":\"As agribusinesses grow, they face increasingly complex decisions about investment, innovation, expansion, exporting, and managing risk. Students examine how agri-startups develop into successful businesses, how growth is funded, and how and agribusiness determines whether they are ready to scale. Students explore how New Zealand agribusinesses compete internationally while also balancing commercial success with environmental and social responsibilities.\",\"cases\":[{\"name\":\"Large dairy conversion or irrigation project\",\"points\":[\"investment appraisal\",\"capital expenditure decisions\",\"assessing risks and returns over the long-term.\"]},{\"name\":\"Alliance Group\",\"points\":[\"growth through cooperative ownership and international market development\",\"export-focused business strategies\",\"adding value to primary products through processing and branding\",\"responding to changing consumer and market demands\",\"managing growth while maintaining farmer ownership.\"]},{\"name\":\"T&G Global\",\"points\":[\"managing a global fresh produce supply chain\",\"product innovation and premium branding\",\"growth through new varieties and export opportunities\",\"responding to changing consumer expectations.\"]}]}}},{\"name\":\"Strategic Business Management and Sustainability\",\"focus\":\"Business structures, strategy, governance, and sustainability, including how organisations are established, managed, and adapted to achieve their purpose while responding to stakeholder expectations, risk, and growth opportunities.\",\"inYear\":{\"12\":\"Students are taught how business structures, purpose, stakeholders, and strategic direction influence decision-making and performance. They apply strategic tools and frameworks to analyse business environments and inform business responses.\",\"13\":\"Students are taught to evaluate how businesses achieve long-term resilience and sustainability through governance, risk management, strategic planning, and responsible business practices.\"},\"years\":{\"12\":[{\"name\":\"Business foundation and types of business\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Business foundations<\\/b>\"},{\"t\":\"li1\",\"h\":\"The legal structure of a business determines how ownership, control, liability, finance, and profit distribution are arranged, shaping organisational behaviour and outcomes.\"},{\"t\":\"li1\",\"h\":\"Legal structures in the private sector include sole traders, partnerships, and companies.\"},{\"t\":\"li1\",\"h\":\"Trusts manage assets for beneficiaries: Ownership is held in trust, control is exercised by trustees, liability is limited, and benefits are distributed.\"},{\"t\":\"li1\",\"h\":\"Cooperatives are member-owned and controlled, with limited liability; surpluses are shared or reinvested.\"},{\"t\":\"li1\",\"h\":\"Charities and not-for-profits pursue social purposes; they are controlled by boards, have limited liability, and reinvest surpluses.\"},{\"t\":\"li1\",\"h\":\"Incorporated societies clubs are member-owned, committee-controlled, with limited liability and reinvested surplus.\"},{\"t\":\"h\",\"h\":\"<b>Māori businesses and agribusiness<\\/b>\"},{\"t\":\"li1\",\"h\":\"Māori enterprises often use companies alongside trusts and Post-Settlement Governance Entities (PSGEs), reflecting collective ownership, governance, and stewardship.\"},{\"t\":\"li1\",\"h\":\"Agribusinesses operate under a range of ownership structures, including sole traders, partnerships, limited liability companies, cooperatives, and Māori trusts, reflecting both individual and collective ownerships.\"},{\"t\":\"h\",\"h\":\"<b>Business size<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses in New Zealand range in size from micro and small enterprises to medium and large firms.\"},{\"t\":\"li1\",\"h\":\"Business size is commonly classified using employee numbers, with small and medium-sized enterprises (SMEs) making up most New Zealand businesses.\"},{\"t\":\"li1\",\"h\":\"Business size influences access to resources, management structures, operational flexibility, and economic impact.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Recognise different business forms and activities (e.g. sole trader, partnership, company; primary, secondary, tertiary sectors).\"},{\"t\":\"li1\",\"h\":\"Examine how different legal structures in New Zealand determine ownership, control, liability, and how profits or benefits are distributed.\"},{\"t\":\"li1\",\"h\":\"Apply business concepts to examine how different organisational forms operate in a range of contexts.\"},{\"t\":\"li1\",\"h\":\"Examine how business size influences operations, decision-making, access to resources, risk, and growth opportunities.\"},{\"t\":\"li1\",\"h\":\"Analyse how businesses interact with supply chains across sectors to support production and delivery.\"}]},{\"name\":\"Strategic positioning and direction\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Strategic direction<\\/b>\"},{\"t\":\"li1\",\"h\":\"Strategic direction encompasses a business’s vision and mission statement.\"},{\"t\":\"li1\",\"h\":\"A vision statement describes an organisation’s desired future state. It outlines what it hopes to achieve in the long-term.\"},{\"t\":\"li1\",\"h\":\"A mission statement defines an organisation’s purpose and pūtake, explaining what it does and why it exists.\"},{\"t\":\"li1\",\"h\":\"Businesses set goals and objectives to meet their strategic direction.\"},{\"t\":\"li1\",\"h\":\"Tools to assess strategic positioning include:\"},{\"t\":\"li2\",\"h\":\"Mendelow’s Power-Interest Matrix, used to identify and prioritise stakeholders and guide engagement strategies\"},{\"t\":\"li2\",\"h\":\"strengths, weakness, opportunities and threats (SWOT) analysis, which evaluates internal strengths and weaknesses and external opportunities and threats\"},{\"t\":\"li2\",\"h\":\"TOWS analysis, which converts SWOT findings into strategies.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Examine how vision statement, mission statement, and purpose.\"},{\"t\":\"li1\",\"h\":\"Influences organisational direction and decision-making.\"},{\"t\":\"li1\",\"h\":\"Identify stakeholders and their influence on business operations using tools such as Mendelow’s Power-Interest Matrix.\"},{\"t\":\"li1\",\"h\":\"Use strategic positioning tools (e.g. SWOT and TOWS) to evaluate internal and external environments and develop informed strategic responses.\"},{\"t\":\"li1\",\"h\":\"Apply systems thinking by connecting operations, risk, stakeholders, and strategy to understand how decisions impact overall business performance.\"}]},{\"name\":\"Resilience and sustainability\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Business policy and resilience<\\/b>\"},{\"t\":\"li1\",\"h\":\"Policies and procedures establish organisational standards and provide clear guidance for implementing them. They ensure consistent, safe, and lawful operation while supporting compliance and reducing risk.\"},{\"t\":\"li1\",\"h\":\"Businesses have a responsibility to consider social and environmental impacts alongside profit, extending beyond legal compliance in response to societal expectations.\"},{\"t\":\"li1\",\"h\":\"Operational management, risk-management, stakeholder engagement, and strategic planning are interconnected and contribute to business resilience and sustainability.\"},{\"t\":\"li1\",\"h\":\"Businesses use crisis management to prepare for unexpected events that may threaten operations, reputation, or financial viability, with the aim of maintaining continuity and stakeholder trust.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Evaluate how policies, procedures, and risk-management (including crisis and contingency planning) support business continuity, safety, and reputational risk.\"},{\"t\":\"li1\",\"h\":\"Explain how societal expectations and external pressures shape responsible business behaviour across economic, social, cultural, and environmental dimensions.\"},{\"t\":\"li1\",\"h\":\"Assess how businesses respond to a crisis (e.g. Covid, flooding, increased oil prices).\"}]}],\"13\":[{\"name\":\"Business foundation and types of business\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Legal structures of business<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses in New Zealand can operate under different legal structures, such as sole traders, partnerships, companies, cooperatives, trusts, charities, and incorporated societies.\"},{\"t\":\"li1\",\"h\":\"Legal structures determine ownership, control, liability, compliance requirements, finance, and how profits or benefits are distributed, therefore choosing a legal structure is a strategic decision.\"},{\"t\":\"h\",\"h\":\"<b>Kaupapa Māori and government entities<\\/b>\"},{\"t\":\"li1\",\"h\":\"Māori enterprises operate through structures such as Māori land trusts, PSGE’s, and iwi-owned companies. These legal structures determine ownership, control, liability, compliance requirements, access to finance, and how profits or benefits are distributed.\"},{\"t\":\"li1\",\"h\":\"These structures separate legal ownership (held by trustees or governance bodies) from beneficial ownership (held by iwi, hapū, or whānau). Māori land trusts focus on managing collectively owned land, while PSGEs manage te Tiriti o Waitangi | the Treaty of Waitangi settlement assets, both prioritising collective benefit, and intergenerational stewardship.\"},{\"t\":\"li1\",\"h\":\"Decision-making sits with trustees or directors, who must meet legal obligations, with liability held by the entity rather than individuals. Benefits are distributed to beneficiaries or reinvested to support long-term collective outcomes.\"},{\"t\":\"li1\",\"h\":\"Iwi-owned companies are often structured to operate commercially, generating returns that may be distributed back to the iwi or reinvested to support long-term development goals.\"},{\"t\":\"li1\",\"h\":\"Government profit-driven entities include State-Owned Enterprises (SOEs) and mixed-ownership companies, which operate commercially with government ownership.\"},{\"t\":\"h\",\"h\":\"<b>Industrial sectors and classification<\\/b>\"},{\"t\":\"li1\",\"h\":\"New Zealand industries are formally classified using the Australian and New Zealand Standard Industrial Classification (ANZSIC) coding system, building on the primary, secondary, and tertiary sector model.\"},{\"t\":\"li1\",\"h\":\"ANZSIC classifications can be aggregated into primary, goods-producing, and services sectors.\"},{\"t\":\"li1\",\"h\":\"Sector composition changes over time due to technological change, globalisation, productivity shifts, consumer demand, and government policy.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Compare how different structures shape decision-making authority, leadership roles, accountability, and organisational complexity.\"},{\"t\":\"li1\",\"h\":\"Evaluate the suitability of organisational structures for different purposes, ownership arrangements, and desired outcomes.\"},{\"t\":\"li1\",\"h\":\"Analyse how organisational structures support collective outcomes, stewardship, and long-term sustainability.\"},{\"t\":\"li1\",\"h\":\"Investigate an iwi-owned corporation and explain its ownership, control, liability, and profit distribution.\"},{\"t\":\"li1\",\"h\":\"Classify businesses and organisations within industries and sectors, explaining how structure and sector influence operations and characteristics.\"},{\"t\":\"li1\",\"h\":\"Investigate risks, opportunities, and external influences affecting industries and sectors.\"}]},{\"name\":\"Strategic positioning and direction\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Strategic direction<\\/b>\"},{\"t\":\"li1\",\"h\":\"Strategic direction guides decisions, including growth, positioning and investment.\"},{\"t\":\"li1\",\"h\":\"Businesses may need to adapt their strategic direction when market conditions, stakeholder expectations, technology, regulation, competition, or environmental pressures change.\"},{\"t\":\"li1\",\"h\":\"Tools to assess strategic positioning include:\"},{\"t\":\"li2\",\"h\":\"Porter’s Five Forces, used to analyse industry competitiveness, attractiveness, and long-term profitability by examining rivalry, buyer power, supplier power, substitutes, and new entrants.\"},{\"t\":\"li2\",\"h\":\"STEEPLE analysis, used to examine macro-environment factors (social, technological, economic, environmental, political, legal, and ethical) that influence business strategy, risk, and opportunities beyond a business’s direct control.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Analyse how businesses have balanced purpose, profit, accountability, and transparency to build trust, reputation, and long-term legitimacy.\"},{\"t\":\"li1\",\"h\":\"Analyse how stakeholder expectations and internal and external influences shape strategic decision-making and strategy.\"},{\"t\":\"li1\",\"h\":\"Use strategic frameworks (e.g. Porter’s Five Forces, STEEPLE) to assess industry competitiveness, external risks and opportunities, and recognise their limitations.\"}]},{\"name\":\"Resilience and sustainability\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Business sustainability<\\/b>\"},{\"t\":\"li1\",\"h\":\"Environmental, Social and Governance (ESG), is a way of assessing how responsibly a business operates by looking at its impact on the environment, its treatment of people, and how well it is managed.\"},{\"t\":\"li1\",\"h\":\"ESG may involve measuring and reporting metrics such as carbon emissions, workplace diversity, and governance practices, helping to strengthen business reputation, stakeholder confidence, and long-term sustainability.\"},{\"t\":\"li1\",\"h\":\"Futureproofing involves identifying long-term risks and opportunities and embedding adaptive responses into strategy to support long-term viability.\"},{\"t\":\"li1\",\"h\":\"Traditional linear business models follow a take-make-dispose approach, whereas circular business models minimise waste by keeping products and materials in use for as long as possible through reuse, repair, remanufacturing, and recycling.\"},{\"t\":\"li1\",\"h\":\"Circular business practices include product life extension, product-as-a-service, sharing models, circular inputs, and resource recovery, and are increasingly adopted in response to environmental pressures.\"},{\"t\":\"li1\",\"h\":\"Cultural responsibility involves the difference between cultural appropriation and cultural appreciation, the latter requiring collaboration, acknowledgement, and shared benefit.\"},{\"t\":\"li1\",\"h\":\"Deceptive marketing such as greenwashing occurs when businesses exaggerate sustainability claims, falsely label country of origin, undermining trust and increasing reputational and regulatory risk.\"},{\"t\":\"li1\",\"h\":\"A community or kaupapa Māori business perspective can be compared with ESG frameworks by considering how it may centre relationships, collective outcomes, and intergenerational responsibility, even where practices may appear similar.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Analyse how circular business models and sustainability approaches can be applied across sectors, including trade-offs between short-term profit and long-term outcomes.\"},{\"t\":\"li1\",\"h\":\"Evaluate the costs, benefits, and effectiveness of sustainability strategies from the perspective of a case study.\"},{\"t\":\"li1\",\"h\":\"Compare different perspectives on sustainability (e.g. ESG frameworks, community or kaupapa Māori approaches) and evaluate their implications for business strategy and integrity.\"},{\"t\":\"li1\",\"h\":\"Distinguish authentic responsible practices from greenwashing by analysing business actions and their impacts.\"}]}]},\"agri\":{\"12\":{\"intro\":\"Agribusinesses operate in a constantly changing environment that is influenced by climate, global and domestic markets, political regulations, consumer expectations, technology, and natural resources. Long-term success depends on making strategic decisions that balance profitability with environmental, social, cultural, and economic responsibilities and outcomes. Students investigate how agribusinesses manage risk, future proof, work with stakeholders, and maintain long-term viability.\",\"cases\":[{\"name\":\"Fonterra\",\"points\":[\"cooperative ownership structure\",\"balancing returns for farmers with environmental expectations\",\"managing global market pressures and sustainability commitments.\"]},{\"name\":\"Ngāi Tahu farming\",\"points\":[\"applying kaitiakitanga within commercial farming operations\",\"balancing financial returns with environmental and cultural outcomes\",\"long-term planning and intergenerational decision making.\"]},{\"name\":\"Mycoplasma bovis response\",\"points\":[\"managing a significant biosecurity threat\",\"stakeholder communication and crisis management\",\"industry-wide collaboration and government involvement.\"]}]},\"13\":{\"intro\":\"Agribusinesses have many examples of businesses responding to climate change, biosecurity threats, market pressures, changing regulations, and evolving consumer expectations. Strategic decisions based around these influences shape the future of an agribusiness. Students examine how businesses position themselves for long-term resilience and intergenerational success. They can investigate business structures, governance, future-proofing strategies, sustainability initiatives, and responses to external influences.\",\"cases\":[{\"name\":\"A2 Milk Company\",\"points\":[\"building a business around product differentiation\",\"strategic responses to international market opportunities\",\"managing rapid growth and changing consumer trends\",\"brand protection and market positioning\",\"balancing growth with long-term shareholder value.\"]},{\"name\":\"NZ King Salmon\",\"points\":[\"strategic management of environmental challenges\",\"stakeholder engagement and community consultation\",\"balancing growth with environmental constraints\",\"regulatory challenges, resource consent processes, and the long-term sustainability in aquaculture.\"]},{\"name\":\"Scales Corporation\",\"points\":[\"diversification across horticulture, food ingredients, and logistics\",\"growth through acquisition and investment\",\"strategic risk management across multiple business sectors\",\"long-term business sustainability and governance.\"]}]}}},{\"name\":\"Creating Value\",\"focus\":\"Innovation, operations, and marketing, and how businesses create, deliver, and communicate value in response to changing customer, technological, and market conditions.\",\"inYear\":{\"12\":\"Students are taught how innovation, production processes, supply chains, quality management, and market research contribute to business performance and competitive advantage.\",\"13\":\"Students are taught how businesses use innovation, technology, intellectual property, marketing strategy, and sales to achieve sustainable growth and long-term success. They analyse how businesses develop strategic advantages, respond to technological change, and create value across local and global markets.\"},\"years\":{\"12\":[{\"name\":\"Creating value through innovation\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Invention and innovation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Invention refers to the creation of new ideas, products, processes, or technologies, which only create economic value when developed into innovations.\"},{\"t\":\"li1\",\"h\":\"Innovation involves implementing or applying new or improve ideas, products, services or processes to create value and meet market needs.\"},{\"t\":\"li1\",\"h\":\"Product innovation includes new or significantly improved goods or services. This may be incremental (small improvements) or disruptive (creating new solutions).\"},{\"t\":\"li1\",\"h\":\"Process innovation involves implementing new or improved production or delivery.\"},{\"t\":\"li1\",\"h\":\"Product and process innovation can create competitive advantage, support growth, and strengthen long-term business resilience, while also introducing risk and uncertainty.\"},{\"t\":\"h\",\"h\":\"<b>Technological and scientific change<\\/b>\"},{\"t\":\"li1\",\"h\":\"Technological and scientific change involves the development and adoption of new digital, mechanical, and biological technologies that transform how businesses operate.\"},{\"t\":\"li1\",\"h\":\"These changes can alter productivity, cost structures, workforce requirements, and business models.\"},{\"t\":\"li1\",\"h\":\"Automation and generative AI tools are transforming the workforce by reducing demand for routine labour and increasing demand for specialised, technical, and data-driven roles.\"},{\"t\":\"li1\",\"h\":\"Effectively managing technological change is critical for long-term sustainability and resilience, requiring adaptation to emerging ethical, environmental, and regulatory challenges.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Analyse the relationship between invention, product innovation, and process innovation in business contexts.\"},{\"t\":\"li1\",\"h\":\"Assess how innovation supports growth, financial performance, competitive advantage, and long-term sustainability using examples from New Zealand businesses or agribusinesses.\"},{\"t\":\"li1\",\"h\":\"Analyse how technological or scientific change transforms productivity, costs, or business models.\"},{\"t\":\"li1\",\"h\":\"Propose product or process innovation strategies businesses could use to respond to market opportunities or technological change.\"}]},{\"name\":\"Creating value through marketing\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Market research<\\/b>\"},{\"t\":\"li1\",\"h\":\"Market research supports informed, data-driven decision-making that reduces risk, improves profitability, and supports product-market fit.\"},{\"t\":\"li1\",\"h\":\"It helps businesses understand customer needs, analyse competitors, identify trends, and uncover growth opportunities.\"},{\"t\":\"li1\",\"h\":\"Businesses use primary and secondary research to validate ideas, optimise pricing, and support growth decisions:\"},{\"t\":\"li2\",\"h\":\"primary research is collected first-hand (e.g. interviews, surveys)\"},{\"t\":\"li2\",\"h\":\"secondary research uses existing data (e.g. government statistics).\"},{\"t\":\"li1\",\"h\":\"Digital tools, including AI, are increasingly used to analyse large datasets and segment customers for more targeted marketing.\"},{\"t\":\"li1\",\"h\":\"Ethical considerations are important when collecting, analysing, and using market research data, including ensuring responsible data governance, protecting privacy, minimising bias, and using generative AI tools transparently and ethically.\"},{\"t\":\"li1\",\"h\":\"Competitor analysis enables businesses to evaluate rivals’ strengths, weaknesses, and strategies to identify competitive advantage.\"},{\"t\":\"h\",\"h\":\"<b>Marketing mix<\\/b>\"},{\"t\":\"li1\",\"h\":\"Markets can be segmented using demographic factors (who customers are) and psychographic factors (why they buy).\"},{\"t\":\"li1\",\"h\":\"Market share measures a business’s proportion of total market sales and is commonly a key growth objective.\"},{\"t\":\"li1\",\"h\":\"Businesses may target mass or niche markets and use strategies such as cost leadership, differentiation, or focus (Porter’s Generic Strategies) to develop competitive advantage.\"},{\"t\":\"li1\",\"h\":\"The 7Ps marketing mix (product, price, place, promotion, people, process, physical evidence) provides a framework for aligning marketing strategy with customer expectations.\"},{\"t\":\"li1\",\"h\":\"Responsible marketing requires avoiding cultural appropriation and respecting the values and contexts of communities.\"},{\"t\":\"h\",\"h\":\"<b>Sales<\\/b>\"},{\"t\":\"li1\",\"h\":\"Sales is the process through which a business completes the exchange of value with a customer, converting buyer interest into a purchase and generating revenue.\"},{\"t\":\"li1\",\"h\":\"Customers typically arrive informed, having already researched options and formed expectations. Effective selling begins with understanding what the customer already knows and what is still unresolved for them.\"},{\"t\":\"li1\",\"h\":\"Online selling platforms enable businesses to reach customers and complete transactions without face-to-face interaction, requiring compelling product presentation, appropriate platform selection, and the use of social proof (customer reviews, ratings, testimonials, and recommendations) to influence purchasing decisions.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Distinguish between primary and secondary market research and their purposes in decision-making.\"},{\"t\":\"li1\",\"h\":\"Analyse how businesses use market research to inform business decisions, including whether to pivot or persevere, to reduce risk.\"},{\"t\":\"li1\",\"h\":\"Discuss the ethical considerations of using AI in market research, including data use, bias, and privacy.\"},{\"t\":\"li1\",\"h\":\"Identify target markets using demographic and psychographic information.\"},{\"t\":\"li1\",\"h\":\"Apply the 7Ps marketing mix to develop market strategies.\"},{\"t\":\"li1\",\"h\":\"Analyse how value is created through exchanges between businesses and customers and evaluate the factors that influence purchasing decisions.\"},{\"t\":\"li1\",\"h\":\"Develop strategies that use customer reviews, ratings, testimonials, and recommendations to influence purchasing decisions.\"}]},{\"name\":\"Creating value through operations\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Production methods, productivity, and efficiency<\\/b>\"},{\"t\":\"li1\",\"h\":\"Production methods can be classified as labour-intensive or capital-intensive, depending on factor use, cost structures, and productivity outcomes.\"},{\"t\":\"li1\",\"h\":\"Common production methods include job, batch, and flow, each suited to different volumes, levels of customisation, and efficiency requirements.\"},{\"t\":\"li1\",\"h\":\"Productivity measures output per input, while efficiency focuses on minimising waste and resource use, often measured by cost per unit.\"},{\"t\":\"li1\",\"h\":\"Productivity and efficiency are influenced by workforce capability, management quality, supplier performance, production design, and investment in technology.\"},{\"t\":\"li1\",\"h\":\"Lean production aims to reduce waste and improve efficiency by eliminating nonvalue adding activities, often identified using TIMWOOD (transport, inventory, motion, waiting, overproduction, overprocessing, defects), and supported through practices such as Kaizen and Just in Time systems.\"},{\"t\":\"li1\",\"h\":\"Generative AI and automation enhance production performance by increasing accuracy, reducing downtime, optimising scheduling, and improving real-time decision-making (e.g. predictive maintenance, robotics with vision systems, digital twins, process-optimisation algorithms).\"},{\"t\":\"li1\",\"h\":\"From a te ao Māori perspective, productivity and efficiency are assessed not only by output and cost, but by how well business activity sustains people, whenua, relationships, and future generations.\"},{\"t\":\"h\",\"h\":\"<b>Process improvement, health and safety<\\/b>\"},{\"t\":\"li1\",\"h\":\"Process improvement involves systematically identifying and eliminating inefficiencies in production to reduce costs, improve quality, and increase productivity.\"},{\"t\":\"li1\",\"h\":\"Businesses pursue process improvement in response to competitive pressure, changing customer expectations, rising input costs, or the availability of new technology.\"},{\"t\":\"li1\",\"h\":\"Businesses have a legal and ethical obligation to provide a safe working environment for employees, contractors, and visitors. Effective health and safety management reduces workplace incidents, improves productivity, and protects business reputation.\"},{\"t\":\"li1\",\"h\":\"Failure to meet health and safety obligations can result in serious harm, legal penalties, financial liability, and long-term reputational damage.\"},{\"t\":\"h\",\"h\":\"<b>Supply chains and enabling technology<\\/b>\"},{\"t\":\"li1\",\"h\":\"The supply-chain connects raw material sourcing, production, storage, distribution, and delivery to the customer. Disruptions at any stage can affect cost, quality, or customer satisfaction.\"},{\"t\":\"li1\",\"h\":\"Effective supply-chain management helps businesses control costs, reduce delays, maintain quality, and respond to demand, while also considering ethical sourcing and sustainability, particularly in global supply chains.\"},{\"t\":\"li1\",\"h\":\"Logistics is the planning, movement, storage and delivery of goods within a supply-chain.\"},{\"t\":\"li1\",\"h\":\"AI and lean supply-chain practices enhance performance through improved visibility, forecasting, automation, and logistics optimisation, while reducing waste and resource consumption through more efficient inventory, delivery, and operational management.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse labour-intensive and capital-intensive production methods and evaluate their suitability for different business scenarios, industries, and operational contexts.\"},{\"t\":\"li1\",\"h\":\"Evaluate strategies for improving operational efficiency, including workforce changes, process redesign, lean production, automation, and AI adoption.\"},{\"t\":\"li1\",\"h\":\"Analyse how a te ao Māori perspective can inform approaches to productivity, efficiency, and sustainable resource use.\"},{\"t\":\"li1\",\"h\":\"Evaluate strategies for process improvement, including lean production, technology investment, and AI adoption.\"},{\"t\":\"li1\",\"h\":\"Evaluate the legal, and ethical obligations businesses must provide for a safe working environment.\"}]}],\"13\":[{\"name\":\"Creating value through innovation\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Innovation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Innovation creates value when new or improved ideas are implemented across the value chain, including logistics, operations, marketing, and service, rather than occurring in isolation.\"},{\"t\":\"li1\",\"h\":\"Value chain activities are interdependent, meaning innovation in one area affects others and requires coordination to avoid reducing overall value.\"},{\"t\":\"li1\",\"h\":\"Effective innovation depends on alignment across inputs, processes, outputs, and customer experience; misalignment can lead to inefficiencies, bottlenecks, or inconsistent value delivery.\"},{\"t\":\"li1\",\"h\":\"Process innovation improves how value is created and delivered, while product innovation improves goods or services; integrating both supports efficiency, differentiation, and scalability.\"},{\"t\":\"li1\",\"h\":\"Innovation involves uncertainty and risk and can result in trade-offs so requires ongoing evaluation to ensure efficiency, flexibility, and decisions around resource allocation.\"},{\"t\":\"li1\",\"h\":\"Technological change enables value-chain innovation through automation, generative AI tools, data analytics, and digital integration, transforming productivity, cost structures, and capability requirements.\"},{\"t\":\"h\",\"h\":\"<b>Intellectual property<\\/b>\"},{\"t\":\"li1\",\"h\":\"Intellectual property (IP) provides legal rights that protect innovation, enabling businesses to capture value and gain commercial advantage.\"},{\"t\":\"li1\",\"h\":\"Main forms of IP include patents, trademarks, copyright, registered designs, and trade secrets, each protecting different aspects of innovation across the value chain.\"},{\"t\":\"li1\",\"h\":\"IP is applied across product development, operations, branding, and marketing, and can support commercialisation through licensing or controlled knowledge use.\"},{\"t\":\"li1\",\"h\":\"IP strategy involves decisions about whether to protect, share, or retain innovations, balancing cost, disclosure, market reach, and value capture.\"},{\"t\":\"li1\",\"h\":\"While IP systems encourage investment in innovation, they also raise ethical and competitive trade-offs by limiting knowledge sharing and access.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Analyse how product and process innovation create value across the value chain and influence other value chain activities.\"},{\"t\":\"li1\",\"h\":\"Investigate how innovation strategies across the value chain contribute to competitive advantage, value add, and business viability.\"},{\"t\":\"li1\",\"h\":\"Distinguish between key forms of intellectual property (IP) and justify appropriate protection choices for different types of innovation.\"},{\"t\":\"li1\",\"h\":\"Analyse how intellectual property supports commercialisation and reduces risk using real business cases.\"},{\"t\":\"li1\",\"h\":\"Discuss the ethics of knowledge sharing and limited access to IP.\"}]},{\"name\":\"Creating value through marketing\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Marketing strategy<\\/b>\"},{\"t\":\"li1\",\"h\":\"A marketing strategy is a long-term plan for understanding customers, communicating value, and achieving sustainable profit and growth.\"},{\"t\":\"li1\",\"h\":\"Marketing strategy creates value by aligning offerings with customer needs, strengthening competitive advantage, and guiding branding and positioning decisions.\"},{\"t\":\"li1\",\"h\":\"A brand is the overall perception and feeling people have about a company, product, or service. Brand strategy may be a subset of the marketing strategy.\"},{\"t\":\"li1\",\"h\":\"Businesses use strategic tools such as analysis frameworks (e.g. positioning matrices, Boston Matrix, Porter’s Five Forces) and strategy frameworks (e.g. Ansoff Matrix, Blue Ocean Strategy) to inform marketing decisions.\"},{\"t\":\"li1\",\"h\":\"Technological change has transformed marketing research, planning, and strategy by enabling data-driven decision-making through digital tools and AI that help understand customer behaviour and measure marketing effectiveness, to improve efficiency and customer engagement.\"},{\"t\":\"li1\",\"h\":\"Sustainable business practices, such as circular models, shift marketing from promoting consumption to emphasising durability, reuse, and long-term value, influencing the marketing mix and brand perception.\"},{\"t\":\"li1\",\"h\":\"Effective global marketing strategy requires cultural awareness, responsible adaptation, and social responsiveness to build trust and consistency across markets.\"},{\"t\":\"h\",\"h\":\"<b>Sales<\\/b>\"},{\"t\":\"li1\",\"h\":\"Value is created through the interaction between the seller and customer, with successful sales reflecting how well customer needs and expectations are understood and addressed.\"},{\"t\":\"li1\",\"h\":\"Social proof, such as reviews, recommendations, and customer experiences, influences purchasing decisions, and shapes customer perceptions before direct engagement with a business.\"},{\"t\":\"li1\",\"h\":\"Online selling performance can be evaluated using sales results, customer feedback, and digital analytics to inform improvements in strategy and decision-making.\"},{\"t\":\"li1\",\"h\":\"Customer questions, objections, and purchasing decisions provide valuable market insights that guide product development, pricing, and marketing strategies.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate the purpose of a marketing strategy and how it supports business growth, brand positioning, and decision-making.\"},{\"t\":\"li1\",\"h\":\"Develop and evaluate marketing strategies that support business growth, brand positioning, and organisational objectives.\"},{\"t\":\"li1\",\"h\":\"Analyse how businesses adapt marketing strategies for global markets, while maintaining cultural relevance, social responsiveness, and brand consistency.\"},{\"t\":\"li1\",\"h\":\"Assess how value co-creation and customer context influence sales outcomes.\"},{\"t\":\"li1\",\"h\":\"Evaluate the impact of social proof on customer purchasing decisions.\"},{\"t\":\"li1\",\"h\":\"Use sales data, customer feedback, and online analytics to evaluate sales effectiveness, identify factors influencing customer decisions, and recommend improvements.\"}]},{\"name\":\"Creating value through operations\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Quality and continuous improvement<\\/b>\"},{\"t\":\"li1\",\"h\":\"Quality creates value by reducing defects, delays, and waste while increasing reliability, consistency, and customer satisfaction, strengthening loyalty and willingness to pay.\"},{\"t\":\"li1\",\"h\":\"Quality control (QC) involves checking outputs against quality standards, typically through inspections, testing, or customer feedback.\"},{\"t\":\"li1\",\"h\":\"Quality assurance (QA) focuses on embedding quality throughout the production process so that defects are prevented rather than detected after they occur, making quality a shared organisational responsibility.\"},{\"t\":\"li1\",\"h\":\"Total Quality Management (TQM) is an organisation-wide approach focused on continuous improvement and customer satisfaction, supported by practices such as quality circles, where employees identify and solve problems collaboratively.\"},{\"t\":\"li1\",\"h\":\"AI can enhance quality outcomes by improving accuracy, prediction, and consistency, but only when supported by high-quality data, clear rules, and effective human oversight.\"},{\"t\":\"li1\",\"h\":\"From a te ao Māori perspective, quality is measured by the integrity of processes and the impact on people, relationships, whenua, and future generations, expressed through concepts such as manaakitanga, mana, kaitiakitanga, and tikanga, not just final product performance.\"},{\"t\":\"h\",\"h\":\"<b>Value chain and strategic advantage<\\/b>\"},{\"t\":\"li1\",\"h\":\"A value chain examines how value is created and added through a business’s primary and support activities, whereas a supply-chain focuses on the flow of materials, information, and products from suppliers to customers. Improving quality, cost efficiency, speed, innovation, and sustainability across the value chain can enhance customer value and strengthen competitive advantage.\"},{\"t\":\"li1\",\"h\":\"Value-chain analysis helps businesses identify where product or process innovation can create differentiated value, often requiring protection through IP to sustain advantage.\"},{\"t\":\"li1\",\"h\":\"Technology and AI enhance every stage of the value chain by improving efficiency, enabling innovation, and supporting value capture and protection.\"},{\"t\":\"li1\",\"h\":\"Strategic location decisions aim to support a business's long-term success by considering factors such as workforce availability, infrastructure, access to markets and supply chains, regulatory requirements, sustainability, and expectations of local communities.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Use quality measures such as standards, defect rates, and customer feedback to assess performance and identify improvement opportunities.\"},{\"t\":\"li1\",\"h\":\"Apply quality management practices, such as quality assurance systems, lean waste reduction, and quality circles, to improve workflow, product consistency, productivity, and operational efficiency.\"},{\"t\":\"li1\",\"h\":\"Distinguish between supply chain and value chain activities.\"},{\"t\":\"li1\",\"h\":\"Recommend where innovation could add value at specific stages of the value chain for a given business.\"},{\"t\":\"li1\",\"h\":\"Explain how location affects a business’s long-term viability.\"}]}]},\"agri\":{\"12\":{\"intro\":\"Agribusinesses create value through innovation, marketing, processing, branding, quality management, and supply chain activities. Students consider how businesses meet customer needs, develop competitive advantage, and capture greater value from products and services. Understanding how value is created throughout the agribusiness value chain helps students see how businesses grow profitability while responding to changing market demands.\",\"cases\":[{\"name\":\"Zespri\",\"points\":[\"development of premium kiwifruit varieties\",\"brand development and international marketing\",\"managing intellectual property and global supply chains.\"]},{\"name\":\"Lewis Road Creamery\",\"points\":[\"premium product positioning\",\"creating value through branding and customer perception\",\"product differentiation within a competitive dairy market.\"]},{\"name\":\"Mānuka Honey Sector\",\"points\":[\"creating value through traceability, quality assurance, and origin branding\",\"building consumer trust through certification and product authenticity.\"]}]},\"13\":{\"intro\":\"Agribusinesses increasingly compete through innovation, technology, branding, and value-added products rather than simply producing commodities. Agribusiness contexts help students understand how innovation, intellectual property, marketing strategy, and operational excellence contribute to sustainable competitive advantage. Students explore how value is created across the entire value chain, from research and production through to processing, marketing, distribution, and customer experience.\",\"cases\":[{\"name\":\"Comvita\",\"points\":[\"creating value from natural products\",\"international branding and premium market positioning\",\"product innovation and research\",\"intellectual property and product differentiation\",\"building value through sustainability and provenance.\"]},{\"name\":\"Silver Fern Farms\",\"points\":[\"moving from commodity production to branded food products\",\"creating value through traceability and provenance\",\"meeting customer requirements in international markets\",\"product differentiation and sustainability\",\"value chain management from farm to consumer.\"]},{\"name\":\"Zespri\",\"points\":[\"protection of intellectual property through plant variety rights\",\"global marketing and branding strategies\",\"value creation throughout the kiwifruit value chain.\"]}]}}},{\"name\":\"Workforce and Financial Viability\",\"focus\":\"People, leadership, and financial decision-making, and how businesses manage human and financial resources to achieve organisational goals and long-term success.\",\"inYear\":{\"12\":\"Students are taught how leadership, motivation, organisational structures, workplace culture, and employment practices influence business performance. They analyse financial information, including cash flow, cost-volume-profit relationships, and internal controls, to support operational and financial decision-making.\",\"13\":\"Students are taught how businesses use financial reporting, investment appraisal, and sources of finance to support strategic decisions and long-term sustainability. They examine accountability and stakeholder interests, leadership, governance, and resource management in business contexts.\"},\"years\":{\"12\":[{\"name\":\"People and culture\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Leadership<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses rely on human capital, people’s skills, knowledge and abilities, to operate successfully.\"},{\"t\":\"li1\",\"h\":\"Motivation influences performance and can be intrinsic (internal satisfaction, pride, purpose) or extrinsic (external rewards such as pay, bonuses, or promotion).\"},{\"t\":\"li1\",\"h\":\"Leadership and management are related but distinct. Leadership focuses on vision, influence, and inspiration, while management focuses on coordination, organisation, and operational efficiency.\"},{\"t\":\"li1\",\"h\":\"Leadership styles include autocratic, democratic, laissez-faire, and situational leadership. These styles differ in the level of leader control, employee participation, task requirements, and employee needs.\"},{\"t\":\"li1\",\"h\":\"Leadership can be shared across people with different expertise, responsibilities, and forms of influence rather than concentrated in a single individual. This approach is common in many Kaupapa Māori and community businesses, drawing on diverse knowledge and perspectives.\"},{\"t\":\"h\",\"h\":\"<b>People and culture<\\/b>\"},{\"t\":\"li1\",\"h\":\"Employment decisions related to recruitment, wages, health and safety, diversity, and redundancy can be analysed in terms of how they affect individuals, business resilience, and community outcomes.\"},{\"t\":\"li1\",\"h\":\"People-focused workplace strategies include fair pay, safe working conditions, inclusive recruitment, training and development, flexible work. These strategies can support employee well-being, staff retention, productivity, and a positive workplace culture.\"},{\"t\":\"li1\",\"h\":\"Social sustainability involves considering the ethical and long-term impacts of employment decisions on people, businesses, and communities.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Analyse how intrinsic and extrinsic motivation influence employee performance, engagement, and retention.\"},{\"t\":\"li1\",\"h\":\"Evaluate leadership styles, to determine their suitability for different business contexts, tasks, and employee needs.\"},{\"t\":\"li1\",\"h\":\"Analyse employment decisions to assess their ethical and long-term impacts on individuals, businesses, and communities.\"},{\"t\":\"li1\",\"h\":\"Analyse how manaakitanga and whanaungatanga may guide employment decisions and support social licence to operate in New Zealand.\"},{\"t\":\"li1\",\"h\":\"Evaluate workplace strategies, such as fair pay, safe working conditions, inclusive recruitment, training and development and flexible work to assess their impact on employee well-being, business performance, and community trust.\"}]},{\"name\":\"Operational finance and internal controls\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Cash flow forecasting<\\/b>\"},{\"t\":\"li1\",\"h\":\"A cash flow forecast estimates future cash inflows, outflows, and closing cash balances over a stated period.\"},{\"t\":\"li1\",\"h\":\"Cash inflows include cash sales, payments from customers for credit sales, borrowing, owner investment, grants, and proceeds from asset sales; cash outflows include payments to suppliers, wages, rent, tax, loan repayments, and asset purchases.\"},{\"t\":\"li1\",\"h\":\"A business can be profitable but experience cash flow difficulties when customers have not yet paid accounts receivable.\"},{\"t\":\"li1\",\"h\":\"Cash flow forecasts help businesses anticipate shortages or surpluses and plan the timing of expenditure, borrowing, stock purchases, and customer or supplier payments.\"},{\"t\":\"li1\",\"h\":\"Businesses can respond to a cash shortage by collecting debts more quickly, changing payment terms, reducing or delaying expenditure, reducing inventory levels, selling assets, or accessing short-term finance; these responses involve trade-offs in cost, speed, and stakeholder relationships.\"},{\"t\":\"h\",\"h\":\"<b>Cost, volume and profit planning<\\/b>\"},{\"t\":\"li1\",\"h\":\"Cost-volume-profit analysis examines the relationship between selling price, sales volume, fixed costs, variable costs, contribution, and profit.\"},{\"t\":\"li1\",\"h\":\"Profit = Revenue – costs.\"},{\"t\":\"li1\",\"h\":\"Fixed costs remain unchanged as output or sales change within a relevant range, while variable costs change as output or sales change.\"},{\"t\":\"li1\",\"h\":\"Contribution per unit = Selling price per unit − Variable cost per unit. It is used to cover fixed costs and then generate profit.\"},{\"t\":\"li1\",\"h\":\"The break-even point is the level of sales at which total revenue equals total costs. At this point, the business makes neither a profit nor a loss.\"},{\"t\":\"li1\",\"h\":\"A target profit calculation identifies how many units a business must sell to cover its fixed costs and achieve a specified level of profit.\"},{\"t\":\"formula\",\"h\":\"Profit Target = <span class=\\\"frac\\\"><span>Fixed Costs + Target Profit<\\/span><span>Contribution per unit<\\/span><\\/span>\",\"x\":\"Profit Target = (Fixed Costs + Target Profit) ÷ Contribution per unit\"},{\"t\":\"li1\",\"h\":\"Changes in selling price, sales volume, fixed costs, or variable costs affect contribution, break-even, and projected profit target.\"},{\"t\":\"h\",\"h\":\"<b>Internal controls<\\/b>\"},{\"t\":\"li1\",\"h\":\"Internal controls are systems and procedures used to protect business resources, improve accuracy, reduce errors, and prevent fraud.\"},{\"t\":\"li1\",\"h\":\"Internal controls may include accurate records, invoices and receipts, authorisation procedures, separation of duties, stocktakes, bank reconciliations, and regular monitoring.\"},{\"t\":\"li1\",\"h\":\"Effective internal controls support accountability, reliable financial information, stakeholder confidence, and sound financial decision-making.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse cash flow information to assess whether a business has enough cash to meet its short-term obligations and offer solutions to ease cash flow issues.\"},{\"t\":\"li1\",\"h\":\"Calculate and interpret cost-volume-profit information, including contribution, break-even, margin of safety, and profit target.\"},{\"t\":\"li1\",\"h\":\"Model the impact of changes in price, sales volume, variable costs, or fixed costs on contribution, break-even, margin of safety, and profit.\"},{\"t\":\"li1\",\"h\":\"Analyse business situations to identify internal control weaknesses and recommend ways to protect cash, assets, and financial information.\"}]},{\"name\":\"Sources of finance and investment appraisal\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Sources of finance<\\/b>\"},{\"t\":\"li1\",\"h\":\"Businesses require finance to start, operate, invest, and grow. Sources may include retained earnings, owner investment, loans, overdrafts, trade credit, leasing, grants, crowdfunding, and investment from partners or shareholders.\"},{\"t\":\"li1\",\"h\":\"Finance may come from within the business, such as retained earnings, or from external providers. External finance may involve debt, which requires repayment and usually interest, or equity, which provides funds in return for ownership or a share of future returns.\"},{\"t\":\"li1\",\"h\":\"The suitability of a source of finance depends on its purpose, cost, availability, repayment requirements, risk, and effect on ownership and control.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse forms of finance, including internal, debt, and equity finance, by considering cost, risk, control, repayment, flexibility, and suitability for the business situation.\"}]}],\"13\":[{\"name\":\"People and culture\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Structure and culture<\\/b>\"},{\"t\":\"li1\",\"h\":\"Organisational structures include tall, flat, and matrix structures, which shape authority, span of control, communication flow, decision-making speed, coordination of human capital, and achievement of strategic objectives.\"},{\"t\":\"li1\",\"h\":\"The suitability of an organisational structure depends on organisational scale, industry context, technological complexity, workforce flexibility, and the level of collaboration or autonomy required.\"},{\"t\":\"li1\",\"h\":\"Organisational culture is shaped by shared values, norms, and practices. In New Zealand, tikanga Māori such as whakawhanaungatanga, kotahitanga, and manaakitanga may influence organisational identity, relationships, decision-making, and collective responsibility.\"},{\"t\":\"li1\",\"h\":\"Businesses may need to change in response to internal or external pressures, such as growth, competition, technology, financial performance, regulation, or changing stakeholder expectations.\"},{\"t\":\"li1\",\"h\":\"Resistance to change can occur at individual or organisational levels due to psychological, structural, or cultural factors.\"},{\"t\":\"li1\",\"h\":\"Awareness, desire, knowledge, ability and reinforcement (ADKAR), is a change management model that supports individual adoption of. It helps businesses manage resistance and embed change successfully.\"},{\"t\":\"h\",\"h\":\"<b>Responsible workplace practices<\\/b>\"},{\"t\":\"li1\",\"h\":\"Employment legislation sets minimum standards for pay, leave, working conditions, consultation, equality, and health and safety, while ethical employment may require businesses to go beyond legal compliance.\"},{\"t\":\"li1\",\"h\":\"Fair employment practices may also align with international frameworks that emphasise human rights, fair labour conditions, non-discrimination, safe work, and responsible business conduct.\"},{\"t\":\"li1\",\"h\":\"Creating a sustainable workplace requires embedding fair and ethical employment practices into core business operations and everyday decision-making.\"},{\"t\":\"li1\",\"h\":\"Businesses can ensure that suppliers and contractors, working for them, uphold fair working conditions and human rights. These supply-chain risks can be managed through ethical sourcing, supplier codes of conduct, audits, certification, grievance processes, and transparency.\"}],\"p\":[{\"t\":\"p\",\"h\":\"Note: Use case studies to support the teaching of the following practices.\"},{\"t\":\"li1\",\"h\":\"Assess organisational structures to determine their suitability for different business contexts.\"},{\"t\":\"li1\",\"h\":\"Analyse how different cultural and organisatio
