nal approaches shape leadership, decision-making, relationships, and shared responsibility within businesses, including kaupapa Māori and community businesses.\"},{\"t\":\"li1\",\"h\":\"Apply a change management model (e.g. ADKAR) to analyse how a business can manage resistance and support employees in adopting and embedding change.\"},{\"t\":\"li1\",\"h\":\"Consider how employment practices are embedded into business operations, policies, and everyday decision-making and how this impacts sustainability of the business.\"},{\"t\":\"li1\",\"h\":\"Assess how employment legislation, legal compliance, and international frameworks influence business decisions about fair, safe, and ethical employment.\"}]},{\"name\":\"Operational finance and internal controls\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Financial reporting<\\/b>\"},{\"t\":\"li1\",\"h\":\"Financial reporting provides evidence about performance, financial position, and cash movements. Reporting requirements depend on an entity’s legal structure, size, purpose, and public accountability.\"},{\"t\":\"li1\",\"h\":\"An income statement shows revenue, cost of sales, expenses, gross profit, and net profit over a period. It is used to assess sales performance, cost control, and whether the business is making enough profit from its activities.\"},{\"t\":\"li1\",\"h\":\"A balance sheet shows assets, liabilities, and equity at a point in time. It is used to assess what a business owns and owes, the extent of owner investment, whether the business has enough working capital for day-to-day operations, and the level of financial risk from debt.\"},{\"t\":\"li1\",\"h\":\"A statement of cash flow shows cash generated and used through operating, investing, and financing activities; it is used to assess how a business has funded its activities and whether its cash position is strengthening or weakening.\"},{\"t\":\"li1\",\"h\":\"Climate-related disclosure requires some large New Zealand organisations to prepare climate statements that report how climate-related risks and opportunities may affect governance, strategy, risk-management, and metrics and targets.\"},{\"t\":\"li1\",\"h\":\"A sustainability report communicates information about an organisation’s social, environmental, cultural, and governance impacts. In New Zealand, broader sustainability reports are generally voluntary, so they may vary in scope, quality, accuracy, and usefulness for stakeholder.\"},{\"t\":\"h\",\"h\":\"<b>Treaty settlements<\\/b>\"},{\"t\":\"li1\",\"h\":\"Treaty settlements provide iwi with significant resources intended to support long-term, intergenerational outcomes, such as wealth, education, housing, cultural outcomes, and economic development.\"},{\"t\":\"li1\",\"h\":\"Post-Settlement Governance Entities must balance commercial returns, investment growth, cultural responsibilities, and community outcomes when allocating settlement funds.\"},{\"t\":\"li1\",\"h\":\"Māori entities have financial reporting requirements based on their legal structure, such as a trust, company, charity, or incorporated society. Where entities manage collectively held assets, reporting also supports accountability to iwi, hapū, whānau, landowners, or beneficiaries.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse income statements to assess cost control, gross profit, expense control and net profit.\"},{\"t\":\"li1\",\"h\":\"Analyse statements of financial position to assess liquidity, solvency, and overall financial risk.\"},{\"t\":\"li1\",\"h\":\"Analyse statements of cash flows to assess how operating, investing, and financing activities affect an organisation’s cash position.\"},{\"t\":\"li1\",\"h\":\"Compare climate-related disclosure and sustainability reporting to assess the usefulness of non-financial information for stakeholders.\"},{\"t\":\"li1\",\"h\":\"Analyse financial reporting for Māori entities to assess how legal structure, collective ownership, and accountability to iwi, hapū, whānau, landowners, or beneficiaries shape reporting obligations and outcomes.\"}]},{\"name\":\"Sources of finance and investment appraisal\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Investment appraisal<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investment appraisal is used to evaluate whether a proposed investment is financially worthwhile by comparing its costs, expected returns, risks, and the timing of cash flows.\"},{\"t\":\"li1\",\"h\":\"The payback period measures how long it will take for an investment to recover its initial cost through net cash inflows.\"},{\"t\":\"li1\",\"h\":\"The accounting rate of return measures expected average annual accounting profit as a percentage of the initial investment.\"},{\"t\":\"li1\",\"h\":\"Liquidity is a business’s ability to pay its short-term debts using the cash it has available or assets that can quickly be turned into cash.\"},{\"t\":\"li1\",\"h\":\"Strategic investment decisions should also consider qualitative factors. These are strategic fit, organisational capability, environmental effects, reputation, and stakeholder outcomes.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate investment proposals using appraisal methods to assess profitability and liquidity, alongside qualitative factors to judge whether a strategic financial decision is suitable for the organisation.\"}]}]},\"agri\":{\"12\":{\"intro\":\"Agribusinesses often face unique challenges such as seasonal labour requirements, fluctuating commodity prices, and variable cash flows. Understanding how businesses manage these challenges helps students appreciate the importance of effective planning and decision-making. Students learn how agribusinesses manage employees, develop leadership, build workplace culture, and make financial decisions that support sustainability and growth.\",\"cases\":[{\"name\":\"Family dairy farm\",\"points\":[\"seasonal cash flow management\",\"succession planning\",\"labour management and staff retention.\"]},{\"name\":\"Seasonal horticultural business\",\"points\":[\"workforce planning during harvest periods\",\"recruitment and management of seasonal workers\",\"managing fluctuating income and expenditure.\"]},{\"name\":\"Sealord\",\"points\":[\"governance within a large Māori-owned business\",\"workforce planning across harvesting, processing, logistics, and export operations\",\"investment in vessels, technology, and processing infrastructure\",\"balancing profitability with sustainability and responsible resource management.\"]}]},\"13\":{\"intro\":\"Long-term agribusiness success depends on strong leadership, effective governance, financial management, and the ability to adapt to change. Students investigate how agribusinesses evaluate investments, manage financial risk, develop workplace culture, and maintain accountability to stakeholders. Agribusiness examples such as cooperatives, family-owned farms, and corporate enterprises demonstrate the importance of balancing financial outcomes with social, cultural, environmental, and intergenerational goals.\",\"cases\":[{\"name\":\"Ravensdown\",\"points\":[\"cooperative business structures and governance\",\"large-scale investment decisions\",\"workforce capability and organisational culture\",\"financial sustainability during changing economic conditions\",\"supporting shareholders while maintaining business viability.\"]},{\"name\":\"Pāmu Farms\",\"points\":[\"organisational structure and leadership\",\"large-scale agribusiness management\",\"sustainability and financial performance.\"]},{\"name\":\"Talley's Group\",\"points\":[\"workforce management across multiple industries and regions\",\"financial performance in a seasonal industry\",\"capital investment and business growth\",\"operational efficiency and supply chain management.\"]}]}}},{\"name\":\"Disciplinary Writing\",\"focus\":\"The use of writing to reflect the ways in which knowledge is organised, analysed, and communicated within the discipline.\",\"inYear\":{},\"years\":{\"12\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Business concepts, frameworks, and disciplinary terminology provide the foundation for analysing complex business issues and communicating strategic understanding.\"},{\"t\":\"li1\",\"h\":\"Business evidence from a range of sources can be selected, interpreted, evaluated, and synthesised to support defensible business decisions, recommendations, and judgements about risks, opportunities and business performance.\"},{\"t\":\"li1\",\"h\":\"Business communication is shaped by purpose, audience, stakeholder needs, and disciplinary conventions, influencing how information, arguments, recommendations, and competing stakeholder perspectives are presented.\"},{\"t\":\"li1\",\"h\":\"Business texts use recognised structures, causal reasoning, and evidence-based argument to analyse, evaluate, compare, and justify business decisions, practices, and outcomes.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply business concepts and terminology precisely, controlling tense for theory versus evidence and using expanded noun groups and nominalisation to express complex ideas for specific purposes and audiences.\"},{\"t\":\"li1\",\"h\":\"Justify business decisions and recommendations for specific audiences by selecting and framing evidence strategically, using evaluative language, and maintaining appropriate formality and objectivity to establish credibility.\"},{\"t\":\"li1\",\"h\":\"Use complex sentence structures to analyse and evaluate business decisions and business practice.\"},{\"t\":\"li1\",\"h\":\"Construct sustained arguments by clearly positioning a viewpoint and integrating relevant business evidence through explicit causal and explanatory reasoning.\"},{\"t\":\"li1\",\"h\":\"Record, interpret and communicate information in written form using conventions of authentic business products and frameworks.\"}]}],\"13\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Business concepts, frameworks, and disciplinary terminology provide the foundation for analysing complex business issues and communicating strategic understanding.\"},{\"t\":\"li1\",\"h\":\"Business evidence from a range of sources can be selected, interpreted, evaluated, and synthesised to support defensible business decisions, recommendations, and judgements about risks, opportunities and business performance.\"},{\"t\":\"li1\",\"h\":\"Business communication is shaped by purpose, audience, stakeholder needs, and disciplinary conventions, influencing how information, arguments, recommendations, and competing stakeholder perspectives are presented.\"},{\"t\":\"li1\",\"h\":\"Business texts use recognised structures, causal reasoning, and evidence-based argument to analyse, evaluate, compare, and justify business decisions, practices, and outcomes.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply business concepts, frameworks, and terminology with control, using tense, nominalisation, and abstract noun groups to analyse complex strategic issues for specific purposes and audiences.\"},{\"t\":\"li1\",\"h\":\"Justify defensible business recommendations for specific stakeholders by strategically selecting, weighing, and framing evidence, evaluating competing stakeholder interests, and using evaluative and persuasive language with a formal, and objective register to establish authority and credibility.\"},{\"t\":\"li1\",\"h\":\"Select and use sentence structures to develop comparisons in order to assess effectiveness, implications, risks, and trade-offs in relation to competing business concepts and practices.\"},{\"t\":\"li1\",\"h\":\"Construct and defend sophisticated business arguments by positioning a strategic viewpoint, synthesising evidence from multiple sources and using explicit causal, evaluative, and conditional reasoning.\"},{\"t\":\"li1\",\"h\":\"Select, integrate and interpret information in written form using conventions of appropriate and authentic business products.\"}]}]},\"intro\":\"In Business Studies, students use explicitly taught disciplinary writing to analyse, evaluate, justify, and communicate business ideas, decisions, strategies, and outcomes using business concepts, frameworks, evidence, data, and terminology.\",\"writing\":true}]},{\"key\":\"cla\",\"name\":\"Classical Studies\",\"short\":\"Classical Studies\",\"years\":[12,13],\"c\":\"--cla\",\"source\":\"Classical Studies, Years 12–13 (October 2026)\",\"starts\":{\"12\":2029,\"13\":2030},\"lead\":\"In Classical Studies, students are taught multi-disciplinary methodologies about Classical Greece and Rome, including social and political structures such as hierarchy and roles, cultural ideals such as excellence and duty, and cultural achievements. Students are taught how to examine literature, mythology, religion, art, archaeology, history, social life, and politics. They are also taught to recognise how these have been shaped and have shaped the foundations of Western civilisation, influencing art, literature, and society, and culture.\",\"paras\":[\"Students are taught to examine classical texts, material culture, belief systems, and historical evidence to understand the ideas, values, and power structures that shaped Classical Greece and Rome. They are taught to recognise and analyse how classical societies have shaped and continue to influence cultures, institutions, and ways of thinking across time and place.\",\"Classical Studies provides students with the knowledge and practices to analyse literature, art and architecture, and societies of Classical Greece and Rome; examine classical primary sources as culturally situated artefacts; analyse evidence and perspectives within broader social, political, and ideological contexts; apply core disciplinary concepts, and develop critical and relational understandings of past societies, including the transmission and influence of classical ideas across time, place, and cultures.\",\"As students progress through Years 12–13, they are taught to interrogate primary evidence; evaluate competing interpretations of the classical world; synthesise evidence, contexts, and viewpoints; and construct increasingly sophisticated evidence-based interpretations, arguments, and judgements. This enables students to develop informed and critical understandings of the classical world, engage thoughtfully with multiple perspectives and knowledge systems, and draw well-reasoned and defensible conclusions about how evidence, interpretation, and context shape understandings of the past.\"],\"pathway\":\"Classical Studies leads to pathways in Classical Studies and related disciplines, such as humanities, history, philosophy, archaeology, and law.\",\"guidance\":[{\"title\":\"Knowledge and practices\",\"blocks\":[{\"t\":\"p\",\"h\":\"The Classical Studies teaching sequence is organised into strands and elements, and then further structured into knowledge and practices. The knowledge column sets out the declarative knowledge to be taught, while the practice column sets out the disciplinary skills, applications, and procedural knowledge. The practices underpin ways of working in Classical Studies and are specific to the discipline.\"},{\"t\":\"p\",\"h\":\"The teaching of all knowledge and practices is compulsory. However, schools can determine how learning is organised across the year, including integrating content from multiple elements and strands where this supports coherence and depth. Examples within the teaching sequence in brackets signified with ‘e.g.’ are provided as guidance only; as long as the intended knowledge and practices are met, schools and teachers may substitute contexts and examples that better reflect local environments, iwi and hapū connections, student interests, and teacher expertise.\"},{\"t\":\"p\",\"h\":\"Disciplinary writing is included in the teaching sequence to set out what subject-specific literacy is to be taught. It is organised into a knowledge component that is consistent across all year levels and a practice component sequenced across years.\"}]},{\"title\":\"Designing a programme\",\"blocks\":[{\"t\":\"p\",\"h\":\"The teaching sequence is designed to be taught as a non-linear programme. The knowledge and practice statements within each element are related, but teachers may select complementary statements from across the sequence or treat elements as discrete units of work. Disciplinary writing is most effectively taught when integrated across the teaching programme.\"}]},{\"title\":\"Scope of Classical Studies\",\"blocks\":[{\"t\":\"p\",\"h\":\"In this curriculum, the classical world is defined as the period from the Mycenaean civilisation of the Late Bronze Age (c.1650 BCE) to the sack of Rome by the Visigoths in 410 CE. This time frame provides the chronological boundaries for the study of classical societies, cultures, ideas, and their legacies.\"},{\"t\":\"p\",\"h\":\"Classical Studies is grounded in primary evidence; all strands and elements must be interpreted first through ancient texts, cultural artefacts, and material remains, with classical scholarship used to support, test, and extend interpretation.\"}]},{\"title\":\"Responsible use of AI\",\"blocks\":[{\"t\":\"p\",\"h\":\"Artificial intelligence (AI) can support learning, research, inquiry, and creative processes, but it may also introduce bias, inaccuracies, ethical concerns, and issues relating to ownership. AI should enhance, not replace, critical or creative thinking, source evaluation, subject knowledge, or students’ own analysis and decision-making. Responsible AI use emphasises the importance of exercising independent judgement, drawing on credible sources, verifying information, being transparent about AI use, considering diverse perspectives, and developing independent thinking.\"}]},{\"title\":\"Working with contexts\",\"blocks\":[{\"t\":\"p\",\"h\":\"In Classical Studies, learning is organised and understood through contexts. These are foundational sites of knowledge through which students encounter classical ideas, practices, values, and ways of thinking in depth.\"},{\"t\":\"p\",\"h\":\"The tables below outline core contexts for Classical Studies in Years 12 and 13. These contexts have been selected because they represent foundational areas of the discipline and provide opportunities for students to develop and demonstrate the specified knowledge and practices across the strands. Within each context, teachers should choose topics that provide sufficient scope and complexity to support the teaching sequence, drawing on material evidence to enable sustained interpretation, comparison, and evaluation.\"},{\"t\":\"p\",\"h\":\"The Supporting Guidance provides examples of appropriate topic selection within each context.\"}]}],\"contexts\":{\"12\":{\"title\":\"Context specifications – Year 12\",\"blocks\":[{\"t\":\"p\",\"h\":\"In <b>Year 12<\\/b>, teachers must choose <b>one<\\/b> context from <b>each<\\/b> column below, based on primary source evidence:\"},{\"t\":\"h\",\"h\":\"<b>Literary contexts<\\/b>\"},{\"t\":\"p\",\"h\":\"(Strand: Literature and Narrative)\"},{\"t\":\"li1\",\"h\":\"Epic\"},{\"t\":\"li1\",\"h\":\"Drama\"},{\"t\":\"li1\",\"h\":\"Epigram or lyric\"},{\"t\":\"li1\",\"h\":\"Histories or biography\"},{\"t\":\"li1\",\"h\":\"Philosophy.\"},{\"t\":\"ref\",\"h\":\"Scope of selected literary text(s) must be sufficient to meet all requirements of knowledge and practices.\"},{\"t\":\"h\",\"h\":\"<b>Artistic and architectural contexts<\\/b>\"},{\"t\":\"p\",\"h\":\"(Strand: Art and Architecture)\"},{\"t\":\"li1\",\"h\":\"Greek public art and architecture\"},{\"t\":\"li1\",\"h\":\"Private Roman art and architecture\"},{\"t\":\"li1\",\"h\":\"Greek vase painting\"},{\"t\":\"li1\",\"h\":\"Public art and architecture of the Roman Empire.\"},{\"t\":\"ref\",\"h\":\"Scope of selected artworks/pieces of architecture must be sufficient to meet all requirements of knowledge and practices.\"},{\"t\":\"h\",\"h\":\"<b>Religion and mythology contexts<\\/b>\"},{\"t\":\"p\",\"h\":\"(Strand: Society and History)\"},{\"t\":\"li1\",\"h\":\"Greek religion and mythology\"},{\"t\":\"li1\",\"h\":\"Roman religion and mythology.\"},{\"t\":\"h\",\"h\":\"<b>Social organisation contexts<\\/b>\"},{\"t\":\"p\",\"h\":\"(Strand: Society and History)\"},{\"t\":\"li1\",\"h\":\"Greek social organisation\"},{\"t\":\"li1\",\"h\":\"Roman social organisation.\"},{\"t\":\"h\",\"h\":\"<b>Interrelationship of Classical Knowledges must be authentically applied within the appropriate context(s) above.<\\/b>\"},{\"t\":\"p\",\"h\":\"See the Supporting Guidance for examples of appropriate topic selection within each selected context.\"}]},\"13\":{\"title\":\"Context specifications – Year 13\",\"blocks\":[{\"t\":\"p\",\"h\":\"In <b>Year 13<\\/b>, teachers must choose <b>one<\\/b> context from <b>each<\\/b> column below, based on primary source evidence:\"},{\"t\":\"h\",\"h\":\"<b>Literary contexts<\\/b>\"},{\"t\":\"p\",\"h\":\"(Strand: Literature and Narrative)\"},{\"t\":\"li1\",\"h\":\"Epic\"},{\"t\":\"li1\",\"h\":\"Drama\"},{\"t\":\"li1\",\"h\":\"Epigram or lyric\"},{\"t\":\"li1\",\"h\":\"Histories or biography\"},{\"t\":\"li1\",\"h\":\"Philosophy.\"},{\"t\":\"ref\",\"h\":\"Scope of selected literary text(s) must be sufficient to meet all requirements of knowledge and practices.\"},{\"t\":\"h\",\"h\":\"<b>Artistic and architectural contexts<\\/b>\"},{\"t\":\"p\",\"h\":\"(Strand: Art and Architecture)\"},{\"t\":\"li1\",\"h\":\"Greek public art and architecture\"},{\"t\":\"li1\",\"h\":\"Private Roman art and architecture\"},{\"t\":\"li1\",\"h\":\"Greek vase painting\"},{\"t\":\"li1\",\"h\":\"Public art and architecture of the Roman Empire.\"},{\"t\":\"ref\",\"h\":\"Scope of selected artworks/pieces of architecture must be sufficient to meet all requirements of knowledge and practices.\"},{\"t\":\"h\",\"h\":\"<b>Politics and ancient history contexts<\\/b>\"},{\"t\":\"p\",\"h\":\"(Strand: Society and History)\"},{\"t\":\"li1\",\"h\":\"Birth of the Athenian Empire (508 BCE–431 BCE)\"},{\"t\":\"li1\",\"h\":\"Rise of Sparta (464 BCE–371 BCE)\"},{\"t\":\"li1\",\"h\":\"Rise of Macedon and the fall of Persia (359 BCE–323 BCE)\"},{\"t\":\"li1\",\"h\":\"Death of the Roman Republic (133 BCE–31 BCE)\"},{\"t\":\"li1\",\"h\":\"Birth of Imperial Rome (44 BCE–27 CE)\"},{\"t\":\"li1\",\"h\":\"Princeps and Dominus (27 CE–96 CE).\"},{\"t\":\"h\",\"h\":\"<b>Interrelationship of Classical Knowledges must be authentically applied within the appropriate context(s) above.<\\/b>\"},{\"t\":\"p\",\"h\":\"See the Supporting Guidance for examples of appropriate topic selection within each selected context.\"}]}},\"support\":[{\"title\":\"Literary contexts\",\"blocks\":[{\"t\":\"h\",\"h\":\"<b>Suggested topics by chosen context<\\/b>\"},{\"t\":\"li1\",\"h\":\"<b>Epic:<\\/b> Iliad, Odyssey, Argonautica, Aeneid, Thebaid.\"},{\"t\":\"li1\",\"h\":\"<b>Drama:<\\/b> Aeschylus, Sophocles, Euripides, Aristophanes, Seneca, Plautus.\"},{\"t\":\"li1\",\"h\":\"<b>Lyric or epigram:<\\/b> Sappho, Callimachus, Martial, Juvenal, Horace, Sulpicia.\"},{\"t\":\"li1\",\"h\":\"<b>Histories or biography:<\\/b> Thucydides, Herodotus, Plutarch, Suetonius, Polybius.\"},{\"t\":\"li1\",\"h\":\"<b>Philosophy:<\\/b> Plato, Xenophon, Marcus Aurelius.\"},{\"t\":\"h\",\"h\":\"<b>Appropriate text selection and scope<\\/b>\"},{\"t\":\"p\",\"h\":\"At Year 12, appropriate text selection includes at least one text or author from one context. The text selection should reflect the cultural legacy of classical literature. There is the expectation that the scope includes, but is not limited to, one text or author with an emphasis on a robust number of extended extracts or chapters for depth study. For example, a single text might include Virgil’s <i>Aeneid<\\/i> or Homer’s <i>Iliad<\\/i>, or a selection of Aristophanes’ plays (<i>Wasps<\\/i> and <i>Frogs<\\/i>), or a selection of Juvenal’s <i>Satires<\\/i>. An example of multiple texts might include both Homeric epics or two of Sophocles’ tragedies.\"},{\"t\":\"p\",\"h\":\"At Year 13, appropriate text selection includes at least one primary text from at least one context, and a series of extracts or examples from one or more other texts or contexts for intertextual engagement. The text selection of the primary text should reflect the cultural legacy of classical literature. It is strongly recommended that text selection is based on the suggested texts under the relevant context. There is the expectation that the scope includes, but is not limited to, the entirety of the primary text, with an emphasis on a robust number of extended extracts or chapters for depth intertextual study with a series of extended extracts from one or more other texts or other cultural artefacts (e.g. Ara Pacis or Prima Porta).\"},{\"t\":\"h\",\"h\":\"<b>Intertextuality at Year 13<\\/b>\"},{\"t\":\"p\",\"h\":\"Intertextuality is the deliberate comparison, allusion, or dialogue by the author to other texts (texts primarily include literary but can also be outside literary tradition, e.g. speech, art, architecture). The focus is on literary text as the foundation; intertextuality is to help connect and further understand the literary work within its tradition and context.\"},{\"t\":\"p\",\"h\":\"Below are examples of appropriate intertext scope for a chosen primary text in Year 13.\"},{\"t\":\"h\",\"h\":\"<b>Primary text: Virgil’s Aeneid<\\/b>\"},{\"t\":\"p\",\"h\":\"Virgilian Intertext:\"},{\"t\":\"li1\",\"h\":\"would include <i>Iliad, Odyssey<\\/i>\"},{\"t\":\"li1\",\"h\":\"could include Catullan elegies, Apollonius, Lucretius, <i>Georgics, Eclogues<\\/i>\"},{\"t\":\"li1\",\"h\":\"other possible intertext: Augustan Context – Ara Pacis, Prima Porta, <i>Carmen Saeculares<\\/i>, Summa Viri (Augustan Forum)\"},{\"t\":\"li1\",\"h\":\"wider context: <i>Divine Comedy<\\/i>, Joseph Campbell Hero’s journey, Greek tragic structure.\"},{\"t\":\"h\",\"h\":\"<b>Primary text: Aristophanes’ Frogs<\\/b>\"},{\"t\":\"p\",\"h\":\"Aristophanic intertext:\"},{\"t\":\"li1\",\"h\":\"would include <i>Wasps<\\/i>, <i>Knights, Arkhanians, Lysistrata<\\/i> (not all)\"},{\"t\":\"li1\",\"h\":\"could include Eupolis, Cratinus\"},{\"t\":\"li1\",\"h\":\"could include Aeschylus, Sophocles, Euripides – specifically literary and dramatic criticism\"},{\"t\":\"li1\",\"h\":\"wider context or other intertext: Athenian democratic or civil war context – Thucydides, Aristotle, Pseudo-Xenophon, Agathon, post-classical satire and comedic political commentary.\"}]},{\"title\":\"Artistic and architectural contexts\",\"blocks\":[{\"t\":\"h\",\"h\":\"<b>Suggested topics by context<\\/b>\"},{\"t\":\"li1\",\"h\":\"<b>Greek vases:<\\/b> Geometric, Orientalising, Attic black-figure, Pioneers, Attic red-figure, Mannerists.\"},{\"t\":\"li1\",\"h\":\"<b>Greek public art and architecture:<\\/b> Sculpture, Relief, Temples, Theatre, Sanctuaries, Stele.\"},{\"t\":\"li1\",\"h\":\"<b>Private Roman art and architecture:<\\/b> Portraiture or busts, Domus italica, Wall-painting, Mosaics.\"},{\"t\":\"li1\",\"h\":\"<b>Public art and architecture of the Roman Empire:<\\/b> Portraiture, Fora, Temples, Entertainment structures, Military monuments, Civic infrastructure.\"},{\"t\":\"h\",\"h\":\"<b>Appropriate art and architecture selection and scope<\\/b>\"},{\"t\":\"p\",\"h\":\"There is an expectation that a wide range of art works are studied to encapsulate the breadth of the artistic context and development over time. In addition to this, there should be an in-depth engagement with a series of selected art works that are representative of the style, detail, and learning. As an approximate guide where specified: ‘multiple’ refers to at least two, ‘a range or series’ refers to at least three, and ‘a wide range’ refers to at least five artworks.\"},{\"t\":\"p\",\"h\":\"Below are examples of potential breadth and depth that could be covered:\"},{\"t\":\"h\",\"h\":\"<b>Greek vases<\\/b>\"},{\"t\":\"p\",\"h\":\"This might include examining geometric patterns through selected vases. For example:\"},{\"t\":\"li1\",\"h\":\"exploring Orientalising motifs on Corinthian aryballoi\"},{\"t\":\"li1\",\"h\":\"analysing Attic narrative scenes in the works of Sophilos and Exekias\"},{\"t\":\"li1\",\"h\":\"investigating bilingual vases by the Andokides Painter\"},{\"t\":\"li1\",\"h\":\"studying the innovations of the Pioneer Group (Euthymides and Euphronios)\"},{\"t\":\"li1\",\"h\":\"and considering transitional styles in the Berlin and Kleophrades Painters, as well as Mannerist tendencies in the Niobid and Medias Painters.\"},{\"t\":\"p\",\"h\":\"Within this broader context of 12–15 vases, three to five key works should be selected for in-depth study to support a deeper understanding of artistic developments.\"},{\"t\":\"h\",\"h\":\"<b>Public art and architecture of the Roman Empire<\\/b>\"},{\"t\":\"p\",\"h\":\"The broader study of Republican veristic portraiture through multiple examples as context (Patrician carrying busts, Capitoline Brutus). For example:\"},{\"t\":\"li1\",\"h\":\"early imperial portraiture (Augustus of Prima Porta, Augustus Forbes Type, Claudius as Jupiter) and the construction of authority through publica magnificentia\"},{\"t\":\"li1\",\"h\":\"Julio-Claudian (Augustan Forum, Ara Pacis), Flavian (Colosseum, Arch of Titus), and Trajanic monuments (Trajan’s Column, Trajan’s Forum).\"},{\"t\":\"p\",\"h\":\"From this range, three to five key works should be selected for detailed study to illustrate shifts in style, technique, and imperial messaging over time.\"}]},{\"title\":\"Social and historical contexts\",\"blocks\":[{\"t\":\"h\",\"h\":\"<b>Suggested topics<\\/b>\"},{\"t\":\"p\",\"h\":\"Below are examples of what could be covered within Year 12 Religion and Mythology and Social Organisation:\"},{\"t\":\"h\",\"h\":\"<b>Year 12 Religion and Mythology<\\/b>\"},{\"t\":\"p\",\"h\":\"An exploration of Greek Myth could include the following scope:\"},{\"t\":\"li1\",\"h\":\"What is myth, theories of myth, cosmogony, roles, and responsibilities of gods, charter myths (Titanomachy, Uranus vs Cronos).\"},{\"t\":\"p\",\"h\":\"An exploration of Roman Myth could include the following scope:\"},{\"t\":\"li1\",\"h\":\"Historical myth (Sabine women, Horatius on the bridge, naming of the Tiber River, Romulus and Remus, Aeneas and the founding of Rome), influence and reimagining of Greek or Etruscan myths, roles and responsibilities of gods.\"},{\"t\":\"p\",\"h\":\"An exploration of Athenian Religion could include:\"},{\"t\":\"li1\",\"h\":\"The ancient Greek sanctuary, establishing a cult, Greek gods and worship, the role of myth in cult, Athena Polias, Demeter Eleusinia, Religion and the Oikos, funerary rites.\"},{\"t\":\"p\",\"h\":\"An exploration of Roman Religion could include:\"},{\"t\":\"li1\",\"h\":\"Numina, polytheistic Gods, prayer, sacrifice, divination, public religion, Vesta, festivals, private religion, and family and funerary rites.\"},{\"t\":\"h\",\"h\":\"<b>Year 12 Social Organisation<\\/b>\"},{\"t\":\"p\",\"h\":\"An exploration of Greek Social Organisation could include the following scope:\"},{\"t\":\"li1\",\"h\":\"Social structure in Athens (citizens, women, and metics), social structure of Sparta (Spartiates, perikoi, helots), forms of government with Greece, Sparta versus Athens, daily life and education.\"},{\"t\":\"p\",\"h\":\"An exploration of Roman Social Organisation could include the following scope:\"},{\"t\":\"li1\",\"h\":\"The Roman Paterfamilias and the Familia, the role and purpose of marriage, citizenship and class, servi and liberti, leisure and entertainment, education, the social role of religion and festivals, economic roles and activities.\"},{\"t\":\"h\",\"h\":\"<b>Year 13 Politics and History<\\/b>\"},{\"t\":\"p\",\"h\":\"Appropriate selection of significant figure(s) or event(s) should reflect a substantive impact that resulted in long-term structural changes within the classical world. The event(s) or figures should be foundational to understanding ancient history in the classical world. Peripheral events or figures that lack this significance can be appropriately included as part of a wider scale selection but lack the substance to be the primary selection to study.\"},{\"t\":\"p\",\"h\":\"For example, Cleopatra is a figure within the fall of the Ptolemaic Dynasty and the third civil war and is appropriate to study as part of a broader study of other events and figures. Cleopatra lacks the level of significance that led to wider structural change in the Roman Empire to justify as the primary focus of study. Other similar examples that lack significance include Darius, Hannibal, and Boudica.\"},{\"t\":\"p\",\"h\":\"Below are examples of some historical contexts for Year 13 politics and history that showcase an appropriate exploration of significant events and figures in the period (including the wider context before and after the given period) and the interconnections with political organisation.\"},{\"t\":\"h\",\"h\":\"<b>Birth of the Athenian Empire (508 BCE–431 BCE)<\\/b>\"},{\"t\":\"li1\",\"h\":\"Examine the wider context of Solon’s socio-political reforms and the subsequent Peisistratid tyranny of the 6th century to showcase the importance of Cleisthenes’ democratic reforms to the Athenian polis. This could also include the importance of infant democracy (boule, Ekklesia, and ostracism) or the emergence of the position of strategos and notable strategoi throughout the 5th century (Themistocles, Cimon, Aristeides, Perikles, Ephialtes). Examine the origins of the Graeco-Persian wars, including the Ionian revolt, the battles of Marathon, Thermopylae or Artemisium, Salamis and Plataea. Identify the reasons Athens grows to prominence in the 470s–450s, including the hegemony of the Delian league, naval supremacy and Spartan isolationism. Finally, examine the reasons for the outbreak of the Peloponnesian War – exploring the role of Corinth and other poleis to encourage Sparta to challenge Athenian imperialism and the series of disputes that caused the outbreak of war (Epidamnus, Potidaea, Corcyra, and the Megarian Degree).\"},{\"t\":\"h\",\"h\":\"<b>Rise of Sparta (464 BCE–371 BCE)<\\/b>\"},{\"t\":\"li1\",\"h\":\"This should be placed within the wider context of considering earlier developments such as the Persian Wars, emergence of Athenian naval supremacy that challenged Sparta’s hegemony, and the subsequent formation of the Delian League and the competing nature of poleis and shifting alliances. The Peloponnesian War should be connected within broader themes such as the Spartan fear of the growth of Athenian power (Thucydides 1.23), differing political systems, challenges to Athenian imperialism (and Sparta’s isolationist policies) from Corinth, Megara and other notable poleis, the role of warfare, and socio-cultural points of difference (such as fear of helot revolution). Focus should be placed on key figures working within the Spartan political system – both kings and notable ephors or gerousiate members (e.g. Lysander, Gylippus, Archidamus, and Sthenelaidas), the establishment of the 30 tyrants, the battle of Leuctra, the strengths and weaknesses of Spartan and Athenian political structures, and how the weakening of political and military structures would enable the rise of Macedon.\"},{\"t\":\"h\",\"h\":\"<b>Death of Roman Republic (133 BCE–31 BCE)<\\/b>\"},{\"t\":\"li1\",\"h\":\"Caesar’s rise to power and death could be connected to its connection to and breaking of Republican politics, the shifting dynamics of political groups and their competing demands, and his interrelationship with key political rivals. This would include examining the background context of the Roman Republic, including the Gracchi, Marius and Sulla, and populares or optimates politics as it played out within the Republican political system. It would then include an examination of Caesar and key events that reflected his interrelationship with political factions and individuals. Finally, it would justify the significance by looking at the lasting impact of the power vacuum in the wake of his death and ultimately the rise of power of Augustus through the third civil war.\"},{\"t\":\"h\",\"h\":\"<b>Princeps and Dominus (14 CE–96 CE)<\\/b>\"},{\"t\":\"li1\",\"h\":\"The study of this historical context expects an exploration of how the principate was maintained and strained under the Julio-Claudian and Flavian emperors from Tiberius to Domitian. It focuses on how imperial power operated in practice, including political and court tensions under Tiberius, the instability surrounding Caligula’s assassination and the influence of the Praetorian Guard, and Claudius’ use of military expansion to strengthen authority. This context should explore the reign of Nero, influence of imperial family, examining the crises such as the Great Fire, persecution of Christians, and his eventual overthrow. The political instability of the year of the four emperors and the consolidation of the Flavian dynasty through civil war victory, rebuilding programmes, and public spectacle. Particular attention is given to the emergence of more overt autocratic authority under Nero and Domitian. Examination of the impact of these developments on succession, the role of the army and imperial court, and the tension between the ideal of the princeps and then dangers of the dominus-style imperial rule.\"}]},{\"title\":\"Interrelationship of classical knowledges contexts\",\"blocks\":[{\"t\":\"p\",\"h\":\"This strand should be embedded authentically within the study of art, literature, and history or society, rather than taught as a separate component. Each topic or case study should incorporate an authentic comparative or interpretive lens that connects classical material to other knowledge systems, time periods, or perspectives.\"},{\"t\":\"p\",\"h\":\"Below are examples of what could be covered:\"},{\"t\":\"h\",\"h\":\"<b>Connections<\\/b>\"},{\"t\":\"li1\",\"h\":\"Cross-cultural comparison: leadership, honour, gender roles, justice, warfare, hospitality\"},{\"t\":\"li1\",\"h\":\"Literature and storytelling: myth alongside other narrative traditions, reinterpretations in later texts\"},{\"t\":\"li1\",\"h\":\"Historical and social systems: law, governance, citizenship, empire\"},{\"t\":\"li1\",\"h\":\"Later receptions: Renaissance art, modern film, political rhetoric, popular culture\"},{\"t\":\"li1\",\"h\":\"Interpretive lenses: feminist, postcolonial, political, ideological readings.\"},{\"t\":\"h\",\"h\":\"<b>Connections in mythology<\\/b>\"},{\"t\":\"li1\",\"h\":\"Rich cosmogonies with personified primal beings and genealogies of gods and humans (Gaia and Ouranos vs Ranginui or Papatūānuku and their descendants).\"},{\"t\":\"li1\",\"h\":\"Hero myths: Maui, Anansi, folklore heroes.\"},{\"t\":\"h\",\"h\":\"<b>Connections in literature<\\/b>\"},{\"t\":\"li1\",\"h\":\"Middle Ages: Dante’s <i>Inferno<\\/i>, Umberto Eco\"},{\"t\":\"li1\",\"h\":\"Renaissance: Shakespeare, Marlow, Milton\"},{\"t\":\"li1\",\"h\":\"Contemporary: <i>Penelopiad<\\/i>, <i>Percy Jackson<\\/i> series.\"},{\"t\":\"h\",\"h\":\"<b>Influences in film<\\/b>\"},{\"t\":\"li1\",\"h\":\"Hero’s Journey template, Nolan’s <i>Odyssey<\\/i>, Wolfgang Peterson’s <i>Troy<\\/i>, depictions of Hercules.\"},{\"t\":\"h\",\"h\":\"<b>Influences in art<\\/b>\"},{\"t\":\"li1\",\"h\":\"Medusa in Renaissance or early modern art (Cellini, Rubens, Bernini, Caravaggio, Verrocchio), Medusa in 19th to 21st century art (Victorian cameos, French or Italian 19th century jewellery) and contemporary society (Garbatti, Hirst, PichiAvo, Moore, Versace)\"},{\"t\":\"li1\",\"h\":\"Architectural influences: Colosseum and modern arenas (Hnry stadium), Triumphal Arches (Arc de Triomphe).\"}]}],\"strands\":[{\"name\":\"Literature and Narrative\",\"focus\":\"The literature of Classical Greece and Rome as texts encoded with ideas and values that shaped thought, action, and ideology in the classical world. Students examine literary works as cultural artefacts situated within specific literary, generic, and structural contexts.\",\"inYear\":{\"12\":\"Study focuses on understanding individual texts in their immediate contexts, including genre, structure, and cultural setting.\",\"13\":\"Learning extends to relational and critical approaches, tracing influence across texts and examining literary tradition, inter- and intra-textuality, ideology, and critical perspectives.\"},\"years\":{\"12\":[{\"name\":\"Literary technique, genre, and structure\",\"k\":[{\"t\":\"li1\",\"h\":\"The composition of classical texts:\"},{\"t\":\"li2\",\"h\":\"are formulaic in structure (e.g. peripeteia, anagnorisis, in medias res, dialogic frame)\"},{\"t\":\"li2\",\"h\":\"contain imagery that resonates with their audience (e.g. ecphrasis, Homeric simile, funerary epigram)\"},{\"t\":\"li2\",\"h\":\"contain typical codes and conventions of genre (e.g. katabasis, deus ex machina)\"},{\"t\":\"li2\",\"h\":\"contain narratives and themes that are shaped by characterisation that informs actions and drive the plot (e.g. hubris, pietas, dike, philia, sophrosynē).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Identify and describe a range of compositional features.\"},{\"t\":\"li1\",\"h\":\"Accurately apply classical terminology relevant to compositional features.\"},{\"t\":\"li1\",\"h\":\"Select and analyse annotations of compositional features.\"},{\"t\":\"li1\",\"h\":\"Synthesise a range of compositional features within text to make determined judgements about text construction.\"}]},{\"name\":\"Cultural artefact\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical texts as cultural artefacts are:\"},{\"t\":\"li2\",\"h\":\"situated in historical or mythological contexts (e.g. the Heroic Bronze Age, Athenian democracy, Roman Principate)\"},{\"t\":\"li2\",\"h\":\"shaped by authorial purpose (e.g. themis, moralia, invective, encomium, apologia)\"},{\"t\":\"li2\",\"h\":\"reflective of societal and cultural values and norms (e.g. aristeia, xenia, pietas, justicia).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Identify and describe relevant historical or mythological contexts and assess the text as a product of its setting.\"},{\"t\":\"li1\",\"h\":\"Analyse the text within its historical or mythological context to explain how norms and values are communicated.\"},{\"t\":\"li1\",\"h\":\"Analyse how authorial purpose shapes narrative, character, and theme.\"}]}],\"13\":[{\"name\":\"Literary tradition and intertextuality\",\"k\":[{\"t\":\"li1\",\"h\":\"Intertextuality of classical texts:\"},{\"t\":\"li2\",\"h\":\"contain deliberate allusions or connections to other cultural artefacts that shape meaning (e.g. kataba/sis, Elektra in <i>The Libation Bearers<\\/i>, Socratic model, Ara Pacis)\"},{\"t\":\"li2\",\"h\":\"are shaped by traditions that draw on shared themes, contexts, and patterns (e.g. nostos, revenge, Lesbian lyric)\"},{\"t\":\"li2\",\"h\":\"inform text construction (e.g. proem, agon, strophic pattern)\"},{\"t\":\"li2\",\"h\":\"deepen audience understanding of text and context (e.g. pro or anti-Augustan readings, criticisms of Cleon, allusions, Homeric echoes, Thucydidean parallels).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Explain deliberate allusions or connections between texts.\"},{\"t\":\"li1\",\"h\":\"Analyse how shared themes, contexts, and narratives position texts within wider literary traditions.\"},{\"t\":\"li1\",\"h\":\"Analyse how intertextual techniques inform the construction, structure, and emphasis of classical texts.\"},{\"t\":\"li1\",\"h\":\"Evaluate how intertextual references shape meaning for ancient or modern audiences.\"},{\"t\":\"li1\",\"h\":\"Synthesise evidence across multiple texts to evaluate textual understanding and reception.\"},{\"t\":\"li1\",\"h\":\"Critically evaluate texts as products of shared intertextual patterns and dialogue.\"}]},{\"name\":\"Classical concepts and interpretations\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical texts:\"},{\"t\":\"li2\",\"h\":\"contain constructed classical concepts, including identities, values, and beliefs (e.g. gender roles, heroism, citizenship)\"},{\"t\":\"li2\",\"h\":\"contain narratives and portrayals that reflect, reinforce, or challenge societal ideologies (e.g. androcentrism, imperialism, civic duty, eros, virtue)\"},{\"t\":\"li2\",\"h\":\"position audiences in relation to values, beliefs, and norms (e.g. vilification of ‘others’, glorification of Rome, idealisation of the polis)\"},{\"t\":\"li2\",\"h\":\"can be evaluated through critical perspectives by applying scholarly lenses and approaches to interpret or critique a text (e.g. comparative historiography, Harvard vs European school on Augustus, feminist readings, Bosworth vs Tarn on Alexander).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse how classical concepts are constructed within texts.\"},{\"t\":\"li1\",\"h\":\"Analyse how narratives and portrayals reflect, reinforce, or challenge classical societal ideologies.\"},{\"t\":\"li1\",\"h\":\"Apply critical scholarly perspectives to interrogate and critically evaluate texts.\"},{\"t\":\"li1\",\"h\":\"Construct evidence-based arguments about the significance of classical concepts and societal ideologies embedded within literary traditions.\"}]}]}},{\"name\":\"Art and Architecture\",\"focus\":\"Classical art and architecture as the visual and material record of the classical world, encoded with ideas and values that show how people imagined their world. Students examine works of art and architecture in relation to their making and use, focusing on form, style, and technique, as well as function, place, and space.\",\"inYear\":{\"12\":\"Students focus on form, style, and technique, as well as function, place, and space.\",\"13\":\"Study broadens to situate works within wider artistic contexts and conventions, including messaging and reception, considering how classical art relates to wider social and political elements and how visual forms develop and evolve.\"},\"years\":{\"12\":[{\"name\":\"Form, style, and technique\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical art and architecture:\"},{\"t\":\"li2\",\"h\":\"contain design techniques that express deliberate stylistic choices (e.g. orders, symmetry)\"},{\"t\":\"li2\",\"h\":\"utilise construction techniques that enable structural solutions and building types or artistic medium (e.g. post and lintel, arches, opus vermiculatum, oxidation, and reduction)\"},{\"t\":\"li2\",\"h\":\"use decorative motifs, iconography, and visual narratives to communicate cultural knowledge (e.g. Trojan War, triumph, civism)\"},{\"t\":\"li2\",\"h\":\"contain representations of classical ideals through depictions of figures, spaces, or symbols (e.g. mimesis and proportionality).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Identify and describe stylistic design features of art or architecture.\"},{\"t\":\"li1\",\"h\":\"Explain how construction techniques enable solutions or the artistic medium.\"},{\"t\":\"li1\",\"h\":\"Annotate and expand on key messages communicated through a range of decorative features.\"},{\"t\":\"li1\",\"h\":\"Analyse artworks or architecture as products of important -cultural or historical context.\"},{\"t\":\"li1\",\"h\":\"Develop supported judgements about how artistic or architectural works express cultural knowledge or ideals.\"}]},{\"name\":\"Function, space, and place\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical art and architecture:\"},{\"t\":\"li2\",\"h\":\"serve practical functions that support everyday socio-cultural life (e.g. bathing, symposia, funerary)\"},{\"t\":\"li2\",\"h\":\"reflect cultural values and collective identities through form and use (e.g. stele, fora)\"},{\"t\":\"li2\",\"h\":\"are situated in specific settings and physical places that shape meaning and ancient experiences (e.g. Parthenon, atrium, Capitoline Wolf).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Identify and link specific features to their practical use.\"},{\"t\":\"li1\",\"h\":\"Interpret how artworks or architecture support everyday socio-cultural activities.\"},{\"t\":\"li1\",\"h\":\"Explain how use of artworks or architecture communicate values, beliefs, or identity using visual and contextual evidence.\"},{\"t\":\"li1\",\"h\":\"Develop supported judgements about the meaning and impact of function, space, or place in classical artworks or architecture.\"}]}],\"13\":[{\"name\":\"Messaging and reception\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical art and architecture:\"},{\"t\":\"li2\",\"h\":\"are designed to promote and communicate cultural or political messages (e.g. imperial generosity, piety, cultural superiority)\"},{\"t\":\"li2\",\"h\":\"can be reconstructed through scholarly analysis of style, context, and evidence to further understand how people understood the messages at the time (e.g. ancient and modern scholarship: Vitruvius, Pausanias, Lynch, Beard)\"},{\"t\":\"li2\",\"h\":\"influence, and are influenced by, their historical and political contexts, which shape the messages they convey (e.g. Augustan Rome, Periclean Athens).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse how classical art and architecture communicate cultural and political messages.\"},{\"t\":\"li1\",\"h\":\"Synthesise visual and contextual evidence from a range of primary sources to interpret the cultural and political messages communicated through classical art and architecture.\"},{\"t\":\"li1\",\"h\":\"Interrogate how scholars have interpreted these messages over time.\"},{\"t\":\"li1\",\"h\":\"Critically evaluate the influence of historical and political context on the creation and messaging of art and architecture.\"},{\"t\":\"li1\",\"h\":\"Articulate a sustained, evidence-based argument that takes a clear position on how messaging operated and was received within classical artworks or architecture.\"}]},{\"name\":\"Artistic context and convention\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical art and architecture:\"},{\"t\":\"li2\",\"h\":\"are situated within a wider artistic context where developments and changes can be traced within classical traditions (e.g. Classical to Hellenistic, Black-figure to Red-figure, domus italica to Greek peristyle)\"},{\"t\":\"li2\",\"h\":\"explore the origin and development of artistic conventions within classical traditions over time (e.g. proportion, drapery, space)\"},{\"t\":\"li2\",\"h\":\"transmit influences that shape and modify classical conventions (e.g. near Eastern and Egyptian influences, Etruscan architecture, Polykleitos’ influence on Mannerists).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Trace and explain developments in artistic convention to show changes in classical traditions.\"},{\"t\":\"li1\",\"h\":\"Synthesise a range of art or architecture to judge the impact of changes on key conventions and features.\"},{\"t\":\"li1\",\"h\":\"Critically evaluate how influences both establish imitation and drive differentiation within and across classical traditions.\"}]}]}},{\"name\":\"Society and History\",\"focus\":\"Classical societies as foundational case studies in citizenship, law, empire, class, and the individuals who shaped the world around them. Students examine both everyday life and formal structures, developing an understanding of classical societies through religion, mythology, and social organisation.\",\"inYear\":{\"12\":\"Students develop a foundational understanding of classical societies through religion, mythology, and social organisation.\",\"13\":\"The focus shifts to political organisation and ancient history, examining key developments in the classical world, including interrogating the political structures and historical processes that shaped it.\"},\"years\":{\"12\":[{\"name\":\"Religion and mythology\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical belief systems:\"},{\"t\":\"li2\",\"h\":\"encompass the roles and responsibilities of the gods in controlling nature, protecting households and cities, and upholding justice and social order (e.g. Olympians, Lares)\"},{\"t\":\"li2\",\"h\":\"help explain the origins of the world, legitimise political and social structures, and shape moral values (e.g. cosmogonies, charter myths, fables)\"},{\"t\":\"li2\",\"h\":\"contain rites of worship, including distinctions between public, private, and mystery cult practices (e.g. festivals, Panathenaeia, mysteries)\"},{\"t\":\"li2\",\"h\":\"reflect how worshippers move, gather, and experience public and private ritual (e.g. temple layout, atria, processional ways)\"},{\"t\":\"li2\",\"h\":\"create shared stories of identity and origin through foundational myths that support the development of worship and cults (e.g. Theseus, Herakles, emperor cults)\"},{\"t\":\"li2\",\"h\":\"prescribe funerary rites that express beliefs about death, the afterlife, and the ongoing relationship between the living and the dead (e.g. burial customs, grave markers, afterlife journey).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Identify and describe the roles and responsibilities of the gods within belief systems.\"},{\"t\":\"li1\",\"h\":\"Explain how mythology and religion reflect values and phenomena in the classical world.\"},{\"t\":\"li1\",\"h\":\"Identify and describe the features and functions of significant institutions, rituals, and practices within classical belief systems.\"},{\"t\":\"li1\",\"h\":\"Explain how mythology and religious beliefs shaped power, status, and identity, and reinforced societal ideas and values.\"},{\"t\":\"li1\",\"h\":\"Analyse and interpret a range of primary sources to make judgements on purpose, use, and importance of belief systems within classical societies and beyond.\"}]},{\"name\":\"Social organisation\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical societies:\"},{\"t\":\"li2\",\"h\":\"differentiate the roles, expectations, and responsibilities in the private and public lives of men and women (e.g. household roles, political participation, economic activity)\"},{\"t\":\"li2\",\"h\":\"organise family and kinship structures that shape gendered roles, expectations, and responsibilities in the private and public lives of men and women (e.g. separate spheres, agathos and virtus, aidos and pudor)\"},{\"t\":\"li2\",\"h\":\"structure citizenship, legal status, and social class so that access to power, rights, and participation is controlled (e.g. liberti, metics, patricians)\"},{\"t\":\"li2\",\"h\":\"promote practices such as education, festivals, and entertainment to shape social belonging, transmit values, and regulate behaviour (e.g. grammaticus, Saturnalia, Dionysia).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Examine the varied roles, responsibilities, and expectations of men and women in classical societies.\"},{\"t\":\"li1\",\"h\":\"Analyse how contrasts between public and private spheres shape and communicate societal ideals.\"},{\"t\":\"li1\",\"h\":\"Identify and describe the differentiated levels of social stratification.\"},{\"t\":\"li1\",\"h\":\"Explain how social systems affect people’s access to power, rights, and participation.\"},{\"t\":\"li1\",\"h\":\"Analyse how family and kinship dynamics influence relationships in classical societies.\"},{\"t\":\"li1\",\"h\":\"Interpret a range of primary sources to develop and justify judgements about how social organisation operates in classical societies and beyond.\"}]}],\"13\":[{\"name\":\"Political structures\",\"k\":[{\"t\":\"li1\",\"h\":\"Political systems in the classical world:\"},{\"t\":\"li2\",\"h\":\"encompass different and sometimes competing structures of organisation and governance (e.g. isonomia vs tyranny, tribunes vs Senate)\"},{\"t\":\"li2\",\"h\":\"involve differing expectations and interactions for civic and political participation or restriction (e.g. citizen vs metic and freeman, patrician vs plebeian)\"},{\"t\":\"li2\",\"h\":\"are not static entities but adapt and develop in response to societal and cultural changes, key individuals, and significant historical events (e.g. radical democracy vs imperialism)\"},{\"t\":\"li2\",\"h\":\"are influenced or manipulated by individuals or groups who employ differentiated methods to work within and outside these systems (e.g. Themistokles, Alkibiades, Populares, Gracchi reforms)\"},{\"t\":\"li2\",\"h\":\"provide contexts in which political processes occur and are understood (e.g. patron-client relationships, ekklesia).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Analyse the impact of events or individuals on significant socio-political change in the classical world.\"},{\"t\":\"li1\",\"h\":\"Synthesise a range of primary source and scholarly material, considering how political context, purpose, and bias influence the interpretation of evidence.\"},{\"t\":\"li1\",\"h\":\"Critically evaluate the significance of classical political systems in their broader context.\"},{\"t\":\"li1\",\"h\":\"Construct cogent arguments and make nuanced judgements about classical political systems.\"}]},{\"name\":\"Ancient history\",\"k\":[{\"t\":\"li1\",\"h\":\"Ancient history:\"},{\"t\":\"li2\",\"h\":\"is contextualised by the political organisation of classical societies (e.g. Athenian democracy, Spartan dual kingship and gerousia, the Roman Republic and Principate)\"},{\"t\":\"li2\",\"h\":\"builds knowledge of significant classical events, movements, or individuals and their interconnectedness (e.g. Ionia, the development of isonomia and eleutheria and their connection to the actions of Aristagoras; the Civil Wars and their role in the rise of the populares, including the Gracchi)\"},{\"t\":\"li2\",\"h\":\"includes historically significant individuals who shaped and impacted the classical world (e.g. Perikles, Julius Caesar, Philip II of Macedon)\"},{\"t\":\"li2\",\"h\":\"explores the role of primary and scholarly evidence in shaping our understanding of classical events, movements, and individuals (e.g. Herodotus and Thucydides on war, Plutarch’s Lives, Livy, modern scholarly interpretations)\"},{\"t\":\"li2\",\"h\":\"examines knowledge of how and why aspects of the classical world changed or remained stable and how specific events are situated within their broader context (e.g. continuity and change in Roman republican institutions, stability, and change in Athenian democracy).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply knowledge of political organisation in classical societies to contextualise and interpret events, movements, and individuals.\"},{\"t\":\"li1\",\"h\":\"Analyse and evaluate the roles and impacts of historically significant individuals on the classical world.\"},{\"t\":\"li1\",\"h\":\"Synthesise and critique primary and scholarly evidence to construct interpretations of classical events, movements, and individuals.\"},{\"t\":\"li1\",\"h\":\"Interrogate significant events, movements, and individuals to trace and analyse interconnections.\"},{\"t\":\"li1\",\"h\":\"Discern and negotiate patterns of continuity and change by situating specific events within their broader context.\"}]}]}},{\"name\":\"Interrelationship of Classical Knowledges\",\"focus\":\"The interconnections and transmissions of classical knowledge across time, place, and space. Students examine connections between classical societies and cultures, exploring how different knowledge systems, cultural traditions, and perspectives can deepen understanding of the classical world and its continuing significance. Through a bicultural lens, they explore relationships between classical knowledge and the knowledges and stories of New Zealand. This strand operates alongside the other strands, enabling authentic integration across contexts.\",\"inYear\":{\"12\":\"The focus is on interconnections of classical knowledges.\",\"13\":\"The focus is on the transmission of classical knowledges.\"},\"years\":{\"12\":[{\"name\":\"Interconnections and perspectives\",\"k\":[{\"t\":\"li1\",\"h\":\"The interconnections of classical knowledges:\"},{\"t\":\"li2\",\"h\":\"contain distinct systems and concepts with strong affinities in other bicultural and multicultural traditions (e.g. pūrākau and myth, tikanga and classical customs, oral and written traditions, atua and gods)\"},{\"t\":\"li2\",\"h\":\"reflect how diverse cultural narratives and perspectives provide important lenses to support understanding of classical literature, art, and society (e.g. te ao Māori and Pacific worldviews, Polyphemus and Early Modern European opera, Alexander Romances, <i>The Penelopiad<\\/i>, the hero’s journey)\"},{\"t\":\"li2\",\"h\":\"are interpreted, adapted, and recontextualised in contemporary society (e.g. a feminist lens applied to <i>The Penelopiad<\\/i>; Aeschylus’ <i>Agamemnon<\\/i> and <i>The Lion King<\\/i>; Christopher <i>Nolan’s The Odyssey<\\/i>; the Jefferson Memorial).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select relevant examples from different cultures to interpret classical texts, artworks, or social practices.\"},{\"t\":\"li1\",\"h\":\"Identify and explain how different traditions demonstrate similarities and differences between concepts and systems.\"},{\"t\":\"li1\",\"h\":\"Develop supported judgements on how key concepts in te ao Māori, the classical world, or other cultures reflect connections between societies.\"}]}],\"13\":[{\"name\":\"Transmission and influence\",\"k\":[{\"t\":\"li1\",\"h\":\"The transmission of classical knowledges:\"},{\"t\":\"li2\",\"h\":\"convey meaning that has been interpreted and reinterpreted over time by different audiences (e.g. heroic identity, civic duty, polychromatism)\"},{\"t\":\"li2\",\"h\":\"conceptualise how classical, Māori and other cultural knowledge systems and concepts interact and change across time and place (e.g. ideals of democracy, Greek and Roman laws echoed in modern courts, models of leadership, demagogues)\"},{\"t\":\"li2\",\"h\":\"influence how interpretive lenses privilege or challenge certain stories, values, and voices in ongoing dialogue between classical and later societies (e.g. classical heroes and symbols in later memorials and speeches; modern theatre or film reworking myths like Medea or the Trojan War; interpretive approaches such as formalism, reception-history, marxism, feminism, Indigenous methodologies, and postcolonial lenses applied to classical literature and art).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Interrogate how key concepts and systems from the classical world influence later ideas and practices through close evaluation of primary and scholarly evidence.\"},{\"t\":\"li1\",\"h\":\"Analyse how different interpretive lenses remember, question, or silence classical concepts and systems.\"},{\"t\":\"li1\",\"h\":\"Construct sustained judgements and draw convincing conclusions that compare how different knowledge systems and lenses reinforce, adapt, or contest each other.\"}]}]}},{\"name\":\"Disciplinary Writing\",\"focus\":\"The use of writing to reflect the ways in which knowledge is organised, analysed, and communicated within the discipline.\",\"inYear\":{},\"years\":{\"12\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical Studies communication is shaped by the purpose, audience, and conventions of the discipline.\"},{\"t\":\"li1\",\"h\":\"Classical sources provide evidence that can be interpreted, analysed, compared, evaluated, and integrated to develop understandings of classical societies, ideas, beliefs, practices, and issues.\"},{\"t\":\"li1\",\"h\":\"Meaning in Classical Studies writing is constructed through the selection, organisation, interpretation, and synthesis of evidence, perspectives, and contextual information.\"},{\"t\":\"li1\",\"h\":\"Classical Studies interpretations and arguments are developed by synthesising evidence and perspectives using recognised structures, evidence-based reasoning, and subject-specific terminology to explain, analyse, evaluate, and justify conclusions.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and use precise subject-specific terminology, including relevant Greek and Latin terms, to communicate understanding of classical texts, material culture, ideas, values, and historical contexts.\"},{\"t\":\"li1\",\"h\":\"Use sentence structural choices and explanatory, comparative, and cause-and-effect language to develop meaning and explain relationships between classical ideas, beliefs, practices, societies, representations, and historical contexts.\"},{\"t\":\"li1\",\"h\":\"Control tense deliberately, using present tense to discuss texts and representations, and past tense when framing historical events, actions, and contextual background.\"},{\"t\":\"li1\",\"h\":\"Structure analytical writing by integrating contextual information and embedding evidence from classical primary sources to support explanations and interpretations.\"}]}],\"13\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Classical Studies communication is shaped by the purpose, audience, and conventions of the discipline.\"},{\"t\":\"li1\",\"h\":\"Classical sources provide evidence that can be interpreted, analysed, compared, evaluated, and integrated to develop understandings of classical societies, ideas, beliefs, practices, and issues.\"},{\"t\":\"li1\",\"h\":\"Meaning in Classical Studies writing is constructed through the selection, organisation, interpretation, and synthesis of evidence, perspectives, and contextual information.\"},{\"t\":\"li1\",\"h\":\"Classical Studies interpretations and arguments are developed by synthesising evidence and perspectives using recognised structures, evidence-based reasoning, and subject-specific terminology to explain, analyse, evaluate, and justify conclusions.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and use precise subject-specific terminology and evaluative language to communicate nuanced interpretations of classical texts, material culture, ideas, values, and historical contexts.\"},{\"t\":\"li1\",\"h\":\"Use sentence structure choices and evaluative, comparative, and causal language to synthesise and assess relationships within and across classical ideas, beliefs, practices, societies, representations, perspectives, and historical contexts.\"},{\"t\":\"li1\",\"h\":\"Control and manipulate tense deliberately, using shifts in tense to distinguish interpretation, analysis, and contextualisation.\"},{\"t\":\"li1\",\"h\":\"Construct sustained analytical arguments by synthesising and evaluating evidence from a range of classical sources, embedding quotations, paraphrases, and references, and using deliberate structure, cohesion, signposting, and academic register to justify interpretations and conclusions.\"}]}]},\"intro\":\"In Classical Studies, students use explicitly taught disciplinary writing to explain, analyse, synthesise, evaluate, and justify interpretations of classical texts, material culture, ideas, and historical contexts for specific purposes and audiences.\",\"writing\":true}]},{\"key\":\"geo\",\"name\":\"Geography\",\"short\":\"Geography\",\"years\":[11,12,13],\"c\":\"--geo\",\"source\":\"Geography, Years 11–13 (October 2026)\",\"starts\":{\"11\":2028,\"12\":2029,\"13\":2030},\"lead\":\"In Geography, students are taught about natural physical processes such as climate, earth surface, and tectonic processes. They are also taught about human processes and issues, such as demographic change, resource scarcity and management, and geopolitical interactions. Through the study of these processes and issues, students examine how environments change and how relationships between people, places, and environments vary across different contexts and over time. Students are taught how to investigate geographic concepts and apply spatial thinking to contexts in New Zealand, the Pacific, and globally.\",\"paras\":[\"Students are taught how people, places, and environments are connected at local, national, and global scales. Students examine how people’s relationships with the environment are shaped by both natural processes and human activities and how different perspectives influence understanding and decision-making about geographic issues and challenges.\",\"Geography provides students with the knowledge and practices to investigate people, places, and environments and the connections between them. Students develop the ability to analyse spatial patterns and processes, evaluate geographic issues and responses, and communicate evidence-based conclusions about environmental and societal challenges using geographic concepts and geospatial tools.\",\"As students progress through Geography Years 11–13, they are taught to deepen their ability to investigate, interpret, analyse, and draw conclusions from geographic information and evidence. This enables them to evaluate issues from different perspectives, assess impacts, and responses, and make informed judgements about geographic questions and challenges.\"],\"pathway\":\"Geography leads to pathways in geography and related fields, including environmental and climate sciences, conservation and resource management, urban and regional planning, geospatial technologies (GIS), hazard and emergency management, public policy, and international development.\",\"guidance\":[{\"title\":\"Knowledge and practices\",\"blocks\":[{\"t\":\"p\",\"h\":\"The Geography teaching sequence is organised into strands and elements, and then further structured into knowledge and practices. The knowledge column sets out the declarative knowledge to be taught, while the practice column sets out the disciplinary skills, applications, and procedural knowledge. The practices underpin ways of working in Geography and are specific to the discipline.\"},{\"t\":\"p\",\"h\":\"The teaching of all knowledge and practices is compulsory. However, schools can determine how learning is organised across the year, including integrating content from multiple elements and strands where this supports coherence and depth. Examples within the teaching sequence in brackets signified with ‘e.g.’ are provided as guidance only; as long as the intended knowledge and practices are met, schools and teachers may substitute contexts and examples that better reflect local environments, iwi and hapū connections, student interests, and teacher expertise.\"},{\"t\":\"p\",\"h\":\"Disciplinary writing is included in the teaching sequence to set out what subject-specific literacy is to be taught. It is organised into a knowledge component that is consistent across all year levels and a practice component sequenced across years.\"}]},{\"title\":\"Responsible use of artificial intelligence\",\"blocks\":[{\"t\":\"p\",\"h\":\"Artificial intelligence (AI) can support learning, research, inquiry, and creative processes, but it may also introduce bias, inaccuracies, ethical concerns, and issues relating to ownership. AI should enhance, not replace, critical or creative thinking, source evaluation, subject knowledge, or students’ own analysis and decision-making. Responsible AI use emphasises the importance of exercising independent judgement, drawing on credible sources, verifying information, being transparent about AI use, considering diverse perspectives, and developing independent thinking.\"}]},{\"title\":\"Designing a programme\",\"blocks\":[{\"t\":\"p\",\"h\":\"The knowledge and practice statements within each element are related, but teachers may select complementary statements from across the sequence or treat elements as discrete units of work. Disciplinary writing is most effectively taught when integrated across the teaching programme.\"},{\"t\":\"p\",\"h\":\"Within each element, it is recommended that knowledge statements are taught in the order presented, as they are sequenced to support conceptual development. Practices, however, may be taught flexibly and revisited as appropriate. Within the practices, the categories ‘Use geographic tools’, ‘Apply geographic concepts’, ‘Decision-making’, and ‘Investigation examples’ are designed to assist with planning. Practices can be integrated across the categories.\"}]},{\"title\":\"Investigations\",\"blocks\":[{\"t\":\"p\",\"h\":\"At Year 11, teachers should provide opportunities for students to engage with the individual elements of the Geographic Investigation strand by integrating particular elements into a range of physical and human geography contexts throughout the year. Teachers are not required to teach a complete investigation sequence around one context. The emphasis should be on building familiarity with each element of the geographic investigation process and developing confidence in using data and evidence to answer geographic questions.\"},{\"t\":\"p\",\"h\":\"Investigation examples are included within the Physical and Human Geography strands to guide teachers. However, teachers may develop investigations that suit their local context while supporting the knowledge and practice statements within the teaching sequence.\"},{\"t\":\"p\",\"h\":\"At Year 12, geographic investigation knowledge and practices are taught through geographic research analysis and through undertaking a teacher-guided investigation. Schools must provide opportunities for students to undertake at least one teacher-guided investigation that draws on the knowledge and practices in the human and physical geography strands. Investigation examples are included within the Physical and Human Geography strands to guide teachers. However, teachers may develop alternative investigations that suit their local context while supporting the knowledge and practice statements within the teaching sequence.\"},{\"t\":\"p\",\"h\":\"Investigations should be relatively narrow in scope and provide structured opportunities for students to apply, with teacher support, the knowledge and practices set out in the Geographic Investigation strand.\"},{\"t\":\"p\",\"h\":\"At Year 13, schools must provide opportunities for students to undertake a complete geographic investigation within a single geographic context. Investigations should broadly relate to a context encountered within the Physical or Human Geography strands and should enable students to integrate geographic knowledge and practices to develop a well-reasoned understanding of a geographic issue, process, pattern, or relationship. Schools should select contexts that are authentic, locally relevant where possible, and appropriate to the available time and resources. Students should develop the aim, question or hypothesis, and methodology for their investigation with teachers providing feedback on the investigation plan before students independently collect, process, present, analyse, evaluate, and report on the investigation.\"},{\"t\":\"p\",\"h\":\"Examples of suitable contexts for the geographic investigation that support the development of the knowledge and practices outlined in the earlier parts of the Year 13 teaching sequence include:\"},{\"t\":\"li1\",\"h\":\"beach processes and landforms\"},{\"t\":\"li1\",\"h\":\"beach mitigation and adaptation strategies\"},{\"t\":\"li1\",\"h\":\"vulnerability of a coastal environment\"},{\"t\":\"li1\",\"h\":\"the sustainability of strategies used to address water insecurity in a specific place\"},{\"t\":\"li1\",\"h\":\"trans-boundary water conflicts in a local area\"},{\"t\":\"li1\",\"h\":\"climate change in the local area.\"},{\"t\":\"p\",\"h\":\"Teachers may select alternative contexts, provided they offer comparable opportunities for students to develop and apply the specified knowledge, concepts, and investigation practices.\"},{\"t\":\"p\",\"h\":\"In addition, teachers may provide opportunities for students to develop and practise individual investigation practices in a range of contexts throughout the year before carrying out their own complete geographic investigation.\"}]},{\"title\":\"Selection of case studies\",\"blocks\":[{\"t\":\"p\",\"h\":\"The case studies are defined to exemplify specific aspects of each element, but they may also be used as a basis for developing the full range of knowledge statements within the element. The case studies are referenced within the knowledge and practices when these relate directly to the specific focus of the case study.\"},{\"t\":\"p\",\"h\":\"The following tables outline the case study choices for each year of teaching.\"}]}],\"contexts\":{\"11\":{\"title\":\"Case studies – Year 11\",\"blocks\":[{\"t\":\"h\",\"h\":\"<b>Climatic processes<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> impacts of tropical storms exemplified through two case studies, including one from the Pacific.\"},{\"t\":\"h\",\"h\":\"<b>Earth surface processes<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> managing and adapting to flood risks exemplified through case studies of river flooding events using two case studies, including one in New Zealand.\"},{\"t\":\"h\",\"h\":\"<b>Tectonic processes<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> impacts of earthquakes and volcanic eruptions on people exemplified through one case study of an earthquake and one case study of a volcanic eruption. One must be a New Zealand or Pacific case study and one from outside this region.\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> adaptations to earthquakes and volcanic eruptions exemplified through one case study of an earthquake and one case study of a volcanic eruption. One must be a New Zealand or Pacific case study and one from outside this region.\"},{\"t\":\"h\",\"h\":\"<b>Demography<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> challenges and opportunities created by population change, exemplified through case studies, including one country that has or is experiencing rapid population growth and one country that has experienced or is experiencing population decline.\"},{\"t\":\"h\",\"h\":\"<b>Resources<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> social and economic impacts of food insecurity and strategies to address one of or both food scarcity and food insecurity exemplified through a case study in a country outside of New Zealand.\"}]},\"12\":{\"title\":\"Case studies – Year 12\",\"blocks\":[{\"t\":\"h\",\"h\":\"<b>Climatic processes<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> how people adapt to extreme environments, exemplified using one case study of a hot desert environment, a cold polar environment, or a high-altitude environment.\"},{\"t\":\"h\",\"h\":\"<b>Earth surface processes<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> significance of a glaciated environment, exemplified through one case study.\"},{\"t\":\"h\",\"h\":\"<b>Demography<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> urban migration challenges and their management exemplified through a case study of a local urban (town or city) area.\"},{\"t\":\"h\",\"h\":\"<b>Resources<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study<\\/b>: strategies to reduce energy insecurity and consumption, exemplified through two case studies (local, regional, or national scale) from different continental regions.\"},{\"t\":\"h\",\"h\":\"<b>Geopolitics<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> international-led initiatives to address inequality, exemplified through two international case studies from different regions that have adopted different strategies.\"}]},\"13\":{\"title\":\"Case studies – Year 13\",\"blocks\":[{\"t\":\"h\",\"h\":\"<b>Climatic processes<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> the management of climate change, exemplified using two case studies – New Zealand and one other country that has adopted strategies to respond to climate change.\"},{\"t\":\"h\",\"h\":\"<b>Earth surface processes<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> the human use, vulnerability, and management of a coastal environment, exemplified through one case study of a coastal environment in New Zealand or the Pacific that has implemented both adaptation and mitigation strategies, or one of these.\"},{\"t\":\"h\",\"h\":\"<b>Resources<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> impacts of water insecurity on people and places, exemplified through case studies from two different continental regions experiencing water insecurity.\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> sustainability of management strategies to address water insecurity, exemplified through case studies exploring management of water insecurity from two different continental regions.\"},{\"t\":\"h\",\"h\":
