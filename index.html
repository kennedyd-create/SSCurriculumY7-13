tters – fast-acting chemical messengers that transmit signals between brain cells\"},{\"t\":\"li2\",\"h\":\"hormones – chemical messengers released into the bloodstream that act more slowly and affect the brain and body over longer periods of time.\"},{\"t\":\"li1\",\"h\":\"Dopamine is involved in helping humans feel pleasure and can drive motivation, regulate motor control, and facilitate reinforcement learning.\"},{\"t\":\"li1\",\"h\":\"Serotonin is involved in mood, emotional processing and sleep-wake regulation. Its precise role in mood disorders is contested.\"},{\"t\":\"li1\",\"h\":\"GABA (gamma-aminobutyric acid) is the brain’s primary inhibitory neurotransmitter, acting as a ‘natural brake’ to maintain emotional and behavioural control.\"},{\"t\":\"li1\",\"h\":\"Endorphins are neurotransmitters and hormones that block pain signals and act as natural pain relievers.\"},{\"t\":\"li1\",\"h\":\"Oxytocin is a hormone involved in social affiliation, maternal attachment and the regulation of the stress response.\"},{\"t\":\"li1\",\"h\":\"Fight-or-flight response is when the amygdala detects danger and prompts the hypothalamus to signal the adrenal glands, flooding the body with adrenaline. This hormonal surge sharpens senses, opens airways, and accelerates heart rate rapidly. (Cannon, 1915).\"},{\"t\":\"p\",\"h\":\"Key study: Raine et al. (1997) – PET scans.\"},{\"t\":\"li1\",\"h\":\"PET scans show patterns of brain activity associated with neurochemical processes, allowing researchers to make inferences about links between brain activity, experiences, and behaviour.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Map the effects of specific neurochemicals and neurotransmission processes to observable human behaviours.\"},{\"t\":\"li1\",\"h\":\"Apply knowledge of neurotransmitters and hormones to explain behavioural responses that occur over different time scales.\"}]},{\"name\":\"Brain structure\",\"k\":[{\"t\":\"li1\",\"h\":\"‘Localisation of function’ means that specific areas of the brain are responsible for specific physical and psychological functions.\"},{\"t\":\"li1\",\"h\":\"The brain can be divided into three parts, each containing further divisions:\"},{\"t\":\"li2\",\"h\":\"cerebrum – higher-order cognitive processing (e.g. language, abstract reasoning)\"},{\"t\":\"li2\",\"h\":\"cerebellum (‘little brain’ at back of skull) – voluntary muscular movements, posture, motor-learning\"},{\"t\":\"li2\",\"h\":\"brainstem (connects brain to spinal cord) – regulates survival behaviours (e.g. heart rate, breathing).\"},{\"t\":\"li1\",\"h\":\"The cerebrum contains the cerebral cortex (outer layer) and subcortical structures (beneath the cortex).\"},{\"t\":\"li1\",\"h\":\"The cerebral cortex is divided into four lobes that contribute to different specialised functions:\"},{\"t\":\"li2\",\"h\":\"frontal lobe – executive functions and voluntary movement (e.g. speech production, decision-making, planning)\"},{\"t\":\"li2\",\"h\":\"parietal lobe – sensory processing and spatial awareness (e.g. touch, temperature, pain, body position)\"},{\"t\":\"li2\",\"h\":\"temporal lobe – auditory processing, language and memory functions (e.g. language comprehension, hearing, memory formation)\"},{\"t\":\"li2\",\"h\":\"occipital lobe – visual processing (e.g. colour, shape and motion perception).\"},{\"t\":\"li1\",\"h\":\"The limbic, motor, and sensory system span multiple areas of the brain. The limbic system includes structures involved in emotion and memory (e.g. the amygdala and hippocampus).\"},{\"t\":\"li1\",\"h\":\"The brain develops across humans’ lifespan, and cognitive abilities (e.g. speech production, attention, impulse control) develop in tandem with the brain.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply knowledge of brain structure and localisation of function to explain and predict patterns of behaviour, cognition, and impairment.\"},{\"t\":\"li1\",\"h\":\"Use research into brain development to map cognitive abilities at different lifespan stages.\"}]}],\"13\":[{\"name\":\"Genetics\",\"k\":[{\"t\":\"li1\",\"h\":\"Interactionist explanations and models explain behaviour as an interaction between genetics and environment.\"},{\"t\":\"li1\",\"h\":\"Epigenetics explores how environmental factors (e.g. stress, trauma) can cause changes in gene expression without altering the DNA sequence itself.\"},{\"t\":\"li1\",\"h\":\"The diathesis–stress model proposes that biological vulnerabilities (diatheses), such as genetic predispositions, interact with environmental triggers (stressors) to lead to the onset of psychological disorders.\"},{\"t\":\"p\",\"h\":\"Key study: Caspi et al. (2002) MAOA gene and childhood maltreatment (Dunedin Study), with Moffitt et al. (2018) – later analyses and critiques.\"},{\"t\":\"li1\",\"h\":\"Genetic research carries particular social risks, because it can result in certain behaviours or characteristics being associated with certain groups, reinforcing damaging stereotypes (e.g. MAOA gene associated with aggression). It is important that researchers factor in the role of:\"},{\"t\":\"li2\",\"h\":\"gene–environment interaction\"},{\"t\":\"li2\",\"h\":\"group vs individual risk\"},{\"t\":\"li2\",\"h\":\"historical and social context.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply interactionist theories and models (e.g. diathesis– stress model, gene–environment interactions) to explain how genetic and environmental factors contribute to behaviour.\"},{\"t\":\"li1\",\"h\":\"Use relevant research to evaluate and critique epigenetic explanations of behaviour.\"},{\"t\":\"li1\",\"h\":\"Apply the diathesis–stress model to case studies to explain the onset of psychological disorders.\"},{\"t\":\"li1\",\"h\":\"Propose improvements to genetic research design to mitigate potential social risks.\"}]},{\"name\":\"Neurochemistry\",\"k\":[{\"t\":\"li1\",\"h\":\"Dysregulation of neurotransmitters has been linked to some clinical conditions. For example:\"},{\"t\":\"li2\",\"h\":\"dopamine – addiction and schizophrenia, where altered dopamine signalling affects reward processing, motivation, and perception. For schizophrenia, dopamine models explain some symptoms better than others.\"},{\"t\":\"li2\",\"h\":\"serotonin – clinical depression and anxiety disorder, where disrupted serotonin activity impairs mood and emotional regulation.\"},{\"t\":\"li1\",\"h\":\"Drug therapies work by altering neurochemical signalling in the brain. Examples include:\"},{\"t\":\"li2\",\"h\":\"increasing or decreasing neurotransmitter availability\"},{\"t\":\"li2\",\"h\":\"blocking or stimulating receptors\"},{\"t\":\"li2\",\"h\":\"modifying reuptake processes.\"},{\"t\":\"li1\",\"h\":\"Hormonal variations between biological sexes (testosterone, oestrogen) can influence different psychological responses and patterns of vulnerability, without determining behaviour.\"},{\"t\":\"li1\",\"h\":\"Modern models expand on the fight-or-flight response. They include Freeze, Fright, Flag, and Faint – which unfold as danger gets closer and options for defence disappear (Schauer &amp; Elbert, 2010). While the initial stages rely on sympathetic nervous system arousal for active mobilisation, the final stages transition into parasympathetic dominance, resulting in behavioural shutdown and dissociation when escape is impossible (Schauer &amp; Elbert, 2010).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Use neurochemical evidence to explain psychological conditions.\"},{\"t\":\"li1\",\"h\":\"Analyse and critique the effectiveness of drug therapies.\"},{\"t\":\"li1\",\"h\":\"Evaluate research about brain chemistry and behaviour, including the strengths and limitations of biological explanations.\"},{\"t\":\"li1\",\"h\":\"Analyse how interactions among biological brain processes influence psychological functioning and behaviour.\"},{\"t\":\"li1\",\"h\":\"Apply knowledge of hormonal variations and models to behaviour.\"}]},{\"name\":\"Brain structure\",\"k\":[{\"t\":\"li1\",\"h\":\"The functions carried out within the four lobes tend to be dominated by either the left or right hemisphere of the brain (e.g. left hemisphere dominates speech production; located in Broca’s area). This division is called ‘lateralisation’.\"},{\"t\":\"li1\",\"h\":\"The three subcortical structures act as control and regulation hubs:\"},{\"t\":\"li2\",\"h\":\"thalamus – filters and directs sensory information to cerebral cortex for processing, helps regulate levels of consciousness, sleep, and alertness by controlling flow of sensory input\"},{\"t\":\"li2\",\"h\":\"hypothalamus – maintains homeostasis by regulating endocrine system and autonomic nervous system, controls biological drives (e.g. hunger, thirst, body temperature) and ‘fight-or-flight’ stress response.\"},{\"t\":\"li1\",\"h\":\"Neurons are the primary cells of the nervous system, consisting of:\"},{\"t\":\"li2\",\"h\":\"a cell body (soma)\"},{\"t\":\"li2\",\"h\":\"dendrites to receive signals\"},{\"t\":\"li2\",\"h\":\"an axon to transmit electrical impulses to other cells\"},{\"t\":\"li2\",\"h\":\"a myelin sheath, an insulating layer around the axon, to increase the speed of impulse conduction.\"},{\"t\":\"li1\",\"h\":\"Communication between neurons occurs at the synapse, which is a gap where electrical impulses trigger the release of neurotransmitters from the pre-synaptic neuron to bind with receptors on the post-synaptic neuron.\"},{\"t\":\"p\",\"h\":\"Key study: Maguire et al. (2000) – neuroplasticity.\"},{\"t\":\"li1\",\"h\":\"‘Neuroplasticity’ refers to the brain’s ability to change its physical structure and organisation in response to experience and learning. This includes:\"},{\"t\":\"li2\",\"h\":\"synaptic pruning – rarely used connections are deleted\"},{\"t\":\"li2\",\"h\":\"functional recovery – the brain redistributes tasks to undamaged areas following trauma or injury.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply knowledge of neuron structure and synaptic communication to explain how signals are transmitted through the nervous system.\"},{\"t\":\"li1\",\"h\":\"Map the pathway of information flow from dendrites to synapse, distinguishing electrical and chemical transmission.\"},{\"t\":\"li1\",\"h\":\"Evaluate claims about neuroplasticity using evidence from research, identifying strengths, limitations, and real-life implications.\"},{\"t\":\"li1\",\"h\":\"Apply knowledge of synapses, neurotransmitter release and lateralisation to explain behaviour.\"}]}]},\"note\":\"Note: At Year 12, Biopsychology is taught through the contexts of Social Psychology, Clinical Psychology, and Educational Psychology. At Year 13, Biopsychology is taught through the contexts of Forensic Psychology, Health Psychology, and Developmental Psychology.\"},{\"name\":\"Cognitive Psychology\",\"focus\":\"Applying models of thinking to explain why and how people think the way they do. It examines mental processes such as learning, memory, attention, perception, and decision-making rather than concentrating on the brain’s physical structures.\",\"inYear\":{\"12\":\"Students are taught to study mental processes including learning, memory, attention, perception, and decision-making. They use cognitive theories to explain behaviour and mental processes.\",\"13\":\"Students are taught to apply and evaluate more complex cognitive explanations of thinking, memory, attention, perception, and decision-making.\"},\"years\":{\"12\":[{\"name\":\"Memory and learning\",\"k\":[{\"t\":\"li1\",\"h\":\"Cognitive psychology rose to prominence in the 1950s, applying scientific methods to the study of internal processes (e.g. memory, learning, attention) and viewing the mind as an information-processing system.\"},{\"t\":\"li1\",\"h\":\"Models of memory describe how memories are encoded, stored, and retrieved.\"},{\"t\":\"li1\",\"h\":\"Schemas are information structures, developed through personal experience, that help individuals to organise, interpret, and process information (e.g. gender roles, classroom behaviour). They develop and change through:\"},{\"t\":\"li2\",\"h\":\"assimilation – fitting new information into existing schemas\"},{\"t\":\"li2\",\"h\":\"accommodation – modifying schemas to incorporate new information.\"},{\"t\":\"p\",\"h\":\"Key study: Loftus &amp; Palmer (1974) – eyewitness memory.\"},{\"t\":\"li1\",\"h\":\"Eyewitness memory research shows that forgetting and memory distortion can be influenced by multiple factors.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Compare and evaluate models of memory in explaining how information is encoded, stored, retrieved, and forgotten.\"},{\"t\":\"li1\",\"h\":\"Apply the concepts of schemas, assimilation, and accommodation to explain how new information influences memory and behaviour.\"},{\"t\":\"li1\",\"h\":\"Apply models of memory to real-world scenarios and evaluate the extent to which they account for observed behaviour.\"},{\"t\":\"li1\",\"h\":\"Evaluate the reliability and usefulness of eyewitness testimony using psychological theories and research evidence.\"},{\"t\":\"li1\",\"h\":\"Analyse how schemas develop and change through experience and influence memory, interpretation, and behaviour.\"},{\"t\":\"li1\",\"h\":\"Evaluate research evidence in studies of memory and learning, considering the strength of the conclusions drawn.\"}]},{\"name\":\"Decision-making processes\",\"k\":[{\"t\":\"li1\",\"h\":\"The computer model of thinking describes the mental processes that contribute to decision-making:\"},{\"t\":\"li2\",\"h\":\"input – information is received by the mind\"},{\"t\":\"li2\",\"h\":\"mediational process – information is interpreted (e.g. through attention, perception, memory, evaluation)\"},{\"t\":\"li2\",\"h\":\"output – the result is a behavioural response.\"},{\"t\":\"li1\",\"h\":\"Heuristics are mental shortcuts that help individuals make decisions quickly and efficiently but increase the risk of errors of judgement. People rely on heuristics especially under conditions of:\"},{\"t\":\"li2\",\"h\":\"time pressure\"},{\"t\":\"li2\",\"h\":\"limited information\"},{\"t\":\"li2\",\"h\":\"high cognitive load.\"},{\"t\":\"li1\",\"h\":\"An individual’s schemas can influence decision-making by shaping how individuals perceive situations, evaluate responsibility, and respond to others.\"},{\"t\":\"li1\",\"h\":\"Prosocial behaviour (e.g. deciding to help (upstander) vs deciding not to help (bystander)) is influenced by a combination of cognitive processes and situational factors:\"},{\"t\":\"li2\",\"h\":\"how the situation is interpreted\"},{\"t\":\"li2\",\"h\":\"perceived responsibility\"},{\"t\":\"li2\",\"h\":\"personal and social schemas.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Use the cognitive approach to analyse and explain decision-making and behaviour in specific contexts.\"},{\"t\":\"li1\",\"h\":\"Apply heuristics to everyday decision-making examples.\"},{\"t\":\"li1\",\"h\":\"Use schema theory to analyse social situations and predict resulting behaviour.\"},{\"t\":\"li1\",\"h\":\"Apply and discuss cognitive concepts to prosocial and bystander scenarios.\"}]},{\"name\":\"Perception and attention\",\"k\":[{\"t\":\"li1\",\"h\":\"Attention is the brain’s mechanism for allocating limited cognitive resources. It acts as a filter that prioritises certain sensory information while suppressing others.\"},{\"t\":\"li1\",\"h\":\"Limits in attentional capacity can result in missed information, slower responses, and errors.\"},{\"t\":\"li1\",\"h\":\"Selective attention refers to the ability to focus on a single stimulus while ignoring competing stimuli (e.g. the ‘cocktail party effect’, where people can focus on a single conversation in a noisy environment).\"},{\"t\":\"li1\",\"h\":\"Inattentional blindness occurs when an individual fails to perceive an unexpected stimulus that is in plain sight because their attention is focused on something else (e.g. Simons &amp; Chabris, 1999). Some researchers take this as evidence that attention is required for conscious awareness. Others argue the stimuli are perceived but not remembered.\"},{\"t\":\"li1\",\"h\":\"In the Stroop Test, participants name the colour of ink while ignoring incongruent word meanings. Increased reaction time demonstrates interference from automatic processing, revealing limits in selective attention.\"},{\"t\":\"li1\",\"h\":\"In the Emotional Stroop Test, delayed reactions when exposed to emotive words demonstrates that emotional stimuli use more attentional resources.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Interpret evidence from attention research to evaluate the claim that attention is a limited cognitive resource.\"},{\"t\":\"li1\",\"h\":\"Compare explanations for limitations of attention using psychological research.\"},{\"t\":\"li1\",\"h\":\"Conduct and evaluate simple attention experiments.\"},{\"t\":\"li1\",\"h\":\"Analyse how attentional limitations influence behaviour in everyday situations.\"}]}],\"13\":[{\"name\":\"Memory and learning\",\"k\":[{\"t\":\"li1\",\"h\":\"Flashbulb memories are vivid, long-lasting memories of the circumstances surrounding a dramatic event, affected by emotional state and personal relevance. Research shows that confidence in these memories remains high, but accuracy can decline over time.\"},{\"t\":\"li1\",\"h\":\"Reconstructive memory refers to the idea that memory is actively reconstructed, integrating original information with schemas, beliefs, and new information (e.g. Bartlett War of Ghosts study, 1932). This can result in memory distortions and false memories.\"},{\"t\":\"li1\",\"h\":\"Forgetting can occur due to interference, where memories (especially similar ones) compete. Interference can be:\"},{\"t\":\"li2\",\"h\":\"proactive – old memories disrupt new ones\"},{\"t\":\"li2\",\"h\":\"retroactive – new memories disrupt old ones.\"},{\"t\":\"li1\",\"h\":\"The ‘encoding specificity principle’ (Tulving, 1983) states that recall is most effective when the same cue is present at both encoding and retrieval. If cues are different, cue-dependent forgetting can occur. This supports the idea that memories can be temporarily inaccessible but not lost.\"},{\"t\":\"li1\",\"h\":\"Cognitive Load Theory (Sweller, 1998) describes learning effectiveness in terms of how much information working memory can process. It distinguishes between three types of cognitive load:\"},{\"t\":\"li2\",\"h\":\"intrinsic load – the load imposed by the number of interacting elements the learner must hold together, which reduces as expertise grows and can be managed by segmenting tasks\"},{\"t\":\"li2\",\"h\":\"extraneous load – cognitive load caused by poor presentation or distractions, that occupy cognitive resources without contributing to learning\"},{\"t\":\"li2\",\"h\":\"germane load – ‘good’ load that goes into processing, constructing, and automating schemas.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Use the concepts of flashbulb memories and reconstructive memory to challenge the reliability of eyewitness testimony.\"},{\"t\":\"li1\",\"h\":\"Interpret memory research data to infer which cognitive processes contribute to forgetting.\"}]},{\"name\":\"Decision-making processes\",\"k\":[{\"t\":\"li1\",\"h\":\"The Theory of Planned Behaviour (Ajzen, 1991) explains decision-making as a reasoned process. It holds that the best predictor of behaviour is intention, which is shaped by:\"},{\"t\":\"li2\",\"h\":\"attitudes (personal evaluation of behaviour)\"},{\"t\":\"li2\",\"h\":\"subjective norms (perceived social expectations)\"},{\"t\":\"li2\",\"h\":\"perceived behavioural control (belief in one’s ability to perform the behaviour).\"},{\"t\":\"li1\",\"h\":\"The dual-process theory of thinking (Kahneman) describes two types of thinking. The two systems are descriptions of patterns of processing rather than distinct structures in the brain.\"},{\"t\":\"li2\",\"h\":\"System 1 is automatic, intuitive, and unconscious, requires little to no effort, and involves little sense of voluntary control. It is highly efficient and relies on heuristics that can sometimes lead to errors.\"},{\"t\":\"li2\",\"h\":\"System 2 is slow, deliberate, and logical, and requires conscious effort and concentration. It is experienced as effortful.\"},{\"t\":\"li1\",\"h\":\"Heuristics used in System 1 thinking can lead to cognitive biases, where decision-making deviates from logic or objective reality. Examples of key cognitive biases include:\"},{\"t\":\"li2\",\"h\":\"confirmation bias\"},{\"t\":\"li2\",\"h\":\"anchoring bias\"},{\"t\":\"li2\",\"h\":\"availability and heuristic bias\"},{\"t\":\"li2\",\"h\":\"bandwagon effect\"},{\"t\":\"li2\",\"h\":\"negativity bias.\"},{\"t\":\"li1\",\"h\":\"Behavioural change can be brought about by examining these mediational processes. For example, Dialectical Behaviour Therapy (DBT) aims to strengthen reflective decision-making (System 2 processes) through:\"},{\"t\":\"li2\",\"h\":\"acceptance (validation and emotional regulation)\"},{\"t\":\"li2\",\"h\":\"change (learning and practising alternative behaviours).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Critique cognitive theories of decision-making in terms of explanatory power and usefulness.\"},{\"t\":\"li1\",\"h\":\"Apply dual-process theory to explain decision errors.\"},{\"t\":\"li1\",\"h\":\"Examine how heuristics and cognitive biases influence real-world decisions.\"},{\"t\":\"li1\",\"h\":\"Design and conduct research investigating either heuristics, bias, or decision-making processes.\"},{\"t\":\"li1\",\"h\":\"Evaluate the usefulness of DBT in improving decision-making.\"}]},{\"name\":\"Perception and attention\",\"k\":[{\"t\":\"li1\",\"h\":\"Divided attention is the spread of limited mental resources across multiple concurrent tasks or information sources, typically resulting in a ‘switch cost’ rather than true simultaneous processing.\"},{\"t\":\"li1\",\"h\":\"Advanced attention mechanisms include:\"},{\"t\":\"li2\",\"h\":\"executive control – intentional direction and shifting of attention\"},{\"t\":\"li2\",\"h\":\"inhibition – suppressing irrelevant or distracting information\"},{\"t\":\"li2\",\"h\":\"cognitive load – the amount of mental effort currently being used\"},{\"t\":\"li2\",\"h\":\"attentional bottlenecks – processing limits that restrict simultaneous information handling.\"},{\"t\":\"li1\",\"h\":\"Perception is the interpretation and organisation of sensory information. It involves:\"},{\"t\":\"li2\",\"h\":\"top-down processing – the cognitive process of using context, memory, and expectations to influence how one interprets sensory input\"},{\"t\":\"li2\",\"h\":\"bottom-up processing – data-driven perception that begins with the sensory receptors and works up to the brain’s integration of sensory information.\"},{\"t\":\"li1\",\"h\":\"Visual illusions (e.g. Müller-Lyer illusion, Margaret Thatcher effect) demonstrate assumptions made by the perceptual system.\"},{\"t\":\"li1\",\"h\":\"Priming occurs when prior exposure influences perception or interpretation.\"},{\"t\":\"li1\",\"h\":\"The McGurk effect illustrates multisensory integration in speech perception.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Explain and evaluate visual and multisensory illusions as evidence of perceptual processing.\"},{\"t\":\"li1\",\"h\":\"Apply top-down and bottom-up processing to perceptual examples.\"},{\"t\":\"li1\",\"h\":\"Evaluate research evidence related to attention and perception.\"},{\"t\":\"li1\",\"h\":\"Design and conduct research investigating attention or perceptual distortion.\"}]}]},\"note\":\"Note: At Year 12, Cognitive psychology is taught through the contexts of Social Psychology, Clinical Psychology, and Educational Psychology. At Year 13, Cognitive Psychology is taught through the contexts of Forensic Psychology, Health Psychology, and Developmental Psychology.\"},{\"name\":\"Sociocultural Psychology\",\"focus\":\"External influences on individual behaviour. Examining how social, cultural, and environmental contexts shape thoughts, emotions, actions, and well-being. Students study social relationships, cross-cultural psychology, and kaupapa Māori psychologies.\",\"inYear\":{\"12\":\"Students are taught to examine how social, cultural, and environmental influences affect behaviour, identity, and well-being. They explore cross-cultural and kaupapa Māori perspectives on human behaviour and experience.\",\"13\":\"Students are taught to analyse how social and cultural contexts influence development, moral reasoning, relationships, and well-being across diverse communities.\"},\"years\":{\"12\":[{\"name\":\"Social and environmental influence\",\"k\":[{\"t\":\"li1\",\"h\":\"The sociocultural approach explains behaviour as the result of interaction between individuals and their social, cultural, and environmental contexts, including family, peers, institutions, and cultural norms.\"},{\"t\":\"h\",\"h\":\"<b>Learning through the social environment<\\/b>\"},{\"t\":\"li1\",\"h\":\"Behaviour is formed through experience and interaction with others. Learning processes include:\"},{\"t\":\"li2\",\"h\":\"classical conditioning – learning through association (e.g. Pavlov – learned associations)\"},{\"t\":\"li2\",\"h\":\"operant conditioning – learning through consequences (e.g. Skinner – reinforcement and punishment shape behaviour)\"},{\"t\":\"li2\",\"h\":\"social learning – learning through observation and modelling (e.g. Bandura – observation without direct enforcement).\"},{\"t\":\"h\",\"h\":\"<b>Social influence<\\/b>\"},{\"t\":\"li1\",\"h\":\"Social influence refers to how individuals adapt behaviour, attitudes, or beliefs due to real or perceived social pressure.\"},{\"t\":\"li1\",\"h\":\"Group therapies can be used to influence an individual’s thoughts and behaviours.\"},{\"t\":\"li1\",\"h\":\"Key forms include:\"},{\"t\":\"li2\",\"h\":\"conformity – adjusting behaviour to align with group norms\"},{\"t\":\"li2\",\"h\":\"obedience – complying with authority figures. Note: Key study: Milgram (1960s) – obedience\"},{\"t\":\"li1\",\"h\":\"Research illustrates how situation and authority can override personal values.\"},{\"t\":\"h\",\"h\":\"<b>Authoritative conformity and cult influence<\\/b>\"},{\"t\":\"li1\",\"h\":\"High-control groups demonstrate how authority, isolation, identity fusion, and conformity pressures can lead individuals to adopt beliefs and behaviours they might otherwise reject.\"},{\"t\":\"li1\",\"h\":\"Sociocultural psychology explains cult influence through social identity, obedience, and situational power, rather than individual pathology.\"},{\"t\":\"h\",\"h\":\"<b>Development in context<\\/b>\"},{\"t\":\"p\",\"h\":\"Key study: The Dunedin Study – lifespan longitudinal study.\"},{\"t\":\"li1\",\"h\":\"Human development is shaped by long-term interaction between biological factors and social environments.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Use theories of conditioning and social influence to explain behaviour in different social and cultural contexts.\"},{\"t\":\"li1\",\"h\":\"Apply social learning and social influence concepts to real-world behaviour.\"},{\"t\":\"li1\",\"h\":\"Analyse how environmental and social factors shape development over time.\"},{\"t\":\"li1\",\"h\":\"Use psychological research to support explanations of social influence.\"},{\"t\":\"li1\",\"h\":\"Use longitudinal research (e.g. The Dunedin Study) to illustrate interactions between biological and social factors impacting development.\"}]},{\"name\":\"Cross-cultural psychologies\",\"k\":[{\"t\":\"li1\",\"h\":\"Cross-cultural psychology refers to the study and comparison of specific social practices (e.g. courtship behaviour, child-rearing practices, therapeutic attitudes and techniques) across several different cultures, examining comparative effects of culture on human thinking, feeling, and behaviour while recognising the influence of research context and cultural assumptions.\"},{\"t\":\"li1\",\"h\":\"Cross-cultural psychology finds both:\"},{\"t\":\"li2\",\"h\":\"universalism in mental processes and human behaviour across cultures (e.g. Buss (1989) found support in a cross-cultural study that men sought good looks and women sought ambition and industriousness in mates)\"},{\"t\":\"li2\",\"h\":\"diversity, highlighting links between cultural norms and behaviour and the ways in which human activities are influenced by cultural forces.\"},{\"t\":\"li1\",\"h\":\"Some claims of universality may be influenced by cultural assumptions and sampling methods used in research.\"},{\"t\":\"li1\",\"h\":\"Cultures fall on a spectrum between collectivist (prioritising group harmony, shared responsibility, interdependence) and individualistic (prioritising autonomy, personal goals, independence).\"},{\"t\":\"li1\",\"h\":\"Key study: Wetherell (1982) – levels of prejudice and discrimination in individualist and collectivist cultures.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Critique cross-cultural studies for generalisability, reliability, and validity.\"},{\"t\":\"li1\",\"h\":\"Apply cross-cultural psychology concepts to culturally diverse contexts and evaluate their usefulness in explaining behaviour.\"}]},{\"name\":\"Kaupapa Māori psychology\",\"k\":[{\"t\":\"li1\",\"h\":\"Historically, Māori and other Indigenous cultures were often examined through psychiatric frameworks that did not always reflect Indigenous perspectives on human behaviour and experience.\"},{\"t\":\"li1\",\"h\":\"Contemporary psychology increasingly recognises Indigenous psychologies as contributing to psychological knowledge, theory, research, and practice.\"},{\"t\":\"li1\",\"h\":\"Kaupapa Māori psychology is an approach that draws on Māori values, concepts, and knowledge systems to understand human behaviour and experience, and to support psychological practice that recognises Māori cultural identity.\"},{\"t\":\"li1\",\"h\":\"Connections to people and whenua, mauri (life force), and wairuatanga (holistic well-being) are integral to this approach.\"},{\"t\":\"h\",\"h\":\"<b>Guiding principles in kaupapa Māori contexts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Pipi et al. (2004) identified eight principles that underpin kaupapa Māori approaches, ensuring that Māori values, perspectives, and knowledge are recognised and respected in practice and engagement:\"},{\"t\":\"li2\",\"h\":\"Whanaungatanga emphasises relationships and connectedness.\"},{\"t\":\"li2\",\"h\":\"Manaakitanga emphasises care, generosity, and reciprocity.\"},{\"t\":\"li2\",\"h\":\"Aroha emphasises respect and compassion.\"},{\"t\":\"li2\",\"h\":\"Mahaki emphasises humility in sharing knowledge.\"},{\"t\":\"li2\",\"h\":\"Mana emphasises dignity, respect, and self-worth.\"},{\"t\":\"li2\",\"h\":\"Titiro, whakarongo, kōrero emphasises looking, listening, and then speaking.\"},{\"t\":\"li2\",\"h\":\"Kia tūpato emphasises caution, reflection, and cultural safety.\"},{\"t\":\"li2\",\"h\":\"He kanohi kitea emphasises being a familiar and trusted presence.\"},{\"t\":\"h\",\"h\":\"<b>Te Whare Tapa Whā model<\\/b>\"},{\"t\":\"li1\",\"h\":\"Te Whare Tapa Whā (Durie, 1984) likens hauora to the four walls of a whare (house), where each wall is interconnected and essential for well-being. The four dimensions are:\"},{\"t\":\"li2\",\"h\":\"taha tinana (physical)\"},{\"t\":\"li2\",\"h\":\"taha hinengaro (mental/emotional)\"},{\"t\":\"li2\",\"h\":\"taha whānau (social)\"},{\"t\":\"li2\",\"h\":\"taha wairua (spiritual).\"},{\"t\":\"li1\",\"h\":\"In 1997, Moeau proposed adding taha whenua as a fifth dimension to acknowledge the importance of connection to place.\"},{\"t\":\"h\",\"h\":\"<b>Interaction between mātauranga Māori and Western science<\\/b>\"},{\"t\":\"li1\",\"h\":\"The He Awa Whiria (braided rivers) model by Macfarlane et al. (2015) describes mātauranga Māori and Western science as distinct knowledge systems that can work together in a shared space without losing their distinct identities.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Evaluate psychological theories, assessments, and practices in relation to Māori cultural values, perspectives, and experiences.\"},{\"t\":\"li1\",\"h\":\"Analyse well-being using Te Whare Tapa Whā and other psychological models.\"},{\"t\":\"li1\",\"h\":\"Apply the He Awa Whiria model to analyse relationships between mātauranga Māori and Western scientific approaches in psychology.\"}]}],\"13\":[{\"name\":\"Social and environmental influence\",\"k\":[{\"t\":\"li1\",\"h\":\"Sociocultural psychology emphasises that behaviour cannot be fully understood without context.\"},{\"t\":\"li1\",\"h\":\"Behaviour is influenced by immediate situational factors as well as broader cultural norms.\"},{\"t\":\"li2\",\"h\":\"Situational explanations focus on role expectations, authority, and group presence.\"},{\"t\":\"li2\",\"h\":\"Cultural explanations focus on shared values, beliefs about responsibility and obligation, and norms governing acceptable behaviour.\"},{\"t\":\"h\",\"h\":\"<b>Sociocultural approaches to development<\\/b>\"},{\"t\":\"li1\",\"h\":\"Development occurs through social interaction and cultural transmission.\"},{\"t\":\"li1\",\"h\":\"Vygotsky’s sociocultural theory (1978) emphasises:\"},{\"t\":\"li2\",\"h\":\"learning through interaction with more knowledgeable others\"},{\"t\":\"li2\",\"h\":\"the role of language as a cultural tool\"},{\"t\":\"li2\",\"h\":\"the ‘zone of proximal development’ – the gap between what a learner can do independently and what they can achieve with guided support (scaffolding) from a ‘more knowledgeable other’.\"},{\"t\":\"li1\",\"h\":\"Peer interaction and play support cognitive and social development through collaboration and shared meaning.\"},{\"t\":\"h\",\"h\":\"<b>Moral reasoning and care ethics<\\/b>\"},{\"t\":\"p\",\"h\":\"Key studies: Kohlberg (1958) – justice ethics and moral development. Gilligan (1982) – care ethics versus justice ethics.\"},{\"t\":\"li1\",\"h\":\"Kohlberg’s theory of moral development proposed that moral reasoning develops through a sequence of stages characterised by increasing attention to:\"},{\"t\":\"li2\",\"h\":\"obedience and avoidance of punishment\"},{\"t\":\"li2\",\"h\":\"conformity to social rules and expectations\"},{\"t\":\"li2\",\"h\":\"ethical principles and abstract ideals of justice.\"},{\"t\":\"li1\",\"h\":\"Gilligan’s research challenged stage-based theories of moral development by emphasising:\"},{\"t\":\"li2\",\"h\":\"moral reasoning grounded in care, responsibility, and relationships\"},{\"t\":\"li2\",\"h\":\"the influence of gendered socialisation and cultural expectations.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Compare situational and cultural explanations of helping behaviour.\"},{\"t\":\"li1\",\"h\":\"Use situational and cultural factors to explain behaviour in real-world settings.\"},{\"t\":\"li1\",\"h\":\"Use Vygotsky’s sociocultural theory, including the Zone of Proximal Development (ZPD), to analyse learning and development in different contexts.\"},{\"t\":\"li1\",\"h\":\"Analyse developmental situations using concepts such as scaffolding, language, peer interaction, and play to explain developmental outcomes.\"},{\"t\":\"li1\",\"h\":\"Evaluate sociocultural explanations of moral reasoning using evidence from psychological research.\"},{\"t\":\"li1\",\"h\":\"Use Gilligan’s work to analyse how moral reasoning reflects social relationships, cultural expectations, and gendered socialisation.\"},{\"t\":\"li1\",\"h\":\"Apply sociocultural concepts to explain how individuals can be influenced by groups, including cult-like environments.\"}]},{\"name\":\"Cross-cultural psychologies\",\"k\":[{\"t\":\"li1\",\"h\":\"Individualism and collectivism can be impacted by further factors such as hierarchy and cultural equality, producing four cultural patterns.\"},{\"t\":\"li2\",\"h\":\"In vertical individualism, people value personal independence and achievement while accepting inequalities in status and success\"},{\"t\":\"li2\",\"h\":\"In vertical collectivism, people prioritise the goals of the group while accepting hierarchical relationships and authority\"},{\"t\":\"li2\",\"h\":\"In horizontal individualism, people value personal autonomy while viewing others as equals rather than competitors\"},{\"t\":\"li2\",\"h\":\"Horizontal collectivism emphasises benevolence and equal standing among group members.\"},{\"t\":\"li1\",\"h\":\"Cultural variations exist within collectivist frameworks, demonstrating that collectivism is not uniform and that significant variation exists within nation-state cultures, arising from differences in history, values, and social organisation (e.g. the East Asian focus on social harmony versus the Latino emphasis on maintaining balanced interpersonal relationships while pursuing personal goals).\"},{\"t\":\"li1\",\"h\":\"Research indicates that while collectivists expect more mutual support, they also face greater pressures to contribute to their social group.\"},{\"t\":\"li1\",\"h\":\"Independence and interdependence describe how individuals perceive their identity in relation to others (as opposed to individualism–collectivism, focused on social structure).\"},{\"t\":\"li2\",\"h\":\"Independent cultures encourage the expression of unique inner attributes and autonomy.\"},{\"t\":\"li2\",\"h\":\"Interdependent cultures focus on fitting in and maintaining harmonious connections across different status levels.\"},{\"t\":\"li1\",\"h\":\"Culture-bound syndromes are patterns of psychological distress that are expressed and understood within specific cultural contexts, highlighting how culture shapes the experience and interpretation of mental health (e.g. Koro in China, a syndrome involving the belief that the penis, breasts, or vulva are shrinking and disappearing into the body (Chowdhury, 1996)).\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Apply the individualism–collectivism spectrum, with vertical and horizontal dimensions, to different contexts.\"},{\"t\":\"li1\",\"h\":\"Evaluate competing explanations for culture-bound syndromes using psychological evidence.\"},{\"t\":\"li1\",\"h\":\"Consider the variations found within nation-state cultures and their application to human behaviour.\"},{\"t\":\"li1\",\"h\":\"Analyse how independent and interdependent self-concepts influence behaviour, relationships, and decision-making in different cultural settings.\"},{\"t\":\"li1\",\"h\":\"Evaluate universal approaches to mental health, weighing evidence of universalism against culturally specific presentations.\"}]},{\"name\":\"Kaupapa Māori psychology\",\"k\":[{\"t\":\"li1\",\"h\":\"The Tohunga Suppression Act 1907 restricted traditional Māori healing practices and promoted the dominance of Western approaches to health and well-being.\"},{\"t\":\"li1\",\"h\":\"Māori are overrepresented in psychiatric admissions. Multiple historical, social, and health-system factors contribute to this pattern.\"},{\"t\":\"li1\",\"h\":\"The Meihana clinical assessment model helps provide culturally responsive care for Māori patients reflecting the importance of collective well-being in Māori health perspectives. It builds upon the four cornerstones of Te Whare Tapa Whā by adding two additional dimensions:\"},{\"t\":\"li2\",\"h\":\"taiao (physical environment)\"},{\"t\":\"li2\",\"h\":\"iwi katoa (societal context).\"},{\"t\":\"li1\",\"h\":\"In New Zealand, there are examples of mental health practice where Māori and other psychological approaches work in partnership. For example, Te Whare Mārie is a kaupapa mental health service designed to help those needing psychiatric care. It uses Māori interventions in a therapeutic environment, which utilises a strengths-based approach as well as giving access to a psychiatrist.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Compare how Māori-centred frameworks and other psychological approaches understand and respond to mental health and well-being.\"},{\"t\":\"li1\",\"h\":\"Apply holistic Māori models, such as Te Whare Tapa Whā and Meihana, to real-world clinical and community mental health contexts.\"},{\"t\":\"li1\",\"h\":\"Evaluate real-world partnerships of Māori and clinical mental health approaches by assessing kaupapa Māori services, such as Te Whare Mārie, in terms of strengths-based practice, cultural safety, and access to clinical support.\"}]}]},\"note\":\"Note: At Year 12, Sociocultural psychology is taught through the contexts of Social Psychology, Clinical Psychology, and Educational Psychology. At Year 13, Sociocultural psychology is taught through the contexts of Forensic Psychology, Health Psychology, and Developmental Psychology.\"},{\"name\":\"Disciplinary Writing\",\"focus\":\"The use of writing to reflect the ways in which knowledge is organised, analysed, and communicated within the discipline.\",\"inYear\":{},\"years\":{\"12\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Psychological research provides evidence that can be interpreted, analysed, evaluated, and used to develop explanations of behaviour and mental processes.\"},{\"t\":\"li1\",\"h\":\"Psychology communication is shaped by the purpose, audience, and conventions of the discipline.\"},{\"t\":\"li1\",\"h\":\"Psychological concepts, theories, research methodologies, findings, and subject-specific terminology provide the framework for constructing and communicating meaning.\"},{\"t\":\"li1\",\"h\":\"Psychology texts use recognised structures and evidence-based reasoning to explain, analyse, evaluate, and justify claims about behaviour and mental processes.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and use precise psychological terminology accurately and consistently to communicate understanding of psychological concepts, theories, research, behaviour, and mental processes.\"},{\"t\":\"li1\",\"h\":\"Use explanatory, comparative, and cause-and-effect reasoning to explain behaviour and mental processes to make relationships between psychological concepts, theories, and evidence explicit.\"},{\"t\":\"li1\",\"h\":\"Control tense deliberately, using present tense to explain psychological concepts, theories, and interpretations, and past tense to describe the procedures and findings of specific research studies.\"},{\"t\":\"li1\",\"h\":\"Produce effective texts in psychology by using appropriate evidence from studies, linking it to psychological theories, considering limitations of evidence and adopting appropriately qualified language to develop supported conclusions.\"}]}],\"13\":[{\"name\":\"\",\"k\":[{\"t\":\"li1\",\"h\":\"Psychological research provides evidence that can be interpreted, analysed, evaluated, and used to develop explanations of behaviour and mental processes.\"},{\"t\":\"li1\",\"h\":\"Psychology communication is shaped by the purpose, audience, and conventions of the discipline.\"},{\"t\":\"li1\",\"h\":\"Psychological concepts, theories, research methodologies, findings, and subject-specific terminology provide the framework for constructing and communicating meaning.\"},{\"t\":\"li1\",\"h\":\"Psychology texts use recognised structures and evidence-based reasoning to explain, analyse, evaluate, and justify claims about behaviour and mental processes.\"}],\"p\":[{\"t\":\"li1\",\"h\":\"Select and consistently use precise psychological terminology to communicate nuanced understanding of psychological concepts, theories, research, behaviour, and mental processes.\"},{\"t\":\"li1\",\"h\":\"Use explanatory, comparative, and cause-and-effect reasoning to analyse behaviour and mental processes to explore complex, potentially conflicting relationships between psychological concepts, theories, and evidence.\"},{\"t\":\"li1\",\"h\":\"Control tense and register deliberately to distinguish between psychological theories, research procedures and findings, interpretations, evaluations, and claims.\"},{\"t\":\"li1\",\"h\":\"Construct effective, sustained texts in psychology by integrating evidence from multiple studies, linking it to psychological theories, considering competing explanations for phenomena, and using qualified language to develop well-supported conclusions.\"}]}]},\"intro\":\"In Psychology, students use explicitly taught disciplinary writing to explain, analyse, and evaluate behaviour and mental processes, interpret and evaluate research evidence, and justify evidence-based conclusions for specific purposes, audiences, and contexts.\",\"writing\":true}]}]};\nconst SUBJECTS = DATA.subjects;\nconst YEARS = [11,12,13];\nconst NA = {\n  bec:{12:\"Leads into Business Studies and Economics\",13:\"Leads into Business Studies and Economics\"},\n  bus:{11:\"The Year 11 course is Business and Economics\"},\n  cla:{11:\"Starts in Year 12\"},\n  psy:{11:\"Starts in Year 12\"}\n};\nconst $ = id => document.getElementById(id);\nconst strip = h => String(h||\"\").replace(/<[^>]+>/g,\"\");\nconst esc = s => String(s||\"\").replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst dec = s => {const e=document.createElement(\"textarea\");e.innerHTML=s;return e.value};\nconst plain = h => dec(strip(h)).replace(/\\s+/g,\" \").trim();\nconst yearsLabel = s => s.years.length===1 ? `Year ${s.years[0]}` : `Years ${s.years[0]}–${s.years[s.years.length-1]}`;\n/* highlight examples and named case or key studies */\nconst deco = h => h\n  .replace(/^(?:<b>)?(Case study|Key study|Key studies)(?:<\\/b>)?\\s*:\\s*(?:<\\/b>)?\\s*/,'<span class=\"cstag\">$1<\/span> ')\n  .replace(/\\(e\\.g\\.\\s*((?:[^()]|\\([^()]*\\))*)\\)/g,'(<span class=\"eg\">e.g.<\/span> <i class=\"egx\">$1<\/i>)')\n  .replace(/(^|[^>])\\be\\.g\\.(?!<\\/span>)/g,'$1<span class=\"eg\">e.g.<\/span>');\n\n/* state, remembered per browser */\nconst LS = \"ss1113\";\nfunction lsGet(k,d){try{const v=localStorage.getItem(LS+k);return v===null?d:JSON.parse(v)}catch(e){return d}}\nfunction lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}\nlet state = {year:11, q:\"\"};\n{const y=lsGet(\"year\",11); if(YEARS.includes(y)) state.year=y;}\nlet openSub = lsGet(\"sub\",null);\nstate.subj = lsGet(\"subj\",null); if(!SUBJECTS.some(s=>s.key===state.subj)) state.subj=null;\nlet openYear = lsGet(\"oy\",null);\nconst saveSubj = () => {lsSet(\"subj\",state.subj);lsSet(\"oy\",openYear);};\nlet openSet = new Set(lsGet(\"open\",[]));\nconst saveYear = () => lsSet(\"year\",state.year);\nconst saveSub = () => lsSet(\"sub\",openSub);\nconst saveOpen = () => lsSet(\"open\",[...openSet]);\nconst subjectsFor = y => SUBJECTS.filter(s=>s.years.includes(y));\nconst elementsOf = (st,y) => (st.years[String(y)]||[]);\nconst START = {}; SUBJECTS.forEach(s=>Object.entries(s.starts).forEach(([y,yr])=>{START[y]=yr;})); /* proposed start year for each year level */\nconst yrList = a => a.length===1?`Year ${a[0]}`:(a.length===2?`Years ${a[0]} and ${a[1]}`:`Years ${a[0]}–${a[a.length-1]}`);\n\n/* overview */\nfunction renderOverview(){\n  let html='<thead><tr><th scope=\"col\">Subject<\/th>'+YEARS.map(y=>`<th scope=\"col\" class=\"yh ${!state.subj&&y===state.year?'sel':''}\"><button type=\"button\" data-y=\"${y}\" title=\"Show the Year ${y} subjects\">Year ${y} <span class=\"yd\">(from 1 January ${START[y]})<\/span><\/button><\/th>`).join(\"\")+'<\/tr><\/thead><tbody>';\n  for(const s of SUBJECTS){\n    const whole=state.subj===s.key;\n    html+=`<tr style=\"--c:var(${s.c});--ct:var(${s.c}-t)\"><th class=\"rowh ${whole?'sel':''}\" scope=\"row\" data-s=\"${s.key}\"><button type=\"button\" class=\"subj\" title=\"Show the ${esc(s.name)} year levels\"><span class=\"sn\">${esc(s.name)}<\/span><span class=\"go\" aria-hidden=\"true\">›<\/span><small>${yearsLabel(s)}<\/small><\/button><\/th>`;\n    for(const y of YEARS){\n      if(!s.years.includes(y)){html+=`<td class=\"na\">${esc((NA[s.key]||{})[y]||\"Not offered\")}<\/td>`;continue;}\n      let cell=\"\";\n      s.strands.forEach((st,si)=>{\n        const names=elementsOf(st,y).map(e=>e.name).filter(Boolean);\n        cell+=`<button type=\"button\" class=\"topic\" data-y=\"${y}\" data-s=\"${s.key}\" data-st=\"${si}\">${esc(st.name)}<\/button>`+(names.length?`<span class=\"els\">${names.map(esc).join(\" · \")}<\/span>`:\"\");\n      });\n      html+=`<td class=\"${(!state.subj&&y===state.year)||(whole&&(openYear===null||openYear===y))?'selcol':''}\" data-y=\"${y}\" data-s=\"${s.key}\">${cell}<\/td>`;\n    }\n    html+=\"<\/tr>\";\n  }\n  $(\"ovt\").innerHTML=html+\"<\/tbody>\";\n}\n$(\"ovt\").addEventListener(\"click\",e=>{\n  const b=e.target.closest(\"button[data-y]:not(.topic)\"), tp=e.target.closest(\"button.topic\"), td=e.target.closest(\"td[data-y]\");\n  const rh=e.target.closest(\"th.rowh\");\n  if(rh){openSubject(rh.dataset.s);return;}\n  if(b){setYear(+b.dataset.y);$(\"detail\").scrollIntoView({block:\"start\"});return;}\n  if(tp){openAt(+tp.dataset.y,tp.dataset.s,+tp.dataset.st);return;}\n  if(td){openAt(+td.dataset.y,td.dataset.s,null);}\n});\nfunction openAt(y,key,si){\n  state.subj=null;openYear=null;saveSubj();state.year=y;saveYear();openSub=key;saveSub();\n  openSet=new Set(si===null?[]:[key+\"|s\"+si]);saveOpen();\n  renderAll();\n  const el=(si!==null&&$(\"st-\"+key+\"-\"+si))||$(\"panel\");\n  if(el) el.scrollIntoView({block:\"start\"});\n}\nfunction openSubject(key){\n  const sub=SUBJECTS.find(x=>x.key===key); if(!sub) return;\n  state.subj=key;openYear=sub.years.length===1?sub.years[0]:null;saveSubj();openSet=new Set();saveOpen();\n  renderAll();\n  $(\"detail\").scrollIntoView({block:\"start\"});\n}\n\n/* year bar */\nfunction renderControls(){\n  $(\"years\").innerHTML=YEARS.map(y=>`<button type=\"button\" data-y=\"${y}\" aria-pressed=\"${!state.subj&&y===state.year}\">Year ${y}<\/button>`).join(\"\");\n}\n$(\"years\").addEventListener(\"click\",e=>{const b=e.target.closest(\"button\");if(b)setYear(+b.dataset.y)});\nfunction setYear(y){if(state.subj){openSub=state.subj;saveSub();} state.subj=null;openYear=null;saveSubj();state.year=y;saveYear();renderAll();}\n$(\"closeall\").addEventListener(\"click\",()=>{openSub=null;saveSub();openYear=null;saveSubj();openSet.clear();saveOpen();renderOverview();renderDetail();});\nlet qt;$(\"q\").addEventListener(\"input\",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();renderDetail();},150)});\n\n/* content rendering */\nfunction hl(html){\n  if(!state.q) return html;\n  const q=state.q.replace(/[.*+?^${}()|[\\]\\\\]/g,\"\\\\$&\");\n  const re=new RegExp(\"(\"+q+\")\",\"gi\");\n  return html.split(/(<[^>]+>)/).map(p=>p.startsWith(\"<\")?p:p.replace(re,\"<mark>$1<\/mark>\")).join(\"\");\n}\nconst has = html => !!state.q && html.includes(\"<mark>\");\nfunction blocksHTML(bl){\n  if(!bl||!bl.length) return '<p class=\"empty\">No content listed for this column.<\/p>';\n  let out=\"\",lvl=0;\n  const close=to=>{while(lvl>to){out+=\"<\/li><\/ul>\";lvl--;}};\n  for(const b of bl){\n    const txt=hl(deco(b.h));\n    if(b.t===\"li1\"||b.t===\"li2\"){\n      const want=b.t===\"li1\"?1:2;\n      if(lvl===want) out+=\"<\/li>\";\n      else if(lvl<want){while(lvl<want){out+=\"<ul>\";lvl++;if(lvl<want) out+=\"<li>\";}}\n      else{close(want);out+=\"<\/li>\";}\n      out+=\"<li>\"+txt;\n    } else {\n      close(0);\n      if(b.t===\"label\") out+=`<div class=\"lab\">${txt}<\/div>`;\n      else if(b.t===\"h\"||b.t===\"H\") out+=`<div class=\"h\">${txt}<\/div>`;\n      else if(b.t===\"ref\") out+=`<div class=\"ref\">${txt}<\/div>`;\n      else if(b.t===\"formula\") out+=`<div class=\"formula\">${txt}<\/div>`;\n      else out+=`<p class=\"p${/^Note:/.test(strip(b.h))?\" note\":\"\"}\">${txt}<\/p>`;\n    }\n  }\n  close(0);\n  return out;\n}\nlet COPY=[];\nfunction toText(title,bl){\n  const L=[title,\"\"];\n  for(const b of bl){\n    const x=b.x||plain(b.h);\n    if(b.t===\"li1\") L.push(\"• \"+x);\n    else if(b.t===\"li2\") L.push(\"    ◦ \"+x);\n    else if(b.t===\"label\") L.push(\"\",x.toUpperCase());\n    else if(b.t===\"formula\") L.push(\"    \"+x);\n    else L.push(\"\",x);\n  }\n  return L.join(\"\\n\").replace(/\\n{3,}/g,\"\\n\\n\");\n}\nconst copyBtn = i => `<button class=\"copy\" type=\"button\" data-i=\"${i}\">Copy<\/button>`;\nfunction unitHTML(e,title,sameK){\n  const ki=COPY.push(toText(titl
