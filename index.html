\"<b>Geopolitics<\\/b>\"},{\"t\":\"p\",\"h\":\"<b>Case study:<\\/b> impacts and perspectives of trans-boundary resource conflict, exemplified through two case studies of current trans-boundary resources conflicts. One must be international.\"}]}},\"support\":[{\"title\":\"Clarifications of disciplinary terminology\",\"blocks\":[{\"t\":\"p\",\"h\":\"Key geographic thinking in this curriculum draws on spatial and temporal analysis. Where spatial and temporal are referred to in the teaching sequence, spatial refers to the arrangement, distribution, and relationships of physical and human features across the Earth’s surface and temporal refers to the dimension of time in geography, focusing on how physical and human processes, patterns, and environments change, persist, or fluctuate across different timescales.\"},{\"t\":\"p\",\"h\":\"Where geographic perspectives are referenced throughout the teaching sequence, it is expected that teaching incorporate a range of relevant perspectives appropriate to the context being studied. These may include social, economic, environmental, political, cultural, Māori, and other Indigenous perspectives, enabling students to examine geographic issues and environments through multiple ways of knowing and understanding.\"},{\"t\":\"p\",\"h\":\"Geographic decision-making draws on a range of skills, including spatial thinking, data interpretation and analysis, while considering perspectives and implications sustainability. These skills are embedded across the Geography curriculum; however, they are made explicit within the Year 12 teaching sequence to ensure students have opportunities to gain knowledge and practice of decision-making to prepare for pathways in geography.\"},{\"t\":\"p\",\"h\":\"Within the geopolitics element, ‘current’ refers to issues that remain relevant, contested, or evolving within the lifetime of students, rather than being purely historical. This ensures students examine contemporary geographic issues by exploring geopolitical processes that continue to shape decision-making, power relations, and resource use today.\"},{\"t\":\"p\",\"h\":\"Where something is referenced as global/globally, this includes New Zealand. Where the Pacific is referenced, this refers to anywhere that borders or is within the Pacific Ocean.\"}]},{\"title\":\"Integrating the use of geospatial tools\",\"blocks\":[{\"t\":\"p\",\"h\":\"Geospatial tools are central to Geography and refer to the use of maps and spatial technologies to visualise, analyse, and represent data linked to specific locations on the Earth’s surface. These include Geographic Information Systems (GIS), Google Earth, and paper-based mapping tools such as atlases and globes. Geospatial tools support spatial analysis, pattern recognition, and evidence-based interpretation across physical and human geographic contexts. Increasingly, geospatial technologies may incorporate artificial intelligence (AI) capabilities that assist with tasks such as image classification, pattern recognition, predictive modelling, and the interpretation of large spatial datasets. The use of specific geospatial tools is intentionally described in broad terms to allow for variability in access to different tools. The intent is for geospatial tools to be used frequently and where they would be most effective and appropriate.\"}]},{\"title\":\"Case studies\",\"blocks\":[{\"t\":\"p\",\"h\":\"A clear distinction is made between case studies and examples. A case study is a detailed, in-depth examination of a specific geographic context that is used to explore, apply, and evaluate knowledge and practices. Case studies require detailed examination of a context related to the knowledge element studied. An example, by contrast, is a brief reference to a particular place, statistic, event, or strategy that illustrates a concept without extended investigation (e.g. a short outline of a management strategy in one location).\"}]},{\"title\":\"Mātauranga Māori\",\"blocks\":[{\"t\":\"p\",\"h\":\"This teaching sequence incorporates Mātauranga Māori relevant to the geographic contexts being studied, providing place-based and intergenerational understandings of relationships between people and environments. Where appropriate, engagement with local hapū and iwi may support the inclusion of local knowledge, histories, values, and perspectives, ensuring teaching draws on multiple knowledge systems to deepen geographic understanding.\"}]}],\"strands\":[{\"name\":\"Physical Geography\",\"focus\":\"The fundamental physical processes and systems that shape the Earth’s environments and landscapes, and the spatial patterns, environmental changes, and interactions between natural processes and human activity that result.\",\"inYear\":{\"11\":\"Students are taught about climatic, earth surface, and tectonic processes, including the impacts of tropical storms, river flooding, earthquakes, and volcanic eruptions on people and places.\",\"12\":\"Students are taught climatic and earth surface processes, including how people adapt to extreme environments and the significance of glacial environments.\",\"13\":\"Students are taught climatic and earth surface processes, including strategies used to respond to climate change and the management of coastal environments through adaptation and mitigation approaches.\"},\"years\":{\"11\":[{\"name\":\"Climate processes\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Global and local weather systems and patterns<\\/b>\"},{\"t\":\"li1\",\"h\":\"Weather refers to short-term atmospheric conditions such as temperature, precipitation, wind, and cloud cover. Climate describes the long-term patterns and averages of these conditions in a region over many years.\"},{\"t\":\"li1\",\"h\":\"Matapae huarere is the practice of observing environmental indicators to anticipate changes in weather conditions. Similar forms of environmental weather forecasting have been used by many cultures around the world. Indicators can include wave size and turbulence, cloud cover, cloud types, the darkness of the sky, and animal behaviour.\"},{\"t\":\"li1\",\"h\":\"Weather forecasting uses equipment to measure atmospheric conditions.\"},{\"t\":\"li1\",\"h\":\"Geographers study climate patterns at a range of different scales.\"},{\"t\":\"h\",\"h\":\"<b>Local<\\/b>\"},{\"t\":\"li1\",\"h\":\"There are clear patterns in the distribution of sunshine, precipitation, wind, and temperature across New Zealand, and throughout the year.\"},{\"t\":\"li1\",\"h\":\"New Zealand’s climate is strongly influenced by its maritime location and prevailing westerly winds, which moderate temperature extremes year-round.\"},{\"t\":\"li1\",\"h\":\"Local factors such as topography, proximity to the ocean, and prevailing winds influence climate conditions in specific locations.\"},{\"t\":\"li1\",\"h\":\"Orographic rainfall is caused by mountain ranges, resulting in high precipitation on the windward side and rain shadow effects that create drier conditions on the leeward side.\"},{\"t\":\"h\",\"h\":\"<b>Global<\\/b>\"},{\"t\":\"li1\",\"h\":\"Earth is unevenly heated due to the angle of insolation. Insolation varies by latitude because the Earth’s curvature causes the Sun’s rays to be more concentrated at lower latitudes and more spread out toward the poles.\"},{\"t\":\"li1\",\"h\":\"Ocean currents and atmospheric circulation redistribute heat by moving warm air and water away from the equator and cooler air and water toward the equator. This helps balance global temperatures and shape climate patterns.\"},{\"t\":\"li1\",\"h\":\"The Köppen–Geiger climate classification groups the world’s climates based on patterns of temperature and precipitation and their influence on natural vegetation.\"},{\"t\":\"li1\",\"h\":\"Climate can influence population distribution by shaping access to resources, food production, and living conditions.\"},{\"t\":\"h\",\"h\":\"<b>Tropical weather systems<\\/b>\"},{\"t\":\"li1\",\"h\":\"Tropical weather systems are classified according to wind speed, progressing from tropical disturbances and tropical depressions to tropical storms and tropical cyclones.\"},{\"t\":\"li1\",\"h\":\"Tropical cyclones are named differently depending on where they are in the world. Tropical cyclones occur in the Indian Ocean, South Pacific, and South Atlantic. Typhoons occur in the North-West Pacific. Hurricanes occur in the North Atlantic and North-East Pacific.\"},{\"t\":\"li1\",\"h\":\"Tropical cyclones require the following conditions to form:\"},{\"t\":\"li2\",\"h\":\"sea surface temperatures of 26–27°C\"},{\"t\":\"li2\",\"h\":\"low vertical wind shear\"},{\"t\":\"li2\",\"h\":\"the Coriolis effect which occurs from 5° north and south of the equator\"},{\"t\":\"li2\",\"h\":\"low pressure and the potential to join with other thunderstorms.\"},{\"t\":\"li1\",\"h\":\"Tropical cyclones are categorised by their maximum sustained wind speed, which indicates their potential damage using a category 1–5 scale.\"},{\"t\":\"li1\",\"h\":\"Tropical weather systems can be tracked over time using satellite imagery, weather radar, and atmospheric data to monitor their location, movement, and intensity, allowing geographers and meteorologists to predict storm paths and reduce risks to people and places.\"},{\"t\":\"h\",\"h\":\"<b>Impacts of tropical weather systems<\\/b>\"},{\"t\":\"li1\",\"h\":\"Tropical weather systems have social impacts (e.g. loss of life, damage to homes and public facilities), economic impacts (e.g. cost of rebuilding, lost trade and tourism revenue) and environmental impacts (e.g. habitat destruction).\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Impacts of tropical weather systems exemplified through two case studies, including one from the Pacific (e.g. Typhoon Haiyan, Cyclone Gabrielle, Cyclone Bola, Hurricane Helene).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Apply appropriate indicators to anticipate weather changes.\"},{\"t\":\"li1\",\"h\":\"Use weather maps to compare atmospheric conditions at a range of locations and consider the causes of differences.\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to examine the relationship between climate, relief, and population density.\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to examine the distribution of tropical weather systems globally.\"},{\"t\":\"li1\",\"h\":\"Use annotated diagrams to show how variations in insolation lead to different climate zones on a global scale.\"},{\"t\":\"li1\",\"h\":\"Identify global climate zones.\"},{\"t\":\"li1\",\"h\":\"Construct diagrams to show the formation of tropical weather systems.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Examine how Matapae huarere and other environmental weather forecasting can be used to predict weather patterns at a local scale.\"},{\"t\":\"li1\",\"h\":\"Examine methods used to track and predict tropical weather systems.\"},{\"t\":\"li1\",\"h\":\"Classify the social, economic, and environmental impacts of tropical weather systems using case studies.\"},{\"t\":\"li1\",\"h\":\"Explain how topography, prevailing winds, and proximity to the ocean interact to affect local weather patterns in New Zealand.\"},{\"t\":\"li1\",\"h\":\"Explain how global patterns of population distribution are affected by climate.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use case studies to evaluate the significance of the short-term and long-term impacts of tropical weather systems, including both major and minor effects.\"},{\"t\":\"li1\",\"h\":\"Use case studies to evaluate the effectiveness of the management of tropical cyclones.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate microclimates in the school grounds.\"},{\"t\":\"li1\",\"h\":\"Investigate the impact of different surface types on temperature.\"},{\"t\":\"li1\",\"h\":\"Investigate evidence of climate change in local climate records.\"}]},{\"name\":\"Earth surface processes\",\"k\":[{\"t\":\"h\",\"h\":\"<b>The water cycle<\\/b>\"},{\"t\":\"li1\",\"h\":\"The water cycle includes key processes such as evaporation, condensation, precipitation, and transpiration. Water is transferred through flows such as infiltration, runoff, and groundwater movement. Water is stored in a range of places including the atmosphere, rivers, oceans, soil, and ice.\"},{\"t\":\"h\",\"h\":\"<b>Catchments and river systems<\\/b>\"},{\"t\":\"li1\",\"h\":\"A catchment is an area of land where water drains into a river system characterised by features including watersheds, tributaries, and main channel.\"},{\"t\":\"li1\",\"h\":\"Catchments vary in size, shape, and location depending on topography, geology, and land use.\"},{\"t\":\"li1\",\"h\":\"Awa can be recognised as living entities connected to people through whakapapa, each with its own mauri, mana, and identity. For example, Te Awa Tupua (Whanganui River) is legally recognised as having personhood and rights, reflecting a holistic relationship between people and the awa, while the Waikato River is recognised by Waikato-Tainui as a tupuna, a taonga, and a source of mauri.\"},{\"t\":\"h\",\"h\":\"<b>River systems and their characteristics<\\/b>\"},{\"t\":\"li1\",\"h\":\"A river’s long profile illustrates the changing gradient from source to mouth, dividing the system into three distinct zones.\"},{\"t\":\"li1\",\"h\":\"The upper reaches are dominated by steep gradients, high velocity, and erosion creating landforms such as narrow V-shaped valleys, waterfalls, and gorges.\"},{\"t\":\"li1\",\"h\":\"The middle reaches of a river are characterised by increased discharge and wider valleys creating landforms such as meanders and floodplains.\"},{\"t\":\"li1\",\"h\":\"In the lower reaches, as the gradient lessens and the river slows, landforms such as wider floodplains, oxbow lakes, braided rivers, and deltas or estuaries are created.\"},{\"t\":\"li1\",\"h\":\"Characteristics of awa systems are portrayed through whakapapa, pūrākau, and pakiwaitara, which carry knowledge about environmental patterns and risks. This knowledge is often embedded in place names, helping to identify features such as flow, strength, or danger.\"},{\"t\":\"h\",\"h\":\"<b>Fluvial processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Fluvial processes carry water and sediment from the source of the river to the mouth of the river.\"},{\"t\":\"li1\",\"h\":\"The fluvial processes include erosion, transportation, and deposition.\"},{\"t\":\"li1\",\"h\":\"Erosional processes wear away materials from the banks of the river. These include hydraulic action, abrasion, and attrition.\"},{\"t\":\"li1\",\"h\":\"Transportation processes carry material along a river in the water. These include traction, saltation, and suspension.\"},{\"t\":\"li1\",\"h\":\"Depositional processes deposit materials when energy decreases.\"},{\"t\":\"h\",\"h\":\"<b>Fluvial landforms<\\/b>\"},{\"t\":\"li1\",\"h\":\"Rivers create a variety of landforms. These vary in different environments depending on topography, climate, and geology.\"},{\"t\":\"li1\",\"h\":\"Landforms found in river environments include meanders, waterfalls, braids, deltas, and V-shaped valleys.\"},{\"t\":\"h\",\"h\":\"<b>Causes of flooding<\\/b>\"},{\"t\":\"li1\",\"h\":\"Flooding is the inundation of land by water.\"},{\"t\":\"li1\",\"h\":\"Natural factors such as climate and relief can cause flooding. Heavy or prolonged rainfall, steep relief, snowmelt, and intense storm events can increase river discharge and river volume, leading to flooding.\"},{\"t\":\"li1\",\"h\":\"Human activities can increase flooding in areas adjacent to a river. Agricultural practices can compact soil and accelerate water movement into river systems through drainage networks, while deforestation removes vegetation that intercepts rainfall, resulting in increased runoff and higher river discharge.\"},{\"t\":\"li1\",\"h\":\"Urbanisation replaces permeable ground with concrete and tarmac, causing rainwater to flow quickly into drains and rivers.\"},{\"t\":\"li1\",\"h\":\"Climate change is increasing the frequency and intensity of extreme rainfall events that can contribute to a greater risk of river flooding in many areas.\"},{\"t\":\"h\",\"h\":\"<b>Monitoring flood risk<\\/b>\"},{\"t\":\"li1\",\"h\":\"The flow of a river over time is measured as discharge, calculated by multiplying the river’s cross-sectional area by its velocity.\"},{\"t\":\"li1\",\"h\":\"Storm hydrographs are used to monitor and communicate how river discharge changes over time during a rainfall event. Storm hydrographs show the relationship between rainfall input and river response, communicating flood risk clearly to decision-makers and the public.\"},{\"t\":\"li1\",\"h\":\"Key features of a storm hydrograph are:\"},{\"t\":\"li2\",\"h\":\"lag time\"},{\"t\":\"li2\",\"h\":\"rising limb\"},{\"t\":\"li2\",\"h\":\"peak discharge\"},{\"t\":\"li2\",\"h\":\"falling limb.\"},{\"t\":\"h\",\"h\":\"<b>Managing and adapting to flood risks<\\/b>\"},{\"t\":\"li1\",\"h\":\"Management of flood risks from rivers can involve many different approaches and will vary depending on location, topography, climate, and land use.\"},{\"t\":\"li1\",\"h\":\"Hard engineering approaches to flood risk management involve the use of built structures to reduce flooding, such as dams, channelisation, and stop banks (e.g. Wairau Creek in Auckland).\"},{\"t\":\"li1\",\"h\":\"Soft engineering approaches involve working with natural processes to reduce flood risk more sustainably. This includes riparian planting to stabilise riverbanks (e.g. poplar and willow planting in Hawke’s Bay). Other methods include daylighting streams, creating and conserving wetlands, and maintaining raingardens in urban areas that slow and filter runoff from impermeable surfaces.\"},{\"t\":\"li1\",\"h\":\"Adaptive approaches to managing flood risk help communities live with flooding by reducing vulnerability and increasing resilience, (e.g. constructing homes on pontoons in Kaiapoi).\"},{\"t\":\"li1\",\"h\":\"Management of flood risks by hapū and iwi reflects the principle of kaitiakitanga, prioritising the protection of the river’s mauri and long-term health over short-term solutions. Planning is intergenerational, often considering long-term impacts and recognising the reciprocal relationships and responsibilities between people, awa, whenua, and ecosystems.\"},{\"t\":\"li1\",\"h\":\"A catchment-based approach is a collaborative, community-led strategy that manages water environments by zoning land use and coordinating activities upstream and downstream (e.g. TANK in Hawkes Bay). Iwi and hapū-led and co-governed catchment initiatives demonstrate how Mātauranga Māori, kaitiakitanga, and Te Mana o te Wai guide the protection, restoration, and sustainable management of freshwater ecosystems.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Managing and adapting to flood risks exemplified through two case studies of river flooding events (e.g. Kawatiri Buller, Waipa, Mississippi, Ganges), including one in New Zealand.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Construct and annotate diagrams to explore the water cycle.\"},{\"t\":\"li1\",\"h\":\"Use aerial photographs and diagrams to show changes in features along a river system.\"},{\"t\":\"li1\",\"h\":\"Use photographs to identify fluvial features.\"},{\"t\":\"li1\",\"h\":\"Use aerial photographs and diagrams to examine how rivers change over time.\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to examine the distribution of river catchments globally.\"},{\"t\":\"li1\",\"h\":\"Interpret storm hydrograph to identify peak discharge and lag times.\"},{\"t\":\"li1\",\"h\":\"Use data to draw cross sections of rivers.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Explain the processes responsible for erosional and depositional landforms in river systems. Discuss the role the water cycle plays in the flooding of river systems.\"},{\"t\":\"li1\",\"h\":\"Examine how people interact with river landscapes through activities such as settlement, agriculture, recreation, and resource use.\"},{\"t\":\"li1\",\"h\":\"Explain how people manage or increase flood risk in river systems, using case studies.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate runoff from different surface types and explaining the implications for flood risk.\"},{\"t\":\"li1\",\"h\":\"Investigate flow paths of water through the school environment during rainfall, and areas of flood risk.\"},{\"t\":\"li1\",\"h\":\"Investigate the effectiveness of local stormwater drainage.\"},{\"t\":\"li1\",\"h\":\"Investigate how a local river or river system has change over time.\"}]},{\"name\":\"Tectonic processes\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Location of earthquakes and volcanic eruptions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Earthquakes and volcanic eruptions are unevenly distributed across the globe, occurring mainly along tectonic plate boundaries, particularly at convergent, divergent, and transform margins.\"},{\"t\":\"h\",\"h\":\"<b>Processes that cause earthquakes and volcanic eruptions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Earthquakes and volcanic eruptions are linked to the movement of tectonic plates driven by convection currents. At plate boundaries and along faults, earthquakes occur through stress accumulation, fault rupture, and seismic wave propagation, while volcanic eruptions occur through magma formation, magma ascent, and eruption at the Earth’s surface.\"},{\"t\":\"li1\",\"h\":\"Earthquakes and volcanic eruptions cause a range of physical effects (ground shaking, surface rupture, liquefaction, ground displacement, lava flows, ash fall, tephra deposits, lahars, landslides, and tsunamis).\"},{\"t\":\"li1\",\"h\":\"Understanding of earthquakes and volcanic eruptions can be informed by Mātauranga Māori through pūrākau, pakiwaitara, and atua such as Rūaumoko and Hine-i-tāpeka. These understandings recognise the interconnected relationships within the taiao and reflect a holistic worldview in which natural processes are connected.\"},{\"t\":\"li1\",\"h\":\"Other Indigenous knowledge systems have explanations for why earthquakes and volcanic eruptions occur (e.g. Namazu in Japan).\"},{\"t\":\"li1\",\"h\":\"Earthquakes are measured using two main scales. The Moment Magnitude Scale, which records the amount of energy released, and the Modified Mercalli Scale, which measures the intensity of shaking and damage experienced by people and buildings.\"},{\"t\":\"li1\",\"h\":\"Volcanic eruptions can be measured using the Volcanic Explosivity Index. This ranks the explosiveness of an eruption based on the volume of material ejected, height of the eruption, and the duration of the eruption.\"},{\"t\":\"h\",\"h\":\"<b>Impacts of earthquakes and volcanic eruptions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Earthquakes and volcanic eruptions have social, economic, and environmental impacts. Most of these impacts are negative but some can be positive.\"},{\"t\":\"li1\",\"h\":\"Economic impacts include infrastructure destruction, business disruption, tourism decline, agricultural losses, and high recovery and rebuilding costs.\"},{\"t\":\"li1\",\"h\":\"Social impacts include casualties and injuries, population displacement and relocation, disruption to daily life, demographic change, loss of cultural heritage, and psychological trauma. Heightened community spirit may also occur.\"},{\"t\":\"li1\",\"h\":\"Environmental impacts include hydrological disruptions, changes to habitats, ecosystems, soil structure, and fertility, atmospheric pollution, and landscape transformation.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Impacts of earthquakes and volcanic eruptions on people exemplified through one case study of an earthquake and one case study of a volcanic eruption (e.g. Nepal, Montserrat, Ahuriri Napier, Tonga, Eyjafjallajökull). One must be a New Zealand or Pacific case study and one from outside this region.\"},{\"t\":\"h\",\"h\":\"<b>Monitoring of earthquakes and volcanic eruptions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Natural hazards such as earthquakes and volcanic eruptions are monitored using a range of scientific methods including seismometers, GPS, tiltmeters, and satellite imagery.\"},{\"t\":\"li1\",\"h\":\"Mātauranga Māori informs the understanding and monitoring of earthquakes and volcanic activity through intergenerational knowledge, observation of environmental indicators, pūrākau, and pakiwaitara. Grounded in whakapapa and the relationships between atua, whenua, and people, it supports the recognition of environmental change and responses that uphold kaitiakitanga and community well-being.\"},{\"t\":\"li1\",\"h\":\"Monitoring is informed by observing natural indicators (e.g. geothermal activity, animal behaviour, and subtle environmental shifts) all of which can signal changes within the taiao. Modelling is carried through oral histories and whakapapa, which record past events and help identify areas of higher risk based on lived experience and inherited knowledge.\"},{\"t\":\"h\",\"h\":\"<b>Forecasting of earthquakes and volcanic eruptions<\\/b>\"},{\"t\":\"li1\",\"h\":\"To forecast the likelihood and potential size of future earthquakes, scientists monitor fault stress with GPS, apply models incorporating historical records, and monitor plate movement rates.\"},{\"t\":\"li1\",\"h\":\"To forecast the likelihood of future volcanic eruptions, scientists combine data such as seismic activity, ground deformation, gas emissions, and eruption history to estimate the probability, timing, and likely style of an eruption. These models help identify areas of greatest risk to support planning, monitoring, and early warning systems.\"},{\"t\":\"li1\",\"h\":\"Hazard modelling is used to assess the probability of earthquakes and volcanic eruptions by analysing past events, and monitoring data and physical processes.\"},{\"t\":\"li1\",\"h\":\"Mātauranga Māori informs preparedness for earthquakes and volcanic eruptions through careful observation and interpretation of environmental indicators. This includes changes in animal behaviour, geothermal activity, water systems, seasonal cycles, and plant life, which provide place-based insights into environmental change and potential natural hazards.\"},{\"t\":\"h\",\"h\":\"<b>Adapting to earthquakes and volcanic eruptions<\\/b>\"},{\"t\":\"li1\",\"h\":\"Contemporary approaches to natural hazard management include hazard mapping, building standards, land-use planning, zoning to limit development in high-risk areas, monitoring technologies, and early warning systems.\"},{\"t\":\"li1\",\"h\":\"Knowledge of earthquakes and volcanic eruptions through whakapapa, oral histories, and detailed place-based knowledge that records past hazard events and long-term environmental change can inform adaptation to earthquakes and volcanoes. These knowledge systems provide insights into patterns of volcanic activity, seismic events, landscape change, and the relationships between people and the taiao, supporting informed decisions about where and how communities live, use resources, and prepare for future hazards.\"},{\"t\":\"li1\",\"h\":\"Adaptation is guided by kaitiakitanga, with an emphasis on avoiding hazard-prone areas and planning land use in ways that prioritise long-term safety and the well-being of both people and the taiao.\"},{\"t\":\"li1\",\"h\":\"Together, these knowledge systems strengthen community resilience by supporting culturally informed, evidence-based decision-making that protects people, places, and the mauri of the environment.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Adaptations to earthquakes and volcanic eruptions exemplified through one case study of an earthquake and one case study of a volcanic eruption (e.g. Kaikōura, Ōtautahi Christchurch, Tokyo, Mt Merapi, Mt Ruapehu, Fagradalsfjall, Ahuriri Napier, Mount Cotopaxi). One must be New Zealand or Pacific, and one from outside this region.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Identify areas at risk of earthquakes and volcanic eruptions across a range of scales using geospatial tools.\"},{\"t\":\"li1\",\"h\":\"Model convergent, divergent, and transform plate boundaries.\"},{\"t\":\"li1\",\"h\":\"Examine differences in the magnitude and scale of earthquakes and volcanic eruptions using data from past events.\"},{\"t\":\"li1\",\"h\":\"Model the processes that produce volcanic eruptions using examples from past volcanic events.\"},{\"t\":\"li1\",\"h\":\"Model the processes that produce earthquakes using examples from past earthquake events.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Explain the global distribution of volcanic eruptions and earthquakes.\"},{\"t\":\"li1\",\"h\":\"Analyse the impacts of a case study earthquake and a case study volcanic eruption by classifying their physical effects and impacts into short term and long term, and economic, social, and environmental categories.\"},{\"t\":\"li1\",\"h\":\"Examine how communities adapt and respond to the impacts of volcanic eruptions and earthquakes using case studies.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate the stability of different building designs during simulated earthquake shaking and the implications for earthquake risk.\"},{\"t\":\"li1\",\"h\":\"Investigate, using secondary data from volcanic events, how distance from a volcano influences exposure to volcanic hazards.\"},{\"t\":\"li1\",\"h\":\"Investigate, using secondary data from volcanic events, how different eruption conditions influence the distribution of volcanic materials and levels of hazard risk.\"},{\"t\":\"li1\",\"h\":\"Investigate community awareness of and preparedness for earthquake and volcanic hazard risks.\"}]}],\"12\":[{\"name\":\"Climate processes\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Geographically extreme environments<\\/b>\"},{\"t\":\"li1\",\"h\":\"Extreme environments are places where physical conditions make human life and activity difficult, often limiting settlement, resource use, and infrastructure development. These environments vary across the world and are largely shaped by differences in latitude and altitude across continents and countries.\"},{\"t\":\"li1\",\"h\":\"Extreme environments include cold and high-altitude regions, such as polar areas and high mountain ranges outside the polar zones, as well as hot arid environments, including deserts, and semi-arid regions where water availability is severely limited.\"},{\"t\":\"li1\",\"h\":\"Climate characteristics in extreme environments vary widely, with extremes of temperature and precipitation and limited or intense sunshine, shaping environmental processes and human adaptation.\"},{\"t\":\"h\",\"h\":\"<b>The factors and processes that influence the climate in extreme environments<\\/b>\"},{\"t\":\"li1\",\"h\":\"The Intertropical Convergence Zone (ITCZ) is a belt of low pressure near the Equator where warm, moist air rises as trade winds converge, leading to high rainfall and frequent thunderstorms. Its position shifts north and south throughout the year, influencing seasonal climate patterns.\"},{\"t\":\"li1\",\"h\":\"The Earth’s atmosphere is divided into Hadley, Ferrel, and Polar circulation cells, which form global pressure belts and influence prevailing winds and the distribution of heat between the Equator and the poles.\"},{\"t\":\"li1\",\"h\":\"Relief affects climate by influencing temperature, airflow, and precipitation, with altitude influencing lapse rates and mountain barriers producing orographic rainfall and rain shadow effects.\"},{\"t\":\"li1\",\"h\":\"Maritime locations experience reduced seasonal temperature variation due to the high heat capacity of water, while continental interiors experience greater thermal extremes.\"},{\"t\":\"li1\",\"h\":\"Ocean currents play a critical role in transferring heat, with warm currents enhancing coastal warmth and precipitation and cold currents contributing to cooler, drier coastal climates.\"},{\"t\":\"h\",\"h\":\"<b>How people adapt to extreme environments<\\/b>\"},{\"t\":\"li1\",\"h\":\"The climate characteristics of extreme environments create challenges for people (e.g. dehydration and reduced productivity, reduced agricultural and industrial production, and reduced resilience to climate change).\"},{\"t\":\"li1\",\"h\":\"The climate characteristics and challenges of extreme environments create opportunities for people to adapt (e.g. alternative energy production and farming methods, tourism, mineral extraction, and specialised clothing and building materials).\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"How people adapt to extreme environments, exemplified using one case study of a hot desert environment (e.g. Sahara, Arabian, Kalahari) or a cold polar environment (e.g. Canada, Yakutsk, Alaska) or high-altitude environments (e.g. Andes, Ethiopian Highlands, Himalayas).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to show characteristics of extreme environments.\"},{\"t\":\"li1\",\"h\":\"Compare climate graphs from different extreme environments to identify variations in precipitation and temperature.\"},{\"t\":\"li1\",\"h\":\"Construct diagrams to show how cells of air circulation are formed.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Examine how physical factors and processes contribute to the characteristics of extreme environments.\"},{\"t\":\"li1\",\"h\":\"Explain how cells of air circulation form to influence climate in different zones.\"},{\"t\":\"li1\",\"h\":\"Examine how the ITCZ influences climate in equatorial environments.\"},{\"t\":\"li1\",\"h\":\"Explain how ocean currents and proximity to oceans influence coastal climates.\"},{\"t\":\"li1\",\"h\":\"Annotate climate graphs from extreme environments to identify the challenges people may face living there.\"},{\"t\":\"li1\",\"h\":\"Use case studies to explain how the characteristics of extreme environments create challenges for people.\"},{\"t\":\"li1\",\"h\":\"Use case studies to explain how the characteristics of extreme environments create opportunities for people to adapt.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use case studies to evaluate the effectiveness of adaptation strategies in extreme environments.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate how shelter provided by landforms, vegetation, or buildings influences local microclimate conditions and environmental characteristics.\"},{\"t\":\"li1\",\"h\":\"Investigate the impact of altitude on climate, vegetation, and soils.\"},{\"t\":\"li1\",\"h\":\"Investigate population density in hot desert environments and its relationship to water sources.\"}]},{\"name\":\"Earth surface processes\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Glaciers and glaciation<\\/b>\"},{\"t\":\"li1\",\"h\":\"Glaciation is the formation, movement, and recession of glaciers.\"},{\"t\":\"li1\",\"h\":\"A glacier is a slow-moving accumulation of compacted snow, ice, and rock that flows downhill under its own weight and gravity.\"},{\"t\":\"h\",\"h\":\"<b>Location of glaciers<\\/b>\"},{\"t\":\"li1\",\"h\":\"Glaciers occur mainly in high latitude polar regions such as Antarctica and Greenland, and in high-altitude mountain environments at lower latitudes where temperatures are low.\"},{\"t\":\"li1\",\"h\":\"In New Zealand, alpine glaciers are found in both the North and South Islands but are concentrated in the Southern Alps of the South Island, where high relief combined with heavy snowfall allows glaciers to exist at relatively low latitudes.\"},{\"t\":\"li1\",\"h\":\"Long-term environmental changes have continuously shifted global glacial distributions; during the Last Glacial Maximum (c.20,000 years ago), ice sheets covered approximately 25% of Earth’s land surface, compared to just 10% today.\"},{\"t\":\"h\",\"h\":\"<b>Formation of glaciers<\\/b>\"},{\"t\":\"li1\",\"h\":\"For a glacier to form, it requires specific conditions (e.g. sustained low temperatures and consistent snowfall leading to an accumulation of snow).\"},{\"t\":\"li1\",\"h\":\"As snow accumulates, the process of nivation leads to the formation of ice.\"},{\"t\":\"li1\",\"h\":\"Where the accumulation is greater than ablation the glacier will grow.\"},{\"t\":\"li1\",\"h\":\"The balance between accumulation and ablation determines the movement of the glacier:\"},{\"t\":\"li2\",\"h\":\"A glacier advances when accumulation exceeds ablation.\"},{\"t\":\"li2\",\"h\":\"A glacier retreats when ablation exceeds accumulation.\"},{\"t\":\"li2\",\"h\":\"When accumulation and ablation are equal the glacier remains stable.\"},{\"t\":\"h\",\"h\":\"<b>Glacial processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Glaciers move downslope under the force of gravity by two different mechanisms, depending on the temperature.\"},{\"t\":\"li1\",\"h\":\"Internal deformation is dominant in cold polar glaciers.\"},{\"t\":\"li1\",\"h\":\"Basal sliding is dominant in temperate alpine glaciers.\"},{\"t\":\"li1\",\"h\":\"As glaciers move downslope, they actively reshape the landscape through a sequence of interacting processes:\"},{\"t\":\"li2\",\"h\":\"As the ice moves, erosion occurs through plucking and abrasion.\"},{\"t\":\"li2\",\"h\":\"A glacier transports weathered and eroded debris within the ice mass, carrying it on the surface, inside the ice, or along the base.\"},{\"t\":\"li2\",\"h\":\"When a glacier enters warmer elevations and melts, it loses the capacity to hold this material, leading to the deposition of unsorted sediment.\"},{\"t\":\"h\",\"h\":\"<b>Glacial landforms<\\/b>\"},{\"t\":\"li1\",\"h\":\"Glacial landforms are present in 25% of the world’s landmass.\"},{\"t\":\"li1\",\"h\":\"Glacial erosional landforms include U-shaped valleys, fjords, ribbon lakes, roches moutonnée, cirques, and hanging valleys.\"},{\"t\":\"li1\",\"h\":\"Glacial depositional landforms include terminal moraine, lateral moraine, erratic boulders, drumlins, and outwash plains.\"},{\"t\":\"h\",\"h\":\"<b>Significance of glacial landscapes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Glacial landscapes are significant for people due to their economic, environmental, and cultural value, including tourism, electricity generation, agriculture, water supply, recreation, and the role of meltwater in creating rivers and supporting downstream communities.\"},{\"t\":\"li1\",\"h\":\"Glacial landscapes are protected by communities because of their significance (e.g. the Andean Ritual sites, the Himalayan prohibitions in Bhutan and Nepal).\"},{\"t\":\"li1\",\"h\":\"Glaciers act as natural freshwater stores, releasing water gradually over time to help regulate river flows and support ecosystems and communities.\"},{\"t\":\"li1\",\"h\":\"Glaciers and glaciated landscapes provide evidence of past climates and environmental change. Ice, landforms, and sediment deposits help scientists understand Earth's climate history and monitor contemporary climate change.\"},{\"t\":\"li1\",\"h\":\"Glaciers are recognised as taonga and vital freshwater systems connected to ancestral mountains, landscapes, and atua such as Tāwhirimātea and Hine-tū-pari-maunga. These understandings recognise glaciers as living parts of the taiao and guide the protection and restoration of glaciated environments for present and future generations.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Significance of a glaciated environment exemplified through one case study (e.g. Aoraki | Mount Cook).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to identify spatial distribution of glaciers across the globe.\"},{\"t\":\"li1\",\"h\":\"Analyse satellite imagery to examine glacial retreat and advance.\"},{\"t\":\"li1\",\"h\":\"Construct annotated diagrams to explain the mechanisms of glacial movement in polar and alpine glaciers.\"},{\"t\":\"li1\",\"h\":\"Use photographs to identify glacial landforms.\"},{\"t\":\"li1\",\"h\":\"Use diagrams to show how erosion, transportation, and deposition occur in glacial environments.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Explain how variations in mass balance influence glacier advance and retreat.\"},{\"t\":\"li1\",\"h\":\"Discuss the cultural significance of glaciers to Māori, including naming and whakapapa.\"},{\"t\":\"li1\",\"h\":\"Examine the relationship between meltwater from glaciers and river systems.\"},{\"t\":\"li1\",\"h\":\"Examine differing perspectives, including local hapū and iwi, of glacial landscapes and their significance to different communities.\"},{\"t\":\"li1\",\"h\":\"Annotate photographs to explain how erosional and depositional glacial landforms have formed.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate the significance of glacial landscapes for people using case study evidence.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate how a New Zealand glacier has changed over time using photographs, maps, satellite imagery, and climate data.\"},{\"t\":\"li1\",\"h\":\"Investigate the significance of a glaciated environment such as Aoraki/Mount Cook for tourism, conservation, and local communities.\"},{\"t\":\"li1\",\"h\":\"Investigate the hypothesis that indicators of glacial erosion and deposition show a consistent direction of former ice movement through a valley.\"}]}],\"13\":[{\"name\":\"Climate processes\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Global circulation models – hydrospheric and atmospheric processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Global pressure belts are formed by differences in solar heating, creating areas of high and low pressure that drive prevailing winds. These winds, such as the trade winds and westerlies, redistribute heat and moisture around the Earth and influence global weather patterns and climate.\"},{\"t\":\"li1\",\"h\":\"Atmospheric circulation and ocean circulation interact to influence global climate patterns.\"},{\"t\":\"h\",\"h\":\"<b>El Niño and La Niña and their impacts on people and places<\\/b>\"},{\"t\":\"li1\",\"h\":\"The El Niño-Southern Oscillation (ENSO) cycle describes periodic changes to regular conditions, including El Niño and La Niña events, which disrupt regular wind patterns, ocean temperatures, and global weather and climate.\"},{\"t\":\"li1\",\"h\":\"Under regular conditions in the Pacific, trade winds blow from east to west, pushing warm surface water towards the western Pacific and allowing cooler water to upwell in the east.\"},{\"t\":\"li1\",\"h\":\"El Niño is caused by several factors (e.g. weakening trade winds, reduced upwelling, Southern Oscillation, and jet stream changes).\"},{\"t\":\"li1\",\"h\":\"El Niño influences weather patterns across the Pacific and globally by increasing rainfall and droughts.\"},{\"t\":\"li1\",\"h\":\"El Niño has both positive and negative economic, social, and environmental impacts on people and places (e.g. crop failure, disease, increased fishing yields).\"},{\"t\":\"li1\",\"h\":\"La Niña is caused by stronger than normal easterly trade winds and is the cold phase of the ENSO cycle.\"},{\"t\":\"li1\",\"h\":\"La Niña leads to increased rain and flooding in the western Pacific and drier conditions in the eastern Pacific.\"},{\"t\":\"h\",\"h\":\"<b>The causes of climate change<\\/b>\"},{\"t\":\"li1\",\"h\":\"Climate change has occurred over long periods of time due to natural variations including changes in the Earth’s orbit, volcanic activity, and fluctuations in solar output, which have caused past periods of warming and cooling.\"},{\"t\":\"li1\",\"h\":\"Human activities (urbanisation, deforestation, and agricultural practices) have contributed to climate change by enhancing the greenhouse effect through the burning of fossil fuels, which releases greenhouse gases such as carbon dioxide.\"},{\"t\":\"h\",\"h\":\"<b>The impacts of climate change<\\/b>\"},{\"t\":\"li1\",\"h\":\"The impacts of climate change on people and places globally can be both positive and negative.\"},{\"t\":\"li1\",\"h\":\"Climate change has environmental impacts (e.g. increased frequency and intensity of forest fires, the melting of permafrost, changes to glaciers, and marine heatwaves).\"},{\"t\":\"li1\",\"h\":\"Climate change has social impacts, (e.g. increased migration, forced displacement, and changes in urban design).\"},{\"t\":\"li1\",\"h\":\"Climate change has economic impacts (e.g. changes to agricultural practices, the creation of jobs, and rising insurance costs).\"},{\"t\":\"li1\",\"h\":\"Climate change has political impacts (e.g. political unrest, strengthened alliances, and change to trade routes).\"},{\"t\":\"h\",\"h\":\"<b>Management of climate change<\\/b>\"},{\"t\":\"li1\",\"h\":\"Climate change responses include mitigation strategies (e.g. transitioning to renewable energy and improving energy efficiency to reduce emissions).\"},{\"t\":\"li1\",\"h\":\"Climate change responses include adaptation strategies (e.g. flood defences, managed retreat, water management, and changes to land use) which reduce vulnerability to climate impacts.\"},{\"t\":\"li1\",\"h\":\"Environmental management can be informed by whakapapa, kaitiakitanga, mana, mauri, and tikanga. These principles recognise the interconnected relationships between people and the environment and support decision-making that contributes to the long-term well-being of people, communities, and the environment.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"The management of climate change exemplified using two case studies (New Zealand and one other country) that has adopted strategies to respond to climate change (e.g. Fiji, Bangladesh, the Netherlands).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Interpret global circulation models to analyse global ocean and wind patterns.\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools and data to identify El Niño and La Niña patterns and their global impacts.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate the global impacts of El Niño.\"},{\"t\":\"li1\",\"h\":\"Explain the relationship between oceans and the atmosphere during El Niño.\"},{\"t\":\"li1\",\"h\":\"Analyse how El Niño alters weather patterns.\"},{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to identify climate change trends and impacts.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate how climate change impacts differ across the globe.\"},{\"t\":\"li1\",\"h\":\"Examine impacts of climate change on local marae, hapū, and iwi.\"},{\"t\":\"li1\",\"h\":\"Examine how kaitiakitanga principles are incorporated in climate change management in a New Zealand context (at any scale).\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use case studies to evaluate the effectiveness of climate change management strategies in a chosen country.\"}]},{\"name\":\"Earth surface processes\",\"k\":[{\"t\":\"h\",\"h\":\"<b>The coastal zone<\\/b>\"},{\"t\":\"li1\",\"h\":\"The coastal zone is the area that lies between the land and the sea, where terrestrial (land) and marine (ocean) environments interact. It includes features such as beaches, dunes, estuaries, wetlands, and the shallow offshore area.\"},{\"t\":\"li1\",\"h\":\"This zone is divided into high-tide, low-tide, and intertidal areas.\"},{\"t\":\"li1\",\"h\":\"Coastlines are consistently changing due to natural processes.\"},{\"t\":\"li1\",\"h\":\"The sediment budget is the relationship between sediment inputs and losses in a coastal system, which determines whether the coastline erodes, stays stable, or builds.\"},{\"t\":\"h\",\"h\":\"<b>Significance of coastlines<\\/b>\"},{\"t\":\"li1\",\"h\":\"Coasts are important for many communities across the globe and in New Zealand.\"},{\"t\":\"li1\",\"h\":\"Many people across the globe rely on the coastal environment for their livelihoods: fishing, tourism, and trade.\"},{\"t\":\"li1\",\"h\":\"Many coastal environments in New Zealand support mahinga kai, providing traditional food resources that sustain marae, hapū, and iwi.\"},{\"t\":\"li1\",\"h\":\"Mahinga kai represents the enduring relationship between people and the environment, where kaitiakitanga ensures the sustainable use, protection, and restoration of coastal ecosystems for present and future generations.\"},{\"t\":\"li1\",\"h\":\"Te Rerenga Wairua is a profoundly sacred site in te ao Māori, recognised as a point where the spirits of the deceased depart the mainland to return to Hawaiki. As a final gathering place of wairua, it holds the highest level of spiritual significance and remains a central place of connection between people, ancestors, and the spiritual realm.\"},{\"t\":\"h\",\"h\":\"<b>Coastal processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Coastal processes include marine, sub-aerial, and aeolian processes.\"},{\"t\":\"h\",\"h\":\"<b>Marine processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"The formation of waves is influenced by several factors that affect their characteristics, including fetch, wind strength, the duration of the wind, and bathymetry.\"},{\"t\":\"li1\",\"h\":\"Waves can be categorised as plunging, spilling, and surging. They can also be categorised as constructive or destructive.\"},{\"t\":\"li1\",\"h\":\"Waves can move in different ways, including refraction, diffraction and reflection.\"},{\"t\":\"li1\",\"h\":\"Wave erosion includes hydraulic action, attrition, abrasion, and solution.\"},{\"t\":\"li1\",\"h\":\"Wave transportation includes traction, saltation, suspension, solution, swash, backwash, and longshore drift.\"},{\"t\":\"li1\",\"h\":\"Wave deposition occurs when waves lose energy and can no longer transport their load.\"},{\"t\":\"h\",\"h\":\"<b>Sub-aerial processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Sub-aerial processes in a coastal environment include weathering, undercutting, and mass movement.\"},{\"t\":\"li1\",\"h\":\"Weathering includes mechanical, chemical, and biological.\"},{\"t\":\"li1\",\"h\":\"Mass movement includes rockfall, landslides, slumping, and slipping.\"},{\"t\":\"h\",\"h\":\"<b>Aeolian processes<\\/b>\"},{\"t\":\"li1\",\"h\":\"Aeolian erosion processes include deflation, abrasion, and attrition.\"},{\"t\":\"li1\",\"h\":\"Aeolian transportation processes include saltation, suspension, and traction.\"},{\"t\":\"li1\",\"h\":\"Aeolian deposition occurs when wind loses energy and can no longer transport its load.\"},{\"t\":\"h\",\"h\":\"<b>Coastal landforms<\\/b>\"},{\"t\":\"li1\",\"h\":\"Coastal landforms are created by the interaction of marine, sub-aerial, and aeolian processes.\"},{\"t\":\"li1\",\"h\":\"Erosional landforms found in coastal environments include notches, shore platforms, caves, arches, stacks, stumps, and cliffs.\"},{\"t\":\"li1\",\"h\":\"Depositional landforms found in coastal environments include beaches (sand and pebble), sand dunes, berms, spits, bars, and lagoons.\"},{\"t\":\"h\",\"h\":\"<b>Significance of coastlines<\\/b>\"},{\"t\":\"li1\",\"h\":\"Coasts are important for many communities across the globe, and in New Zealand, with many people relying on the coastal environment for their livelihoods (fishing, tourism, and trade).\"},{\"t\":\"li1\",\"h\":\"Many coastal environments in New Zealand support mahinga kai, providing traditional food resources that sustain marae and hapū and reinforce kaitiakitanga.\"},{\"t\":\"li1\",\"h\":\"Te Rerenga Wairua is a profoundly sacred site in te ao Māori, recognised as a point where the spirits of the deceased depart the mainland to return to Hawaiki. As a final gathering place of wairua, it holds the highest level of spiritual significance and remains a central place of connection between people, ancestors, and the spiritual realm.\"},{\"t\":\"h\",\"h\":\"<b>Human use of coastlines<\\/b>\"},{\"t\":\"li1\",\"h\":\"Coastlines are used by humans in many ways, including recreation and tourism, fishing and aquaculture, sand mining and resource extraction.\"},{\"t\":\"li1\",\"h\":\"The development of coastline infrastructure such as ports, roads, and settlements is a major human use that can significantly alter coastal environments.\"},{\"t\":\"li1\",\"h\":\"Human use of coastlines competes for limited coastal space and resources, leading to conflicts between economic development, environmental protection, and social and cultural values.\"},{\"t\":\"h\",\"h\":\"<b>Coastal vulnerability<\\/b>\"},{\"t\":\"li1\",\"h\":\"Physical factors that affect the vulnerability of coastlines include the physical exposure of the coastline to prevailing winds, geology, topography of the coastline, tidal range, and exposure to natural hazards, especially storms.\"},{\"t\":\"li1\",\"h\":\"Human factors that affect the vulnerability of coastlines include population density, inadequate infrastructure, land use, and economic vulnerability due to increased hazard risk.\"},{\"t\":\"li1\",\"h\":\"The impacts of coastal vulnerability on people and places can be significant. The impacts can include increased insurance costs, displacement, salination, and damage to infrastructure.\"},{\"t\":\"h\",\"h\":\"<b>Coastal mitigation and adaptation strategies<\\/b>\"},{\"t\":\"li1\",\"h\":\"Nature-based mitigation and adaptation of coastal environments include dune, mangrove and wetland restoration, and beach nourishment.\"},{\"t\":\"li1\",\"h\":\"Structural and engineering mitigation strategies includes seawalls, groynes, breakwaters, gabions, rock armour, and sandbagging.\"},{\"t\":\"li1\",\"h\":\"Strategic and adaptive planning includes managed retreat, coastal hazards zoning, and adaptive policy.\"},{\"t\":\"li1\",\"h\":\"Mātauranga Māori guides coastal mitigation and adaptation through kaitiakitanga, recognising coastlines as living systems where the well-being of people, whenua, wai, and biodiversity are interconnected. Responses seek to protect the mauri of coastal environments while sustaining cultural relationships, wāhi tapu mahinga kai, and the well-being of future generations.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"The human use, vulnerability, and management of a coastal environment exemplified through one case study of a coastal environment in New Zealand or the Pacific (e.g. Chatham Islands, Cook Islands, South Dunedin) that has implemented both adaptation and mitigation strategies, or one of these.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use photographs to identify coastal landforms.\"},{\"t\":\"li1\",\"h\":\"Construct diagrams to analyse how coastal processes create distinct landforms.\"},{\"t\":\"li1\",\"h\":\"Use geospatial tools to analyse spatial patterns in coastal landforms and explain how coastal processes create those patterns.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Use case studies to discuss coastal vulnerability and the factors that affect it.\"},{\"t\":\"li1\",\"h\":\"Model how the interaction of coastal processes creates coastal landforms and show how these processes work together over time to shape landforms.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate the impacts of human use of coastlines and the effectiveness of adaptation and mitigation strategies in responding to coastal challenges, considering their sustainability from a range of perspectives, using case study evidence.\"}]}]}},{\"name\":\"Human Geography\",\"focus\":\"The human and cultural processes and systems that influence people, places, and environments, and the use of geographic tools and methods to interpret patterns, perspectives, and inform decision-making.\",\"inYear\":{\"11\":\"Students are taught about population change and food security, including the challenges and opportunities created by demographic change and strategies to address food scarcity.\",\"12\":\"Students are taught about migration, energy security, and inequality, including urban migration challenges, strategies to reduce energy insecurity, and approaches to addressing inequality.\",\"13\":\"Students are taught about water insecurity, and trans-boundary resource conflicts, including sustainable resource management and differing perspectives on contested resources.\"},\"years\":{\"11\":[{\"name\":\"Demography\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Population growth, density, and distribution<\\/b>\"},{\"t\":\"li1\",\"h\":\"Global population has grown rapidly since 1800, but rates of growth, spatial distribution, and population density vary markedly between and within regions.\"},{\"t\":\"h\",\"h\":\"<b>Factors that influence the current spatial distribution of the global population<\\/b>\"},{\"t\":\"li1\",\"h\":\"Physical factors influencing the global population distribution include soils, climate, topography, and access to water.\"},{\"t\":\"li1\",\"h\":\"Economic factors influencing the global population distribution include employment, transport routes, and infrastructure.\"},{\"t\":\"li1\",\"h\":\"Social factors influencing the global population distribution include family connections, lifestyle preferences, and places of cultural and religious importance.\"},{\"t\":\"h\",\"h\":\"<b>Characteristics of population growth and decline<\\/b>\"},{\"t\":\"li1\",\"h\":\"Populations are characterised by the birth and death rates, the rate of natural increase, life expectancy, fertility rates, and infant mortality rates.\"},{\"t\":\"li1\",\"h\":\"Population changes can be seen in population pyramids and by using a simple model such as the Demographic Transition Model.\"},{\"t\":\"h\",\"h\":\"<b>Factors that influence global population growth and decline over time<\\/b>\"},{\"t\":\"li1\",\"h\":\"Economic factors can influence population growth or decrease population sizes. These have occurred in the past during the agricultural and industrial revolutions (exponential growth rates) and will either increase or decline with favourable or unfavourable economic conditions.\"},{\"t\":\"li1\",\"h\":\"Social factors influencing population growth or decline include availability of birth control, shifting gender roles, and access to education and healthcare.\"},{\"t\":\"li1\",\"h\":\"Political factors influencing population growth or decline include pro-natalist and anti-natalist policies, civil conflict, and government immigration policies.\"},{\"t\":\"h\",\"h\":\"<b>Population challenges across the globe<\\/b>\"},{\"t\":\"li1\",\"h\":\"Across the globe, rapid population growth can strain natural resources and services, cause environmental degradation, and lower standards of living.\"},{\"t\":\"li1\",\"h\":\"By contrast, population decline can reduce the workforce and economic productivity, and cause population ageing, which increases pressure on healthcare and welfare systems.\"},{\"t\":\"li1\",\"h\":\"A changing demographic structure can result in a change in age and gender balance.\"},{\"t\":\"h\",\"h\":\"<b>Challenges and opportunities as a result of population change<\\/b>\"},{\"t\":\"li1\",\"h\":\"The challenges of rapid population growth can be addressed by a range of strategies (e.g. ante-natal policies, increasing access to family planning, and migration controls).\"},{\"t\":\"li1\",\"h\":\"The challenges of rapid population growth can create opportunities to increase carrying capacity through lifestyle changes, consumption patterns, technological innovation, and adaptation.\"},{\"t\":\"li1\",\"h\":\"The challenges of population decline can be addressed by strategies such as pro-natalist policies, childcare support, and encouraging migration into an area.\"},{\"t\":\"li1\",\"h\":\"The impacts of population decline can provide opportunities to adapt and thrive. This may look like:\"},{\"t\":\"li2\",\"h\":\"increasing the retirement age to encourage lifelong work\"},{\"t\":\"li2\",\"h\":\"incentives\"},{\"t\":\"li2\",\"h\":\"targeted immigration\"},{\"t\":\"li2\",\"h\":\"innovation and automation to address workforce shortages\"},{\"t\":\"li2\",\"h\":\"growth of the ‘silver economy’.\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Challenges and opportunities created by population change, exemplified through case studies, including one country that has or is experiencing rapid population growth (e.g. Nigeria, Qatar, Ireland, Kiribati), and one country that has or is experiencing population decline (e.g. Japan, South Korea, Canada, Germany). Growth and decline can apply to either a country, region, or demographic group.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Interpret choropleth maps and population density maps to identify patterns of global population distribution, across different scales.\"},{\"t\":\"li1\",\"h\":\"Interpret population pyramids for a country or region to explain population characteristics.\"},{\"t\":\"li1\",\"h\":\"Use data to examine population trends.\"},{\"t\":\"li1\",\"h\":\"Interpret information from demographic data sources.\"},{\"t\":\"li1\",\"h\":\"Use diagrams to show how physical and social/economic factors influence patterns of human settlement.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Explain the factors contributing to population distributions at global and regional scales.\"},{\"t\":\"li1\",\"h\":\"Examine temporal changes in population using demographic data and models (e.g. the Demographic Transition Model, population pyramids, and population growth trends).\"},{\"t\":\"li1\",\"h\":\"Identify the impacts of population growth and population decline using case studies.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Compare strategies used to address population challenges in two population case studies.\"},{\"t\":\"li1\",\"h\":\"Evaluate alternative strategies for addressing population challenges, drawing on evidence from two case studies.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate how population characteristics, including age structure, influence the type, location, and availability of services in the local community.\"},{\"t\":\"li1\",\"h\":\"Investigate changes in the population characteristics of the local area.\"},{\"t\":\"li1\",\"h\":\"Investigate the hypothesis that communities with more working-age residents will have more frequent and accessible public transport services.\"},{\"t\":\"li1\",\"h\":\"Investigate global patterns of population growth and decline.\"}]},{\"name\":\"Resources\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Global distribution of food production and consumption<\\/b>\"},{\"t\":\"li1\",\"h\":\"The spatial distribution of total food production varies across the globe.\"},{\"t\":\"li1\",\"h\":\"Total food production and type of food produced (e.g. fish, potatoes, rice, and dairy) varies between countries. Types of food production have also changed over time.\"},{\"t\":\"li1\",\"h\":\"The spatial distribution of food consumption varies globally.\"},{\"t\":\"li1\",\"h\":\"Total food consumption and calorie intake vary between countries and has changed over time.\"},{\"t\":\"h\",\"h\":\"<b>Factors influencing food production across the globe<\\/b>\"},{\"t\":\"li1\",\"h\":\"There are multiple physical factors that influence food production (e.g. soils, climate, topography, and water availability).\"},{\"t\":\"li1\",\"h\":\"Economic factors can influence food production (e.g. market demand, labour availability, technology, capital).\"},{\"t\":\"li1\",\"h\":\"Social and political factors can influence food production (e.g. land ownership, government policy, cultural practices).\"},{\"t\":\"h\",\"h\":\"<b>Food scarcity and insecurity across the globe<\\/b>\"},{\"t\":\"li1\",\"h\":\"There are important differences between food scarcity and food insecurity.\"},{\"t\":\"li1\",\"h\":\"Food scarcity refers to a physical lack of food in an area where there is not enough food available.\"},{\"t\":\"li1\",\"h\":\"Food scarcity can be caused by environmental factors such as droughts and floods, which reduce crop yields and disrupt food production.\"},{\"t\":\"li1\",\"h\":\"Food insecurity arises when people do not have reliable access to sufficient, safe, and nutritious food, even if food is available.\"},{\"t\":\"li1\",\"h\":\"Food insecurity can be caused by socioeconomic factors, such as:\"},{\"t\":\"li2\",\"h\":\"conflict\"},{\"t\":\"li2\",\"h\":\"poverty\"},{\"t\":\"li2\",\"h\":\"inflation\"},{\"t\":\"li2\",\"h\":\"displacement\"},{\"t\":\"li2\",\"h\":\"the interruption of supply chains.\"},{\"t\":\"h\",\"h\":\"<b>Social and economic impacts of food scarcity and insecurity<\\/b>\"},{\"t\":\"li1\",\"h\":\"Food scarcity and food insecurity have social and economic impacts that place pressure on households, governments, and aid systems.\"},{\"t\":\"li1\",\"h\":\"Social impacts include:\"},{\"t\":\"li2\",\"h\":\"malnutrition\"},{\"t\":\"li2\",\"h\":\"poor health\"},{\"t\":\"li2\",\"h\":\"reduced educational outcomes\"},{\"t\":\"li2\",\"h\":\"increased migration\"},{\"t\":\"li2\",\"h\":\"social instability.\"},{\"t\":\"li1\",\"h\":\"Economic impacts include:\"},{\"t\":\"li2\",\"h\":\"reducing workforce productivity\"},{\"t\":\"li2\",\"h\":\"limiting economic growth\"},{\"t\":\"li2\",\"h\":\"increasing healthcare costs.\"},{\"t\":\"h\",\"h\":\"<b>Understanding food security through Mātauranga Māori<\\/b>\"},{\"t\":\"li1\",\"h\":\"Food security can be informed by the principles of kaitiakitanga, manaakitanga, and whakapapa, which recognise that the well-being of people is inseparable from the health of whenua, wai, and ecosystems.\"},{\"t\":\"li1\",\"h\":\"Mahinga kai, grounded in Mātauranga Māori and tikanga, encompasses the customary gathering, cultivation, harvesting, and management of food and natural resources, the places where these resources are found, and the knowledge and practices that sustain them across generations.\"},{\"t\":\"li1\",\"h\":\"Mahinga kai reflects a reciprocal relationship between people and the environment, supporting access to culturally appropriate and nutritious food while protecting the mauri of ecosystems and food sources.\"},{\"t\":\"h\",\"h\":\"<b>Strategies to address food scarcity and food insecurity<\\/b>\"},{\"t\":\"li1\",\"h\":\"Strategies to address food scarcity and insecurity should focus on enhancing diversified, resilient, and accessible systems.\"},{\"t\":\"li1\",\"h\":\"Strategies to address food scarcity may focus on increasing production (seed banks, Svalbard Global Seed Vault), technological practices (vertical farming and genetically modifying crops), government policies (national rice reserves in Japan and Vietnam), and global humanitarian responses (The Global Agriculture and Food Security Program).\"},{\"t\":\"li1\",\"h\":\"Non-governmental strategies to address food insecurity can include:\"},{\"t\":\"li2\",\"h\":\"community-based (e.g. urban gardens, including māra kai, and social supermarkets)\"},{\"t\":\"li2\",\"h\":\"advocacy-based (e.g. supporting or influencing government policies like school meal programmes)\"},{\"t\":\"li2\",\"h\":\"part of global humanitarian responses (e.g. Fair Trade initiatives).\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Social and economic impacts of food insecurity and strategies to address one of or both food scarcity and food insecurity exemplified through a case study in a country outside of New Zealand (e.g. Singapore, Brazil, China, United Arab Emirates, Malawi).\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Interpret maps, geospatial tools, and data sets to examine spatial distribution and temporal change of food production and consumption.\"},{\"t\":\"li1\",\"h\":\"Construct systems diagrams to show the interaction of physical and human factors affecting food production.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Explain how physical factors influence patterns of food production.\"},{\"t\":\"li1\",\"h\":\"Explain why food scarcity and food insecurity varies between places and over time.\"},{\"t\":\"li1\",\"h\":\"Analyse the environmental, economic, political, and social causes of food scarcity and food insecurity, and examine their impacts on communities, economies, and environments using case study evidence.\"},{\"t\":\"li1\",\"h\":\"Investigate how diversifying food production, food sources, and food consumption can contribute to resilient and accessible food systems.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate the effectiveness of strategies used to address food scarcity and food insecurity using a case study.\"},{\"t\":\"li1\",\"h\":\"Examine varied perspectives on appropriate strategies used to address food scarcity and food insecurity using a case study.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate how a community initiative such as a foodbank, community garden, or pātaka kai, supports food security and well-being.\"}]}],\"12\":[{\"name\":\"Demography\",\"k\":[{\"t\":\"h\",\"h\":\"<b>New Zealand contemporary migration (2000 to present)<\\/b>\"},{\"t\":\"li1\",\"h\":\"Lee’s migration model is a way of explaining the reasons (push and pull factors) for migration from the origin to the destination including the intervening obstacles and counterflows that are experienced by migrants.\"},{\"t\":\"li1\",\"h\":\"Migration is characterised by external migration (emigration and immigration) and internal migration which can result in positive or negative net migration.\"},{\"t\":\"li1\",\"h\":\"Internal migration may see people move within a city (intra-urban), between cities (inter-urban), between regions (regional migration) or between islands (e.g. North to South Island in New Zealand). Migration sometimes occurs as movement from one place to another in stages rather than in a single move (stepwise migration).\"},{\"t\":\"li1\",\"h\":\"Māori urban migration has been an important geographic process since the mid-twentieth century, which continues to influence contemporary patterns of settlement, mobility, housing experiences, and connections to place.\"},{\"t\":\"li1\",\"h\":\"New Zealand immigrants originate from a variety of other countries (Between 2006 and 2026, most of the immigrants to New Zealand came from the UK, China, India, Australia, and the Philippines).\"},{\"t\":\"li1\",\"h\":\"Some New Zealanders emigrate to other countries. For example, in 2025, the most common destination for New Zealanders was Australia.\"},{\"t\":\"h\",\"h\":\"<b>Factors that influence external migration<\\/b>\"},{\"t\":\"li1\",\"h\":\"Economic, social, and political factors influence external migration to or from New Zealand. These factors may include an increase in the standard of living or improved employment opportunities, perceived clean, green environments, and political stability.\"},{\"t\":\"h\",\"h\":\"<b>Factors that influence internal migration<\\/b>\"},{\"t\":\"li1\",\"h\":\"Economic, social, and political factors influence internal migration within New Zealand. These may include:\"},{\"t\":\"li2\",\"h\":\"housing costs and availability\"},{\"t\":\"li2\",\"h\":\"housing planning policies\"},{\"t\":\"li2\",\"h\":\"accessibility\"},{\"t\":\"li2\",\"h\":\"lifestyle\"},{\"t\":\"li2\",\"h\":\"education\"},{\"t\":\"li2\",\"h\":\"retirement opportunities.\"},{\"t\":\"h\",\"h\":\"<b>Urban challenges of migration<\\/b>\"},{\"t\":\"li1\",\"h\":\"Many migrants to and within New Zealand are moving into urban areas.\"},{\"t\":\"li1\",\"h\":\"Migration to urban areas of New Zealand presents challenges, such as:\"},{\"t\":\"li2\",\"h\":\"housing supply\"},{\"t\":\"li2\",\"h\":\"housing affordability\"},{\"t\":\"li2\",\"h\":\"infrastructure pressure\"},{\"t\":\"li2\",\"h\":\"discrimination\"},{\"t\":\"li2\",\"h\":\"social integration.\"},{\"t\":\"li1\",\"h\":\"For Māori living away from their tūrangawaewae, geographic separation can affect connections to whānau, hapū, iwi, and whenua, and may influence participation in cultural, social, and community life and the transmission of mātauranga Māori.\"},{\"t\":\"h\",\"h\":\"<b>Management of urban migration<\\/b>\"},{\"t\":\"li1\",\"h\":\"Local governments and non-governmental organisations can address urban migration challenges through strategies such as intensification of land use, investment in infrastructure and services, and initiatives that support community cohesion and the integration of new residents.\"},{\"t\":\"li1\",\"h\":\"Māori respond to the opportunities and challenges of urbanisation through iwi-led and community-led initiatives that strengthen connections to whenua, whakapapa, and identity. These include providing housing for iwi members living outside their rohe, supporting reconnection with whānau, hapū, and iwi, establishing urban marae and kaupapa Māori organisations, and strengthening Māori representation and participation in local decision-making through mechanisms such as Māori wards.\"},{\"t\":\"li1\",\"h\":\"Migrants may face a range of challenges when integrating into a new country, including cultural adjustment, language barriers, and social inclusion. Community-led initiatives aim to address these challenges by celebrating the different cultures of migrant groups in festivals (e.g. Polyfest, Diwali), providing resources for community-focused support (English classes for those who are not yet fluent), supporting community-focused development initiatives to help migrants adapt to their new communities (e.g. Bike Bridge in Christchurch, Lote Tree Trust).\"},{\"t\":\"h\",\"h\":\"<b>Case study:<\\/b>\"},{\"t\":\"li1\",\"h\":\"Urban migration challenges and their management exemplified through a case study of a local urban (town or city) area (e.g. Queenstown, Selwyn, Auckland, Whangarei, Cromwell).\"},{\"t\":\"h\",\"h\":\"<b>Decision-making for urban migration challenges<\\/b>\"},{\"t\":\"li1\",\"h\":\"Approaches to addressing urban migration challenges are often multi-faceted, as decision-makers must balance the perspectives and competing interests of multiple stakeholders.\"},{\"t\":\"li1\",\"h\":\"Geographic decision-making involves identifying an issue, evaluating evidence, considering multiple perspectives and factors, assessing the implications of different options, and justifying decisions using evidence.\"},{\"t\":\"li1\",\"h\":\"Decision-making considers spatial, economic, and temporal factors, including location, size, accessibility, timeframes, and the short- and long-term implications of different responses.\"},{\"t\":\"li1\",\"h\":\"Decision-makers must assess the reliability and validity of the data and evidence available to ensure decisions are balanced and well-informed.\"},{\"t\":\"li1\",\"h\":\"The decision must consider potential short- and long-term economic, social, and environmental impacts.\"},{\"t\":\"li1\",\"h\":\"Evaluating alternative courses of action involves considering different perspectives, assessing potential consequences, and justifying a preferred response using geographic evidence and reasoning.\"}],\"p\":[{\"t\":\"h\",\"h\":\"<b>Use geographic tools<\\/b>\"},{\"t\":\"li1\",\"h\":\"Interpret migration data to and within New Zealand.\"},{\"t\":\"li1\",\"h\":\"Evaluate the reliability and limitations in migration data sources.\"},{\"t\":\"li1\",\"h\":\"Use population pyramids to explain the impacts of migration on cities or regions.\"},{\"t\":\"li1\",\"h\":\"Analyse migration models to identify reasons for external migration to New Zealand in recent years.\"},{\"t\":\"h\",\"h\":\"<b>Apply geographic concepts<\\/b>\"},{\"t\":\"li1\",\"h\":\"Explain internal migration to urban areas by examining its economic, social, and political causes.\"},{\"t\":\"li1\",\"h\":\"Examine differing perspectives on solutions to migration challenges.\"},{\"t\":\"li1\",\"h\":\"Examine the impacts of external migration to urban areas in New Zealand.\"},{\"t\":\"li1\",\"h\":\"Examine the impacts of internal migration to urban areas in New Zealand.\"},{\"t\":\"h\",\"h\":\"<b>Decision-making<\\/b>\"},{\"t\":\"li1\",\"h\":\"Evaluate alternative strategies for addressing an urban migration challenge, drawing on evidence from a case study and present a preferred response.\"},{\"t\":\"h\",\"h\":\"<b>Investigation examples<\\/b>\"},{\"t\":\"li1\",\"h\":\"Investigate where infill housing is occurring in the local area and how it may be linked to population growth and housing demand.\"},{\"t\":\"li1\",\"h\":\"Investigate migration into and out of the local area.\"},{\"t\":\"li1\",\"h\":\"Investigate the impact of rapid urban population growth resulting from migration on infrastructure.\"},{\"t\":\"li1\",\"h\":\"Investigate the impact of long-term population loss on a local community.\"}]},{\"name\":\"Resources\",\"k\":[{\"t\":\"h\",\"h\":\"<b>Global distribution of energy production and consumption<\\/b>\"},{\"t\":\"li1\",\"h\":\"There are different forms of energy use including electricity, transportation, and industrial use.\"},{\"t\":\"li1\",\"h\":\"There are different sources of energy production, including non-renewable (fossil fuels: coal, oil, natural gas) and renewable (solar, hydro, wind), primary and secondary production.\"},{\"t\":\"li1\",\"h\":\"Global energy consumption is a major contributor to climate change because most energy is still produced from fossil fuels, which release greenhouse gases that warm the Earth’s atmosphere.\"},{\"t\":\"li1\",\"h\":\"The environmental impact of energy consumption depends on the energy source used, with renewable energy offering a way to meet growing energy demands.\"},{\"t\":\"li1\",\"h\":\"The total energy production and type of energy produced (fossil fuels, renewable, nuclear) varies between countries.\"},{\"t\":\"li1\",\"h\":\"The spatial distribution of energy consumption varies globally.\"},{\"t\":\"li1\",\"h\":\"Total energy consumption varies between countries.\"},{\"t\":\"li1\",\"h\":\"The total and type of energy production has changed over time.\"},{\"t\":\"h\",\"h\":\"<b>Factors influencing energy production and consumption<\\/b>\"},{\"t\":\"li1\",\"h\":\"Physical factors influence energy production and consumption including location, climate, and topography.\"},{\"t\":\"li1\",\"h\":\"Economic factors can influence energy production and consumption, such as technology and national income.\"},{\"t\":\"li1\",\"h\":\"Social and political factors can influence energy production and consumption, such as population and government policy.\"},{\"t\":\"li1\",\"h\":\"There are many challenges countries face when managing energy production and consumption such as cost, time, distance, technology, and governance.\"},{\"t\":\"h\",\"h\":\"<b>Strategies to reduce energy insecurity and reduce consumption<\\/b>\"},{\"t\":\"li1\",\"h\":\"Strategies to reduce energy insecurity and consumption include:\"},{\"t\":\"li2\",\"h\":\"changes to production\"},{\"t\":\"li2\",\"h\":\"improving energy efficiency\"},{\"t\":\"li2\",\"h\":\"clean energy incentives\"},{\"t\":\"li2\",\"h\":\"transitioning from fossil fuels to renewable sources and optimising output through technology.\"},{\"t\":\"li1\",\"h\":\"Global approaches to sustainable management can include the low-energy, resource-conscious lifestyle, such as the Sámi, which supports environmental su
